# uzi external API, version 1 (PRD #1907 D12).
#
# This document is the stable, versioned contract external products build against.
# Changes are ADDITIVE ONLY: new paths, new optional request fields, new response
# fields. Removing or renaming a path, field or enum value, or making an optional
# request field required, is a breaking change and needs a deprecation window (at
# least two minor releases and at least 90 days, whichever is later) or a new
# /api/v2 prefix. The internal /api/* routes are NOT part of this contract.
#
# The jobs endpoints (PRD #1908) are described below; the same rule applies to them.
# scripts/oasdiff.sh runs `task check:api-v1-compat`, which diffs this file against the
# copy on origin/main and fails on any breaking change.
#
# Paths below are relative to the single server url, /api/v1: "/whoami" is served
# at GET /api/v1/whoami. TestV1OpenAPIRouteParity (api/internal/handler) asserts
# that this document's operations and the production router's /api/v1 routes are
# the same set, in both directions, and that every response schema's properties
# match the Go DTO's JSON fields.
openapi: 3.1.0
info:
  title: uzi API
  version: 1.0.0
  description: >-
    The stable external API of a uzi instance. Callers authenticate with a
    Bearer product token (uzp_), minted by a user in Settings for a product an
    admin registered, or with the user's own uzi CLI token (uzc_). The token
    acts as the user who minted it and never with admin authority.
servers:
  - url: /api/v1
# Two alternative ways to authenticate (PRD #1910): a pasted Bearer token, or an OAuth 2.0
# authorization-code access token, which is the same uzp_ Bearer credential obtained by a user
# consenting in the browser. The oauth2 requirement is a NEW ALTERNATIVE entry beside
# bearerAuth, never a scope added to bearerAuth and never a per-operation override (both are
# breaking changes to oasdiff).
security:
  - bearerAuth: []
  - oauth2: []
paths:
  /whoami:
    get:
      operationId: whoami
      summary: Identify the caller
      description: >-
        Returns the user the token acts as, the product the token is bound to
        (null for a CLI token), and the scopes the token holds. Any valid token
        may call it; no particular scope is required.
      responses:
        "200":
          description: The caller's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /jobs:
    post:
      operationId: createJob
      summary: Create a job
      description: >-
        Queues a job that runs as the token's user, on that user's own Anthropic
        credential. Needs the jobs:run scope. A product token may create only the job
        types its product allows. The job starts queued and runs to completion with no
        approval step; poll GET /jobs/{id} for progress. Naming a site list in
        egress_profile runs the job on the isolated lane, where only that list's hosts
        are reachable through the fetcher; a product token may name only a list its
        product is allowed to use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
      responses:
        "201":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listJobs
      summary: List jobs
      description: >-
        The caller's jobs, newest first, one page at a time. A user token sees all of
        its user's jobs; a product token sees only the jobs created through its own
        product. Needs the jobs:read scope.
      parameters:
        - name: limit
          in: query
          required: false
          description: Page size, 1 to 100. The default is 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          description: The next_cursor of the previous page. Opaque.
          schema:
            type: string
      responses:
        "200":
          description: One page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /jobs/{id}:
    get:
      operationId: getJob
      summary: Get a job
      description: >-
        One job's state. Needs the jobs:read scope. A job the caller cannot see (another
        user's, another product's, or unknown) is 404.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /jobs/{id}/result:
    get:
      operationId: getJobResult
      summary: Get a job's result
      description: >-
        The job's report and findings. The result is null until the job has reported
        one; job_status says whether it can still arrive (queued, running or waiting)
        or never will (failed, cancelled). Needs the jobs:read scope.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job's status and, once reported, its result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /jobs/{id}/messages:
    get:
      operationId: listJobMessages
      summary: Read a job's progress messages
      description: >-
        A narrowed progress feed: the agent's text, status and error lines, oldest first,
        after the given seq. Tool input and output are never included. Poll again with
        after set to the last seq returned. Needs the jobs:read scope.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: after
          in: query
          required: false
          description: Return only messages with a seq greater than this. The default is 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The messages after the given seq (at most one bounded page).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMessages"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a job
      description: >-
        Cancels a queued or running job. A queued job ends cancelled at once; a running
        one is stopped by its worker, so the returned job may still read running for a
        moment. Needs the jobs:run scope.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job after the cancel request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /jobs/{id}/files:
    get:
      operationId: listJobFiles
      summary: List a job's files
      description: >-
        The files of one job: the input files attached to it and the output files it
        produced, with their metadata, and refused_files, the outputs that were not stored
        (over a quota or not an allowed type) while the job still completed. Download the
        bytes of a file with GET /files/{id}. An output carries source_url only when its
        SHA-256 equals the SHA-256 of a fetch the fetch service recorded as allowed in this
        same job; nothing the agent claims about a file's origin is used. Needs the
        jobs:read scope. A job the caller cannot see is 404.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job's files and refused outputs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobFiles"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /files:
    post:
      operationId: uploadFile
      summary: Upload an input file
      description: >-
        Stores one file for use as a job input. Send multipart/form-data with the
        file in a part named file, and declare its exact size in the X-Uzi-File-Size
        header (required: the server reserves exactly that many bytes before it reads
        the body, and refuses an upload whose bytes differ). A sha256 in
        X-Uzi-File-Sha256 is verified against the bytes when given. Needs the jobs:run
        scope. The type is detected from the bytes and must agree with the part's
        Content-Type and the file name's extension: PDF, PNG, JPEG, DOCX and XLSX
        (the ZIP-based Office formats need their type or extension declared), and
        UTF-8 text (text/plain, text/markdown, text/csv, application/json; JSON must
        parse). Anything else is refused with reason unsupported_file_type. The file
        is stored under a name derived from its content, never from the uploader's;
        display_name is the uploader's file name reduced to its last path component
        and stripped of control and invisible characters. The file starts unattached
        and expires after UZI_JOB_UPLOAD_TTL (default 1 hour) unless a job create
        references it in input_file_ids. Only the user, and for a product token only
        the product, that uploaded a file can attach it, to one job.
      parameters:
        - name: X-Uzi-File-Size
          in: header
          required: true
          description: The file's exact size in bytes.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: X-Uzi-File-Sha256
          in: header
          required: false
          description: The file's SHA-256 as 64 lowercase hexadecimal characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The file. Only the first part with this name is read.
      responses:
        "201":
          description: The stored file, in state unattached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "408":
          $ref: "#/components/responses/RequestTimeout"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /files/{id}:
    get:
      operationId: downloadFile
      summary: Download a file
      description: >-
        The file's bytes. Every response is sent as an attachment with
        Content-Type: application/octet-stream and X-Content-Type-Options: nosniff,
        whatever the file's type, so it is never rendered in a browser; the filename in
        Content-Disposition is the content-derived storage name (the SHA-256 and an
        extension), never the uploader's name. The file's own type is in the metadata
        (content_type). Treat the bytes as untrusted data. Needs the jobs:read scope. Only
        the user that owns the file can read it, and a product token only files of its own
        product's jobs (or its own unattached uploads): a file the caller cannot see is 404,
        the same as an unknown one. An expired file is 410.
      parameters:
        - name: id
          in: path
          required: true
          description: The file id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The file's bytes.
          headers:
            Content-Disposition:
              description: attachment; filename="<sha256>.<ext>".
              schema:
                type: string
            X-Content-Type-Options:
              description: Always nosniff.
              schema:
                type: string
                enum:
                  - nosniff
            Content-Length:
              description: The file's size in bytes.
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A product token (uzp_) or a uzi CLI token (uzc_) with user scope. Admin
        read-only tokens (uza_) and browser session cookies are refused.
    oauth2:
      type: oauth2
      description: >-
        OAuth 2.0 authorization code with PKCE (S256), for a product an admin registered as
        a confidential client (HTTP Basic client authentication at the token endpoint). The
        user approves on the uzi consent page; the product receives a one-hour access token
        (sent as a Bearer token, identical to a product token) and a refresh token. Revoking
        the connection ends both. The authorization and token endpoints are on the uzi origin
        under /api/oauth, outside this document's /api/v1 prefix.
      flows:
        authorizationCode:
          authorizationUrl: /api/oauth/authorize
          tokenUrl: /api/oauth/token
          refreshUrl: /api/oauth/token
          scopes:
            "jobs:run": Create jobs as the user, cancel them and upload their input files.
            "jobs:read": List and read the user's jobs, their messages, results and files.
  responses:
    Unauthorized:
      description: >-
        Missing, malformed, unknown, revoked or expired token, a disabled or
        deleted product, or an inactive user. The body is the same whatever the
        reason.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        The token lacks the scope the endpoint needs (reason insufficient_scope), or, on
        POST /jobs, a product token asked for a job type its product does not allow
        (reason job_type_not_allowed; a product with an empty allow-list allows none) or named a
        site list in egress_profile that its product is not allowed to use (reason
        egress_profile_not_allowed; a product with no allowed lists may use none).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        No such job or file, or one the caller cannot see: another user's, another
        product's and a malformed id all answer the same (reason not_found). On POST
        /jobs, egress_profile names no site list (reason unknown_egress_profile).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The job has already finished (reason job_terminal).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The file has expired and its bytes are gone (reason file_expired).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: >-
        The request is over a size limit. Reason payload_too_large: the request body is
        over the size limit. On POST /files, reason file_too_large: the declared file
        size is over the per-file cap (UZI_JOB_INPUT_FILE_MAX_BYTES). On POST /jobs,
        reason too_many_files (more input_file_ids than UZI_JOB_INPUTS_MAX_FILES) or
        job_bytes_exceeded (the attached files total more than
        UZI_JOB_INPUTS_MAX_BYTES).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: >-
        The file's bytes are not a supported type, or disagree with the type its
        Content-Type or file name declares (reason unsupported_file_type). The message
        names the specific refusal, and for an unrecognised extension lists the allowed
        ones.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: >-
        POST /files: the request body ended or broke before the file was read, for
        example the client disconnected (reason invalid_request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RequestTimeout:
      description: >-
        POST /files: the body was not fully received within the upload deadline, so a
        stalled upload is cut off (reason request_timeout). The deadline is at least
        UZI_RECOVERY_REQUEST_DEADLINE (120 seconds by default) and grows with the declared
        file size at 100 KiB/s (256 seconds for a 25 MiB file), and it never exceeds 10
        minutes (or UZI_RECOVERY_REQUEST_DEADLINE itself when that is set higher).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: >-
        This deployment has no file store configured (reason files_unavailable, on
        POST /files and on POST /jobs with input_file_ids), or, on POST /jobs, this
        deployment has no isolated research lane enabled and the request names an
        egress_profile (reason isolated_lane_unavailable; no job is created), or, on POST /files, too many
        uploads are streaming at once, process-wide or for this user (reason
        uploads_busy; retry after the number of seconds in the Retry-After header). On
        every operation, reason auth_unavailable means the token could not be checked
        because the token store failed (a transient fault, not an invalid token): retry
        with backoff.
      headers:
        Retry-After:
          description: "Present with reason uploads_busy: the seconds to wait before retrying."
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InsufficientStorage:
      description: >-
        The stored-file quota is full: the user's own, the instance's, or the budget
        shared with recovery archives (reason storage_quota_exceeded). Retry after
        stored files expire.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: >-
        The request is understood but refused. The reason says why: invalid_request (a
        malformed or invalid body or query parameter; the message names the field),
        unknown_job_type or no_model_credential (the user has no usable Anthropic
        credential in uzi). On POST /files, also empty_file, size_mismatch (the streamed size is not
        X-Uzi-File-Size) and sha256_mismatch. On POST /jobs, also file_unavailable (an
        input_file_ids entry is unknown, belongs to another user or product, is already
        attached, has expired, or is listed twice).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: >-
        Either the per-user request budget for /api/v1 is spent (no reason field; retry
        after the number of seconds in the Retry-After header), or, on POST /jobs, the
        user already has the maximum number of unfinished jobs (reason over_cap; retry
        once one finishes or is cancelled).
      headers:
        Retry-After:
          description: >-
            Present when the request budget is spent. An upper bound, in seconds, on
            how long to wait: the budget is a fixed window and this is always the full
            window length, so the budget may reset sooner. A retry after this many
            seconds does not land in the window that was exhausted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    JobId:
      name: id
      in: path
      required: true
      description: The job id.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: A human-readable message.
        reason:
          type: string
          description: >-
            A stable machine-readable code for the failure, on the errors that have
            one (see each response). Branch on this, not on the message.
    Whoami:
      type: object
      required:
        - user
        - product
        - scopes
      properties:
        user:
          $ref: "#/components/schemas/WhoamiUser"
        product:
          description: The product the token is bound to; null for a CLI token.
          oneOf:
            - $ref: "#/components/schemas/WhoamiProduct"
            - type: "null"
        scopes:
          type: array
          description: The scopes the token holds. A CLI token holds every scope.
          items:
            type: string
            enum:
              - jobs:run
              - jobs:read
    WhoamiUser:
      type: object
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Empty when the user has not set a display name.
    WhoamiProduct:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    JobCreateRequest:
      type: object
      required:
        - type
        - prompt
      properties:
        type:
          type: string
          description: The job type.
          enum:
            - research
        title:
          type:
            - string
            - "null"
          description: >-
            A short label, at most 200 bytes. Derived from the first line of the
            prompt when omitted.
        prompt:
          type: string
          description: What the job should do, at most 256 KiB.
        inputs:
          type:
            - array
            - "null"
          description: >-
            Named text the job can read, at most 20 inputs and 1 MiB in total. Names
            are 1 to 100 characters of letters, digits, dot, underscore or hyphen,
            starting with a letter or digit, unique within the job.
          items:
            $ref: "#/components/schemas/JobInput"
        input_file_ids:
          type:
            - array
            - "null"
          description: >-
            Ids of files uploaded with POST /files, attached to the job as input files.
            At most 10 (UZI_JOB_INPUTS_MAX_FILES), each listed once, together at most
            50 MiB (UZI_JOB_INPUTS_MAX_BYTES). Each must be unattached, unexpired and
            uploaded by the same user and, for a product token, the same product.
          items:
            type: string
            format: uuid
        requested_by_label:
          type:
            - string
            - "null"
          description: >-
            Who the job is for, in the caller's own words, at most 200 bytes. Shown to
            the job's owner as attribution reported by the product; never used to
            decide access.
        wall_seconds:
          type:
            - integer
            - "null"
          description: >-
            A wall-clock limit for the job, in seconds. Values above the instance
            ceiling (8 hours) are clamped to it. The instance default applies when
            omitted.
        egress_profile:
          type:
            - string
            - "null"
          description: >-
            The name of a site list. The job runs on the isolated lane and can reach only
            that list's hosts, through the fetcher. A product token may name only a list
            its product is allowed to use (403, reason egress_profile_not_allowed); an
            unknown list is 404 (reason unknown_egress_profile); an empty string is 422. A
            deployment with no isolated research lane enabled refuses it with 503 (reason
            isolated_lane_unavailable).
            Omit it, or send null, for a job with no site list.
    JobInput:
      type: object
      required:
        - name
        - content
      properties:
        name:
          type: string
        content:
          type: string
    Job:
      type: object
      required:
        - id
        - type
        - status
        - title
        - requested_by_label
        - failure_reason
        - wall_seconds
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: The job type, one of the values POST /jobs accepts.
        status:
          type: string
          description: >-
            queued (waiting for a worker), running, waiting (held until a model
            credential or capacity is available; it resumes by itself), and the
            terminal completed, failed and cancelled.
          enum:
            - queued
            - running
            - waiting
            - completed
            - failed
            - cancelled
        title:
          type: string
        requested_by_label:
          type:
            - string
            - "null"
        failure_reason:
          type:
            - string
            - "null"
          description: Why the job failed; null unless it failed.
        wall_seconds:
          type:
            - integer
            - "null"
          description: The job's wall-clock limit; null while the instance default applies.
        created_at:
          type: string
          format: date-time
        started_at:
          type:
            - string
            - "null"
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
    JobList:
      type: object
      required:
        - jobs
        - next_cursor
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        next_cursor:
          type:
            - string
            - "null"
          description: Pass as cursor to fetch the next page; null on the last page.
    JobResult:
      type: object
      required:
        - job_status
        - result
      properties:
        job_status:
          type: string
          description: The job's status, as in Job.
          enum:
            - queued
            - running
            - waiting
            - completed
            - failed
            - cancelled
        result:
          description: The job's result; null until it has reported one.
          oneOf:
            - $ref: "#/components/schemas/JobResultBody"
            - type: "null"
    JobResultBody:
      type: object
      required:
        - status
        - report_md
        - findings
        - sources
        - files
        - refused_files
      properties:
        status:
          type: string
          description: A short lowercase token the job reported for its own outcome.
        report_md:
          type: string
          description: The report, markdown. Untrusted text; render it inert.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/JobFinding"
        sources:
          type: array
          description: >-
            The job's source log: every fetch the fetch service recorded for this job,
            allowed or refused, oldest first (at most the first 500). Empty for a job that
            fetched nothing.
          items:
            $ref: "#/components/schemas/JobSource"
        files:
          type: array
          description: The job's input and output files, as GET /jobs/{id}/files lists them.
          items:
            $ref: "#/components/schemas/JobFile"
        refused_files:
          type: array
          description: The outputs that were not stored, and why.
          items:
            $ref: "#/components/schemas/JobRefusedFile"
    JobFiles:
      type: object
      required:
        - files
        - refused_files
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/JobFile"
        refused_files:
          type: array
          items:
            $ref: "#/components/schemas/JobRefusedFile"
    JobFile:
      type: object
      required:
        - id
        - display_name
        - content_type
        - byte_size
        - sha256
        - direction
        - state
        - expires_at
        - source_url
      properties:
        id:
          type: string
          format: uuid
          description: Download the bytes with GET /files/{id}.
        display_name:
          type: string
          description: >-
            A file name, reduced to its last path component with control and invisible
            characters removed. Untrusted text: render it inert.
        content_type:
          type: string
          description: >-
            The type detected from the bytes. May be an empty string for an expired file, whose
            bytes are gone: the stored row does not guarantee a retained identity once expired.
        byte_size:
          type: integer
          format: int64
        sha256:
          type: string
          description: >-
            The SHA-256 of the file's bytes, lowercase hexadecimal. May be an empty string for an
            expired file, whose bytes are gone: the stored row does not guarantee a retained
            identity once expired.
        direction:
          type: string
          enum:
            - input
            - output
        state:
          type: string
          description: attached (the job has not finished), available or expired.
          enum:
            - attached
            - available
            - expired
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            When the file expires. Null while it is attached to a job that has not
            finished.
        source_url:
          type:
            - string
            - "null"
          description: >-
            For an output, the URL it was fetched from, when its SHA-256 equals that of a
            fetch the fetch service recorded as allowed in this same job. Null otherwise,
            always for an input. Untrusted text taken from the site's redirects; render it
            inert.
    JobRefusedFile:
      type: object
      required:
        - display_name
        - byte_size
        - reason
      properties:
        display_name:
          type: string
          description: Untrusted text, render it inert.
        byte_size:
          type: integer
          format: int64
        reason:
          type: string
          description: >-
            Why the output was not stored, for example a quota or an unsupported type. A
            reason of generation_pending means a generated file (report.md or
            findings.json) is still being stored.
    JobSource:
      type: object
      required:
        - url
        - final_url
        - verdict
        - reason
        - http_status
        - content_type
        - byte_size
        - sha256
        - fetched_at
      properties:
        url:
          type: string
          description: The URL the agent asked to fetch. Untrusted text.
        final_url:
          type: string
          description: The URL after redirects; empty when the fetch did not get that far.
        verdict:
          type: string
          enum:
            - allowed
            - refused
        reason:
          type: string
          description: Why a fetch was refused; empty when it was allowed.
        http_status:
          type: integer
          description: The HTTP status the site answered with; 0 when there was none.
        content_type:
          type: string
        byte_size:
          type: integer
          format: int64
        sha256:
          type: string
          description: The SHA-256 of the fetched bytes, lowercase hexadecimal; empty for a refused fetch.
        fetched_at:
          type: string
          format: date-time
    JobFinding:
      type: object
      required:
        - severity
        - message_md
        - url
        - file
        - line
      properties:
        severity:
          type: string
          enum:
            - info
            - warning
            - error
        message_md:
          type: string
        url:
          type:
            - string
            - "null"
          description: An http or https location; null when the finding names a file or nothing.
        file:
          type:
            - string
            - "null"
        line:
          type:
            - integer
            - "null"
          description: A line in file; null unless file is set.
    JobMessages:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/JobMessage"
    JobMessage:
      type: object
      required:
        - seq
        - created_at
        - type
        - text
      properties:
        seq:
          type: integer
        created_at:
          type: string
          format: date-time
        type:
          type: string
          enum:
            - text
            - status
            - error
        text:
          type: string
    File:
      type: object
      required:
        - id
        - display_name
        - storage_name
        - content_type
        - byte_size
        - sha256
        - state
        - expires_at
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: >-
            The uploader's file name reduced to its last path component, with control
            and invisible characters removed. Untrusted text: render it inert.
        storage_name:
          type: string
          description: The content-derived name, the file's sha256 and a type extension.
        content_type:
          type: string
          description: The type detected from the bytes.
        byte_size:
          type: integer
          format: int64
        sha256:
          type: string
          description: The SHA-256 of the file's bytes, lowercase hexadecimal.
        state:
          type: string
          description: unattached, attached, available or expired.
          enum:
            - unattached
            - attached
            - available
            - expired
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            When the file expires. Null while it is attached to a job that has not
            finished.
