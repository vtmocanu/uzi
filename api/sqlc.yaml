# Regenerate the code in internal/store after editing any migration or query
# (sqlc is not installed globally; this pinned go-run needs no local install):
#   cd api && go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/queries/"
    schema: "internal/store/migrations/"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        # PRD #333: a privcheck.Finding already exists (privcheck/report.go), so the
        # generated struct for the `findings` table carries the Incidental prefix to keep
        # the two "Finding" concepts distinct (PRD line 68). finding_dispositions →
        # FindingDisposition is fine as-is.
        rename:
          finding: "IncidentalFinding"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
