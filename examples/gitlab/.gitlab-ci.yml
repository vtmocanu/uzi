# Example .gitlab-ci.yml for self-hosting uzi on GitLab.
#
# This is a STARTING POINT, not uzi's own CI. uzi's canonical repo runs GitHub
# Actions (.github/workflows/); this file is distilled from the original GitLab
# pipeline and stripped of internal infra (Harbor, kaniko, private runners) so a
# GitLab self-hoster can adapt it. It is deliberately minimal: the real pipeline
# splits validate/lint/test into per-toolchain jobs for parallelism and adds
# release, e2e and publish gates you can layer back on.
#
# The gates are just `task` targets, so CI and a local `task gate` stay identical.
# Registry defaults to GitLab's built-in Container Registry ($CI_REGISTRY_IMAGE);
# override the variables below to push elsewhere.

variables:
  # Pin the gate runner. go-task is fetched + sha256-verified in .task-setup.
  # Bump both together (see https://github.com/go-task/task/releases).
  TASK_VERSION: "3.51.1"
  TASK_SHA256: "da7e92f0ff961ef2aae7cfecbad8d1fd2a08d7b09ba968673adf7ff389b243b5"

stages:
  - gate
  - build

# Fetch the pinned go-task binary, sha256-verified. Referenced by every gate job.
.task-setup:
  before_script:
    - |
      set -eu
      command -v curl >/dev/null || (apk add --no-cache curl ca-certificates >/dev/null 2>&1 || (apt-get update && apt-get install -y curl ca-certificates))
      curl -fsSLo /tmp/task.tar.gz "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz"
      echo "${TASK_SHA256}  /tmp/task.tar.gz" | sha256sum -c -
      tar -xzf /tmp/task.tar.gz -C /usr/local/bin task
      task --version

# One gate job per toolchain. `task gate:<component>` runs fmt + vet + build +
# lint + deadcode + test for that component; they are independent, so they run in
# parallel (needs: []). Repo-wide checks (shellcheck, yamllint, formula, gitleaks)
# are `task gate:repo`.
gate:repo:
  stage: gate
  image: golang:1.26
  needs: []
  extends: .task-setup
  variables:
    UZI_LINT_SHELL_REQUIRED: "1"
    UZI_LINT_YAML_REQUIRED: "1"
    UZI_LINT_FORMULA_REQUIRED: "1"
  script:
    - task gate:repo

gate:api:
  stage: gate
  image: golang:1.26
  needs: []
  extends: .task-setup
  script:
    - task gate:api

gate:controller:
  stage: gate
  image: golang:1.26
  needs: []
  extends: .task-setup
  script:
    - task gate:controller

gate:web:
  stage: gate
  image: node:24
  needs: []
  extends: .task-setup
  variables:
    UZI_DEADCODE_WEB_REQUIRED: "1"
  script:
    - cd web && npm ci && cd ..
    - task gate:web

gate:agent:
  stage: gate
  image: node:24
  needs: []
  extends: .task-setup
  variables:
    UZI_DEADCODE_AGENT_REQUIRED: "1"
  script:
    - cd agent && npm ci && cd ..
    - task gate:agent

# Render + lint the Helm chart (the deploy artifact).
helm:
  stage: gate
  image: alpine/helm:3.16.4
  needs: []
  script:
    - helm dependency build deploy/chart
    - helm lint deploy/chart
    - helm template uzi deploy/chart --namespace uzi > /dev/null

# Build + push the images to the GitLab Container Registry on the default branch
# and on tags. Swap docker:dind for kaniko/buildkit if your runners require it.
build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  needs: ["gate:repo", "gate:api", "gate:controller", "gate:web", "gate:agent", "helm"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  before_script:
    # GitLab's native variable expansion has no ${VAR:-default}; resolve TAG in the shell.
    - export TAG="${CI_COMMIT_TAG:-latest}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f api/Dockerfile -t "$CI_REGISTRY_IMAGE/api:$TAG" .
    - docker build -f web/Dockerfile -t "$CI_REGISTRY_IMAGE/web:$TAG" .
    - docker build -f controller/Dockerfile -t "$CI_REGISTRY_IMAGE/controller:$TAG" .
    - docker push "$CI_REGISTRY_IMAGE/api:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/web:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/controller:$TAG"
