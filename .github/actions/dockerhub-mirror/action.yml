name: Docker Hub mirror
description: >-
  Route the runner Docker daemon's Docker Hub pulls through mirror.gcr.io, Google's
  public pull-through cache of Docker Hub images. GitHub-hosted runners share Docker
  Hub's unauthenticated per-IP pull quota, so a burst elsewhere can fail our pulls
  with `toomanyrequests` (first seen 2026-10-09). No credential is involved, so the
  ci.yml R1 trust boundary (no secrets in PR CI) is unchanged, and a mirror miss
  falls back to Docker Hub. Run it BEFORE anything starts a container: it restarts
  dockerd. Do not use it in a job with `services:` (the restart would stop them).
  buildx docker-container builders take the same mirror through
  setup-buildx-action's buildkitd-config-inline instead.

runs:
  using: composite
  steps:
    - name: Configure the Docker Hub mirror
      shell: bash
      run: |
        set -euo pipefail
        cfg=/etc/docker/daemon.json
        current='{}'
        if sudo test -s "$cfg"; then current="$(sudo cat "$cfg")"; fi
        printf '%s' "$current" \
          | jq '."registry-mirrors" = ((."registry-mirrors" // []) + ["https://mirror.gcr.io"] | unique)' \
          | sudo tee "$cfg" >/dev/null
        sudo systemctl restart docker
        for _ in $(seq 1 30); do
          if docker info >/dev/null 2>&1; then break; fi
          sleep 1
        done
        # Positive control: fail loudly if the daemon did not pick the mirror up.
        docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -F 'mirror.gcr.io'
