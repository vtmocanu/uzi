# uzi devbox worker-toolchain refresh: bump the nixpkgs pin Renovate does not cover.
#
# WHY THIS EXISTS (issue #912). agent/devbox-global/devbox.json lists the worker
# toolchain UNVERSIONED (go, gcc, python3, chromium, openssl, semgrep, helm,
# opentofu, ...); each resolves against the nixpkgs revision pinned in
# agent/devbox-global/devbox.lock, and the worker image bakes exactly that lock
# (agent/templates/base/Dockerfile COPYs it before `devbox global install`). Renovate
# tracks the npm/Go/CI-tool pins but not this lock, so it silently rots (the pin sat
# ~6.5 weeks stale when #912 was filed). This weekly job removes the lock and re-resolves
# every package against the newest nixpkgs-unstable commit (a plain `devbox update` keeps
# packages pinned to their current commit -- a no-op for versions), so a bump CAN carry
# major tool versions, which is intended (workers should get current, patched tools) and is
# exactly why it is VALIDATED and human-reviewed rather than applied blind.
#
# HOW IT VALIDATES WITHOUT A PAT, AND WHY A PR CAN FALL BACK TO AN ISSUE. A PR opened
# with the default GITHUB_TOKEN does NOT trigger other workflows (GitHub's recursion
# guard), and opening a PR with GITHUB_TOKEN at all requires the repo setting "Allow
# GitHub Actions to create and approve pull requests". This workflow validates
# in a read-only job -- it builds the worker base image, whose Dockerfile runs
# agent/devbox-global/assert-toolchain.sh against what devbox actually installed
# (toolchain-guard.tsv smoke) -- and only on a green build does it push the branch and
# try to open a PR. If PR creation is refused (setting off and no PAT), it files a
# tracking ISSUE pointing at the already-pushed, already-validated branch, so the
# signal is never lost and a human opens the PR (which then triggers CI). Supplying a
# workflow-scoped PAT as DEVBOX_UPDATE_TOKEN (contents + pull-requests write) makes the
# PR open directly and run its own CI. main's ci.yml re-validates on merge either way.
# This preserves roles-manifest-refresh.yml's PR-or-issue pattern. Validation and
# proposal use separate runners; only the final trusted proposal step gets write
# credentials. A manual dry_run validates without proposing anything.
name: Devbox toolchain update

# Quoted so yamllint's `truthy` rule does not read the key as the boolean `on`.
"on":
  schedule:
    # 06:41 UTC Mondays, off the hour and distinct from the other weekly jobs
    # (roles-manifest-refresh 06:27, main-guard 05:43, e2e 01:17) to dodge scheduler
    # contention. Weekly keeps each bump's delta small so a major shows up isolated.
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the lock update without proposing a PR or issue
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devbox-update
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.delta.outputs.changed }}
      lock_sha: ${{ steps.lock.outputs.sha }}
    runs-on: ubuntu-latest
    # A healthy run is a devbox re-lock plus one worker-image build; this only bounds a
    # pathological hang (the cold base build with a fresh nixpkgs closure is minutes).
    timeout-minutes: 45
    steps:
      - name: Checkout uzi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The proposal job fetches its own full history for the branch-clobber
          # guard. This separate checkout is only for generation and validation.
          fetch-depth: 0
          persist-credentials: false

      # Install nix (flakes enabled) + the devbox CLI directly, NOT via
      # jetify-com/devbox-install-action. Given a project-path, that action PRE-INSTALLS the
      # whole toolchain before our step runs -- redundant with the Docker validate build
      # below, and it fetches the OLD (pre-update) nixpkgs closure we are about to discard,
      # which is an extra transient-failure surface (a truncated nixpkgs tarball fetch failed
      # the first run). Installing the tools ourselves skips it: `devbox update` only
      # re-locks, and the real toolchain install + validation happens in the base-image build.
      - name: Install nix (flakes)
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa  # v23
        env:
          # Keep repository/run metadata out of third-party telemetry. The
          # action and installer use separate channels, so disable both.
          OTEL_SDK_DISABLED: "true"
        with:
          diagnostic-endpoint: ""
          # Authenticated GitHub flake fetches avoid shared-IP rate limits.
          # This job's token is read-only, so nix.conf gains no write credential.
          github-token: ${{ github.token }}

      # The pinned devbox release BINARY (not the self-updating launcher), sha256-verified,
      # matching agent/templates/base/Dockerfile's ARG DEVBOX_VERSION so the lock is
      # regenerated by the same tool that later consumes it.
      - name: Install devbox CLI (pinned, verified)
        env:
          DEVBOX_VERSION: "0.17.5"
        run: |
          set -euo pipefail
          tarball="devbox_${DEVBOX_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/jetify-com/devbox/releases/download/${DEVBOX_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/${tarball}" "${base}/${tarball}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          grep -F -- "${tarball}" "${tmp}/checksums.txt" > "${tmp}/want.sha256"
          (cd "${tmp}" && sha256sum -c want.sha256)
          tar -xzf "${tmp}/${tarball}" -C "${tmp}"
          sudo install -m 0755 "$(find "${tmp}" -type f -name devbox | head -n1)" /usr/local/bin/devbox
          devbox version

      # Force a FULL re-resolve. `devbox update` on its own keeps every package "resolved to
      # its current version" (the old pinned commit) -- a no-op for tool versions (verified:
      # it only advanced the nixpkgs-unstable alias while all 23 packages stayed on the old
      # commit, so chromium etc. did not move). Removing the lock first makes devbox
      # re-resolve every unversioned package against the CURRENT nixpkgs-unstable commit,
      # which is what actually advances the versions (chromium 150 -> 152 in a local resolve).
      # --no-install: the real install + toolchain-guard validation happens in the base-image
      # build below, so the heavy runner install is skipped here. A transient nix binary-cache
      # fetch can truncate (as it did on the first run), so retry; rm runs each attempt so a
      # partial lock from a failed try never leaks into the next.
      - name: devbox update (full re-resolve to the latest nixpkgs)
        working-directory: agent/devbox-global
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f devbox.lock
            if devbox update --no-install; then exit 0; fi
            if [ "${attempt}" -lt 3 ]; then
              echo "devbox update attempt ${attempt} failed; retrying after backoff..." >&2
              sleep "$((attempt * 20))"
            fi
          done
          echo "devbox update failed after 3 attempts." >&2
          exit 1

      - name: Detect a lock change
        id: delta
        run: |
          set -euo pipefail
          if git diff --quiet -- agent/devbox-global/devbox.lock; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "nixpkgs pin unchanged; nothing to do."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff -- agent/devbox-global/devbox.lock
          fi

      - name: Set up buildx
        if: steps.delta.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Validation: build the worker base image with the UPDATED lock. The build COPYs
      # the lock, runs `devbox global install`, then assert-toolchain.sh cross-checks the
      # installed package set and smoke-runs each tool. A missing or broken tool fails
      # the build, so this step fails and the push/PR step below is skipped -- a bad bump
      # is never proposed. push:false touches no registry credential; cache-from is the
      # public, anonymous release buildcache (read-only), matching ci.yml's build-agent.
      - name: Validate - build the worker base image (toolchain guard runs inside)
        if: steps.delta.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: agent/templates/base/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/vtmocanu/uzi/agent-base:buildcache
          build-args: |
            UZI_SRC_SHA=${{ github.sha }}
          tags: uzi-agent-base:devbox-update

      - name: Digest the validated lock
        if: steps.delta.outputs.changed == 'true'
        id: lock
        run: |
          set -euo pipefail
          sha="$(sha256sum agent/devbox-global/devbox.lock | awk '{print $1}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Transfer only the validated lock
        if: steps.delta.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validated-devbox-lock
          path: agent/devbox-global/devbox.lock
          if-no-files-found: error
          retention-days: 1

  # No third-party actions or validation commands run with this job's write token.
  # Only this final trusted shell step receives credentials and consumes lock DATA.
  propose:
    needs: validate
    if: needs.validate.outputs.changed == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push the update branch
      pull-requests: write  # open the PR
      issues: write  # the tracking-issue fallback
      actions: read  # download this run's validated lock artifact
    steps:
      - name: Propose the validated bump (PR, else tracking issue)
        env:
          GH_TOKEN: ${{ secrets.DEVBOX_UPDATE_TOKEN || github.token }}
          # Artifact access uses the built-in job token even when the proposal
          # PAT has only contents/PR scope; job actions:read does not scope a PAT.
          ARTIFACT_TOKEN: ${{ github.token }}
          LOCK_SHA: ${{ needs.validate.outputs.lock_sha }}
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d "${RUNNER_TEMP}/devbox-lock.XXXXXX")"
          trap 'rm -rf "$artifact_dir"' EXIT
          GH_TOKEN="$ARTIFACT_TOKEN" gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name validated-devbox-lock --dir "$artifact_dir"
          # Treat the artifact as data only: exactly one regular lock, no links or
          # extra paths, and a digest supplied separately by the validation job.
          lock_artifact="$artifact_dir/devbox.lock"
          [ -f "$lock_artifact" ] && [ ! -L "$lock_artifact" ] \
            || { echo "Missing or linked validated lockfile." >&2; exit 1; }
          [ "$(find "$artifact_dir" -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] \
            || { echo "Unexpected validated artifact contents." >&2; exit 1; }
          [[ "$LOCK_SHA" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Invalid validated lock digest." >&2; exit 1; }
          printf '%s  %s\n' "$LOCK_SHA" "$lock_artifact" | sha256sum -c -

          # No checkout action runs in this write-scoped job. Fetch the exact
          # source revision validated above, without persisted credentials.
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          cp "$lock_artifact" agent/devbox-global/devbox.lock
          # Git reads the token only when network authentication is needed; this
          # env-scoped helper persists no credential in the checkout or artifact.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper
          export GIT_CONFIG_VALUE_0='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f'

          BRANCH="chore/devbox-toolchain-update"
          LABEL="dependencies"
          LOCK="agent/devbox-global/devbox.lock"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="$(printf 'Automated weekly `devbox update` of the worker toolchain nixpkgs pin (`%s`), which Renovate does not cover (#912).\n\nThe devbox-global packages are unversioned and track `nixpkgs-unstable`, so this bump can include **major** tool versions -- review the lock delta.\n\nValidated in the scheduled run by building agent/templates/base/Dockerfile (the toolchain-guard.tsv smoke runs inside that build); this proposal exists only because that build was green. main'"'"'s ci.yml re-validates on merge.\n\nRun: %s' "${LOCK}" "${RUN_URL}")"

          # Idempotent label so `gh pr create --label` / `gh issue create --label` work.
          gh label create "${LABEL}" \
            --description "Dependency updates" --color 0366D6 --force >/dev/null 2>&1 || true

          # Never clobber human work on the bot branch (mirrors roles-manifest-refresh.yml,
          # hardened to FAIL CLOSED per review): the branch is treated as protected unless
          # every check POSITIVELY confirms it is safe to overwrite -- an open PR tracks it,
          # OR the remote branch carries commits touching files other than the lock (a
          # maintainer's conflict-resolution, a pinned package, or the deferred uxlab-lock
          # bump). A failed gh/git query leaves it protected, so a transient API/network blip
          # skips the push (retried next run) instead of risking a clobber. `ls-remote
          # --exit-code` distinguishes a CONFIRMED-absent branch (rc 2, safe to create) from
          # a query error (other rc, fail closed). The bump is surfaced as a tracking issue.
          protected=true
          push_mode=""
          expected_sha=""
          if ! open_pr="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"; then
            echo "gh pr list failed; treating ${BRANCH} as protected (fail closed)." >&2
          elif [ -n "${open_pr}" ]; then
            echo "Open PR #${open_pr} tracks ${BRANCH}; not clobbering."
          else
            ls_rc=0
            git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1 || ls_rc=$?
            if [ "${ls_rc}" -eq 2 ]; then
              protected=false; push_mode="create"  # remote branch confirmed absent
            elif [ "${ls_rc}" -ne 0 ]; then
              echo "git ls-remote failed (rc=${ls_rc}); treating ${BRANCH} as protected (fail closed)." >&2
            elif git fetch --no-tags origin \
                   "+refs/heads/main:refs/remotes/origin/main" \
                   "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
              # Capture the diff status separately from grep: a `git diff` FAILURE (e.g. the
              # branch has unrelated history with no merge base) must fail closed, whereas
              # grep's rc 1 "no non-lock file" is the expected SAFE case.
              diff_rc=0
              changed="$(git diff --name-only "refs/remotes/origin/main...refs/remotes/origin/${BRANCH}")" || diff_rc=$?
              if [ "${diff_rc}" -ne 0 ]; then
                echo "git diff against ${BRANCH} failed (rc=${diff_rc}); treating as protected (fail closed)." >&2
              elif [ -n "$(printf '%s\n' "${changed}" | grep -Fxv "${LOCK}" || true)" ]; then
                echo "${BRANCH} carries commits touching files other than ${LOCK}; not clobbering."
              else
                # Only the lock commit -> safe to refresh; the push below leases against this
                # exact SHA so a commit landing before the push rejects instead of being lost.
                protected=false; push_mode="lease"
                expected_sha="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
              fi
            else
              echo "git fetch failed; treating ${BRANCH} as protected (fail closed)." >&2
            fi
          fi

          upsert_issue() {
            existing="$(gh issue list --state open --label "${LABEL}" --search "devbox toolchain in:title" --json number --jq '.[0].number // empty')"
            if [ -n "${existing}" ]; then
              echo "Tracking issue #${existing} already open; not duplicating."
            else
              gh issue create --title "$1" --label "${LABEL}" --body "$2"
            fi
          }

          if [ "${protected}" = true ]; then
            echo "Branch ${BRANCH} has an open PR or human commits; not clobbering. Surfacing a tracking issue instead." >&2
            upsert_issue "Devbox worker toolchain bump available (branch occupied)" \
              "$(printf 'A newer validated `devbox.lock` bump is available, but `%s` has an open PR or human commits, so this run did not overwrite it. Merge or clear the branch and re-run the workflow.\n\n%s' "${BRANCH}" "${BODY}")"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add "${LOCK}"
          git commit -m "chore(deps): refresh devbox worker toolchain nixpkgs pin"

          # Atomic publish. A confirmed-absent branch is created with a plain push (which
          # fails, safely, if someone raced us to create it); an existing safe branch is
          # overwritten with --force-with-lease against the exact SHA the guard fetched, so
          # a commit landing between the check and the push rejects the lease instead of
          # being clobbered. Either rejection surfaces a tracking issue, not a failed run.
          push_rc=0
          if [ "${push_mode}" = "create" ]; then
            git push origin "HEAD:refs/heads/${BRANCH}" || push_rc=$?
          else
            git push --force-with-lease="refs/heads/${BRANCH}:${expected_sha}" \
              origin "HEAD:refs/heads/${BRANCH}" || push_rc=$?
          fi
          if [ "${push_rc}" -ne 0 ]; then
            echo "Push to ${BRANCH} rejected (it changed after the safety check); surfacing a tracking issue." >&2
            upsert_issue "Devbox worker toolchain bump: ${BRANCH} changed during the run" \
              "$(printf 'The push to `%s` was rejected because it changed after the safety check (a concurrent commit, or a raced branch creation). Re-run the workflow.\n\n%s' "${BRANCH}" "${BODY}")"
            exit 0
          fi

          if gh pr create --base main --head "${BRANCH}" \
               --title "chore(deps): refresh devbox worker toolchain (nixpkgs pin)" \
               --label "${LABEL}" --body "${BODY}"; then
            echo "Opened refresh PR."
            exit 0
          fi

          echo "PR creation refused (Actions-create-PR setting off and no DEVBOX_UPDATE_TOKEN); filing a tracking issue." >&2
          upsert_issue "Devbox worker toolchain bump validated on ${BRANCH}" \
            "$(printf 'A validated `devbox.lock` bump is pushed to `%s`. Open a PR from it (that triggers CI) and merge.\n\n%s' "${BRANCH}" "${BODY}")"
