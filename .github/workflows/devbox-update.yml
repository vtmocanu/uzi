# uzi devbox worker-toolchain refresh: bump the nixpkgs pin Renovate does not cover.
#
# WHY THIS EXISTS (issue #912). agent/devbox-global/devbox.json lists the worker
# toolchain UNVERSIONED (go, gcc, python3, chromium, openssl, semgrep, helm,
# opentofu, ...); each resolves against the nixpkgs revision pinned in
# agent/devbox-global/devbox.lock, and the worker image bakes exactly that lock
# (agent/templates/base/Dockerfile COPYs it before `devbox global install`). Renovate
# tracks the npm/Go/CI-tool pins but not this lock, so it silently rots (the pin sat
# ~6.5 weeks stale when #912 was filed). This weekly job runs `devbox update`, which
# advances the pin to the newest nixpkgs-unstable commit -- so a bump CAN carry major
# tool versions, which is intended (workers should get current, patched tools) and is
# exactly why it is VALIDATED and human-reviewed rather than applied blind.
#
# HOW IT VALIDATES WITHOUT A PAT, AND WHY A PR CAN FALL BACK TO AN ISSUE. A PR opened
# with the default GITHUB_TOKEN does NOT trigger other workflows (GitHub's recursion
# guard), and opening a PR with GITHUB_TOKEN at all requires the repo setting "Allow
# GitHub Actions to create and approve pull requests". So this job does the validation
# ITSELF -- it builds the worker base image, whose Dockerfile runs
# agent/devbox-global/assert-toolchain.sh against what devbox actually installed
# (toolchain-guard.tsv smoke) -- and only on a green build does it push the branch and
# try to open a PR. If PR creation is refused (setting off and no PAT), it files a
# tracking ISSUE pointing at the already-pushed, already-validated branch, so the
# signal is never lost and a human opens the PR (which then triggers CI). Supplying a
# workflow-scoped PAT as DEVBOX_UPDATE_TOKEN (contents + pull-requests write) makes the
# PR open directly and run its own CI. main's ci.yml re-validates on merge either way.
# This mirrors roles-manifest-refresh.yml's credential-less PR-or-issue pattern.
name: Devbox toolchain update

# Quoted so yamllint's `truthy` rule does not read the key as the boolean `on`.
"on":
  schedule:
    # 06:41 UTC Mondays, off the hour and distinct from the other weekly jobs
    # (roles-manifest-refresh 06:27, main-guard 05:43, e2e 01:17) to dodge scheduler
    # contention. Weekly keeps each bump's delta small so a major shows up isolated.
    - cron: "41 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write  # push the update branch
  pull-requests: write  # open the PR
  issues: write  # the tracking-issue fallback

concurrency:
  group: devbox-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A healthy run is a devbox re-lock plus one worker-image build; this only bounds a
    # pathological hang (the cold base build with a fresh nixpkgs closure is minutes).
    timeout-minutes: 45
    steps:
      - name: Checkout uzi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The PAT (if set) is what lets the bump PR trigger its own CI; else the
          # built-in token, which can still push and open a PR where the repo setting
          # allows it, and otherwise the issue fallback runs.
          token: ${{ secrets.DEVBOX_UPDATE_TOKEN || github.token }}

      # Install nix + the devbox CLI, pinned to the SAME version baked into the worker
      # image (agent/templates/base/Dockerfile ARG DEVBOX_VERSION) so the lock is
      # regenerated by the tool that later consumes it.
      - name: Install nix + devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7  # v0.15.0
        with:
          project-path: agent/devbox-global
          devbox-version: "0.17.5"
          enable-cache: "false"

      - name: devbox update (advance the worker toolchain nixpkgs pin)
        working-directory: agent/devbox-global
        run: devbox update

      - name: Detect a lock change
        id: delta
        run: |
          set -euo pipefail
          if git diff --quiet -- agent/devbox-global/devbox.lock; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "nixpkgs pin unchanged; nothing to do."
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            git --no-pager diff -- agent/devbox-global/devbox.lock
          fi

      - name: Set up buildx
        if: steps.delta.outputs.changed == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      # Validation: build the worker base image with the UPDATED lock. The build COPYs
      # the lock, runs `devbox global install`, then assert-toolchain.sh cross-checks the
      # installed package set and smoke-runs each tool. A missing or broken tool fails
      # the build, so this step fails and the push/PR step below is skipped -- a bad bump
      # is never proposed. push:false touches no registry credential; cache-from is the
      # public, anonymous release buildcache (read-only), matching ci.yml's build-agent.
      - name: Validate - build the worker base image (toolchain guard runs inside)
        if: steps.delta.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          file: agent/templates/base/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/vtmocanu/uzi/agent-base:buildcache
          build-args: |
            UZI_SRC_SHA=${{ github.sha }}
          tags: uzi-agent-base:devbox-update

      # Reached only when the lock changed AND the validation build was green (a failed
      # build fails its step, skipping this one). Pushes the bot branch and opens a PR;
      # if PR creation is refused, files/refreshes a tracking issue instead.
      - name: Propose the validated bump (PR, else tracking issue)
        if: steps.delta.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEVBOX_UPDATE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/devbox-toolchain-update"
          LABEL="dependencies"
          LOCK="agent/devbox-global/devbox.lock"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY="$(printf 'Automated weekly `devbox update` of the worker toolchain nixpkgs pin (`%s`), which Renovate does not cover (#912).\n\nThe devbox-global packages are unversioned and track `nixpkgs-unstable`, so this bump can include **major** tool versions -- review the lock delta.\n\nValidated in the scheduled run by building agent/templates/base/Dockerfile (the toolchain-guard.tsv smoke runs inside that build); this proposal exists only because that build was green. main'"'"'s ci.yml re-validates on merge.\n\nRun: %s' "${LOCK}" "${RUN_URL}")"

          # Idempotent label so `gh pr create --label` / `gh issue create --label` work.
          gh label create "${LABEL}" \
            --description "Dependency updates" --color 0366D6 --force >/dev/null 2>&1 || true

          # Never clobber human work on the bot branch (mirrors roles-manifest-refresh.yml,
          # hardened to FAIL CLOSED per review): the branch is treated as protected unless
          # every check POSITIVELY confirms it is safe to overwrite -- an open PR tracks it,
          # OR the remote branch carries commits touching files other than the lock (a
          # maintainer's conflict-resolution, a pinned package, or the deferred uxlab-lock
          # bump). A failed gh/git query leaves it protected, so a transient API/network blip
          # skips the push (retried next run) instead of risking a clobber. `ls-remote
          # --exit-code` distinguishes a CONFIRMED-absent branch (rc 2, safe to create) from
          # a query error (other rc, fail closed). The bump is surfaced as a tracking issue.
          protected=true
          push_mode=""
          expected_sha=""
          if ! open_pr="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"; then
            echo "gh pr list failed; treating ${BRANCH} as protected (fail closed)." >&2
          elif [ -n "${open_pr}" ]; then
            echo "Open PR #${open_pr} tracks ${BRANCH}; not clobbering."
          else
            ls_rc=0
            git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1 || ls_rc=$?
            if [ "${ls_rc}" -eq 2 ]; then
              protected=false; push_mode="create"  # remote branch confirmed absent
            elif [ "${ls_rc}" -ne 0 ]; then
              echo "git ls-remote failed (rc=${ls_rc}); treating ${BRANCH} as protected (fail closed)." >&2
            elif git fetch --no-tags origin \
                   "+refs/heads/main:refs/remotes/origin/main" \
                   "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
              others="$(git diff --name-only "refs/remotes/origin/main...refs/remotes/origin/${BRANCH}" | grep -Fxv "${LOCK}" || true)"
              if [ -z "${others}" ]; then
                # Only the lock commit -> safe to refresh, but the push below leases against
                # this exact SHA so a commit landing before the push rejects instead of being lost.
                protected=false; push_mode="lease"
                expected_sha="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
              else
                echo "${BRANCH} carries commits touching files other than ${LOCK}; not clobbering."
              fi
            else
              echo "git fetch failed; treating ${BRANCH} as protected (fail closed)." >&2
            fi
          fi

          upsert_issue() {
            existing="$(gh issue list --state open --label "${LABEL}" --search "devbox toolchain in:title" --json number --jq '.[0].number // empty')"
            if [ -n "${existing}" ]; then
              echo "Tracking issue #${existing} already open; not duplicating."
            else
              gh issue create --title "$1" --label "${LABEL}" --body "$2"
            fi
          }

          if [ "${protected}" = true ]; then
            echo "Branch ${BRANCH} has an open PR or human commits; not clobbering. Surfacing a tracking issue instead." >&2
            upsert_issue "Devbox worker toolchain bump available (branch occupied)" \
              "$(printf 'A newer validated `devbox.lock` bump is available, but `%s` has an open PR or human commits, so this run did not overwrite it. Merge or clear the branch and re-run the workflow.\n\n%s' "${BRANCH}" "${BODY}")"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add "${LOCK}"
          git commit -m "chore(deps): refresh devbox worker toolchain nixpkgs pin"

          # Atomic publish. A confirmed-absent branch is created with a plain push (which
          # fails, safely, if someone raced us to create it); an existing safe branch is
          # overwritten with --force-with-lease against the exact SHA the guard fetched, so
          # a commit landing between the check and the push rejects the lease instead of
          # being clobbered. Either rejection surfaces a tracking issue, not a failed run.
          push_rc=0
          if [ "${push_mode}" = "create" ]; then
            git push origin "HEAD:refs/heads/${BRANCH}" || push_rc=$?
          else
            git push --force-with-lease="refs/heads/${BRANCH}:${expected_sha}" \
              origin "HEAD:refs/heads/${BRANCH}" || push_rc=$?
          fi
          if [ "${push_rc}" -ne 0 ]; then
            echo "Push to ${BRANCH} rejected (it changed after the safety check); surfacing a tracking issue." >&2
            upsert_issue "Devbox worker toolchain bump: ${BRANCH} changed during the run" \
              "$(printf 'The push to `%s` was rejected because it changed after the safety check (a concurrent commit, or a raced branch creation). Re-run the workflow.\n\n%s' "${BRANCH}" "${BODY}")"
            exit 0
          fi

          if gh pr create --base main --head "${BRANCH}" \
               --title "chore(deps): refresh devbox worker toolchain (nixpkgs pin)" \
               --label "${LABEL}" --body "${BODY}"; then
            echo "Opened refresh PR."
            exit 0
          fi

          echo "PR creation refused (Actions-create-PR setting off and no DEVBOX_UPDATE_TOKEN); filing a tracking issue." >&2
          upsert_issue "Devbox worker toolchain bump validated on ${BRANCH}" \
            "$(printf 'A validated `devbox.lock` bump is pushed to `%s`. Open a PR from it (that triggers CI) and merge.\n\n%s' "${BRANCH}" "${BODY}")"
