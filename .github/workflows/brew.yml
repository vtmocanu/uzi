# Regenerate a uzi CLI Homebrew formula for a v* tag and push it to vtmocanu/homebrew-tap.
#
# Two channels, routed by the tag (PRD #1378): a STABLE tag (vX.Y.Z) renders the `uzi-cli`
# formula via `task brew:formula`; an RC tag (vX.Y.Z-rc.N) renders the separate, opt-in
# `uzi-cli-rc` formula via `task brew-rc:formula`. Both compute the tag tarball's sha256,
# substitute the url/sha256 placeholders in the matching Formula/*.rb template, and push
# the rendered copy into the tap with `task <channel>:publish`. The mechanics live in the
# vendored homebrew-tap.yml, included by uzi's Taskfile.yml under `brew:` and `brew-rc:`
# (the two sanctioned includes, local vendored copies; see that file's rule 3).
#
# TRIGGERS: a `v*` tag push (auto-publish the formula on release, matching release.yml)
# AND workflow_dispatch (re-publish for any existing tag by hand). Both feed the same job
# through INPUT_TAG below. brew:formula fetches the ANONYMOUS auto-archive
# (https://github.com/vtmocanu/uzi/archive/refs/tags/<tag>.tar.gz); the reusable task
# guards the empty-input digest and refuses to render on a 404. A release tags vX.Y.Z (or
# vX.Y.Z-rc.N), release.yml publishes the images + chart, and this publishes the matching
# formula. brew stays a SEPARATE workflow from release.yml because it needs that public
# archive, and a failed tap push must not redden the image+chart release.
#
# The default GITHUB_TOKEN cannot write to a second repo, so the cross-repo push uses
# HOMEBREW_TAP_TOKEN (a fine-grained PAT scoped to vtmocanu/homebrew-tap, contents:write),
# from the `release` environment. The `environment: release` below is REQUIRED for that
# reason -- it scopes the token as an environment secret -- NOT as an approval gate: that
# environment carries no required reviewer (removed 2026-08-20), so this publishes
# immediately on the tag with no approval click. Access control is the `v*` tag ruleset
# (only a repo admin can create the tag), same as release.yml. No GitHub Release is
# created (the auto-archive needs none), so permissions stay read-only -- matching
# cc-statusline.

name: Brew

# Quoted so yamllint's `truthy` rule does not read the key as the boolean `on`.
"on":
  push:
    # Every v* tag, both channels (PRD #1378). A STABLE tag (vX.Y.Z) publishes the
    # `uzi-cli` formula; an RC tag (vX.Y.Z-rc.N) publishes the separate, opt-in
    # `uzi-cli-rc` formula, so stable users on `uzi-cli` never see a candidate while a
    # dogfooder can `brew install vtmocanu/tap/uzi-cli-rc`. (Before #1378 the negative
    # `!v*-*` pattern excluded RC tags entirely; now the Detect channel step routes them.)
    # The Validate step's regex is the SemVer gate for both channels, esp. workflow_dispatch.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish the uzi-cli / uzi-cli-rc formula for (e.g. v0.42.1 or v0.42.1-rc.1)"
        required: true

permissions:
  contents: read

concurrency:
  # Ref-INDEPENDENT (not per-tag): a promote ceremony pushes the stable tag and the next
  # RC tag within minutes, firing two runs that BOTH `git push origin main` into the tap
  # from a fresh clone with no rebase/retry. A per-ref group would let them run
  # concurrently and collide on a non-fast-forward push, reddening one (PRD #1378 R5). One
  # shared group + cancel-in-progress:false serializes the promote's two publishes: one
  # runs, the other pends, then runs (the channels render different formula files, so
  # ordering is enough). A 3rd tag pushed inside that ~3-min window would displace the
  # single pending slot; `queue: max` (a real GH Actions key since 2026-05-07) would hold
  # all pending runs, but the pinned actionlint rejects the `queue` key, so it is deferred
  # until that pin catches up -- and three simultaneous release tags is not a cadence the
  # RC-first flow produces, while a displaced publish simply re-runs on the tag.
  group: brew-tap-publish
  cancel-in-progress: false

jobs:
  publish-formula:
    runs-on: ubuntu-latest
    environment: release
    env:
      # Passed via env, never string-interpolated into a run script: a workflow_dispatch
      # input is untrusted, and git ref names allow shell metacharacters. On a v* tag push
      # inputs.tag is empty, so fall back to the tag ref name; the Validate step below
      # rejects anything that is not strict SemVer either way.
      INPUT_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # Only strict SemVer tags may proceed -- a stable vMAJOR.MINOR.PATCH or an RC
      # vMAJOR.MINOR.PATCH-rc.N (integer N, no leading zero). $INPUT_TAG flows into a URL +
      # Task template substitution where quoting cannot be relied on; the guard is
      # injection-safe because $INPUT_TAG is shell-expanded from env, never a GH expression.
      - name: Validate tag format
        id: tag
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
            echo "refusing to publish: tag '$INPUT_TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          fi
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

      # Route the tag to a channel: a prerelease suffix (vX.Y.Z-rc.N) publishes the opt-in
      # `uzi-cli-rc` formula via the `brew-rc:` task include; a stable tag publishes
      # `uzi-cli` via `brew:`. The output is a fixed literal from this case (`brew` or
      # `brew-rc`), never the raw tag, so it is safe to splice into the task target below.
      - name: Detect channel
        id: channel
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) ns=brew-rc ;;
            *)   ns=brew ;;
          esac
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Renders dist/<channel>.rb (auto-archive url + computed sha256) for the routed
      # channel. Fails loudly on the empty-input digest (a bad tag / network failure).
      # VERSION and CHANNEL_NS flow via env: (never string-interpolated into the run body),
      # matching this repo's zizmor template-injection convention -- release.yml uses env:
      # the same way. CHANNEL_NS is the fixed `brew`/`brew-rc` literal from Detect channel.
      - name: Render formula
        env:
          VERSION: ${{ steps.tag.outputs.tag }}
          CHANNEL_NS: ${{ steps.channel.outputs.ns }}
        run: task --yes "${CHANNEL_NS}:formula" VERSION="$VERSION"

      # Clones the tap with HOMEBREW_TAP_TOKEN, copies the rendered formula, commits + pushes.
      - name: Publish to tap
        env:
          VERSION: ${{ steps.tag.outputs.tag }}
          CHANNEL_NS: ${{ steps.channel.outputs.ns }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: task --yes "${CHANNEL_NS}:publish" VERSION="$VERSION" HOMEBREW_TAP_TOKEN="$HOMEBREW_TAP_TOKEN"
