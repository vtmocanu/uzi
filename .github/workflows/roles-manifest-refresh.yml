# uzi role refresh: sync the builtins and the dev-team roster from the upstream
# skills library's latest stable release.
#
# WHY THIS EXISTS. PRD #85 vendored api/internal/agenttmpl/library/manifest.json and
# issue #601 added this weekly job to notice upstream version moves. Since PRD #1849
# the 11 builtin subagent files are byte-for-byte copies of the upstream
# product-agents/ files, so #1851 makes this job do the whole sync instead of only
# bumping version numbers: scripts/refresh-role-manifest.sh checks out the latest
# stable vX.Y.Z release, copies the builtin bodies, moves the versions and the pin,
# syncs .claude/agents/ with the library's own sync.py, and byte-checks parity.
# The PR is complete: green CI, merge, release.
#
# ALL OR NOTHING. A role missing upstream, a version moving backward or a
# non-integer version writes nothing and opens a tracking issue instead.
#
# BOT-ONLY BRANCH. The branch is replaced only when every commit on it is this bot's
# (author github-actions[bot] and the `Roles-Refresh-Bot: true` trailer) and it
# touches only bot-owned files (the manifest, the builtins, .claude/agents/*.md);
# the push is --force-with-lease against the SHA it inspected. A branch carrying
# any human commit is left alone and a tracking issue is opened.
#
# TOKEN / CI-ON-PR NOTE. A PR opened with the default GITHUB_TOKEN does NOT trigger
# other workflows (GitHub's recursion guard), so the PR's CI runs automatically only
# with a workflow-scoped PAT in the ROLES_REFRESH_TOKEN secret (contents +
# pull-requests write). Opening a PR with GITHUB_TOKEN also needs the repo setting
# "Allow GitHub Actions to create and approve pull requests"; when that is off, the
# job falls back to a tracking ISSUE so the drift is never lost.

name: Roles Manifest Refresh

# Quoted so yamllint's `truthy` rule does not read the key as the boolean `on`.
"on":
  schedule:
    # 06:27 UTC Mondays, off the top of the hour to dodge scheduler contention and
    # distinct from e2e.yml (01:17) and main-guard.yml (05:43).
    - cron: "27 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: roles-manifest-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A healthy run is a minute or two (one go run); this only bounds a hang.
    timeout-minutes: 20
    steps:
      - name: Checkout uzi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # No write credential on disk while the upstream release's sync.py runs:
          # the last step authenticates only its own push and gh calls.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Same pin and version as ci.yml; api/cmd/builtinparity needs it.
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Install PyYAML for the library's sync.py
        # sync.py refuses to run without PyYAML; pinned rather than trusting the image.
        run: python3 -m pip install --disable-pip-version-check --user 'pyyaml==6.0.3'

      - name: Check out the latest stable upstream release
        id: upstream
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/vtmocanu/skills.git "${RUNNER_TEMP}/skills"
          tag="$(scripts/refresh-role-manifest.sh --latest-stable-tag "${RUNNER_TEMP}/skills")"
          git -C "${RUNNER_TEMP}/skills" checkout --quiet "refs/tags/${tag}"
          {
            echo "tag=${tag}"
            echo "sha=$(git -C "${RUNNER_TEMP}/skills" rev-parse "refs/tags/${tag}^{commit}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Sync builtins and roster
        id: refresh
        run: |
          set -euo pipefail
          scripts/refresh-role-manifest.sh "${RUNNER_TEMP}/skills" "${{ steps.upstream.outputs.sha }}"

      - name: Surface the result (PR, or a tracking issue)
        if: >-
          steps.refresh.outputs.changed == 'true' || steps.refresh.outputs.warned == 'true'
          || steps.refresh.outputs.parity_ok != 'true'
        env:
          # The PAT (if set) is what lets the PR trigger its own CI; else the
          # built-in token, which can still push and open a PR where the repo
          # setting allows it, and otherwise the issue fallback runs.
          GH_TOKEN: ${{ secrets.ROLES_REFRESH_TOKEN || github.token }}
          CHANGED: ${{ steps.refresh.outputs.changed }}
          PRODUCT_CHANGED: ${{ steps.refresh.outputs.product_changed }}
          ROSTER_CHANGED: ${{ steps.refresh.outputs.roster_changed }}
          PARITY_OK: ${{ steps.refresh.outputs.parity_ok }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
          WARNINGS: ${{ steps.refresh.outputs.warnings }}
          ROSTER_REPORT: ${{ steps.refresh.outputs.roster_report }}
          PARITY_REPORT: ${{ steps.refresh.outputs.parity_report }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          BRANCH="chore/roles-manifest-refresh"
          LABEL="roles-manifest-refresh"
          TRAILER="Roles-Refresh-Bot: true"
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          HEADER="$(printf 'Automated by the weekly roles-manifest-refresh workflow (#1851). Upstream skills %s (%s). Run: %s' "${UPSTREAM_TAG}" "${UPSTREAM_SHA}" "${RUN_URL}")"

          BODY="${HEADER}"
          [ -n "${SUMMARY}" ] && BODY="$(printf '%s\n\n**Builtins** (api/internal/agenttmpl):\n\n%s' "${BODY}" "${SUMMARY}")"
          [ -n "${ROSTER_REPORT}" ] && BODY="$(printf '%s\n\n**Dev-team roster** (.claude/agents):\n\n%s' "${BODY}" "${ROSTER_REPORT}")"
          if [ "${PARITY_OK}" = "true" ]; then
            BODY="$(printf '%s\n\n**Parity:** %s' "${BODY}" "${PARITY_REPORT}")"
          elif [ -n "${PARITY_REPORT}" ]; then
            BODY="$(printf '%s\n\n**Parity check did not pass** (a PR stays a draft until it does):\n\n%s' "${BODY}" "${PARITY_REPORT}")"
          fi
          [ -n "${WARNINGS}" ] && BODY="$(printf '%s\n\n**Needs a human:**\n\n%s' "${BODY}" "${WARNINGS}")"

          # Open a tracking issue only if none is open (no weekly duplicate nag).
          upsert_issue() {
            gh label create "${LABEL}" \
              --description "Upstream role-library drift detected by the weekly refresh" \
              --color 1D76DB --force
            existing="$(gh issue list --state open --label "${LABEL}" --json number --jq '.[0].number // empty')"
            if [ -n "${existing}" ]; then
              echo "Tracking issue #${existing} already open; not adding a duplicate."
            else
              gh issue create --title "Upstream role library: the weekly refresh needs a human" \
                --label "${LABEL}" --body "$1"
            fi
          }
          close_tracking_issues() {
            gh issue list --state open --label "${LABEL}" --json number --jq '.[].number' \
              | while read -r n; do
                  [ -n "${n}" ] || continue
                  gh issue close "${n}" --comment "Superseded by the refresh PR on ${BRANCH}. Run: ${RUN_URL}"
                done
          }

          # Warnings (nothing was written, all or nothing), or a parity failure with
          # nothing to commit: surface as an issue and stop.
          if [ "${CHANGED}" != "true" ]; then
            upsert_issue "${BODY}"
            exit 0
          fi

          # Inspect the existing branch: replace it only when every commit on it is
          # ours and touches only bot-owned files.
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true
          inspected=""
          protected=false
          if inspected="$(git rev-parse --verify --quiet "refs/remotes/origin/${BRANCH}")"; then
            for c in $(git rev-list "refs/remotes/origin/main..${inspected}"); do
              if [ "$(git log -1 --format=%ae "${c}")" != "${BOT_EMAIL}" ] \
                 || ! git log -1 --format=%B "${c}" | grep -qxF "${TRAILER}"; then
                protected=true
              fi
            done
            others="$(git diff --name-only "refs/remotes/origin/main...${inspected}" \
              | grep -vE '^(api/internal/agenttmpl/library/manifest\.json|api/internal/agenttmpl/builtins/[a-z0-9-]+\.md|\.claude/agents/[a-z0-9-]+\.md)$' || true)"
            [ -n "${others}" ] && protected=true
          else
            inspected=""
          fi
          if [ "${protected}" = true ]; then
            echo "Branch ${BRANCH} carries a human commit or a non-bot file; not replacing it."
            upsert_issue "$(printf '%s\n\nThe refresh branch %s has human changes, so this run did not replace it. Land or close it, then re-run the workflow.' "${BODY}" "${BRANCH}")"
            exit 0
          fi

          # Authenticate git for this step only (checkout persisted no credential).
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "${BOT_EMAIL}"
          git checkout -B "${BRANCH}"
          if [ "${PRODUCT_CHANGED}" = "true" ]; then
            git add api/internal/agenttmpl/library/manifest.json api/internal/agenttmpl/builtins
            git commit -m "chore(agenttmpl): sync builtins to skills ${UPSTREAM_TAG}" -m "${TRAILER}"
          fi
          if [ "${ROSTER_CHANGED}" = "true" ]; then
            git add -- '.claude/agents/*.md'
            git commit -m "chore(agents): sync the dev-team roster to skills ${UPSTREAM_TAG}" -m "${TRAILER}"
          fi
          git push --force-with-lease="${BRANCH}:${inspected}" origin "${BRANCH}"

          open_pr="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${open_pr}" ]; then
            gh pr edit "${open_pr}" --body "${BODY}"
            is_draft="$(gh pr view "${open_pr}" --json isDraft --jq .isDraft)"
            if [ "${PARITY_OK}" = "true" ] && [ "${is_draft}" = "true" ]; then
              gh pr ready "${open_pr}"
            elif [ "${PARITY_OK}" != "true" ] && [ "${is_draft}" != "true" ]; then
              gh pr ready --undo "${open_pr}"
            fi
            echo "Updated the open refresh PR #${open_pr}."
            exit 0
          fi
          draft=()
          [ "${PARITY_OK}" = "true" ] || draft=(--draft)
          if gh pr create --base main --head "${BRANCH}" "${draft[@]}" \
               --title "chore(agenttmpl): sync builtin roles to skills ${UPSTREAM_TAG}" \
               --body "${BODY}"; then
            echo "Opened refresh PR."
            close_tracking_issues
            exit 0
          fi

          echo "PR creation failed; filing a tracking issue instead." >&2
          upsert_issue "${BODY}"
