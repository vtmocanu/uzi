# Protected manual releases, opt-in nightly RCs and publication journals (#3512).
# App/environment/ruleset setup and the first live dispatch belong to the maintainer.
# D10 retains pre-cut CI and publication-role retries with a bounded journal.
# Own-main CI is report-only; tagged-smoke and targeted assertion recovery follow separately.
name: Release automation

"on":
  schedule:
    - cron: '47 4 * * *'
      timezone: Europe/Bucharest
  workflow_dispatch:
    inputs:
      kind:
        description: Release operation
        type: choice
        options: [rc, stable]
        required: true
      version:
        description: Optional RC base X.Y.Z
        type: string
      abandon_train:
        description: Abandon the open train (requires a higher version)
        type: boolean
        default: false
      supersede:
        description: Exact latest failed or missing-publication RC to replace
        type: string
      rc_tag:
        description: Stable only, exact candidate tag
        type: string
      rc_sha:
        description: Stable only, full peeled candidate commit
        type: string

permissions: {}
concurrency:
  group: release-auto
  cancel-in-progress: false
  queue: max

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.authorize.outputs.outcome }}
      reason: ${{ steps.authorize.outputs.reason }}
      created_at: ${{ steps.authorize.outputs.created_at }}
    env:
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'rc' || inputs.kind }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ABANDON: ${{ github.event_name == 'schedule' && 'false' || inputs.abandon_train }}
      RELEASE_SUPERSEDE: ${{ inputs.supersede }}
      RELEASE_RC_TAG: ${{ inputs.rc_tag }}
      RELEASE_RC_SHA: ${{ inputs.rc_sha }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_ACTOR: ${{ github.triggering_actor }}
      RELEASE_DISPATCHERS: ${{ vars.RELEASE_DISPATCHERS }}
      RELEASE_NIGHTLY_ENABLED: ${{ vars.RELEASE_NIGHTLY_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release route and original run metadata
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/release-auto.py authorize

  prepare:
    needs: authorize
    if: needs.authorize.outputs.outcome == 'authorized'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: read
      actions: write
    outputs:
      outcome: ${{ steps.prepare.outputs.outcome }}
      reason: ${{ steps.prepare.outputs.reason }}
      parent: ${{ steps.prepare.outputs.parent }}
      release: ${{ steps.prepare.outputs.release }}
      tag: ${{ steps.prepare.outputs.tag }}
      tag_oid: ${{ steps.prepare.outputs.tag_oid }}
      digest: ${{ steps.prepare.outputs.digest }}
      refs_digest: ${{ steps.prepare.outputs.refs_digest }}
      previous_rc: ${{ steps.prepare.outputs.previous_rc }}
      previous_rc_sha: ${{ steps.prepare.outputs.previous_rc_sha }}
      previous_stable: ${{ steps.prepare.outputs.previous_stable }}
      previous_stable_sha: ${{ steps.prepare.outputs.previous_stable_sha }}
      changes: ${{ steps.prepare.outputs.changes }}
      changes_count: ${{ steps.prepare.outputs.changes_count }}
      changes_truncated: ${{ steps.prepare.outputs.changes_truncated }}
      phase: ${{ steps.prepare.outputs.phase }}
      audit_head: ${{ steps.prepare.outputs.audit_head }}
      retry_log: ${{ steps.prepare.outputs.retry_log }}
      stage: ${{ steps.prepare.outputs.stage }}
      planned_tag: ${{ steps.prepare.outputs.planned_tag }}
      uncited: ${{ steps.prepare.outputs.uncited }}
      uncited_count: ${{ steps.prepare.outputs.uncited_count }}
      uncited_truncated: ${{ steps.prepare.outputs.uncited_truncated }}
      artifact_name: release-auto-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'rc' || inputs.kind }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ABANDON: ${{ github.event_name == 'schedule' && 'false' || inputs.abandon_train }}
      RELEASE_SUPERSEDE: ${{ inputs.supersede }}
      RELEASE_RC_TAG: ${{ inputs.rc_tag }}
      RELEASE_RC_SHA: ${{ inputs.rc_sha }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_ACTOR: ${{ github.triggering_actor }}
      RELEASE_DISPATCHERS: ${{ vars.RELEASE_DISPATCHERS }}
      RELEASE_NIGHTLY_ENABLED: ${{ vars.RELEASE_NIGHTLY_ENABLED }}
      RUN_CREATED_AT: ${{ needs.authorize.outputs.created_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Configure release bot identity
        run: |
          git config user.name 'uzi release bot'
          git config user.email 'uzi-release@users.noreply.github.com'
      - name: Prepare exact release without an App key
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/release-auto.py prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.prepare.outputs.outcome == 'prepared'
        with:
          name: release-auto-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-auto/release.bundle
          if-no-files-found: error
          retention-days: 1

  push:
    needs: [authorize, prepare]
    if: needs.authorize.outputs.outcome == 'authorized' && needs.prepare.outputs.outcome == 'prepared'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    environment:
      name: ${{ inputs.kind == 'stable' && 'release-stable' || 'release-rc' }}
    outputs:
      outcome: ${{ steps.push.outputs.outcome }}
      attempted: ${{ steps.push.outputs.attempted || steps.bundle.outputs.attempted }}
      reason: ${{ steps.bundle.outputs.reason || steps.push.outputs.reason }}
    env:
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'rc' || inputs.kind }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ABANDON: ${{ github.event_name == 'schedule' && 'false' || inputs.abandon_train }}
      RELEASE_SUPERSEDE: ${{ inputs.supersede }}
      RELEASE_RC_TAG: ${{ inputs.rc_tag }}
      RELEASE_RC_SHA: ${{ inputs.rc_sha }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_ACTOR: ${{ github.triggering_actor }}
      RELEASE_DISPATCHERS: ${{ vars.RELEASE_DISPATCHERS }}
      RELEASE_NIGHTLY_ENABLED: ${{ vars.RELEASE_NIGHTLY_ENABLED }}
      RUN_CREATED_AT: ${{ needs.authorize.outputs.created_at }}
      PARENT: ${{ needs.prepare.outputs.parent }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TAG_OID: ${{ needs.prepare.outputs.tag_oid }}
      BUNDLE_DIGEST: ${{ needs.prepare.outputs.digest }}
      REFS_DIGEST: ${{ needs.prepare.outputs.refs_digest }}
      PREVIOUS_RC: ${{ needs.prepare.outputs.previous_rc }}
      PREVIOUS_RC_SHA: ${{ needs.prepare.outputs.previous_rc_sha }}
      PREVIOUS_STABLE: ${{ needs.prepare.outputs.previous_stable }}
      PREVIOUS_STABLE_SHA: ${{ needs.prepare.outputs.previous_stable_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Validate request and bundle before minting
        id: bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          failure_shell=$BASHPID
          reason='authorization-failed'
          fail() {
            if [ "$BASHPID" = "$failure_shell" ]; then printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"; fi
            exit 1
          }
          trap fail ERR
          if [ "${GITHUB_RUN_ATTEMPT:-}" != 1 ]; then
            reason='re-dispatch-required'
            echo '::error::Re-dispatch instead of rerunning prepare or push.'
            fail
          fi
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0
          [ "$GITHUB_REPOSITORY" = vtmocanu/uzi ]
          [ "$RELEASE_REF" = refs/heads/main ]
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              dispatcher_words="$(printf '%s' "$RELEASE_DISPATCHERS" | tr ',\t\r\n' '    ')"
              read -r -a dispatchers <<< "$dispatcher_words"
              allowed=false
              for dispatcher in "${dispatchers[@]}"; do
                if [ -n "$RELEASE_ACTOR" ] && [ "$dispatcher" = "$RELEASE_ACTOR" ]; then allowed=true; fi
              done
              [ "$allowed" = true ] ;;
            schedule)
              if [ "${RELEASE_NIGHTLY_ENABLED:-}" != true ]; then reason='nightly-disabled'; fail; fi
              if ! { [ "$RELEASE_KIND" = rc ] && [ "$RELEASE_ABANDON" = false ] &&
                     [ -z "$RELEASE_VERSION$RELEASE_SUPERSEDE$RELEASE_RC_TAG$RELEASE_RC_SHA" ]; }; then fail; fi ;;
            *) fail ;;
          esac
          reason='input-validation'
          base='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          rc="^v${base}-rc\.[1-9][0-9]*$"
          [[ "$RELEASE_ABANDON" = true || "$RELEASE_ABANDON" = false ]]
          [[ -z "$RELEASE_VERSION" || ( ${#RELEASE_VERSION} -le 100 && "$RELEASE_VERSION" =~ ^${base}$ ) ]]
          [[ -z "$RELEASE_SUPERSEDE" || ( ${#RELEASE_SUPERSEDE} -le 128 && "$RELEASE_SUPERSEDE" =~ $rc ) ]]
          case "$RELEASE_KIND" in
            rc)
              [ -z "$RELEASE_RC_TAG$RELEASE_RC_SHA" ]
              [[ "$RELEASE_TAG" =~ $rc ]]
              if ! { [ "$RELEASE_ABANDON" = false ] || [ -n "$RELEASE_VERSION" ]; }; then fail; fi
              if [ -n "$RELEASE_VERSION" ]; then [ "${RELEASE_TAG#v}" = "${RELEASE_VERSION}-rc.${RELEASE_TAG##*-rc.}" ]; fi
              ;;
            stable)
              if ! { [ -z "$RELEASE_VERSION$RELEASE_SUPERSEDE" ] && [ "$RELEASE_ABANDON" = false ]; }; then fail; fi
              [[ ${#RELEASE_RC_TAG} -le 128 && "$RELEASE_RC_TAG" =~ $rc && "$RELEASE_RC_SHA" =~ ^[0-9a-f]{40}$ ]]
              if ! { [ "$RELEASE_TAG" = "${RELEASE_RC_TAG%-rc.*}" ] && [ "$PARENT" = "$RELEASE_RC_SHA" ]; }; then fail; fi
              reason='stale-request'
              [[ "$RUN_CREATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
              requested="$(date -u -d "$RUN_CREATED_AT" +%s)"; now="$(date -u +%s)"
              if ! { [ "$requested" -le "$now" ] && [ "$((now-requested))" -le 86400 ]; }; then fail; fi
              ;;
            *) exit 1 ;;
          esac
          reason='bundle-digest-mismatch'
          for sha in "$PARENT" "$RELEASE_SHA" "$TAG_OID"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          for digest in "$BUNDLE_DIGEST" "$REFS_DIGEST"; do [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; done
          bundle="$RUNNER_TEMP/release-bundle/release.bundle"
          actual_bundle_digest="$(sha256sum "$bundle" | cut -d' ' -f1)"
          [ "$actual_bundle_digest" = "$BUNDLE_DIGEST" ]
          reason='invalid-prepared-bundle'
          bare="$RUNNER_TEMP/release-auto-push.git"
          [ ! -e "$bare" ]
          git init --bare --template= "$bare"
          g() { git --git-dir="$bare" -c core.hooksPath=/dev/null "$@"; }
          g remote add origin https://github.com/vtmocanu/uzi.git
          g fetch --no-tags origin "$PARENT"
          g bundle verify "$bundle"
          heads="$(g bundle list-heads "$bundle")"
          head_count="$(printf '%s\n' "$heads" | wc -l | tr -d ' ')"
          [ "$head_count" = 2 ]
          printf '%s\n' "$heads" | awk -v r="$RELEASE_SHA" -v t="$RELEASE_TAG" -v o="$TAG_OID" '
            $1==r && $2=="refs/heads/release-auto-prepared" { a++ }
            $1==o && $2=="refs/tags/"t { b++ }
            END { exit !(a==1 && b==1 && NR==2) }'
          g fetch "$bundle" refs/heads/release-auto-prepared:refs/heads/release-auto-prepared "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_sha="$(g rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [ "$tag_sha" = "$RELEASE_SHA" ]
          tag_type="$(g cat-file -t "refs/tags/$RELEASE_TAG")"
          [ "$tag_type" = tag ]
          parent_line="$(g rev-list --parents -n 1 "$RELEASE_SHA")"
          [ "$parent_line" = "$RELEASE_SHA $PARENT" ]
          reason='non-metadata-bundle'
          changes="$RUNNER_TEMP/release-changes"
          g diff-tree --no-commit-id --no-renames --no-ext-diff --no-textconv --name-status -r -z "$PARENT" "$RELEASE_SHA" > "$changes"
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}'
          status=''; path=''
          while IFS= read -r -d '' status; do
            IFS= read -r -d '' path || fail
            old_mode="$(g ls-tree "$PARENT" -- "$path" | awk '{print $1}')"
            case "$status:$path" in
              M:CHANGELOG.md|M:deploy/chart/Chart.yaml|M:deploy/chart/values.yaml|M:scripts/assert-worker-tag-decoupled.sh)
                new_mode="$(g ls-tree "$RELEASE_SHA" -- "$path" | awk '{print $1}')"
                if ! { [ "$old_mode" = "$new_mode" ] && [[ "$old_mode" = 100644 || "$old_mode" = 100755 ]]; }; then fail; fi ;;
              D:*)
                if ! { [[ "$path" =~ ^changelog\.d/${uuid}\.md$ ]] && [ "$old_mode" = 100644 ]; }; then fail; fi ;;
              *) fail ;;
            esac
            status=''; path=''
          done < "$changes"
          [ -z "$status$path" ]
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo 'attempted=false' >> "$GITHUB_OUTPUT"
            reason='invalid-nightly-window'
            [[ "$RUN_CREATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            requested="$(date -u -d "$RUN_CREATED_AT" +%s)"
            attempt_date="$(TZ=Europe/Bucharest date -d "$RUN_CREATED_AT" +%F)"
            cutoff="$(TZ=Europe/Bucharest date -d "$attempt_date 13:00:00" +%s)"
            offset="$(TZ=Europe/Bucharest date -d "$attempt_date 13:00:00" +%z)"
            now="$(date -u +%s)"
            [[ "$now" =~ ^[0-9]+$ ]]
            [[ "$cutoff" =~ ^[0-9]+$ ]]
            [[ "$offset" = +0200 || "$offset" = +0300 ]]
            [ "$requested" -le "$((now+60))" ]
            if ! [ "$now" -lt "$cutoff" ]; then
              reason='missed-target'
              fail
            fi
          fi

      - name: Mint repository-scoped installation token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: vtmocanu
          repositories: uzi
          permission-contents: write

      - name: Revalidate remote state and atomically push
        id: push
        shell: bash
        env:
          GH_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -Eeuo pipefail
          failure_shell=$BASHPID
          reason='remote-state-unreadable'
          fail() {
            if [ "$BASHPID" = "$failure_shell" ]; then printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"; fi
            exit 1
          }
          trap fail ERR
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0
          unset GIT_TRACE GIT_TRACE_CURL GIT_CURL_VERBOSE GIT_TRACE_PACKET GIT_TRACE_SETUP GIT_TRACE_PERFORMANCE GIT_TRACE2 GIT_TRACE2_EVENT GIT_TRACE2_PERF
          bare="$RUNNER_TEMP/release-auto-push.git"
          g() { git --git-dir="$bare" -c core.hooksPath=/dev/null "$@"; }
          auth="$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          refs="$(g ls-remote origin refs/heads/main 'refs/tags/v*')"
          reason='release-ref-race'
          actual_digest="$(printf '%s\n' "$refs" | awk '$2 ~ /^refs\/tags\/v/ {print}' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          [ "$actual_digest" = "$REFS_DIGEST" ]
          inventory="$(printf '%s\n' "$refs" | awk -F '\t' '
            BEGIN { base="(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)" }
            function gt(a,b, x,y,i) {
              sub(/^v/,"",a); sub(/^v/,"",b); gsub(/-rc\./,".",a); gsub(/-rc\./,".",b)
              split(a,x,"."); split(b,y,".")
              for(i=1;i<=4;i++) {if(x[i]+0>y[i]+0)return 1;if(x[i]+0<y[i]+0)return 0} return 0
            }
            { oid[$2]=$1; t=$2; sub(/^refs\/tags\//,"",t)
              if(t ~ ("^v"base"-rc[.][1-9][0-9]*$") && (rc=="" || gt(t,rc))) rc=t
              if(t ~ ("^v"base"$") && (st=="" || gt(t,st))) st=t
            }
            END { r=oid["refs/tags/"rc"^{}"];if(r=="")r=oid["refs/tags/"rc]
              s=oid["refs/tags/"st"^{}"];if(s=="")s=oid["refs/tags/"st]
              printf "%s|%s|%s|%s|%s",oid["refs/heads/main"],rc,r,st,s }')"
          IFS='|' read -r main rc rc_sha stable stable_sha <<< "$inventory"
          if ! { [ "$rc" = "$PREVIOUS_RC" ] && [ "$rc_sha" = "$PREVIOUS_RC_SHA" ]; }; then fail; fi
          if ! { [ "$stable" = "$PREVIOUS_STABLE" ] && [ "$stable_sha" = "$PREVIOUS_STABLE_SHA" ]; }; then fail; fi
          if printf '%s\n' "$refs" | awk -v tag="refs/tags/$RELEASE_TAG" '$2==tag {found=1} END {exit !found}'; then reason='target-tag-exists'; fail; fi
          case "$RELEASE_KIND" in
            rc) reason='main-race'; [ "$main" = "$PARENT" ]; refspecs=("$RELEASE_SHA:refs/heads/main" "refs/tags/$RELEASE_TAG") ;;
            stable)
              if ! { [ "$rc" = "$RELEASE_RC_TAG" ] && [ "$rc_sha" = "$RELEASE_RC_SHA" ]; }; then fail; fi
              reason='stale-request'
              requested="$(date -u -d "$RUN_CREATED_AT" +%s)"; now="$(date -u +%s)"
              if ! { [ "$requested" -le "$now" ] && [ "$((now-requested))" -le 86400 ]; }; then fail; fi
              refspecs=("refs/tags/$RELEASE_TAG") ;;
            *) exit 1 ;;
          esac
          # A lost transport receipt may follow a successful atomic server update.
          # Recover/verify this exact tag only; never prepare or push a replacement.
          receipt="$RUNNER_TEMP/push-receipt"
          errors="$RUNNER_TEMP/push-errors"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo 'attempted=false' >> "$GITHUB_OUTPUT"
            reason='invalid-nightly-window'
            [[ "$RUN_CREATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            requested="$(date -u -d "$RUN_CREATED_AT" +%s)"
            attempt_date="$(TZ=Europe/Bucharest date -d "$RUN_CREATED_AT" +%F)"
            cutoff="$(TZ=Europe/Bucharest date -d "$attempt_date 13:00:00" +%s)"
            offset="$(TZ=Europe/Bucharest date -d "$attempt_date 13:00:00" +%z)"
            now="$(date -u +%s)"
            [[ "$now" =~ ^[0-9]+$ ]]
            [[ "$cutoff" =~ ^[0-9]+$ ]]
            [[ "$offset" = +0200 || "$offset" = +0300 ]]
            [ "$requested" -le "$((now+60))" ]
            if ! [ "$now" -lt "$cutoff" ]; then
              reason='missed-target'
              fail
            fi
          fi
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          if g push --porcelain --atomic origin "${refspecs[@]}" > "$receipt" 2> "$errors"; then
            cat "$receipt" "$errors"
            echo 'outcome=pushed' >> "$GITHUB_OUTPUT"
          else
            cat "$receipt" "$errors"
            if awk -F '\t' '
              NF>=3 && $1=="!" { rejected++ }
              NF>=3 && $1 ~ /^[ *+\-]$/ { changed++ }
              END { exit !(rejected>0 && changed==0) }' "$receipt"; then
              echo 'attempted=false' >> "$GITHUB_OUTPUT"
              echo 'outcome=push-rejected' >> "$GITHUB_OUTPUT"
              reason='push-rejected'
              fail
            else
              echo 'outcome=receipt-unknown' >> "$GITHUB_OUTPUT"
              echo 'reason=push-receipt-unknown' >> "$GITHUB_OUTPUT"
              echo '::warning::Push receipt unconfirmed; inspect and verify only the prepared tag.'
            fi
          fi

  watch:
    needs: [authorize, prepare, push]
    if: ${{ !cancelled() && needs.push.outputs.attempted == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: write
    outputs:
      outcome: ${{ steps.watch.outputs.outcome }}
      receipt: ${{ steps.watch.outputs.receipt }}
      published_at: ${{ steps.watch.outputs.published_at }}
      verified_at: ${{ steps.watch.outputs.verified_at }}
      journal: ${{ steps.watch.outputs.journal }}
      reason: ${{ steps.admit.outputs.reason || steps.watch.outputs.reason }}
    env:
      RELEASE_KIND: ${{ github.event_name == 'schedule' && 'rc' || inputs.kind }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_ABANDON: ${{ github.event_name == 'schedule' && 'false' || inputs.abandon_train }}
      RELEASE_SUPERSEDE: ${{ inputs.supersede }}
      RELEASE_RC_TAG: ${{ inputs.rc_tag }}
      RELEASE_RC_SHA: ${{ inputs.rc_sha }}
      RELEASE_REF: ${{ github.ref }}
      RELEASE_ACTOR: ${{ github.triggering_actor }}
      RELEASE_DISPATCHERS: ${{ vars.RELEASE_DISPATCHERS }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Run recovery policy from this operation's trusted workflow commit.
          # A pinned older candidate can lack the current controller entirely.
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Recheck dispatcher and exact recovery tag
        id: admit
        run: python3 -I scripts/release-auto.py watch-check
      - name: Recover and verify only the prepared tag
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          failure_shell=$BASHPID
          reason='publication-unconfirmed'
          fail() {
            if [ "$BASHPID" = "$failure_shell" ]; then printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"; fi
            exit 1
          }
          trap fail ERR
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          [ "$tag_sha" = "$RELEASE_SHA" ]
          receipt=confirmed
          if [ "$RELEASE_KIND" = rc ]; then
            git fetch origin refs/heads/main
            if ! git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then receipt=unconfirmed; fi
          fi
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          if [ "$receipt" != confirmed ]; then reason='push-receipt-unconfirmed'; fail; fi
          watch_status=0
          .agents/skills/uzi-release/scripts/release-watch.sh "${RELEASE_TAG#v}" --max-reruns 2 --interval 60 --max-ticks 60 \
            --journal "$RUNNER_TEMP/release-watch.json" --operation "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --kind "$RELEASE_KIND" \
            2>&1 | tee "$RUNNER_TEMP/release-watch.log" || watch_status=$?
          python3 -I scripts/release-auto.py watch-log
          [ "$watch_status" -eq 0 ]
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          .agents/skills/uzi-release/scripts/release-verify.sh "$RELEASE_TAG"
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "verified_at=$verified_at" >> "$GITHUB_OUTPUT"
          echo 'outcome=published-and-verified' >> "$GITHUB_OUTPUT"

  report:
    needs: [authorize, prepare, push, watch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Summarize and track failures without repository code
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_CREATED_AT: ${{ needs.authorize.outputs.created_at }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json, os, re, subprocess
          from zoneinfo import ZoneInfo
          needs = json.loads(os.environ['NEEDS_JSON'])
          authorized = needs['authorize'].get('outputs', {})
          prepared = needs['prepare'].get('outputs', {})
          pushed = needs['push'].get('outputs', {})
          push_outcome = pushed.get('outcome') or ('receipt-unknown' if pushed.get('attempted') == 'true' else '')
          watched = needs['watch'].get('outputs', {})
          # BEGIN JOURNAL CODEC: parity-tested with scripts/lib/release-journal.py
          LIMIT = 32768

          WORKFLOWS = {'release.yml', 'brew.yml', 'ci.yml', 'kind-smoke.yml'}

          STATES = {'queued', 'in_progress', 'completed', 'waiting', 'pending', 'requested'}

          CONCLUSIONS = {'success', 'failure', 'cancelled', 'timed_out', 'action_required',
                         'startup_failure', 'neutral', 'skipped', 'stale', None, ''}

          MAIN_STATES = {'not-applicable', 'unavailable', 'absent', 'pending', 'passed', 'failed', 'cancelled'}

          FIELDS = {'schema', 'operation', 'repository', 'tag', 'sha', 'main_ci', 'attempts', 'decisions', 'truncated', 'state', 'reason', 'publication_read_errors'}

          def integer(value, minimum=1):
              if type(value) is not int or not minimum <= value < 2**53:
                  raise ValueError('invalid journal integer')
              return value

          def label(value):
              if not isinstance(value, str):
                  raise ValueError('invalid journal label')
              return ''.join(char for char in value if char.isprintable())[:160]

          def status(value, conclusion):
              if value not in STATES or conclusion not in CONCLUSIONS:
                  raise ValueError('invalid journal state')

          def validate(data):
              if (not isinstance(data, dict) or data.keys() != FIELDS or type(data['schema']) is not int
                      or data['schema'] != 1 or not isinstance(data['operation'], str)
                      or not re.fullmatch(r'[A-Za-z0-9_.:-]{1,128}', data['operation'])
                      or not isinstance(data['repository'], str)
                      or not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', data['repository'])
                      or not isinstance(data['tag'], str)
                      or not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-rc\.[1-9][0-9]*)?', data['tag'])
                      or not isinstance(data['sha'], str) or not re.fullmatch(r'[0-9a-f]{40}', data['sha'])
                      or type(data['truncated']) is not bool or not isinstance(data['attempts'], list)
                      or not isinstance(data['decisions'], list)
                      or not isinstance(data['main_ci'], dict)
                      or data['main_ci'] != {'policy': 'report-only', 'state': data['main_ci'].get('state')}
                      or data['main_ci']['state'] not in MAIN_STATES):
                  raise ValueError('invalid journal envelope')
              for attempt in data['attempts']:
                  if not isinstance(attempt, dict) or attempt.keys() != {'workflow', 'run', 'attempt', 'status', 'conclusion',
                          'initial_status', 'initial_conclusion', 'first_observed_at', 'observed_at', 'url', 'jobs', 'jobs_omitted'}:
                      raise ValueError('invalid journal attempt')
                  if attempt['workflow'] not in WORKFLOWS:
                      raise ValueError('invalid journal workflow')
                  integer(attempt['run'])
                  integer(attempt['attempt'])
                  if attempt['url'] != f"https://github.com/{data['repository']}/actions/runs/{attempt['run']}/attempts/{attempt['attempt']}":
                      raise ValueError('invalid canonical run URL')
                  integer(attempt['jobs_omitted'], 0)
                  status(attempt['status'], attempt['conclusion'])
                  status(attempt['initial_status'], attempt['initial_conclusion'])
                  for timestamp in (attempt['observed_at'], attempt['first_observed_at']):
                      if not isinstance(timestamp, str) or not re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', timestamp):
                          raise ValueError('invalid journal timestamp')
                  if not isinstance(attempt['jobs'], list):
                      raise ValueError('invalid journal job list')
                  for job in attempt['jobs']:
                      if not isinstance(job, dict) or job.keys() != {'id', 'name', 'status', 'conclusion', 'original_conclusion', 'url', 'steps', 'steps_omitted'}:
                          raise ValueError('invalid journal job')
                      integer(job['id'])
                      if job['url'] != f"https://github.com/{data['repository']}/actions/runs/{attempt['run']}/job/{job['id']}":
                          raise ValueError('invalid canonical job URL')
                      integer(job['steps_omitted'], 0)
                      if label(job['name']) != job['name']:
                          raise ValueError('invalid bounded job label')
                      status(job['status'], job['conclusion'])
                      status(job['status'], job['original_conclusion'])
                      if not isinstance(job['steps'], list):
                          raise ValueError('invalid journal step list')
                      for step in job['steps']:
                          if not isinstance(step, dict) or step.keys() != {'number', 'name', 'status', 'conclusion'}:
                              raise ValueError('invalid journal step')
                          integer(step['number'])
                          if label(step['name']) != step['name']:
                              raise ValueError('invalid bounded step label')
                          status(step['status'], step['conclusion'])
              for decision in data['decisions']:
                  if not isinstance(decision, dict) or decision.keys() != {'workflow', 'run', 'attempt', 'reason', 'before', 'after', 'state', 'at'}:
                      raise ValueError('invalid journal decision')
                  if (decision['workflow'] not in WORKFLOWS or decision['reason'] not in
                          {'publication-role', 'gate-refused', 'budget-exhausted', 'evidence-unavailable'}
                          or decision['state'] not in {'reserved', 'requested', 'uncertain', 'blocked', 'passed-on-retry', 'failed-on-retry'}):
                      raise ValueError('invalid journal decision state')
                  integer(decision['run'])
                  integer(decision['attempt'])
                  integer(decision['before'], 0)
                  integer(decision['after'], 0)
                  if decision['after'] > decision['before']:
                      raise ValueError('journal budget increased')
                  if not isinstance(decision['at'], str) or not re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', decision['at']):
                      raise ValueError('invalid decision timestamp')
              reasons = {'watching': {'publication-pending'}, 'workflows-green': {'publication-workflows-green'},
                         'blocked': {'gate-refused', 'budget-exhausted', 'retry-request-unconfirmed', 'publication-refused'},
                         'pending-timeout': {'publication-timeout'}, 'instrument-error': {'evidence-unavailable'}}
              if not isinstance(data['state'], str) or data['state'] not in reasons or data['reason'] not in reasons[data['state']]:
                  raise ValueError('invalid journal operation result')
              errors = data['publication_read_errors']
              if not isinstance(errors, dict) or errors.keys() != {'release.yml', 'brew.yml'}:
                  raise ValueError('invalid publication read counters')
              for count in errors.values():
                  integer(count, 0)
              return data

          def encoded(data):
              return json.dumps(data, ensure_ascii=True, separators=(',', ':'), sort_keys=True).replace('`', '\\u0060').encode('ascii')

          def audit(raw, total_raw=None, truncated_raw=None):
              try:
                  rows = json.loads(raw or 'null')
                  total = json.loads(total_raw or 'null')
                  truncated = json.loads(truncated_raw or 'null')
              except (ValueError, TypeError):
                  return None, None, None
              if not isinstance(rows, list):
                  return None, None, None
              for row in rows:
                  if (not isinstance(row, dict) or row.keys() != {'sha', 'pr', 'shipping'}
                          or not isinstance(row['sha'], str) or not re.fullmatch('[0-9a-f]{40}', row['sha'])
                          or type(row['shipping']) is not bool
                          or (row['pr'] is not None and (type(row['pr']) is not int or not 0 < row['pr'] < 2**53))):
                      return None, None, None
              if total is None and truncated is None:
                  total = len(rows)
              elif (type(total) is not int or not len(rows) <= total < 2**53 or type(truncated) is not bool
                    or truncated != (total > len(rows))):
                  return None, None, None
              kept = []
              for row in rows[:64]:
                  if len(encoded(kept + [row])) > 8192:
                      break
                  kept.append(row)
              return kept, total, len(kept) < total

          def decode(raw):
              if isinstance(raw, str):
                  raw = raw.encode('utf-8')
              if len(raw) > LIMIT:
                  raise ValueError('journal exceeds source limit')
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError('duplicate journal key')
                      result[key] = value
                  return result
              return validate(json.loads(raw, object_pairs_hook=unique))
          # END JOURNAL CODEC
          try:
              recovery_journal = decode(watched.get('journal') or 'null')
          except (ValueError, KeyError, TypeError, AttributeError):
              recovery_journal = None
          # Mirror the public identity wire contract in release-diagnostics.py:
          # this job has no checkout and must not execute repository code.
          uncited = json.loads(prepared.get('uncited') or 'null')
          if uncited is not None:
              if not isinstance(uncited, list) or len(uncited) > 50:
                  raise ValueError('invalid public identity list')
              for row in uncited:
                  if (not isinstance(row, dict) or row.keys() != {'sha', 'pr'}
                          or not isinstance(row['sha'], str) or not re.fullmatch('[0-9a-f]{40}', row['sha'])
                          or (row['pr'] is not None and (type(row['pr']) is not int or not 0 < row['pr'] < 2**53))):
                      raise ValueError('invalid public identity')
          uncited_count = json.loads(prepared.get('uncited_count') or 'null')
          uncited_truncated = json.loads(prepared.get('uncited_truncated') or 'null')
          if uncited is None:
              if uncited_count is not None or (uncited_truncated is not None and uncited_truncated is not False):
                  raise ValueError('invalid uncollected identities')
              uncited_truncated = None
          elif (type(uncited_count) is not int or not len(uncited) <= uncited_count < 2**53
                or type(uncited_truncated) is not bool or uncited_truncated != (uncited_count > len(uncited))):
              raise ValueError('invalid public identity count')
          changes, changes_count, changes_truncated = audit(prepared.get('changes'), prepared.get('changes_count'), prepared.get('changes_truncated'))
          attempted = {'true': True, 'false': False}.get(pushed.get('attempted'))
          # The recovery marker is false after a definitive rejection, despite
          # Git having attempted that push. Keep the public statement literal.
          if push_outcome == 'push-rejected': attempted = True
          if needs['push']['result'] == 'skipped': attempted = False
          failed = [name for name in ('authorize', 'prepare', 'push', 'watch') if needs[name]['result'] in ('failure', 'cancelled')]
          noop_phase = 'prepare' if prepared.get('outcome') == 'no-op' else 'authorize' if authorized.get('outcome') == 'no-op' else 'watch'
          phase = failed[0] if failed else noop_phase
          result = {'run': os.environ['RUN_URL'], 'tag': prepared.get('tag') or None,
                    'planned_tag': prepared.get('planned_tag') or None, 'phase': phase,
                    'stage': (prepared.get('stage') or None) if phase == 'prepare' else None,
                    'parent': prepared.get('parent') or None, 'release': prepared.get('release') or None,
                    'audit_head': prepared.get('audit_head') or None, 'push_attempted': attempted,
                    'push_outcome': push_outcome or None,
                    'published_at': watched.get('published_at') or None, 'verified_at': watched.get('verified_at') or None,
                    'changes': changes, 'changes_count': changes_count, 'changes_truncated': changes_truncated, 'uncited': uncited,
                    'uncited_count': uncited_count, 'uncited_truncated': uncited_truncated,
                    'retries': json.loads(prepared.get('retry_log') or '[]'), 'journal': recovery_journal}
          problem = bool(failed) or watched.get('receipt') == 'unconfirmed'
          result['outcome'] = 'blocked' if problem else (watched.get('outcome') or prepared.get('outcome') or 'no-op')
          result['reason'] = next((needs[name].get('outputs', {}).get('reason') or name + '-failed' for name in failed),
                                  'partial-publication' if problem else prepared.get('reason') or authorized.get('reason') or 'complete')
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and result['reason'] in ('missed-target', 'tip-not-green-by-cutoff', 'skip-ci-tip'):
              result['outcome'] = 'defer'
          if problem and push_outcome == 'receipt-unknown':
              result['outcome'], result['reason'] = 'partial-publication', 'push-receipt-unknown'
          result['late_finish'] = None
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and watched.get('outcome') == 'published-and-verified' and watched.get('verified_at'):
              def utc_stamp(value):
                  if not isinstance(value, str) or not re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', value):
                      raise ValueError('invalid nightly timing metadata')
                  return dt.datetime.fromisoformat(value.replace('Z', '+00:00'))
              zone = ZoneInfo('Europe/Bucharest')
              day = utc_stamp(os.environ.get('RUN_CREATED_AT')).astimezone(zone).date()
              target = dt.datetime.combine(day, dt.time(14), zone)
              result['late_finish'] = utc_stamp(watched['verified_at']) > target
          skip_ci_text = ('Scheduled preparation exhausted its wait budget while the selected skip-ci tip lacked exact proof; use a newer CI-bearing main tip.'
                          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' else
                          'Manual preparation refused immediately: this skip-ci tip lacks exact proof; use a newer CI-bearing main tip.')
          explanation = {'changelog-coverage-refused': 'Release preparation refused: the assembled changelog failed its coverage check.',
                         'changelog-coverage-error': 'Release preparation could not establish changelog coverage.',
                         'push-rejected': 'Release push was rejected without updating refs.',
                         'nightly-disabled': 'Nightly RC paused: RELEASE_NIGHTLY_ENABLED is not true.',
                         'no-new-shipping-change': 'Nightly RC skipped: no new non-metadata shipping changes.',
                         'no-releasable-notes': 'Nightly RC skipped: no releasable notes.',
                         'skip-ci-tip': skip_ci_text,
                         'missed-target': 'Nightly RC stopped because its remaining pre-push cutoff budget was exhausted.',
                         'tip-not-green-by-cutoff': 'Nightly RC found no exact green tip within its pre-cut budget.',
                         'push-receipt-unconfirmed': 'Release recovery could not confirm that main contains the RC.'}.get(
                             result['reason'], 'Release automation stopped during ' + phase + '.' if problem else 'Release automation summary.')
          if problem and attempted is False: explanation += ' No push was attempted.'
          elif problem and attempted is None: explanation += ' Push attempt status is unavailable; inspect remote refs.'
          # Keep the bounded journal compact in incident bodies; indentation can
          # multiply its source size. The job summary renders it separately.
          body = explanation + '\n\n```json\n' + encoded(result).decode('ascii') + '\n```\n'
          if changes_truncated:
              body += '\nShowing ' + str(len(changes)) + ' of ' + str(changes_count) + ' audited changes; see the full prepare summary.\n'
          if needs['watch']['result'] != 'skipped' and recovery_journal is None:
              body += '\nRecovery attempt journal unavailable; inspect the watch log. This is not a recovery certificate.\n'
          elif recovery_journal is not None and recovery_journal['state'] == 'watching':
              body += '\nRecovery journal is incomplete; terminal status was not saved. Attempt records are partial.\n'
          if result['late_finish']:
              warning = 'Nightly release verified after the 14:00 Europe/Bucharest target.'
              body += '\n**Late completion:** ' + warning + '\n'
              print('::warning::' + warning)
          for row in uncited or []:
              label = 'PR #' + str(row['pr']) if row['pr'] is not None else row['sha'][:10]
              body += '- Uncited ' + label + ': https://github.com/vtmocanu/uzi/commit/' + row['sha'] + '\n'
          if uncited_truncated:
              body += '\nShowing ' + str(len(uncited)) + ' of ' + str(uncited_count) + ' uncited commits.\n'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(body)
          if problem:
              if os.environ['REPOSITORY'] != 'vtmocanu/uzi':
                  raise SystemExit(1)
              def api(*args, data=None):
                  command = ['gh', 'api', *args]
                  if data is not None: command += ['--input', '-']
                  return json.loads(subprocess.check_output(command, input=json.dumps(data).encode() if data is not None else None))
              repo = os.environ['REPOSITORY']
              title = 'Release automation failures'
              pages = api('--paginate', '--slurp', f'repos/{repo}/issues?state=all&labels=area%3A%3Arelease&per_page=100')
              matches = [issue for page in pages for issue in page if issue.get('title') == title and 'pull_request' not in issue]
              if matches:
                  issue = min(matches, key=lambda item: item['number'])
                  if issue['state'] == 'closed': api('--method', 'PATCH', f'repos/{repo}/issues/{issue["number"]}', data={'state': 'open'})
                  api('--method', 'POST', f'repos/{repo}/issues/{issue["number"]}/comments', data={'body': body})
              else:
                  api('--method', 'POST', f'repos/{repo}/issues', data={'title': title, 'body': body, 'labels': ['area::release', 'priority::normal']})
              print('Release incident delivered successfully.')
          PY
