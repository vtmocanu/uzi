# uzi CI gate (ported from the retired GitLab pipeline, PRD #103 / #230).
#
# THIS WORKFLOW IS THE PR/main GATE: validate + lint + test across the four
# toolchains (Go api, Go controller, Vite/React web, Node agent), repo-wide checks,
# a Helm lint/template, and -- on pull requests, path-filtered -- `push:false` image
# VALIDATION builds (does each Dockerfile still build?). It pushes NO images, uses
# NO secrets, and runs NO release logic: image publishing + the chart/brew release
# land in release.yml, and the KinD smoke in kind-smoke.yml.
#
# R1 TRUST BOUNDARY: these jobs must run clean on an untrusted (fork) PR with zero
# secret exposure. Hence top-level `permissions: contents: read` (a read-only
# GITHUB_TOKEN), no `secrets:`, no `environment:`, and no `pull_request_target`. The
# image-validation builds are `push:false` and touch no registry, so they add no
# secret and no write scope -- the boundary is unchanged.
#
# The jobs use Taskfile gate targets. Most gates run flat in parallel; agent
# tests use two file shards plus an always-run
# required-check aggregator named `test-agent`. The recipes live in Taskfile.yml
# so local and CI cannot diverge; `lint-repo` invokes the composed
# `task gate:repo` because its members are repo-wide checks with no component.

name: CI

# Quoted so yamllint's `truthy` rule does not read the key as the boolean `on`
# (GitHub Actions treats "on" and on identically).
"on":
  pull_request: {}
  push:
    branches: [main]

# Read-only token. Do not add scopes here: a gate needs none.
permissions:
  contents: read

# Cancel a superseded run's still-running jobs when a newer commit lands on the
# same ref -- mirrors GitLab's workflow.auto_cancel over interruptible gate jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Go api ----
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Latest patch of this Go minor, so a stdlib CVE fixed in a patch release
          # does not redden the vulncheck gate on a stale toolchain. check-latest is
          # load-bearing: without it setup-go resolves the minor to whatever patch the
          # assigned runner image happens to preinstall (observed to differ between
          # runners), so the "latest patch" promise only holds with the forced
          # manifest lookup. This is the bootstrap Go, like the Dockerfiles'
          # golang:<minor> builder base: go.mod's `go` line is the language floor and
          # its `toolchain` line, which Go auto-downloads when newer, is the floor for
          # the Go that actually builds. Renovate groups the toolchain line, this
          # go-version and the builder image on a minor bump; the `go` floor is
          # raised by hand (Renovate leaves that directive alone by default).
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: api-validate
          module: api
      - uses: ./.github/actions/setup-task
      - name: go mod download
        working-directory: api
        run: go mod download
      - name: fmt-check + vet + build
        run: |
          task fmt-check:api
          task vet:api
          task build:api
      # sqlc as a PINNED RELEASE BINARY, not `go run .../sqlc@v1.31.1 generate`. The
      # go-run form COMPILES sqlc from source on any cold cache (~57-61s measured,
      # back when all api jobs shared one setup-go cache key); even with the per-job
      # cache it would recompile after every toolchain bump and bloat the entry.
      # A downloaded release binary skips the compile. Same VERSION (1.31.1) => byte-
      # identical codegen, so the drift check is unchanged; the version pin is the
      # arg; the sha256 is the whole control on this fetch, and Renovate keeps it in
      # lockstep with the version via the github-release-attachments datasource (the
      # `# renovate-tarball:` marker + the customManager in renovate.json). A sqlc
      # bump PR reddens the drift step below (regenerate must be a no-op) until the
      # committed codegen is regenerated -- that red is the signal, not a chore.
      # linux/amd64 (GitHub-hosted ubuntu runners are amd64); local `sqlc generate`
      # stays on `go run` per .claude/rules/go.md and is unaffected.
      - name: Install sqlc (pinned, sha256-verified)
        run: |
          set -euo pipefail
          # renovate-tarball: depName=sqlc-dev/sqlc
          SQLC_VERSION="v1.31.1"        # v-prefixed git tag (getDigest fetches releases/tags/<value>)
          SQLC_V="${SQLC_VERSION#v}"    # tarball filename is versionless
          # Renovate keeps SQLC_SHA256 in lockstep with SQLC_VERSION (it resolves the
          # new tag's linux_amd64 tarball sha256 from the release's checksums).
          SQLC_SHA256="497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
          curl -fsSLo /tmp/sqlc.tar.gz \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            "https://github.com/sqlc-dev/sqlc/releases/download/${SQLC_VERSION}/sqlc_${SQLC_V}_linux_amd64.tar.gz"
          echo "${SQLC_SHA256}  /tmp/sqlc.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/sqlc.tar.gz -C "${HOME}/.local/bin" sqlc
          rm -f /tmp/sqlc.tar.gz
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          # Positive control: a bare install proves nothing until the binary runs.
          "${HOME}/.local/bin/sqlc" version
      - name: sqlc drift (regenerate must be a no-op)
        working-directory: api
        run: |
          sqlc generate
          git diff --exit-code -- internal/store
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  lint-api:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 + an explicit fetch of origin/main: the golangci ratchet
      # (.golangci.yml `new-from-merge-base: origin/main`) needs a reachable common
      # ancestor. If origin/main does not resolve, the target's pre-flight exits 2
      # rather than reporting the whole unfiltered backlog as this branch's findings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Latest patch of this Go minor, so a stdlib CVE fixed in a patch release
          # does not redden the vulncheck gate on a stale toolchain. check-latest is
          # load-bearing: without it setup-go resolves the minor to whatever patch the
          # assigned runner image happens to preinstall (observed to differ between
          # runners), so the "latest patch" promise only holds with the forced
          # manifest lookup. This is the bootstrap Go, like the Dockerfiles'
          # golang:<minor> builder base: go.mod's `go` line is the language floor and
          # its `toolchain` line, which Go auto-downloads when newer, is the floor for
          # the Go that actually builds. Renovate groups the toolchain line, this
          # go-version and the builder image on a minor bump; the `go` floor is
          # raised by hand (Renovate leaves that directive alone by default).
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: api-lint
          module: api
          extra-paths: ~/.cache/golangci-lint
      - uses: ./.github/actions/setup-task
      - name: go mod download
        working-directory: api
        run: go mod download
      - name: Fetch origin/main for the ratchet
        run: git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
      - name: lint + deadcode + vulncheck
        run: |
          task lint:api
          task deadcode:api
          task vulncheck:api
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Latest patch of this Go minor, so a stdlib CVE fixed in a patch release
          # does not redden the vulncheck gate on a stale toolchain. check-latest is
          # load-bearing: without it setup-go resolves the minor to whatever patch the
          # assigned runner image happens to preinstall (observed to differ between
          # runners), so the "latest patch" promise only holds with the forced
          # manifest lookup. This is the bootstrap Go, like the Dockerfiles'
          # golang:<minor> builder base: go.mod's `go` line is the language floor and
          # its `toolchain` line, which Go auto-downloads when newer, is the floor for
          # the Go that actually builds. Renovate groups the toolchain line, this
          # go-version and the builder image on a minor bump; the `go` floor is
          # raised by hand (Renovate leaves that directive alone by default).
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: api-test
          module: api
      - uses: ./.github/actions/setup-task
      - name: go mod download
        working-directory: api
        run: go mod download
      - name: test:api (-race -count=1)
        run: task test:api
      - name: coverage-xml:api
        run: task coverage-xml:api
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  # The live-DB gate. The *LiveDB tests self-skip unless UZI_TEST_DATABASE_URL is
  # set, so `go test` above prints a green `ok` while every one of them is skipped.
  # This job runs them against a real Postgres and asserts they actually ran.
  test-api-store-it:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same digest docker-compose.yml pins, so CI tests the engine the stack
        # runs. GitHub service containers cannot override the image command, so the
        # GitLab job's fsync=off/full_page_writes=off/synchronous_commit=off perf
        # tuning is dropped -- those are crash-recovery knobs, behaviour-identical.
        # Pulled through mirror.gcr.io (Google's Docker Hub cache): runners share Docker
        # Hub's anonymous per-IP quota (toomanyrequests, 2026-10-09). Same digest, so the
        # same image; a service container cannot use the daemon mirror (it starts before
        # any step), hence the explicit host. For the same reason it has no Docker Hub
        # fallback (scripts/docker-pull-fallback.sh needs a step): a mirror eviction of
        # this digest fails the job until the image is cached again.
        image: mirror.gcr.io/library/postgres:17@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
        env:
          POSTGRES_USER: uzi
          POSTGRES_DB: uzi
          # Throwaway per-job database, reachable only from this job -- never a credential.
          POSTGRES_PASSWORD: uzi-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U uzi -d uzi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UZI_TEST_DATABASE_URL: postgres://uzi:uzi-ci@localhost:5432/uzi?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Latest patch of this Go minor, so a stdlib CVE fixed in a patch release
          # does not redden the vulncheck gate on a stale toolchain. check-latest is
          # load-bearing: without it setup-go resolves the minor to whatever patch the
          # assigned runner image happens to preinstall (observed to differ between
          # runners), so the "latest patch" promise only holds with the forced
          # manifest lookup. This is the bootstrap Go, like the Dockerfiles'
          # golang:<minor> builder base: go.mod's `go` line is the language floor and
          # its `toolchain` line, which Go auto-downloads when newer, is the floor for
          # the Go that actually builds. Renovate groups the toolchain line, this
          # go-version and the builder image on a minor bump; the `go` floor is
          # raised by hand (Renovate leaves that directive alone by default).
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: api-livedb
          module: api
      - name: go mod download
        working-directory: api
        run: go mod download
      - name: LiveDB tests (gate on the gate)
        working-directory: api
        run: |
          set -euo pipefail
          # -run filters to the *LiveDB tests; -p 1 is load-bearing (the packages
          # share one database and race goose without it). The package list mirrors
          # e2e/run-store-it.sh and must stay in sync with it: a *LiveDB test in a
          # package neither lists never runs anywhere (17 such tests were found on
          # 2026-09-02; this job had never executed one of them). The trailing check is the
          # gate on the gate: a rename, a lost DSN or an unreachable service silently
          # turns this back into a green no-op.
          PKGS=(
            ./internal/store/...
            ./internal/handler/...
            ./internal/forgesvc/...
            ./internal/schedsvc/...
            ./internal/workersvc/...
            ./internal/recovery/...
            ./internal/poller/...
          )
          go test -count=1 -v -race -p 1 -run 'LiveDB$' "${PKGS[@]}" 2>&1 | tee livedb.log
          # Aggregate check shared with e2e/run-store-it.sh: something ran, and nothing
          # skipped at any indentation (a skipped subtest is an indented `--- SKIP:`).
          ../scripts/livedb-skip-guard.sh livedb.log
          # Per package: a listed package that contributes zero *LiveDB tests prints
          # `ok <pkg> 0.01s [no tests to run]`, which the aggregate count above cannot
          # see. Each root package must have a plain `ok <pkg> <N>s` line.
          for p in "${PKGS[@]}"; do
            root="github.com/vtmocanu/uzi/api/${p#./}"
            root="${root%/...}"
            if ! grep -qE "^ok[[:space:]]+${root}[[:space:]]+[0-9.]+s$" livedb.log; then
              echo "FAIL: ${root} reported no LiveDB test run (no plain 'ok <pkg> <N>s' line)."
              exit 1
            fi
          done
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  # The combined recovery proof crosses API, agent, fixtures and the DB harness.
  # Run on every PR/main push like the other test gates, avoiding incomplete path
  # filters. The Task target owns the serial LiveDB sweep and all three worker
  # variants; ubuntu-latest supplies Docker for its throwaway database.
  test-codex-refresh-lostreply-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27"
          check-latest: true
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: api-codex-refresh-e2e
          module: api
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: Install agent dependencies
        working-directory: agent
        run: npm ci --ignore-scripts
      # run-store-it.sh skips its own pull when the image is present; this one falls back
      # to Docker Hub (re-tagged under the mirror name) when mirror.gcr.io misses.
      - name: Pre-pull the throwaway Postgres (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh postgres:17
      - name: Combined Codex lost refresh reply proof
        env:
          # Docker Hub's anonymous pull quota (toomanyrequests, 2026-10-09): pull the
          # throwaway Postgres from mirror.gcr.io, Google's Docker Hub cache, by name.
          UZI_STORE_IT_PG_IMAGE: mirror.gcr.io/library/postgres:17
        run: task test:codex-refresh-lostreply-e2e
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  # --------------------------------------------------------- Go controller ----
  validate-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: controller-validate
          module: controller
      - uses: ./.github/actions/setup-task
      - name: go mod download
        working-directory: controller
        run: go mod download
      - name: fmt-check + vet + build
        run: |
          task fmt-check:controller
          task vet:controller
          task build:controller
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  lint-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: controller-lint
          module: controller
          extra-paths: ~/.cache/golangci-lint
      - uses: ./.github/actions/setup-task
      - name: go mod download
        working-directory: controller
        run: go mod download
      - name: Fetch origin/main for the ratchet
        run: git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
      - name: lint + deadcode + vulncheck
        run: |
          task lint:controller
          task deadcode:controller
          task vulncheck:controller
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  test-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: controller-test
          module: controller
      - uses: ./.github/actions/setup-task
      - name: go mod download
        working-directory: controller
        run: go mod download
      - name: test:controller (-race -count=1)
        run: task test:controller
      - name: coverage-xml:controller
        run: task coverage-xml:controller
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  # ---------------------------------------------------------- Vite/React web ----
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: lint + deadcode + vulncheck + check-docs + check-changelog + check-styles + typecheck
        env:
          # Turns the deadcode wrapper's loud-SKIP (when knip is absent) into exit 2:
          # CI always installs knip, so a skip here means the image regressed.
          UZI_DEADCODE_WEB_REQUIRED: "1"
        run: |
          task lint:web
          task deadcode:web
          task vulncheck:web
          task check-docs:web
          task check-changelog:web
          task check-styles:web
          task typecheck:web

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: test:web (vitest --coverage)
        run: task test:web

  # Layout tests in real headless Chromium (vitest browser mode); jsdom in test-web cannot
  # see wrapping or overflow. The browser version is pinned by web's `playwright` devDependency.
  test-web-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: install headless Chromium
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: test:web-browser (vitest browser mode)
        run: task test:web-browser

  # -------------------------------------------------------------- Node agent ----
  validate-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: npm ci
        working-directory: agent
        run: npm ci
      - name: lint + deadcode + vulncheck + typecheck
        env:
          UZI_DEADCODE_AGENT_REQUIRED: "1"
        run: |
          task lint:agent
          task deadcode:agent
          task vulncheck:agent
          task typecheck:agent

  test-agent-shard:
    name: test-agent-shard (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: npm ci
        working-directory: agent
        run: npm ci
      # The agent tests shell out to `git init`/clone and bash; ubuntu-latest ships
      # both (the GitLab alpine job had to `apk add git bash`).
      - name: test:agent shard
        env:
          UZI_AGENT_TEST_SHARD: ${{ format('{0}/2', matrix.shard) }}
          UZI_AGENT_TEST_JUNIT: shard-${{ matrix.shard }}.xml
        run: task test:agent:shard
      # Revisit placement only if the slowest agent leg exceeds the next CI job by >60s on main.
      - name: test:codex-m4 (shard 1 only)
        if: matrix.shard == 1
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          task test:codex-m4
          printf 'passed\n' > "agent/shard-${SHARD_INDEX}.codex-m4"
      # The JUnit file names the files Node ACTUALLY ran. The marker proves M4
      # completed in one leg; an accidental M4 run in leg 2 makes its own marker.
      - name: Save executed-file report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Preserve each attempt: a failed-only rerun may rerun just one shard.
          name: agent-tests-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: agent/shard-${{ matrix.shard }}.*
          if-no-files-found: error
          retention-days: 1

  test-agent-worker-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, validate-agent]
    # changes deliberately skips on main pushes. Override dependency skip propagation,
    # but never run after failed validation or a failed PR path-filter job.
    if: >-
      always() && needs.validate-agent.result == 'success' &&
      (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && needs.changes.result == 'success' &&
      needs.changes.outputs.worker_uid == 'true'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: ./.github/actions/setup-task
      - name: Install inventory parser
        working-directory: agent
        run: npm ci --ignore-scripts
      # The builder image comes from mirror.gcr.io (driver-opts below); this pre-pull falls
      # back to Docker Hub on a mirror miss, and buildx uses the local copy if its own pull fails.
      - name: Pre-pull the BuildKit image (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: agent/templates/base/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=ghcr.io/vtmocanu/uzi/agent-base:buildcache
            type=registry,ref=ghcr.io/vtmocanu/uzi/agent-base:buildcache-release
          tags: wuid-2134-base:ci
      - name: Require worker UID leaves
        env:
          WORKER_UID_IMAGE: wuid-2134-base:ci
          WORKER_UID_SKIP_BUILD: "1"
        run: task test:agent:worker-uid

  # The ruleset requires this EXACT check name. A failed, skipped or canceled
  # matrix leg must yield a FAILED check, not a skipped green dependency.
  test-agent:
    name: test-agent
    runs-on: ubuntu-latest
    needs: [test-agent-shard, changes, test-agent-worker-uid]
    if: always()
    steps:
      - name: Require shards and the applicable worker UID lane to succeed
        env:
          SHARD_RESULT: ${{ needs['test-agent-shard'].result }}
          WORKER_RESULT: ${{ needs['test-agent-worker-uid'].result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker_uid }}
          CI_EVENT: ${{ github.event_name }}
        run: |
          if [ "$SHARD_RESULT" != success ]; then
            echo "agent test shard result: $SHARD_RESULT"
            exit 1
          fi
          if [ "$CI_EVENT" = pull_request ] && [ "$CHANGES_RESULT" = success ] && [ "$WORKER_CHANGED" = false ]; then
            # Only an explicitly unrelated PR may skip this lane.
            case "$WORKER_RESULT" in success|skipped) ;; *) exit 1 ;; esac
          elif [ "$WORKER_RESULT" != success ]; then
            echo "required worker UID lane result: $WORKER_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: ./.github/actions/setup-task
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: agent-tests-*
          path: ${{ runner.temp }}/agent-shards
          # Keep attempts separate; check:agent-shards picks the latest per shard.
          merge-multiple: false
      - name: Check executed-file union and M4 count
        env:
          UZI_AGENT_SHARD_REPORT_DIR: ${{ runner.temp }}/agent-shards
        run: task check:agent-shards

  # ------------------------------------------------------------- repo-wide ----
  # shellcheck (pinned, Renovate-tracked) + yamllint + ruby formula syntax +
  # actionlint/zizmor (pinned) + gitleaks. Invokes the composed `task gate:repo`;
  # the *_REQUIRED flags
  # turn each check's fail-open SKIP into exit 2 so a missing tool in CI cannot pass
  # silently.
  lint-repo:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 + an explicit fetch of origin/main: check:changelog-entry diffs the
      # branch against merge-base(origin/main, HEAD), which a shallow checkout cannot
      # compute. Without it the check fails closed (exit 2), never green.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Fetch origin/main for the CHANGELOG entry gate
        run: git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
      # Go is needed for scan:secrets (gitleaks via `go install pkg@version`).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          # Latest patch of this Go minor, so a stdlib CVE fixed in a patch release
          # does not redden the vulncheck gate on a stale toolchain. check-latest is
          # load-bearing: without it setup-go resolves the minor to whatever patch the
          # assigned runner image happens to preinstall (observed to differ between
          # runners), so the "latest patch" promise only holds with the forced
          # manifest lookup. This is the bootstrap Go, like the Dockerfiles'
          # golang:<minor> builder base: go.mod's `go` line is the language floor and
          # its `toolchain` line, which Go auto-downloads when newer, is the floor for
          # the Go that actually builds. Renovate groups the toolchain line, this
          # go-version and the builder image on a minor bump; the `go` floor is
          # raised by hand (Renovate leaves that directive alone by default).
          go-version: "1.27"
          check-latest: true
          # Per-job-class cache below instead (.github/actions/go-cache).
          cache: false
      - uses: ./.github/actions/go-cache
        id: gocache
        with:
          class: repo-lint
          module: api
      - uses: ./.github/actions/setup-task
      - name: Install shellcheck (pinned, sha256-verified)
        run: |
          set -euo pipefail
          # lint:shell asserts this exact version and exits 2 on any mismatch;
          # 0.10.0 and 0.11.0 are different gates (0.10.0 does not emit SC3067).
          # Renovate tracks this via the `renovate-tarball` marker below
          # (github-release-attachments datasource) and bumps SHELLCHECK_VERSION and
          # SHELLCHECK_SHA256 together in one PR. The *_VERSION literal MUST be the
          # v-prefixed git tag: getDigest fetches releases/tags/<value> verbatim, and
          # the tag, the .tar.xz asset filename and the extracted dir all carry the v.
          # The linux.x86_64 asset ships as .tar.xz for BOTH 0.10.0 and 0.11.0
          # (0.10.0 has NO .tar.gz), so the extension is stable across the bump and
          # only the version substring changes -- which is exactly what
          # github-release-attachments maps on. linux.x86_64 is hardcoded: GitHub
          # ubuntu runners are amd64; a future arm64 runner fails LOUDLY at --version.
          #
          # TEMP: pinned to v0.10.0 (below the latest v0.11.0) to force a live
          # Renovate bump-back PR that proves this wiring; Renovate restores v0.11.0.
          #
          # Retry transient network failures (connection reset mid-download);
          # --retry-all-errors covers resets plain --retry does not. The sha256
          # check below is unchanged, so integrity is unaffected.
          # renovate-tarball: depName=koalaman/shellcheck
          SHELLCHECK_VERSION="v0.11.0"
          SHELLCHECK_SHA256="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          curl -fsSLo /tmp/shellcheck.tar.xz \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "${HOME}/.local/bin/shellcheck"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/shellcheck" --version
      - name: Install yamllint
        # lint-yaml.sh carries no version pin (1.37.1 and 1.38.0 both measured
        # clean), so a current yamllint is fine. Ruby (for the formula syntax lint)
        # ships preinstalled on ubuntu-latest at >= 3.1.
        run: pipx install yamllint
      - name: Install actionlint + zizmor (pinned)
        run: |
          set -euo pipefail
          # actionlint as a PINNED RELEASE BINARY (curl + sha256), not `go install
          # @v1.7.7`. The go-install form COMPILES actionlint from source each run
          # (~10-20s) on a cold GOCACHE; a downloaded release binary
          # skips the compile, the same win the pinned-shellcheck block above and
          # scripts/golangci-lint.sh already take. Its embedded shellcheck is the
          # same 0.11.0 installed above, so shell findings match lint:shell's tool.
          # (Do NOT start a comment line with the word shellcheck: shellcheck reads
          # `# shellcheck <word>` as a directive and SC1072/SC1073-fails the parse.)
          # Pins EXACTLY: the sha256 is the whole control on this fetch, and Renovate
          # keeps it in lockstep with the version via the github-release-attachments
          # datasource (the `# renovate-tarball:` marker + the customManager in
          # renovate.json). actionlint is a linter, so a bump PR may redden lint-repo
          # with new workflow findings -- that red is the signal to fix them, by
          # design. linux/amd64 tarball; it extracts `actionlint` (+ docs/man) at root.
          # renovate-tarball: depName=rhysd/actionlint
          ACTIONLINT_VERSION="v1.7.12"          # v-prefixed git tag (getDigest fetches releases/tags/<value>)
          ACTIONLINT_V="${ACTIONLINT_VERSION#v}" # tarball filename is versionless
          # Renovate keeps ACTIONLINT_SHA256 in lockstep with ACTIONLINT_VERSION (it
          # resolves the new tag's linux_amd64 tarball sha256 from the release).
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSLo /tmp/actionlint.tar.gz \
            --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_V}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/actionlint.tar.gz -C "${HOME}/.local/bin" actionlint
          rm -f /tmp/actionlint.tar.gz
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/actionlint" --version
          # zizmor: a Python-packaged (PyPI) tool, so pipx mirrors the yamllint install.
          # Pinned exactly: a newer zizmor can add audits that would redden the gate on
          # an unrelated PR, the drift lint:shell pins shellcheck against. No sha to
          # maintain (pip verifies from PyPI), so Renovate bumps this fully automatically.
          # renovate: datasource=pypi depName=zizmor versioning=pep440
          pipx install zizmor==1.30.1
      - name: Install semgrep (the worker lock's version)
        # semgrep is a PyPI-packaged tool, so pipx mirrors the yamllint/zizmor
        # installs above. CI holds no version of its own: it installs the version baked
        # into the worker toolchain (agent/devbox-global/devbox.lock's default
        # x86_64-linux output), so CI and a uzi worker enforce the SAST rules with the
        # identical engine and the weekly devbox refresh moves both. A newer semgrep can
        # change rule/pattern semantics, the drift the pinned zizmor/shellcheck above
        # guard against. check:semgrep-parity pins this two-line shape (#2093).
        run: |
          SEMGREP_VERSION="$(./scripts/semgrep-worker-version.sh)"
          pipx install "semgrep==${SEMGREP_VERSION}"
      - name: gate:repo (shell + yaml + formula + actions + secrets + sast)
        env:
          UZI_LINT_SHELL_REQUIRED: "1"
          UZI_LINT_YAML_REQUIRED: "1"
          UZI_LINT_FORMULA_REQUIRED: "1"
          UZI_LINT_ACTIONS_REQUIRED: "1"
          # PRD #862 M5: now that semgrep is installed above, force the sast:semgrep
          # step in gate:repo to REQUIRED (scripts/semgrep-gate.sh keys on this, not
          # on bare CI -- see that script). This is the milestone that turns the
          # semgrep gate on IN CI; before it, CI skipped semgrep gracefully.
          UZI_SAST_REQUIRED: "1"
        run: task gate:repo
      # Offline fixture test of the release-train scripts (PRD 1265 M1). A `gate`
      # member, not a `gate:repo` member (it builds a multi-commit git repo), so it
      # is a distinct step here in the repo-wide job. Needs only git + bash, both
      # present on the runner and set up by the checkout above.
      - name: test:release-scripts (release-train fixture)
        run: task test:release-scripts
      - name: Save Go cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outputs.key != '' && steps.gocache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.gocache.outputs.key }}
          paths: ${{ steps.gocache.outputs.paths }}

  # ------------------------------------------------------------- Helm chart ----
  helm-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v4.3.0
      - name: helm dependency build
        # Bundles the CNPG `cluster` subchart (oci://ghcr.io/cloudnative-pg/charts,
        # public) per Chart.lock, so the render below is self-contained.
        run: helm dependency build deploy/chart
      - name: helm lint
        run: helm lint deploy/chart
      - name: Render and assert chart well-formedness
        run: |
          helm template uzi deploy/chart -f deploy/values/ci-render.yaml --namespace uzi > /tmp/uzi-rendered.yaml
          sh scripts/assert-chart-render.sh /tmp/uzi-rendered.yaml
      - name: Render and assert controller strategy
        run: |
          helm template uzi deploy/chart -f deploy/values/ci-render.yaml --namespace uzi \
            --show-only templates/controller-deployment.yaml > /tmp/uzi-controller.yaml
          sh scripts/assert-controller-strategy.sh /tmp/uzi-controller.yaml
      - uses: ./.github/actions/setup-task
      - name: Render and assert the OpenShift/OKD knobs
        # Offline (strips the CNPG subchart). Needs helm (above) and yq, which the
        # ubuntu-latest runner provides, the same unpinned-reader reasoning as
        # lint-actions-embedded.sh.
        run: task render:openshift-check
      - name: Docker-tier fail-guards
        run: |
          # (1) docker on + NetworkPolicy off + no acknowledge -> MUST refuse to render.
          if helm template uzi deploy/chart --set workers.enabled=true --set api.tls.enabled=true --set workers.docker.enabled=true >/dev/null 2>/tmp/guard.err; then
            echo "FAIL: the docker tier rendered UNFENCED (NetworkPolicy off, no acknowledgeUnfenced) -- the fail-guard did not fire"; exit 1
          fi
          grep -q "workers.docker.networkPolicy.enabled" /tmp/guard.err || { echo "FAIL: render aborted but NOT with the docker fail-guard message:"; cat /tmp/guard.err; exit 1; }
          echo "OK: docker fail-guard fires when the tier would be unfenced"
          # (2) docker on + NetworkPolicy on -> renders fine.
          helm template uzi deploy/chart --set workers.enabled=true --set api.tls.enabled=true --set workers.docker.enabled=true --set workers.docker.networkPolicy.enabled=true >/dev/null
          # (3) docker on + explicit acknowledgeUnfenced opt-out -> renders fine.
          helm template uzi deploy/chart --set workers.enabled=true --set api.tls.enabled=true --set workers.docker.enabled=true --set workers.docker.networkPolicy.acknowledgeUnfenced=true >/dev/null

  # ------------------------------------------------ PR image validation ----
  # `push:false` buildx builds proving each Dockerfile still builds (the retired
  # kaniko `--no-push` jobs, PRD #230). PULL-REQUEST ONLY and path-filtered: the
  # heavy builds (agent especially) run only when their inputs change. They touch NO
  # registry and NO secrets, so the R1 trust boundary is unchanged. On push to main
  # the real images are built by kind-smoke.yml (api/web) and by release.yml (tags); this
  # section is pure pre-merge validation.
  #
  # `changes` runs on PRs and exposes one boolean per component; each build job gates
  # on its own flag AND on that component's validate/test/lint gates, so a broken
  # source never reaches a (slow) image build. Exception: build-agent gates on
  # validate-agent only (see its comment).
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      controller: ${{ steps.filter.outputs.controller }}
      agent: ${{ steps.filter.outputs.agent }}
      worker_uid: ${{ steps.filter.outputs.worker_uid }}
      web_nginx: ${{ steps.filter.outputs.web_nginx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
              - 'docs/**'
            controller:
              - 'controller/**'
            agent:
              - 'agent/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            worker_uid:
              - 'agent/**'
              - '.dockerignore'
              - 'Taskfile.yml'
              - 'e2e/worker-uid/**'
              - '.github/workflows/ci.yml'
            web_nginx:
              - 'web/nginx.conf'
              - 'web/nginx.mock.conf'
              - 'web/Dockerfile'
              - 'deploy/chart/**'
              - 'Taskfile.yml'
              - 'scripts/assert-web-nginx.sh'
              - '.github/workflows/ci.yml'

  # The three web nginx configs (compose, mock, and the chart's rendered web-configmap)
  # gzip and cache static assets and keep every security header (#2662, #2663). Real
  # nginx in Docker beside a stub api, so it stays out of gate:repo, which needs neither
  # Docker nor Helm. Path-filtered on PRs (skipped, not pending, otherwise); runs on every
  # push to main. `changes` runs only on PRs, and a skipped `needs` skips this job unless
  # the condition overrides it with a status function, hence `!cancelled()`.
  test-web-nginx:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.web_nginx == 'true')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5
        with:
          version: v4.3.0
      - uses: ./.github/actions/setup-task
      # Pulls the digest-pinned nginx image from web/Dockerfile itself (Docker Hub, one
      # pull per run); yq, curl, gzip and cmp come with ubuntu-latest.
      - name: Assert the web nginx configs
        run: task test:web-nginx

  build-api:
    runs-on: ubuntu-latest
    needs: [changes, validate-api, test-api, lint-api]
    if: needs.changes.outputs.api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The builder image comes from mirror.gcr.io (driver-opts below); this pre-pull falls
      # back to Docker Hub on a mirror miss, and buildx uses the local copy if its own pull fails.
      - name: Pre-pull the BuildKit image (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: api
          file: api/Dockerfile
          push: false
          platforms: linux/amd64
          tags: uzi-api:pr

  # Context is the repo ROOT: web/Dockerfile COPYs both web/ and docs/.
  build-web:
    runs-on: ubuntu-latest
    needs: [changes, validate-web, test-web, test-web-browser]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The builder image comes from mirror.gcr.io (driver-opts below); this pre-pull falls
      # back to Docker Hub on a mirror miss, and buildx uses the local copy if its own pull fails.
      - name: Pre-pull the BuildKit image (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: web/Dockerfile
          push: false
          platforms: linux/amd64
          tags: uzi-web:pr

  # The backend-free demo/mock SPA image (web/Dockerfile.mock, PRD #311 M1). Same
  # inputs as build-web; validation-only, never published.
  build-web-mock:
    runs-on: ubuntu-latest
    needs: [changes, validate-web, test-web, test-web-browser]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The builder image comes from mirror.gcr.io (driver-opts below); this pre-pull falls
      # back to Docker Hub on a mirror miss, and buildx uses the local copy if its own pull fails.
      - name: Pre-pull the BuildKit image (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: web/Dockerfile.mock
          push: false
          platforms: linux/amd64
          tags: uzi-web-mock:pr

  build-controller:
    runs-on: ubuntu-latest
    needs: [changes, validate-controller, test-controller, lint-controller]
    if: needs.changes.outputs.controller == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The builder image comes from mirror.gcr.io (driver-opts below); this pre-pull falls
      # back to Docker Hub on a mirror miss, and buildx uses the local copy if its own pull fails.
      - name: Pre-pull the BuildKit image (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: controller
          file: controller/Dockerfile
          push: false
          platforms: linux/amd64
          tags: uzi-controller:pr

  # One job per template (base, jvm). Context is the repo ROOT (the image bakes uzi's
  # own source at /opt/uzi-src); buildx honours the per-Dockerfile
  # agent/templates/<t>/Dockerfile.dockerignore and auto-populates TARGETARCH, so
  # unlike the retired kaniko jobs no --build-arg TARGETARCH is needed.
  #
  # LAYER CACHE (cache-from only, no cache-to). The agent base is by far the most
  # expensive image (~2.6 GiB of pinned nix + devbox + Chromium realizes before any
  # uzi source is copied), and this validation build otherwise rebuilds it from
  # scratch every agent PR (~215s, the PR critical path). release.yml already pushes a
  # registry buildcache to ghcr.io/vtmocanu/uzi/agent-<t>:buildcache (release.yml
  # `cache-to`); reading it here reuses those nix/Chromium layers so only the cheap
  # trailing layers (COPY . /opt/uzi-src, version stamps) rebuild. It is READ-ONLY:
  # no `cache-to`, so this job never writes the release cache and cannot touch the
  # GHA 10 GB cap (registry cache lives in GHCR). The agent-<t> packages are PUBLIC
  # (gh api /users/vtmocanu/packages/container/uzi%2Fagent-base -> visibility: public),
  # so cache-from pulls ANONYMOUSLY -- NO GHCR login and NO packages: read, so the R1
  # trust boundary (PR builds touch no registry credential, no secret) is UNCHANGED.
  # A cache miss (the :buildcache tag absent -- e.g. before the first release that
  # builds the agent, or a fork PR) is tolerated by build-push-action: the build just
  # runs cold, exactly as before this line existed.
  #
  # NOT gated on test-agent: that suite runs ~7 min while this build takes ~2-4 min,
  # so waiting for it made an agent PR ~3 min slower. Nothing is dropped: test-agent is
  # still a required check, this build is not, and it pushes nothing. validate-agent
  # (~20 s: lint, typecheck) stays as the cheap fail-fast.
  build-agent:
    runs-on: ubuntu-latest
    needs: [changes, validate-agent]
    if: needs.changes.outputs.agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        template: [base, jvm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # The builder image comes from mirror.gcr.io (driver-opts below); this pre-pull falls
      # back to Docker Hub on a mirror miss, and buildx uses the local copy if its own pull fails.
      - name: Pre-pull the BuildKit image (mirror first, Docker Hub fallback)
        run: ./scripts/docker-pull-fallback.sh moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: agent/templates/${{ matrix.template }}/Dockerfile
          push: false
          platforms: linux/amd64
          # :buildcache holds the runtime-stage layers, :buildcache-release the release
          # stage's (release.yml writes both since #1720); read-only here, as above.
          cache-from: |
            type=registry,ref=ghcr.io/vtmocanu/uzi/agent-${{ matrix.template }}:buildcache
            type=registry,ref=ghcr.io/vtmocanu/uzi/agent-${{ matrix.template }}:buildcache-release
          build-args: |
            UZI_SRC_SHA=${{ github.sha }}
          tags: uzi-agent-${{ matrix.template }}:pr
