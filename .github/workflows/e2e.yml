# Disposable #3074 diagnostic branch only. Never merge this workflow replacement.
name: L02 native packaged probe

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: l02-native-spike
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Measure pinned code-mode yields without provider spending
        run: bash e2e/codex-m3a/l02-spike/run.sh
