<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uzi — AI dark factory</title>
    <script>
      // Pre-paint theme stamp (PRD #21): apply the last resolved theme from the
      // cache before the bundle loads, so the first paint is themed and there is
      // no flash of the wrong theme. The server-resolved value wins once me()
      // returns (web/src/lib/theme.ts). Dependency-free and kept in sync with
      // that module's THEMES list and "uzi.theme" storage key. No cached value
      // (or storage blocked) leaves data-theme unset, which renders ember.
      (function () {
        try {
          var t = localStorage.getItem("uzi.theme");
          if (t === "ember" || t === "mission") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {
          /* storage unavailable: fall through to the default (ember) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
