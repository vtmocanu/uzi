server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers. The SPA is fully same-origin so no CORS is
    # configured by design.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Restrictive CSP. The built SPA loads only same-origin JS/CSS and uses no
    # external hosts, so 'self' covers everything. There are NO inline <script>s:
    # the theme pre-paint stamp (PRD #21) ships as an external same-origin file
    # (/theme-preinit.js), covered by script-src 'self', precisely so this stays
    # free of 'unsafe-inline' (which would gut the XSS posture). No inline <style>
    # or eval either; fetches hit only same-origin /api. React's inline style
    # props set CSSOM properties, which style-src does not govern.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;

    # Docker's embedded DNS tracks the api container when Compose recreates it.
    # A variable upstream makes nginx resolve the service again after the cache
    # expires instead of keeping the address it found at startup.
    resolver 127.0.0.11 valid=5s;
    resolver_timeout 5s;

    # Live run WebSocket. Kept as a dedicated exact-match location so the
    # Upgrade/Connection handshake headers stay OFF the plain REST proxy below
    # (which must keep ordinary keepalive). Host is forwarded as $http_host
    # (NOT $host): the api enforces same-origin by comparing the browser Origin
    # against the Host header, and the browser's Origin includes the port
    # (e.g. http://127.0.0.1:8080); $host strips the port, which would fail that
    # check with a 403. proxy_read_timeout is long so an idle-but-live socket is
    # not culled mid-run. The same XFF-overwrite hardening as /api/ applies.
    location = /api/ws {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Proxy the API on the same origin. We OVERWRITE X-Forwarded-For with
    # $remote_addr (not $proxy_add_x_forwarded_for) so any client-supplied XFF
    # is discarded here; the API then trusts this hop only when the connection
    # originates from a TRUSTED_PROXIES CIDR.
    location /api/ {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Input-file upload (PRD #1909). Exact-match so the larger body limit and the longer
    # timeouts apply to this one route and nothing else under /api/ (the /api/ block above keeps
    # nginx's 1 MiB client_max_body_size default). Every proxy header and the XFF overwrite match
    # /api/.
    #  - client_max_body_size: the api's default per-file cap (UZI_JOB_INPUT_FILE_MAX_BYTES,
    #    25 MiB) plus multipart framing, rounded up to 26 MiB. Raise it together with that cap.
    #  - Request buffering stays ON (the nginx default; stated so nobody turns it off): nginx
    #    receives the whole body from the client, however slowly it arrives, and only then opens
    #    the upstream request, so a slow or stalled client never holds an api connection or a
    #    database connection. client_body_timeout bounds the gap between two reads from the client
    #    (a stalled client is answered 408 here, never reaching the api).
    #  - proxy_send_timeout / proxy_read_timeout: the api bounds its own read and its transaction
    #    at UZI_RECOVERY_REQUEST_DEADLINE (120 s by default) plus a 15 s response grace, so
    #    nginx waits longer than that (150 s) for the upstream. Raise them with that deadline.
    location = /api/v1/files {
        client_max_body_size 26m;
        client_body_timeout 120s;
        proxy_request_buffering on;
        proxy_send_timeout 150s;
        proxy_read_timeout 150s;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route serves index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
