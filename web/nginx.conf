server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers. The SPA is fully same-origin so no CORS is
    # configured by design.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Restrictive CSP. The built SPA loads only same-origin JS/CSS (no inline
    # <script>/<style>, no eval), fetches only same-origin /api, and uses no
    # external hosts, so 'self' covers everything. React's inline style props
    # set CSSOM properties, which style-src does not govern.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;

    # Live run WebSocket. Kept as a dedicated exact-match location so the
    # Upgrade/Connection handshake headers stay OFF the plain REST proxy below
    # (which must keep ordinary keepalive). Host is forwarded as $http_host
    # (NOT $host): the api enforces same-origin by comparing the browser Origin
    # against the Host header, and the browser's Origin includes the port
    # (e.g. http://127.0.0.1:8080); $host strips the port, which would fail that
    # check with a 403. proxy_read_timeout is long so an idle-but-live socket is
    # not culled mid-run. The same XFF-overwrite hardening as /api/ applies.
    location = /api/ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Proxy the API on the same origin. We OVERWRITE X-Forwarded-For with
    # $remote_addr (not $proxy_add_x_forwarded_for) so any client-supplied XFF
    # is discarded here; the API then trusts this hop only when the connection
    # originates from a TRUSTED_PROXIES CIDR.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route serves index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
