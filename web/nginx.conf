server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening headers. The SPA is fully same-origin so no CORS is
    # configured by design.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Proxy the API on the same origin. $proxy_add_x_forwarded_for appends the
    # real connecting client to X-Forwarded-For; the API trusts only that last
    # hop for rate-limiting.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route serves index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
