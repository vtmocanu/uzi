# nginx config for the MOCK build (VITE_UZI_MOCK=1): static assets only.
# There is deliberately NO /api or /api/ws proxy — the bundle contains its own
# in-browser mock API and mock WebSocket, and no request ever leaves the page.

# Runtime web modules (PRD #4686): the Cache-Control of a /modules/<id>/ response, keyed on the
# FINAL status and path. A module upstream is untrusted, so its own Cache-Control and Expires
# are hidden and ignored in each module location and this map decides instead:
#   - 200/206/304 under /modules/<id>/assets/ -> a year, immutable (hashed build output)
#   - 200/206/304 anywhere else               -> no-cache (remoteEntry.js and friends)
#   - everything else (302, 404, 502, ...)    -> no-store, so an error is never cached and an
#                                                asset 404 is never immutable
# The decision uses $uri (the normalized path nginx matched), while the upstream gets the raw
# $request_uri. An encoded or dot-segment path can therefore pick the immutable policy for an
# attacker-chosen URL key (the cache key the browser sees); low impact, since the URL is its own
# cache key and a module can only make itself cacheable under a path it already serves.
# The variable is $uzi_modcc, outside the per-module $uzi_module_<id> namespace, so a module whose id is `cc` cannot collide.
# Always used as `add_header Cache-Control $uzi_modcc always;`.
map "$status:$uri" $uzi_modcc {
    "~^(200|206|304):/modules/[a-z][a-z0-9-]*/assets/" "public, max-age=31536000, immutable";
    "~^(200|206|304):" "no-cache";
    default "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Same restrictive CSP as production (script-src 'self', no 'unsafe-inline';
    # the theme pre-paint stamp is the external same-origin /theme-preinit.js).
    # connect-src 'self' stays as a tripwire: the mock needs no network at all, so
    # any fetch would be same-origin-only and simply 404 against this static server.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;

    # Loud tripwire: the mock bundle must never call an API. If a stray fetch
    # slips in, fail it with a 404 instead of silently serving index.html.
    location /api/ {
        gzip off;
        return 404;
    }

    # Runtime web modules (PRD #4686). The chart or scripts/web-modules-gen.py writes one
    # `location ^~ /modules/<id>/` block per module into /etc/nginx/uzi-modules/locations.conf
    # (the images ship an empty one). Included at server level, beside the catch-all below.
    include /etc/nginx/uzi-modules/*.conf;

    # The public module manifest the SPA fetches once per document. An exact alias, so it is
    # always the list the operator generated and never a file of the SPA docroot (the build's
    # own /modules.json, `[]`, is shadowed). no-cache: an edited list is seen on reload. A
    # location-level add_header drops every inherited one, so the security headers are repeated
    # verbatim (change all CSP copies together; scripts/assert-web-nginx.sh asserts it).
    location = /modules.json {
        alias /etc/nginx/uzi-modules/modules.json;
        default_type application/json;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_proxied any;
        gzip_types application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
    }

    # Catch-all for /modules/: an id with no configured location (a removed module, a typo) is a
    # plain 404, never the SPA index (the SPA route is /m/<id>, not /modules/). ^~ stops regex
    # locations from taking over; a module's own `location ^~ /modules/<id>/` is longer and wins.
    location ^~ /modules/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
        return 404;
    }

    # (Static locations match production.)
    # Static locations. gzip is set per location, not at server level, and every
    # /api/ location sets `gzip off;` explicitly, so nginx never introduces
    # compression on API responses (an upstream Content-Encoding passes through).
    # A location-level add_header drops EVERY inherited server-level add_header,
    # so the security headers are repeated verbatim below; the CSP must stay
    # byte-identical to the server-level line (change all copies together;
    # scripts/assert-web-nginx.sh asserts it).
    # Hashed /assets/ files are immutable for a year. try_files $uri =404 makes a
    # missing asset a 404 instead of the SPA index, and the plain add_header (no
    # `always`) means a 404 never carries the one-year policy.
    location /assets/ {
        try_files $uri =404;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_proxied any;
        gzip_types application/javascript text/javascript text/css image/svg+xml application/json application/manifest+json;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
    }

    # SPA fallback: any non-file route serves index.html for client routing. The
    # index and unhashed root files (e.g. /theme-preinit.js) are no-cache.
    location / {
        try_files $uri $uri/ /index.html;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_proxied any;
        gzip_types application/javascript text/javascript text/css image/svg+xml application/json application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
    }
}
