# Static server for the example module image (web/examples/ui-module/Dockerfile). Not shipped.
#
# The web nginx proxies /modules/example/... here with the path unchanged, so the build sits
# under /modules/example/ in the document root (the Vite `base` of the build is the same path).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A relative redirect keeps a directory redirect on the host the browser used: this
    # server sits behind the web nginx and does not know its public name or port.
    absolute_redirect off;

    # Hashed build output never changes under its name.
    location ^~ /modules/example/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # remoteEntry.js and the rest are re-validated on every load: a rollout swaps them in place.
    location ^~ /modules/example/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /modules/example {
        return 301 /modules/example/;
    }

    location / {
        return 404;
    }
}
