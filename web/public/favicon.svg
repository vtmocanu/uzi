<!-- Uzi brand status favicon (PRD #70). Rounded near-black steel field with the
     in-app FactoryIcon mark (web/src/components/icons.tsx) stroked in brand ember.
     Stroke bumped to 2.7 (vs the in-app 2) and the mark inset a little so the glyph
     stays legible and un-clipped when the tab shrinks it to ~16px. #favicon-svg in
     index.html points here so a later hook can swap the href for the dynamic overlay. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <rect x="0" y="0" width="24" height="24" rx="5" fill="#080A0F" />
  <g transform="translate(12 12) scale(0.86) translate(-12 -12)"
     fill="none" stroke="#FB923C" stroke-width="2.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z" />
    <path d="M17 18h1M12 18h1M7 18h1" />
  </g>
</svg>
