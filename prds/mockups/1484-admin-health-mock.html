<title>uzi Admin Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* uzi's own tokens: the "dawn" light theme as the base, "ember" for dark. */
  :root {
    color-scheme: light;
    --bg: 242 244 247; --surface: 255 255 255; --raised: 235 238 243;
    --edge: 214 219 228; --edge-strong: 174 182 196;
    --fg: 21 26 34; --muted: 74 85 103; --faint: 95 106 130;
    --brand: 185 60 11; --on-brand: 255 255 255;
    --ok: 3 112 90; --warn: 154 74 5; --danger: 190 18 60; --info: 3 105 161;
    /* the console scope stays dark in every theme, as in the app */
    --con-bg: 8 10 15; --con-fg: 228 232 240; --con-muted: 148 158 176; --con-edge: 39 45 60;
    --con-ok: 52 211 153; --con-warn: 251 191 36; --con-danger: 251 113 133; --con-brand: 251 146 60;
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: 8 10 15; --surface: 15 18 26; --raised: 23 27 38; --edge: 39 45 60; --edge-strong: 58 66 86;
      --fg: 228 232 240; --muted: 148 158 176; --faint: 122 133 154;
      --brand: 251 146 60; --on-brand: 26 16 8;
      --ok: 52 211 153; --warn: 251 191 36; --danger: 251 113 133; --info: 56 189 248;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: 8 10 15; --surface: 15 18 26; --raised: 23 27 38; --edge: 39 45 60; --edge-strong: 58 66 86;
    --fg: 228 232 240; --muted: 148 158 176; --faint: 122 133 154;
    --brand: 251 146 60; --on-brand: 26 16 8;
    --ok: 52 211 153; --warn: 251 191 36; --danger: 251 113 133; --info: 56 189 248;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: rgb(var(--bg)); color: rgb(var(--fg));
    font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: rgb(var(--info)); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid rgb(var(--brand)); outline-offset: 2px; border-radius: 4px; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: rgb(var(--muted)); }
  .faint { color: rgb(var(--faint)); }

  /* ---- the mock's own chrome, kept visually apart from the app ---- */
  .mockbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
    padding: 9px 16px; background: rgb(var(--fg)); color: rgb(var(--bg)); font-size: 12.5px;
  }
  .mockbar .tag {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; background: rgb(var(--brand)); color: rgb(var(--on-brand));
  }
  .ctl { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ctl > span { opacity: .7; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid rgb(var(--bg) / .35); border-radius: 8px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; margin: 0; cursor: pointer; padding: 5px 11px; font-size: 12.5px;
    background: transparent; color: rgb(var(--bg) / .82);
  }
  .seg button + button { border-left: 1px solid rgb(var(--bg) / .35); }
  .seg button[aria-pressed="true"] { background: rgb(var(--bg)); color: rgb(var(--fg)); font-weight: 600; }
  .seg button:focus-visible { outline-offset: -2px; }
  .seg button:disabled { opacity: .4; cursor: default; }

  .note {
    border: 1px dashed rgb(var(--edge-strong)); border-radius: 8px; padding: 10px 12px;
    font-size: 12.5px; color: rgb(var(--muted)); background: transparent; max-width: 78ch;
  }
  .note b { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--brand)); margin-right: 6px; font-weight: 600; }

  /* ---- app frame ---- */
  .frame { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 80vh; }
  .side { border-right: 1px solid rgb(var(--edge)); background: rgb(var(--surface)); padding: 18px 10px; }
  .wordmark { padding: 0 10px 14px; font-weight: 600; letter-spacing: -.01em; font-size: 15px; }
  .wordmark small { display: block; font-weight: 400; font-size: 11px; color: rgb(var(--faint)); letter-spacing: 0; }
  .nav { display: grid; gap: 2px; }
  .nav button {
    appearance: none; border: 0; background: transparent; color: rgb(var(--muted)); text-align: left;
    padding: 7px 10px; border-radius: 7px; font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .nav button.live { cursor: pointer; }
  .nav button.live:hover { background: rgb(var(--raised)); color: rgb(var(--fg)); }
  .nav button[aria-current="page"] { background: rgb(var(--raised)); color: rgb(var(--fg)); font-weight: 500; }
  .pip { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pip.warn { background: rgb(var(--warn)); }
  .pip.danger { background: rgb(var(--danger)); }
  .main { padding-block: 26px 48px; padding-inline: 28px; display: grid; gap: 22px; align-content: start; min-width: 0; }
  .main > section { display: grid; gap: 20px; min-width: 0; }
  @media (max-width: 860px) {
    .frame { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    .main { padding-inline: 16px; }
  }

  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: rgb(var(--muted)); }
  h2.section { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: rgb(var(--faint)); }

  .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid rgb(var(--edge)); }
  .tabs span, .tabs button {
    appearance: none; background: transparent; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    padding: 8px 12px; font-size: 14px; font-weight: 500; color: rgb(var(--muted)); white-space: nowrap; flex: none;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tabs .on { border-bottom-color: rgb(var(--brand)); color: rgb(var(--fg)); }
  .newtag { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: rgb(var(--brand)); border: 1px solid rgb(var(--brand) / .45); border-radius: 4px; padding: 0 4px; }

  .card { border: 1px solid rgb(var(--edge)); background: rgb(var(--surface)); border-radius: 12px; }
  .pad { padding: 18px 20px; }

  /* severity language: form + colour */
  .sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .02em; padding: 2px 8px 2px 6px; border-radius: 999px; border: 1px solid; white-space: nowrap; width: max-content; }
  .sev i { font-style: normal; font-size: 10px; width: 10px; text-align: center; }
  .sev.ok { color: rgb(var(--ok)); border-color: rgb(var(--ok) / .3); background: rgb(var(--ok) / .08); }
  .sev.warn { color: rgb(var(--warn)); border-color: rgb(var(--warn) / .4); background: rgb(var(--warn) / .1); }
  .sev.danger { color: rgb(var(--danger)); border-color: rgb(var(--danger) / .45); background: rgb(var(--danger) / .1); }
  .sev.unknown { color: rgb(var(--muted)); border-color: rgb(var(--edge-strong)); border-style: dashed; background: rgb(var(--raised)); }
  .sev.na { color: rgb(var(--faint)); border-color: rgb(var(--edge)); background: transparent; font-weight: 500; }

  /* verdict */
  .verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
  .verdict .big { display: flex; gap: 12px; align-items: flex-start; }
  .verdict .glyph { font-size: 22px; line-height: 1.25; flex: none; }
  .verdict .glyph.ok { color: rgb(var(--ok)); } .verdict .glyph.warn { color: rgb(var(--warn)); }
  .verdict .glyph.danger { color: rgb(var(--danger)); }
  .verdict h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  .verdict p { margin: 3px 0 0; color: rgb(var(--muted)); max-width: 70ch; }
  .tally { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 12.5px; color: rgb(var(--faint)); margin-top: 14px; padding-top: 12px; border-top: 1px solid rgb(var(--edge)); }
  .btn { appearance: none; cursor: pointer; border: 1px solid rgb(var(--edge-strong)); background: rgb(var(--surface)); color: rgb(var(--fg)); border-radius: 7px; padding: 4px 10px; font-size: 12.5px; }
  .btn:hover { background: rgb(var(--raised)); }
  .attn { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .attn li { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
  .attn a { color: rgb(var(--fg)); font-weight: 500; }
  .attn .s { color: rgb(var(--muted)); font-weight: 400; }
  @media (max-width: 720px) { .verdict { grid-template-columns: minmax(0, 1fr); } .tally { justify-content: flex-start; } }

  /* check rows */
  .group { overflow: hidden; }
  .group > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 20px; border-bottom: 1px solid rgb(var(--edge)); }
  .check { border-top: 1px solid rgb(var(--edge)); }
  .group > header + .check { border-top: 0; }
  .check > summary {
    list-style: none; cursor: pointer; padding: 11px 20px;
    display: grid; grid-template-columns: 84px minmax(130px, 190px) minmax(0, 1fr) auto 14px;
    grid-template-areas: "sev title sum since chev"; gap: 4px 14px; align-items: baseline;
  }
  .check > summary::-webkit-details-marker { display: none; }
  .check > summary:hover { background: rgb(var(--raised) / .6); }
  .check .sev { grid-area: sev; }
  .check .ctitle { grid-area: title; font-weight: 500; }
  .check .csum { grid-area: sum; color: rgb(var(--muted)); min-width: 0; }
  .check .since { grid-area: since; font-size: 12.5px; color: rgb(var(--faint)); white-space: nowrap; }
  .check .chev { grid-area: chev; color: rgb(var(--faint)); font-size: 11px; transition: transform .15s; }
  .check[open] .chev { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) { .check .chev { transition: none; } }
  .check.s-ok .ctitle, .check.s-na .ctitle { font-weight: 400; }
  .check.s-warn { background: rgb(var(--warn) / .05); }
  .check.s-danger { background: rgb(var(--danger) / .06); }
  .check.s-warn .csum, .check.s-danger .csum, .check.s-unknown .csum { color: rgb(var(--fg)); }
  @media (max-width: 720px) {
    .check > summary { grid-template-columns: 84px minmax(0, 1fr) auto 14px; grid-template-areas: "sev title since chev" "sum sum sum sum"; padding-inline: 16px; }
    .group > header { padding-inline: 16px; }
  }
  .cbody { padding: 2px 20px 16px 118px; display: grid; gap: 12px; }
  @media (max-width: 720px) { .cbody { padding-left: 16px; padding-right: 16px; } }
  .kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; font-size: 13px; }
  .kv dt { color: rgb(var(--faint)); }
  .kv dd { margin: 0; font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .action { font-size: 13.5px; max-width: 72ch; }
  .action b { font-weight: 600; }
  .cmd { display: flex; gap: 8px; align-items: stretch; }
  .cmd pre { margin: 0; flex: 1; min-width: 0; overflow-x: auto; background: rgb(var(--con-bg)); color: rgb(var(--con-fg)); border: 1px solid rgb(var(--con-edge)); border-radius: 7px; padding: 7px 10px; font-family: var(--font-mono); font-size: 12px; }
  .src { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: rgb(var(--faint)); }
  .plumb { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; border: 1px solid rgb(var(--edge-strong)); color: rgb(var(--muted)); }
  .plumb.new { border-color: rgb(var(--brand) / .5); color: rgb(var(--brand)); }

  /* fleet table */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: rgb(var(--faint)); padding: 9px 12px; border-bottom: 1px solid rgb(var(--edge)); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid rgb(var(--edge)); white-space: nowrap; vertical-align: baseline; }
  tr:last-child td { border-bottom: 0; }
  th:first-child, td:first-child { padding-left: 20px; } th:last-child, td:last-child { padding-right: 20px; }
  .dot { display: inline-flex; align-items: center; gap: 6px; }
  .dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .t-ok { color: rgb(var(--ok)); } .t-warn { color: rgb(var(--warn)); } .t-danger { color: rgb(var(--danger)); } .t-muted { color: rgb(var(--muted)); }

  /* banner (AppShell level) */
  .banner { border: 1px solid rgb(var(--danger) / .4); background: rgb(var(--danger) / .1); border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; }
  .banner p { margin: 0; }
  .banner .t { font-weight: 600; }
  .banner .b { color: rgb(var(--muted)); margin-top: 2px; max-width: 80ch; }
  .banner .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .linkbtn { appearance: none; border: 0; background: transparent; padding: 0; color: rgb(var(--info)); cursor: pointer; font-size: 14px; }
  .linkbtn:hover { text-decoration: underline; }

  /* overview */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 900px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { padding: 16px; }
  .label { margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: rgb(var(--faint)); }
  .tile .value { margin: 6px 0 0; font-size: 24px; font-weight: 600; }
  .tile .hint { margin: 2px 0 0; font-size: 12px; color: rgb(var(--faint)); }
  .hcard header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
  .hcard .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .hcard .line strong { font-weight: 600; }
  .quiet { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 11px 16px; }
  .runs { margin: 8px 0 0; padding: 0; list-style: none; }
  .runs li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; padding: 10px 0; border-top: 1px solid rgb(var(--edge)); }
  .runs li:first-child { border-top: 0; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid rgb(var(--edge)); background: rgb(var(--raised)); color: rgb(var(--muted)); white-space: nowrap; }
  .badge.warn { color: rgb(var(--warn)); border-color: rgb(var(--warn) / .4); background: rgb(var(--warn) / .1); }
  .badge.ok { color: rgb(var(--ok)); border-color: rgb(var(--ok) / .3); background: rgb(var(--ok) / .08); }
  .badge.info { color: rgb(var(--info)); border-color: rgb(var(--info) / .35); background: rgb(var(--info) / .08); }
  .userline { border: 1px solid rgb(var(--edge-strong)); background: rgb(var(--raised)); border-radius: 10px; padding: 11px 16px; color: rgb(var(--fg)); }

  /* console + slack */
  .console { background: rgb(var(--con-bg)); color: rgb(var(--con-fg)); border: 1px solid rgb(var(--con-edge)); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; margin: 0; white-space: pre; }
  .console .p { color: rgb(var(--con-brand)); } .console .m { color: rgb(var(--con-muted)); }
  .console .ok { color: rgb(var(--con-ok)); } .console .warn { color: rgb(var(--con-warn)); } .console .danger { color: rgb(var(--con-danger)); }
  .slack { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 16px 18px; max-width: 640px; }
  .slack .av { width: 36px; height: 36px; border-radius: 8px; background: rgb(var(--brand)); color: rgb(var(--on-brand)); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .slack .who { font-weight: 600; } .slack .who span { font-weight: 400; color: rgb(var(--faint)); font-size: 12px; margin-left: 6px; }
  .slack ul { margin: 6px 0 8px; padding-left: 18px; } .slack p { margin: 4px 0 0; }
  .two { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
</style>

<div class="mockbar">
  <span class="tag">mock</span>
  <div class="ctl"><span>Scenario</span>
    <div class="seg" id="seg-scn" role="group" aria-label="Scenario">
      <button id="scn-healthy" data-scn="healthy">Healthy</button>
      <button id="scn-degraded" data-scn="degraded">Degraded</button>
      <button id="scn-incident" data-scn="incident">Incident</button>
      <button id="scn-silent" data-scn="silent">Controller silent</button>
      <button id="scn-compose" data-scn="compose">Compose</button>
    </div>
  </div>
  <div class="ctl"><span>Surface</span>
    <div class="seg" id="seg-view" role="group" aria-label="Surface">
      <button id="view-btn-health" data-view="health">Admin health tab</button>
      <button id="view-btn-overview" data-view="overview">Overview</button>
      <button id="view-btn-push" data-view="push">CLI and Slack</button>
    </div>
  </div>
  <div class="ctl"><span>Viewing as</span>
    <div class="seg" id="seg-role" role="group" aria-label="Role">
      <button id="role-admin" data-role="admin">Admin</button>
      <button id="role-user" data-role="user">User</button>
    </div>
  </div>
</div>

<div class="frame">
  <aside class="side" aria-label="App navigation (mock)">
    <div class="wordmark">uzi<small>Uzinele Întunecate</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div id="banner"></div>
    <section id="v-health"></section>
    <section id="v-overview" hidden></section>
    <section id="v-push" hidden></section>
  </main>
</div>

<script>
(function () {
  "use strict";
  var GLYPH = { ok: "●", warn: "▲", danger: "◆", unknown: "?", na: "○" };
  var LABEL = { ok: "OK", warn: "Warn", danger: "Danger", unknown: "Unknown", na: "N/A" };
  var RANK = { danger: 0, unknown: 1, warn: 2, ok: 3, na: 4 };
  var GROUPS = [
    ["workers", "Workers and capacity"], ["queue", "Queue"], ["control", "Control plane"],
    ["integrations", "Integrations"], ["housekeeping", "Housekeeping"]
  ];

  // plumb: "have" = the api already holds this data, "new" = needs new plumbing, "check" = not yet verified in code
  var BASE = [
    { id: "fleet.roll", group: "workers", title: "Worker image roll", summary: "4 of 4 hosted workers on 0.84.0",
      plumb: "have", source: "Controller status report. Stored today, but only the owner's worker list reads it; the admin list must join it too.",
      evidence: [["Target tag", "0.84.0"], ["Settled", "4"], ["Rolling", "0"], ["Stuck", "0"]] },
    { id: "fleet.capacity", group: "workers", title: "Run capacity", summary: "4 workers online across 3 users, 3 idle, none cordoned",
      plumb: "have", source: "Worker heartbeats",
      evidence: [["Online", "4 of 4"], ["Busy", "1"], ["Cordoned", "0"], ["Users with waiting runs and no usable worker", "0"]] },
    { id: "fleet.disk", group: "workers", title: "Worker disk", summary: "Fullest volume is 41% used",
      plumb: "have", source: "Worker heartbeat stats",
      evidence: [["Fullest", "base.l-7c2e data, 41%"], ["Disk-pressure flags", "0"]] },
    { id: "queue.waiting", group: "queue", title: "Queued runs", summary: "No run is waiting for a worker",
      plumb: "have", source: "runs.health, written by the sweeper",
      evidence: [["Waiting for a worker", "0"], ["Oldest", "n/a"]] },
    { id: "queue.undispatched", group: "queue", title: "Undispatched runs", summary: "No task run is stuck before dispatch",
      plumb: "new", source: "New query: task runs created but never dispatched (dispatched_at is null)",
      evidence: [["Threshold", "10 min"], ["Matches", "0"]] },
    { id: "controller.report", group: "control", title: "Worker controller", summary: "Last report 6 s ago, expected every 10 s",
      plumb: "new", source: "Arrival time of the controller's status report. Today it is stored only per worker, so an empty fleet leaves no trace: needs one stored row.",
      evidence: [["Last report", "6 s ago"], ["Interval", "10 s"], ["Stale after", "30 s"], ["Danger after", "5 min"]] },
    { id: "db.ping", group: "control", title: "Database", summary: "Ping 2 ms, pool 3 of 20 in use, migrations at head",
      plumb: "have", source: "pgx pool stats and the goose version table",
      evidence: [["Ping", "2 ms"], ["Pool in use", "3 of 20"], ["Migration head", "applied"]] },
    { id: "loops.tick", group: "control", title: "Background loops", summary: "Sweeper, forge poller and lifecycle reconciler all ticked in the last minute",
      plumb: "new", source: "In-process last-tick timestamps",
      evidence: [["Sweeper", "12 s ago"], ["Forge poller", "31 s ago"], ["Lifecycle reconciler", "9 s ago"]] },
    { id: "version.skew", group: "control", title: "Version skew", summary: "web, api and controller all on 0.84.0",

    var ws = '<span class="p">$</span> uzi admin workers\n<span class="m">' + pad("OWNER", 8) + pad("NAME", 13) + pad("STATUS", 9) + pad("VERSION", 9) + pad("UPGRADE", 17) + "BLOCKING</span>\n";
    s.fleet.forEach(function (w) { ws += pad(w.owner, 8) + pad(w.name, 13) + pad(w.status, 9) + pad(w.version, 9) + '<span class="' + (w.ut === "muted" ? "m" : w.ut) + '">' + pad(w.upgrade, 17) + "</span>" + esc(w.blocking || "") + "\n"; });
    h += '<div style="display:grid;gap:10px"><h2 class="section">uzi admin workers, with the missing columns</h2><pre class="console">' + ws.replace(/\n$/, "") + "</pre></div>";

    h += '<div style="display:grid;gap:10px"><h2 class="section">Slack DM to admins</h2>';
    if (s.slack) {
      h += '<div class="card slack"><div class="av" aria-hidden="true">uz</div><div><div class="who">uzi<span>APP</span></div><p><strong>◆ ' + esc(s.slack.head) + "</strong></p><ul>" + s.slack.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + '</ul><p><a href="#" data-goto="health">Open health</a></p></div></div><div class="note"><b>mock note</b>' + esc(s.slack.foot) + " Warnings never notify.</div>";
    } else {
      h += '<div class="note"><b>mock note</b>No message in this scenario: nothing crossed into Danger. Warnings and not-applicable checks never DM.</div>';
    }
    h += "</div></div>";
    el.innerHTML = h;
  }

  /* ---------- shell ---------- */
  function renderBanner() {
    var el = document.getElementById("banner"), b = SCN[state.scn].banner;
    if (!b || state.role !== "admin" || state.view === "push" || state.snoozed) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="banner" role="alert"><div><p class="t"><span aria-hidden="true" class="t-danger">◆</span> ' + esc(b.t) + '</p><p class="b">' + esc(b.b) + '</p></div><div class="acts">' +
      (state.view === "health" ? "" : '<button class="linkbtn" type="button" data-goto="health">Open health</button>') + '<button class="btn" type="button" id="snooze">Snooze 1 h</button></div></div>';
  }
  function renderNav() {
    var list = checks(), t = tally(list), att = attention(list), admin = state.role === "admin";
    var items = [["Overview", "overview"], ["Board", ""], ["Runs", ""], ["Workers", ""], ["Schedules", ""], ["Judge", ""], ["Docs", ""], ["Settings", ""]];
    if (admin) items.push(["Admin", "health"]);
    document.getElementById("nav").innerHTML = items.map(function (i) {
      var cur = i[1] && i[1] === state.view ? ' aria-current="page"' : "";
      var pip = i[0] === "Admin" && att.length ? '<span class="pip ' + (t.danger ? "danger" : "warn") + '" title="' + att.length + ' health checks need attention"></span>' : "";
      return "<button type=\"button\"" + (i[1] ? ' class="live" data-goto="' + i[1] + '"' : " tabindex=\"-1\"") + cur + "><span>" + i[0] + "</span>" + pip + "</button>";
    }).join("");
  }
  function press(groupId, attr, val) {
    Array.prototype.forEach.call(document.querySelectorAll("#" + groupId + " button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute(attr) === val)); });
  }
  function render() {
    press("seg-scn", "data-scn", state.scn); press("seg-view", "data-view", state.view); press("seg-role", "data-role", state.role);
    ["health", "overview", "push"].forEach(function (v) { document.getElementById("v-" + v).hidden = v !== state.view; });
    renderNav(); renderBanner(); renderHealth(); renderOverview(); renderPush();
    try { localStorage.setItem("uzi-health-mock", JSON.stringify({ scn: state.scn, view: state.view, role: state.role })); } catch (e) { /* ignore */ }
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button, a"); if (!b) return;
    if (b.dataset.scn) { state.scn = b.dataset.scn; state.snoozed = false; render(); }
    else if (b.dataset.view) { state.view = b.dataset.view; render(); }
    else if (b.dataset.role) { state.role = b.dataset.role; render(); }
    else if (b.dataset.goto) { ev.preventDefault(); state.view = b.dataset.goto; render(); window.scrollTo(0, 0); }
    else if (b.dataset.jump) {
      ev.preventDefault(); var d = document.getElementById("c-" + b.dataset.jump);
      if (d) { d.open = true; d.scrollIntoView({ block: "center", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
    }
    else if (b.id === "snooze") { state.snoozed = true; renderBanner(); }
    else if (b.dataset.copy || b.id === "copy-diag") {
      var text = b.dataset.copy || checks().map(function (c) { return LABEL[c.sev].toUpperCase() + "\t" + c.id + "\t" + c.summary; }).join("\n");
      var label = b.textContent;
      try { navigator.clipboard.writeText(text).then(function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = label; }, 1400); }, function () {}); } catch (e) { /* clipboard blocked */ }
    }
  });
  render();
})();
</script>
