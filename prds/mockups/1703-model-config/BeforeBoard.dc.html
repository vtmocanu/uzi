<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#080a0f}
.r{font-family:'IBM Plex Sans',system-ui,sans-serif;color:#e4e8f0;background:#080a0f;box-sizing:border-box}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid #3a4256;border-radius:8px;background:#171b26;font-family:inherit;font-size:12px;color:#e4e8f0;text-align:left;width:100%;box-sizing:border-box}
.btn{display:flex;justify-content:center;align-items:center;height:32px;border-radius:8px;background:#fb923c;color:#1c0e03;font-family:inherit;font-weight:600;font-size:12.5px;border:0;width:100%}
.pin{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:11px;background:#fb7185;color:#22060c;font-size:12px;font-weight:700;padding:0 6px;box-sizing:border-box;flex-shrink:0}
.lab{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;background:#171b26;border:1px solid #272d3c;color:#aab3c4}
</style>
</helmet>
<div class="r" style="width: 420px; height: 560px; display: flex; flex-direction: column">
<div style="height: 40px; background: #2a1117; color: #fda4af; display: flex; align-items: center; padding: 0 20px; font-size: 12px; font-weight: 600; letter-spacing: .08em">BEFORE · Board → Ready column</div>
<div style="margin: 24px; padding: 14px; background: #0b0e15; border: 1px solid #272d3c; border-radius: 12px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 12px; font-weight: 600; color: #949eb0; letter-spacing: .06em; text-transform: uppercase">Ready · 3</div>
<div style="background: #0f121a; border: 1px solid #272d3c; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 12px; color: #7a859a" class="mono">#[ISSUE]</div>
<div style="font-size: 14px; font-weight: 500">[Issue title]</div>
<div style="display: flex; gap: 6px"><span class="lab">uzi</span><span class="lab">Planned</span></div>
<button type="button" class="sel"><span>Use my default</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="#949eb0" stroke-width="1.5" fill="none"></path></svg></button>
<button type="button" class="sel"><span>Inherit the worker's token</span><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="#949eb0" stroke-width="1.5" fill="none"></path></svg></button>
<button type="button" class="btn">Start run</button>
</div>
<div style="display: flex; gap: 8px; align-items: flex-start; color: #fda4af; font-size: 12.5px; line-height: 1.5"><span class="pin">16</span>Which model and effort will this run use? Nothing here says.</div>
</div>
</div>
</x-dc>
