name: uzi

# Local laptop demo. Every published port is bound to 127.0.0.1 so nothing is
# exposed on the network (copied from multica's loopback binding).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uzi}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uzi} -d ${POSTGRES_DB:-uzi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./api
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-uzi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uzi}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env - generate with openssl rand -hex 64}"
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-168h}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8080}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
