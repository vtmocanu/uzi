services:
  web:
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    volumes:
      - ../../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1::8080"
    depends_on:
      - api
  api:
    image: node:24-alpine
    command: ["node", "/fixture/server.mjs"]
    volumes:
      - ./server.mjs:/fixture/server.mjs:ro
  occupant:
    image: node:24-alpine
    profiles: [occupant]
    command: ["node", "-e", "setInterval(() => {}, 1000000)"]
