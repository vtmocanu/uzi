# DARK CODEX GUARD (issue #1171 M5) -- no raw child_process spawn in
# agent/src/codex/** outside the sanctioned launcher and boot-time Landlock probe.
#
# The general rule covers every Codex provider file except the supervisor launcher and
# codex-capability.ts. The capability-specific rule then covers ONLY codex-capability.ts,
# with exact exceptions for its sanctioned import, fixed spawnSync probe and injectable
# test seam. Splitting the rules is load-bearing: pattern-not exceptions are global to a
# rule, so putting them on the general rule would also allow those forms in broker.ts or
# any future provider file.
#
# Imports are matched as well as calls because a child_process binding can be assigned to an
# arbitrary local callee. Semgrep matches destructured imports by subset, so the exact
# sanctioned import exception also suppresses a superset with extra named bindings. The third
# rule rejects every dangerous extra binding, aliased or unaliased, in codex-capability.ts.
# Other files need no companion: their general rule flags every child_process import directly.
#
# RELIABILITY BOUNDARY. This is a syntactic, file-glob-scoped gate. It cannot trace a spawn
# hidden behind an imported helper and does not prove a sanctioned spawner is correct. A new
# seam needs an explicit path or pattern exception plus positive and negative controls.
#
# POSITIVE CONTROLS (verified before commit): broker.ts fires on the bare, namespace,
# aliased-import and verbatim-probe forms; codex-capability.ts fires on a new bare spawn plus
# aliased and unaliased dangerous superset imports. NEGATIVE CONTROL: the committed tree
# reports zero findings; regexp.exec(...) remains outside the namespace-member patterns.
rules:
  - id: codex-no-direct-spawn
    languages: [typescript]
    severity: ERROR
    message: >-
      Raw child_process spawn is confined to the sanctioned Codex seams. A
      spawn/exec/fork or child_process import in another agent/src/codex file escapes
      the supervisor/registry lifecycle. Route it through the launcher / command /
      fileop seam.
    paths:
      # Root-anchored to silence Semgrepignore-v2 warnings. The gate scans from repo root.
      include:
        - /agent/src/codex
      exclude:
        # The supervisor spawn plus its fixed id/provisioning probes.
        - /agent/src/codex/launcher.ts
        # Covered by codex-capability-no-extra-direct-spawn below, where its exact
        # exceptions cannot leak into any other provider file.
        - /agent/src/codex/codex-capability.ts
    pattern-either:
      # Bare-callee forms from destructured imports.
      - pattern: spawn(...)
      - pattern: spawnSync(...)
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: execFile(...)
      - pattern: execFileSync(...)
      - pattern: fork(...)
      # Namespace-member forms whose names do not collide with common methods.
      # Deliberately omit $NS.exec/$NS.execSync so regexp.exec(...) does not fire.
      - pattern: $NS.spawn(...)
      - pattern: $NS.spawnSync(...)
      - pattern: $NS.execFile(...)
      - pattern: $NS.execFileSync(...)
      - pattern: $NS.fork(...)
      # Imports catch arbitrary aliases and namespace names.
      - pattern: import * as $X from "node:child_process"
      - pattern: import * as $X from "child_process"
      - pattern: import { ... } from "node:child_process"
      - pattern: import { ... } from "child_process"
      - pattern: import $X from "node:child_process"
      - pattern: import $X from "child_process"

  - id: codex-capability-no-extra-direct-spawn
    languages: [typescript]
    severity: ERROR
    message: >-
      codex-capability.ts may use only the exact child_process import and fixed
      boot-time Landlock probe forms. Any other spawn/exec/fork or child_process
      import widens the trusted startup seam.
    paths:
      include:
        - /agent/src/codex/codex-capability.ts
    patterns:
      - pattern-either:
          - pattern: spawn(...)
          - pattern: spawnSync(...)
          - pattern: exec(...)
          - pattern: execSync(...)
          - pattern: execFile(...)
          - pattern: execFileSync(...)
          - pattern: fork(...)
          - pattern: $NS.spawn(...)
          - pattern: $NS.spawnSync(...)
          - pattern: $NS.execFile(...)
          - pattern: $NS.execFileSync(...)
          - pattern: $NS.fork(...)
          - pattern: import * as $X from "node:child_process"
          - pattern: import * as $X from "child_process"
          - pattern: import { ... } from "node:child_process"
          - pattern: import { ... } from "child_process"
          - pattern: import $X from "node:child_process"
          - pattern: import $X from "child_process"
      - pattern-not: 'import { spawnSync, type SpawnSyncReturns } from "node:child_process"'
      - pattern-not: 'spawnSync(command, [...args], { stdio: "ignore", timeout: 10_000 })'
      - pattern-not: 'spawn(bin, ["--probe"])'

  # Semgrep's destructured-import match is subset-based. The sanctioned import exception
  # above therefore also suppresses a superset. Catch every extra dangerous binding at the
  # import, before an assignment can hide its callee behind an arbitrary local name.
  - id: codex-capability-no-extra-child-process-bindings
    languages: [typescript]
    severity: ERROR
    message: >-
      codex-capability.ts permits only its sanctioned spawnSync binding and type.
      An extra child_process binding can hide a raw callee behind an arbitrary local
      name and widen the trusted startup seam.
    paths:
      include:
        - /agent/src/codex/codex-capability.ts
    pattern-either:
      - pattern: import { ..., spawn, ... } from "node:child_process"
      - pattern: import { ..., exec, ... } from "node:child_process"
      - pattern: import { ..., execSync, ... } from "node:child_process"
      - pattern: import { ..., execFile, ... } from "node:child_process"
      - pattern: import { ..., execFileSync, ... } from "node:child_process"
      - pattern: import { ..., fork, ... } from "node:child_process"
      - pattern: import { ..., spawn, ... } from "child_process"
      - pattern: import { ..., exec, ... } from "child_process"
      - pattern: import { ..., execSync, ... } from "child_process"
      - pattern: import { ..., execFile, ... } from "child_process"
      - pattern: import { ..., execFileSync, ... } from "child_process"
      - pattern: import { ..., fork, ... } from "child_process"
      - pattern: import { ..., $X as $Y, ... } from "node:child_process"
      - pattern: import { ..., $X as $Y, ... } from "child_process"
