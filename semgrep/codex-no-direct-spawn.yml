# DARK CODEX GUARD (issue #1171 M5) -- no raw child_process spawn in
# agent/src/codex/** outside the sanctioned launcher, boot-time Landlock probe,
# and evaluator-only same-identity app-server leaf.
#
# The general rule covers every Codex provider file except the supervisor launcher,
# codex-capability.ts and the evaluator-only pr-description-eval-launch.ts.
# The capability-specific rule then covers ONLY codex-capability.ts,
# with exact exceptions for its sanctioned import, fixed spawnSync probe and injectable
# test seam. Splitting the rules is load-bearing: pattern-not exceptions are global to a
# rule, so putting them on the general rule would also allow those forms in broker.ts or
# any future provider file.
#
# Imports are matched as well as calls because a child_process binding can be assigned to an
# arbitrary local callee. Semgrep matches destructured imports by subset, so the exact
# sanctioned import exception also suppresses a superset with extra named bindings. The third
# rule rejects every extra named binding, aliased or unaliased, in codex-capability.ts.
# The evaluator leaf has its own exact import and fixed launch exceptions, with companion
# rules rejecting supersets. These exceptions cannot leak into other Codex files.
# Other files need no companion: their general rule flags every child_process import directly.
#
# RELIABILITY BOUNDARY. This is a syntactic, file-glob-scoped gate. It cannot trace a spawn
# hidden behind an imported helper and does not prove a sanctioned spawner is correct. A new
# seam needs an explicit path or pattern exception plus positive and negative controls.
#
# POSITIVE CONTROLS (verified before commit): broker.ts fires on the bare, namespace,
# aliased-import and verbatim-probe forms; codex-capability.ts fires on a new bare spawn plus
# aliased and unaliased dangerous superset imports. NEGATIVE CONTROL: the committed tree
# reports zero findings; regexp.exec(...) remains outside the namespace-member patterns.
rules:
  - id: codex-no-direct-spawn
    languages: [typescript]
    severity: ERROR
    message: >-
      Raw child_process spawn is confined to the sanctioned Codex seams. A
      spawn/exec/fork or child_process import in another agent/src/codex file escapes
      the supervisor/registry lifecycle. Route it through the launcher / command /
      fileop seam.
    paths:
      # Root-anchored to silence Semgrepignore-v2 warnings. The gate scans from repo root.
      include:
        - /agent/src/codex
      exclude:
        # The supervisor spawn plus its fixed id/provisioning probes.
        - /agent/src/codex/launcher.ts
        # Covered by codex-capability-no-extra-direct-spawn below, where its exact
        # exceptions cannot leak into any other provider file.
        - /agent/src/codex/codex-capability.ts
        # Evaluator-only leaf: exact import/call and superset companions below.
        - /agent/src/codex/pr-description-eval-launch.ts
    pattern-either:
      # Bare-callee forms from destructured imports.
      - pattern: spawn(...)
      - pattern: spawnSync(...)
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: execFile(...)
      - pattern: execFileSync(...)
      - pattern: fork(...)
      # Namespace-member forms whose names do not collide with common methods.
      # Deliberately omit $NS.exec/$NS.execSync so regexp.exec(...) does not fire.
      - pattern: $NS.spawn(...)
      - pattern: $NS.spawnSync(...)
      - pattern: $NS.execFile(...)
      - pattern: $NS.execFileSync(...)
      - pattern: $NS.fork(...)
      # Imports catch arbitrary aliases and namespace names.
      - pattern: import * as $X from "node:child_process"
      - pattern: import * as $X from "child_process"
      - pattern: import { ... } from "node:child_process"
      - pattern: import { ... } from "child_process"
      - pattern: import $X from "node:child_process"
      - pattern: import $X from "child_process"

  - id: codex-capability-no-extra-direct-spawn
    languages: [typescript]
    severity: ERROR
    message: >-
      codex-capability.ts may use only the exact child_process import and fixed
      boot-time Landlock probe forms. Any other spawn/exec/fork or child_process
      import widens the trusted startup seam.
    paths:
      include:
        - /agent/src/codex/codex-capability.ts
    patterns:
      - pattern-either:
          - pattern: spawn(...)
          - pattern: spawnSync(...)
          - pattern: exec(...)
          - pattern: execSync(...)
          - pattern: execFile(...)
          - pattern: execFileSync(...)
          - pattern: fork(...)
          - pattern: $NS.spawn(...)
          - pattern: $NS.spawnSync(...)
          - pattern: $NS.execFile(...)
          - pattern: $NS.execFileSync(...)
          - pattern: $NS.fork(...)
          - pattern: import * as $X from "node:child_process"
          - pattern: import * as $X from "child_process"
          - pattern: import { ... } from "node:child_process"
          - pattern: import { ... } from "child_process"
          - pattern: import $X from "node:child_process"
          - pattern: import $X from "child_process"
      - pattern-not: 'import { spawnSync, type SpawnSyncReturns } from "node:child_process"'
      - pattern-not: 'spawnSync(command, [...args], { stdio: "ignore", timeout: 10_000 })'
      - pattern-not: 'spawn(bin, ["--probe"])'

  # Semgrep's destructured-import match is subset-based. The sanctioned import exception
  # above therefore also suppresses any superset, including APIs not in the direct-call list
  # (for example ChildProcess). Match the source text instead: the ONE exact static import is
  # allowed, and every other named child_process import is rejected generically before an
  # assignment can hide its callee behind an arbitrary local name.
  - id: codex-capability-exact-child-process-import
    languages: [typescript]
    severity: ERROR
    message: >-
      codex-capability.ts permits exactly one child_process import: spawnSync plus the
      type-only SpawnSyncReturns. Any extra value or type binding widens the trusted
      startup seam.
    paths:
      include:
        - /agent/src/codex/codex-capability.ts
    patterns:
      # Keep selection structural so comments or newlines between JavaScript tokens cannot
      # hide an unsafe import. Subtract only the exact sanctioned source spelling.
      - pattern-either:
          - pattern: import { ... } from "node:child_process"
          - pattern: import { ... } from "child_process"
      - pattern-not-regex: '(?ms)^[ \t]*import[ \t]*\{[ \t\r\n]*spawnSync[ \t\r\n]*,[ \t\r\n]*type[ \t]+SpawnSyncReturns[ \t\r\n]*\}[ \t\r\n]*from[ \t\r\n]*["'']node:child_process["''][ \t]*;?[ \t]*$'

  - id: codex-evaluator-no-extra-direct-spawn
    languages: [typescript]
    severity: ERROR
    message: >-
      The evaluator leaf permits only its fixed same-identity app-server launch.
      Other child_process imports or process calls widen this local seam.
    paths:
      include:
        - /agent/src/codex/pr-description-eval-launch.ts
    patterns:
      - pattern-either:
          # Bare-callee forms from destructured imports.
          - pattern: spawn(...)
          - pattern: spawnSync(...)
          - pattern: exec(...)
          - pattern: execSync(...)
          - pattern: execFile(...)
          - pattern: execFileSync(...)
          - pattern: fork(...)
          # Namespace-member forms whose names do not collide with common methods.
          # Deliberately omit $NS.exec/$NS.execSync so regexp.exec(...) does not fire.
          - pattern: $NS.spawn(...)
          - pattern: $NS.spawnSync(...)
          - pattern: $NS.execFile(...)
          - pattern: $NS.execFileSync(...)
          - pattern: $NS.fork(...)
          # Imports catch arbitrary aliases and namespace names.
          - pattern: import * as $X from "node:child_process"
          - pattern: import * as $X from "child_process"
          - pattern: import { ... } from "node:child_process"
          - pattern: import { ... } from "child_process"
          - pattern: import $X from "node:child_process"
          - pattern: import $X from "child_process"
          - pattern: import "node:child_process"
          - pattern: import "child_process"
          - pattern: ($SEAM ?? spawn)(...)
      - pattern-not: 'import { spawn, type ChildProcess } from "node:child_process"'
      - pattern-not: '(testSeams.spawn ?? spawn)(CODEX_BIN, [...PROVIDER_CHILD_ARGV], { cwd, env, stdio: ["pipe", "pipe", "pipe"] })'

  - id: codex-evaluator-exact-child-process-import
    languages: [typescript]
    severity: ERROR
    message: The evaluator permits exactly spawn plus type-only ChildProcess from node:child_process.
    paths:
      include:
        - /agent/src/codex/pr-description-eval-launch.ts
    patterns:
      - pattern-either:
          - pattern: import { ... } from "node:child_process"
          - pattern: import { ... } from "child_process"
      - pattern-not-regex: '(?ms)^[ \t]*import[ \t]*\{[ \t\r\n]*spawn[ \t\r\n]*,[ \t\r\n]*type[ \t]+ChildProcess[ \t\r\n]*\}[ \t\r\n]*from[ \t\r\n]*["'']node:child_process["''][ \t]*;?[ \t]*$'

  # Object patterns match subsets too. Require the entire fixed call spelling,
  # so extra argv/options cannot ride along with a structurally sanctioned call.
  - id: codex-evaluator-exact-launch
    languages: [typescript]
    severity: ERROR
    message: The evaluator launch must retain CODEX_BIN, PROVIDER_CHILD_ARGV and controlled stdio/options.
    paths:
      include:
        - /agent/src/codex/pr-description-eval-launch.ts
    patterns:
      - pattern: ($SEAM ?? spawn)(...)
      - pattern-not-regex: '\(testSeams\.spawn[ \t\r\n]*\?\?[ \t\r\n]*spawn\)[ \t\r\n]*\(CODEX_BIN,[ \t\r\n]*\[\.\.\.PROVIDER_CHILD_ARGV\],[ \t\r\n]*\{[ \t\r\n]*cwd,[ \t\r\n]*env,[ \t\r\n]*stdio:[ \t\r\n]*\["pipe",[ \t\r\n]*"pipe",[ \t\r\n]*"pipe"\],[ \t\r\n]*\}[ \t\r\n]*\)'
