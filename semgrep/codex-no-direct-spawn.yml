# DARK CODEX GUARD (issue #1171 M5) -- no raw child_process spawn in
# agent/src/codex/** outside the three sanctioned raw-spawn wrappers.
#
# WHAT THIS ENFORCES. Inside the Codex provider tree, raw subprocess creation is
# confined to exactly three files that legitimately import `node:child_process`
# today: launcher.ts (the supervisor spawn plus the id/provision spawnSync probes),
# codex-executor.ts (the command seam's direct child spawn), and fileop-client.ts
# (the fileop seam). Every other file in agent/src/codex/** must reach a subprocess
# through those seams, never by importing child_process and spawning its own -- a raw
# spawn elsewhere escapes the supervisor/registry lifecycle and the seam boundary.
# (R2 supervisor-registration of these spawners is deferred, so the three stay
# sanctioned for now.)
#
# THE PATTERN. `pattern-either` over the child_process call forms
# (spawn/spawnSync/exec/execSync/execFile/execFileSync/fork); the three sanctioned
# spawner files are `paths.exclude`d. On the clean tree the only spawners in
# agent/src/codex/** are those three excluded files (confirmed by grep), so this rule
# reports ZERO findings; the same call in e.g. broker.ts fires. `exec(...)` matches
# only a bare `exec` callee, not the `regexp.exec(...)` / `str.exec(...)` member
# form. Codex tests live under agent/test/, outside this rule's /agent/src/codex
# scope.
#
# 🔴 RELIABILITY BOUNDARY. This is a SYNTACTIC, FILE-GLOB-SCOPED match on the direct
# child_process call APIs by name. It does NOT trace a spawn hidden behind a helper
# imported from another module (intraprocedural limit), and it does NOT prove the
# three sanctioned spawners themselves are correct -- only that no NEW file in the
# tree grows its own raw spawn. A spawner added under a new sanctioned seam must be
# added to the exclude list deliberately, the same way the include glob is kept in
# sync.
#
# POSITIVE CONTROL (verified before commit): adding `spawn("x");` to
# agent/src/codex/broker.ts fires; reverting returns to zero.
# NEGATIVE CONTROL: the committed tree reports zero findings -- the only spawners are
# the three excluded files.
rules:
  - id: codex-no-direct-spawn
    languages: [typescript]
    severity: ERROR
    message: >-
      Raw child_process spawn is confined to the three sanctioned Codex spawner files
      (launcher.ts, codex-executor.ts, fileop-client.ts). A spawn/exec/fork in any
      other agent/src/codex file escapes the supervisor/registry lifecycle and the
      seam boundary. Route the subprocess through the launcher / command / fileop
      seam.
    paths:
      # Root-anchored (leading `/`) to silence semgrep's Semgrepignore-v2
      # deprecation warning about bare relative includes, mirroring canary.yml.
      # The gate scans `.` from the repo root, so this resolves to agent/src/codex/.
      include:
        - /agent/src/codex
      # The only three files that legitimately import node:child_process today: the
      # supervisor spawn (launcher.ts), the command seam's direct child spawn
      # (codex-executor.ts), and the fileop seam (fileop-client.ts).
      exclude:
        - /agent/src/codex/launcher.ts
        - /agent/src/codex/codex-executor.ts
        - /agent/src/codex/fileop-client.ts
    pattern-either:
      - pattern: spawn(...)
      - pattern: spawnSync(...)
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: execFile(...)
      - pattern: execFileSync(...)
      - pattern: fork(...)
