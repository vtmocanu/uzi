# The original root Compose stack builds from source for laptop development;
# Kubernetes is the established server path. This stack serves a single VPS
# using signed release images, without building application images on the host.
# Kept in the main repository so server configuration is versioned with the code.
# Related deployment patterns:
# Immich: https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Supabase: https://github.com/supabase/supabase/tree/master/docker
# Plausible: https://github.com/plausible/community-edition

services:
  db:
    image: postgres:17@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uzi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-uzi} -d ${POSTGRES_DB:-uzi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    image: ghcr.io/vtmocanu/uzi/api:${UZI_VERSION:?set UZI_VERSION in .env}
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-uzi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uzi}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env - generate with openssl rand -hex 64}"
      UZI_SECRET_KEY: "${UZI_SECRET_KEY:?set UZI_SECRET_KEY in .env - generate with openssl rand -base64 32}"
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-168h}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8080}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      UZI_ALLOWED_EMAIL_DOMAINS: ${UZI_ALLOWED_EMAIL_DOMAINS:-}
      UZI_REGISTRATION_ENABLED: ${UZI_REGISTRATION_ENABLED:-true}
      UZI_EPHEMERAL_LEASE: ${UZI_EPHEMERAL_LEASE:-}
      UZI_PASSWORD_LOGIN_ENABLED: ${UZI_PASSWORD_LOGIN_ENABLED:-true}
      UZI_OIDC_ISSUER_URL: ${UZI_OIDC_ISSUER_URL:-}
      UZI_OIDC_CLIENT_ID: ${UZI_OIDC_CLIENT_ID:-}
      UZI_OIDC_CLIENT_SECRET: ${UZI_OIDC_CLIENT_SECRET:-}
      UZI_OIDC_SCOPES: ${UZI_OIDC_SCOPES:-openid profile email}
      UZI_OIDC_PROVIDER_NAME: ${UZI_OIDC_PROVIDER_NAME:-SSO}
      UZI_OIDC_HTTP_TIMEOUT: ${UZI_OIDC_HTTP_TIMEOUT:-15s}
      UZI_OIDC_GROUPS_CLAIM: ${UZI_OIDC_GROUPS_CLAIM:-groups}
      UZI_OIDC_ADMIN_GROUPS: ${UZI_OIDC_ADMIN_GROUPS:-}
      UZI_OIDC_ALLOWED_GROUPS: ${UZI_OIDC_ALLOWED_GROUPS:-}
      FORGE_ALLOWED_BASE_URLS: ${FORGE_ALLOWED_BASE_URLS:-https://gitlab.example.com}
      # Issue tracker SSRF allowlist (PRD #4173 S3): separate from the forge one, https
      # only, empty by default (no issue tracker connection can be created). Not worker egress.
      ISSUE_TRACKER_ALLOWED_BASE_URLS: ${ISSUE_TRACKER_ALLOWED_BASE_URLS:-}
      FORGE_POLL_INTERVAL: ${FORGE_POLL_INTERVAL:-60s}
      FORGE_RECONCILE_EVERY: ${FORGE_RECONCILE_EVERY:-10}
      FORGE_HTTP_TIMEOUT: ${FORGE_HTTP_TIMEOUT:-15s}
      FORGE_RATE_LIMIT_MAX: ${FORGE_RATE_LIMIT_MAX:-30}
      FORGE_RATE_LIMIT_WINDOW: ${FORGE_RATE_LIMIT_WINDOW:-1m}
      V1_RATE_LIMIT_MAX: ${V1_RATE_LIMIT_MAX:-120}
      V1_RATE_LIMIT_WINDOW: ${V1_RATE_LIMIT_WINDOW:-1m}
      OAUTH_RATE_LIMIT_MAX: ${OAUTH_RATE_LIMIT_MAX:-60}
      OAUTH_RATE_LIMIT_WINDOW: ${OAUTH_RATE_LIMIT_WINDOW:-1m}
      UZI_JOB_INPUT_FILE_MAX_BYTES: ${UZI_JOB_INPUT_FILE_MAX_BYTES:-}
      UZI_JOB_INPUTS_MAX_FILES: ${UZI_JOB_INPUTS_MAX_FILES:-}
      UZI_JOB_INPUTS_MAX_BYTES: ${UZI_JOB_INPUTS_MAX_BYTES:-}
      UZI_JOB_OUTPUT_FILE_MAX_BYTES: ${UZI_JOB_OUTPUT_FILE_MAX_BYTES:-}
      UZI_JOB_OUTPUTS_MAX_FILES: ${UZI_JOB_OUTPUTS_MAX_FILES:-}
      UZI_JOB_OUTPUTS_MAX_BYTES: ${UZI_JOB_OUTPUTS_MAX_BYTES:-}
      UZI_JOB_FILES_PER_OWNER_BYTES: ${UZI_JOB_FILES_PER_OWNER_BYTES:-}
      UZI_JOB_FILES_INSTANCE_BYTES: ${UZI_JOB_FILES_INSTANCE_BYTES:-}
      UZI_STORED_FILES_BUDGET_BYTES: ${UZI_STORED_FILES_BUDGET_BYTES:-}
      UZI_JOB_FILES_RETENTION: ${UZI_JOB_FILES_RETENTION:-}
      UZI_JOB_UPLOAD_TTL: ${UZI_JOB_UPLOAD_TTL:-}
      UZI_PRODUCT_SKILLS_ALLOWED_BASE_URLS: ${UZI_PRODUCT_SKILLS_ALLOWED_BASE_URLS:-}
      UZI_SEED_EMAIL: ${UZI_SEED_EMAIL:-}
      UZI_SEED_PASSWORD: ${UZI_SEED_PASSWORD:-}
      UZI_SEED_NAME: ${UZI_SEED_NAME:-}
      UZI_SEED_FORGE_PAT: ${UZI_SEED_FORGE_PAT:-}
      UZI_SEED_FORGE_TYPE: ${UZI_SEED_FORGE_TYPE:-}
      UZI_SEED_FORGE_BASE_URL: ${UZI_SEED_FORGE_BASE_URL:-}
      UZI_SEED_FORGE_REPOS: ${UZI_SEED_FORGE_REPOS:-}
      UZI_SEED_ANTHROPIC_TOKEN: ${UZI_SEED_ANTHROPIC_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      UZI_PUBLIC_BASE_URL: ${UZI_PUBLIC_BASE_URL:-}
      SLACK_HTTP_TIMEOUT: ${SLACK_HTTP_TIMEOUT:-15s}
      SLACK_DM_RATE_LIMIT_MAX: ${SLACK_DM_RATE_LIMIT_MAX:-6}
      SLACK_DM_RATE_LIMIT_WINDOW: ${SLACK_DM_RATE_LIMIT_WINDOW:-1m}
      SLACK_SOCKET_DEBUG: ${SLACK_SOCKET_DEBUG:-}
      UZI_SEED_SLACK_BOT_TOKEN: ${UZI_SEED_SLACK_BOT_TOKEN:-}
      UZI_SEED_SLACK_APP_TOKEN: ${UZI_SEED_SLACK_APP_TOKEN:-}
      UZI_SEED_PUBLIC_BASE_URL: ${UZI_SEED_PUBLIC_BASE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      UZI_PREREQUISITE_CLOSURE_FORGES: ${UZI_PREREQUISITE_CLOSURE_FORGES:-}
      RUN_TIMEOUT: ${RUN_TIMEOUT:-6h}
      RUN_WALL_CEILING: ${RUN_WALL_CEILING:-}
      RUN_IDLE_TIMEOUT: ${RUN_IDLE_TIMEOUT:-10m}
      RUN_CODEX_IDLE_STALL_MAX_PARKS: ${RUN_CODEX_IDLE_STALL_MAX_PARKS:-3}
      RUN_MAX_ITERATIONS: ${RUN_MAX_ITERATIONS:-5}
      PLAN_MAX_REVISIONS: ${PLAN_MAX_REVISIONS:-3}
      PLAN_CROSS_CHECK_MAX_REVISIONS: ${PLAN_CROSS_CHECK_MAX_REVISIONS-4}
      QUESTION_MAX: ${QUESTION_MAX:-5}
      QUESTION_TIMEOUT_SECONDS: ${QUESTION_TIMEOUT_SECONDS:-86400}
      RUN_MAX_REQUEUES: ${RUN_MAX_REQUEUES:-3}
      UZI_AUTOSTOP_ENABLED: ${UZI_AUTOSTOP_ENABLED:-true}
      RUN_LIMIT_MAX_WAITS: ${RUN_LIMIT_MAX_WAITS:-5}
      RUN_LIMIT_MAX_PARK: ${RUN_LIMIT_MAX_PARK:-192h}
      WORKER_HEARTBEAT_STALE: ${WORKER_HEARTBEAT_STALE:-45s}
      SWEEP_INTERVAL: ${SWEEP_INTERVAL:-15s}
      WORKER_AFFINITY_GRACE: ${WORKER_AFFINITY_GRACE:-2m}
      WORKER_STALE_REQUEUE_GRACE: ${WORKER_STALE_REQUEUE_GRACE:-10m}
      WORKER_SPREAD_GRACE: ${WORKER_SPREAD_GRACE:-9s}
      RUN_BACKGROUND_GRACE: ${RUN_BACKGROUND_GRACE:-15m}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/server", "-health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
  web:
    image: ghcr.io/vtmocanu/uzi/web:${UZI_VERSION:?set UZI_VERSION in .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
  agent:
    image: ghcr.io/vtmocanu/uzi/agent-base:${UZI_VERSION:?set UZI_VERSION in .env}
    restart: unless-stopped
    profiles: ["agent"]
    stop_grace_period: 40s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
      - DAC_OVERRIDE
    cpus: ${AGENT_CPUS:-2}
    mem_limit: ${AGENT_MEM_LIMIT:-4g}
    environment:
      UZI_API_URL: ${UZI_API_URL:-http://api:8080}
      UZI_WORKER_TOKEN_FILE: /run/secrets/worker_token
      UZI_DATA_DIR: /data
      UZI_WORKER_NAME: ${UZI_WORKER_NAME:-}
      WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-15s}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-3s}
      WORKER_PLAN_APPROVAL_TIMEOUT: ${WORKER_PLAN_APPROVAL_TIMEOUT:-24h}
      WORKER_MAX_CONCURRENT_RUNS: ${WORKER_MAX_CONCURRENT_RUNS:-1}
      WORKER_MEMORY_GUARD_ENABLED: ${WORKER_MEMORY_GUARD_ENABLED:-false}
      WORKER_MEMORY_GUARD_RESERVE_BYTES: ${WORKER_MEMORY_GUARD_RESERVE_BYTES:-}
      WORKER_MEMORY_GUARD_SAMPLE_MS: ${WORKER_MEMORY_GUARD_SAMPLE_MS:-}
      WORKER_MEMORY_GUARD_HYSTERESIS_BYTES: ${WORKER_MEMORY_GUARD_HYSTERESIS_BYTES:-}
      WORKER_MEMORY_GUARD_REARM_MS: ${WORKER_MEMORY_GUARD_REARM_MS:-}
      WORKER_MEMORY_GUARD_RESPONSE_BUDGET_MS: ${WORKER_MEMORY_GUARD_RESPONSE_BUDGET_MS:-}
      WORKER_MEMORY_GUARD_MAX_INTERVENTIONS: ${WORKER_MEMORY_GUARD_MAX_INTERVENTIONS:-}
      WORKER_CROSS_CHECK_SLOTS: ${WORKER_CROSS_CHECK_SLOTS:-1}
      WORKER_GO_BUILD_PARALLELISM: ${WORKER_GO_BUILD_PARALLELISM:-}
      WORKER_GO_MAXPROCS: ${WORKER_GO_MAXPROCS:-}
      WORKER_TRANSIENT_TRIP_MS: ${WORKER_TRANSIENT_TRIP_MS:-}
      WORKER_OUTBOX_RUN_MAX_BYTES: ${WORKER_OUTBOX_RUN_MAX_BYTES:-}
      WORKER_OUTBOX_MAX_BYTES: ${WORKER_OUTBOX_MAX_BYTES:-}
      WORKER_OUTBOX_SPILL_BUFFER_BYTES: ${WORKER_OUTBOX_SPILL_BUFFER_BYTES:-}
      WORKER_OUTBOX_RETENTION: ${WORKER_OUTBOX_RETENTION:-}
      UZI_LOG_LEVEL: ${UZI_LOG_LEVEL:-info}
    volumes:
      - agentdata:/data
      - agentnix:/nix
    secrets:
      - worker_token
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
  agentdata:
  agentnix:
secrets:
  worker_token:
    environment: UZI_WORKER_TOKEN
