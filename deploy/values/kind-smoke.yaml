# KinD chart-install smoke values (PRD #52 M8). Installs the uzi stack into an
# ephemeral KinD cluster with NO Infisical operator and NO Harbor access —
# everything is local (kind-loaded api/web images) or public (the CNPG postgres
# image + operator), so the smoke is fully credential-less. This is a TEST target,
# never a deploy target.

secrets:
  # SKIP the InfisicalSecret CRs (no operator in KinD). The smoke job pre-creates
  # `uzi-secrets` as a plain Secret with a random valid UZI_SECRET_KEY + JWT_SECRET
  # (the api refuses placeholder keys). The CNPG operator generates the -app DB
  # secret from the Cluster CR.
  mode: existing

# No Harbor pull secret: api/web are kind-loaded, postgres is public ghcr.io.
imagePullSecret:
  name: ""

api:
  image:
    # Locally built + kind-loaded: `docker build -t uzi-api:kind ./api` then
    # `kind load docker-image uzi-api:kind`.
    repository: uzi-api
    tag: kind
    pullPolicy: IfNotPresent
  # KinD has no ingress-nginx and kindnet friction with probe CIDRs; disable the
  # api NetworkPolicy for the smoke (default stays enabled for real clusters).
  networkPolicy:
    enabled: false
  config:
    API_ADDR: ":8080"
    # http origin => CookieSecure off (KinD is plain http via port-forward).
    FRONTEND_ORIGIN: http://localhost
    # Permissive for the single-node test (not a real trust boundary here).
    TRUSTED_PROXIES: "0.0.0.0/0"

web:
  image:
    repository: uzi-web
    tag: kind
    pullPolicy: IfNotPresent
  # Single web replica is enough for the smoke.
  replicaCount: 1
  ingress:
    enabled: false

# Hosted workers (PRD #58 M3). The envelope is created so the KinD run exercises
# what KinD CAN prove: the tar-based /nix seed under real PodSecurity `restricted` +
# non-root + 0555 store dirs, object rendering, and ResourceQuota/LimitRange/
# PodSecurity ADMISSION. All of that is apiserver- or kubelet-side.
#
# WHAT A GREEN KIND RUN DOES NOT PROVE — three ways KinD's defaults make it lie,
# each verified rather than assumed:
#
#  1. NO NETWORK POLICY IS ENFORCED, AT ALL. kindnet does not implement NetworkPolicy
#     by design (kind#3705, kind#842) — not the Antrea ANNP (there is no Antrea) and
#     not even the default-deny floor. The policies below are CREATED and silently
#     never enforced, so a worker here has unrestricted egress and a stub run goes
#     green even if the entire policy set is wrong. Deferred to M6, with the FQDN
#     enforcement gap; they are the same gap.
#  2. THE fsGroup PIN IS INVISIBLE. local-path-provisioner's setup script is
#     `mkdir -m 0777`, and the PV is a Local/hostPath source — so uid 10001 writes the
#     volume regardless of fsGroup, and a test would pass for a reason that does not
#     exist on dev-cluster (where an RWO ext4 volume mounts root:root 0755 and fsGroup
#     is the ONLY thing making it writable). Assert the OBSERVABLE (stat the mount for
#     gid 10001 + setgid), never writability.
#  3. THE lost+found SENTINEL TRAP IS INVISIBLE. local-path makes a plain directory,
#     so a fresh PVC here really IS empty and an emptiness check passes — while
#     dev-cluster's hypervisor CSI formats ext4 and a fresh PVC carries lost+found. That
#     is closed by a UNIT test instead (controller/internal/kube/render_test.go): it is
#     a property of the check and needs no kubelet.
#
# Minor, same family: local-path IGNORES the requested PVC size (it is a directory),
# so /nix at 4Gi is unenforced here.
workers:
  enabled: true
  namespace: uzi-workers
  # No Harbor in KinD: the agent image is kind-loaded and needs no pull secret.
  imagePullSecretName: ""
  # KinD's default local-path provisioner.
  storageClass: standard
  # Created but NOT enforced by kindnet (see 1 above). Left on so the manifests are at
  # least admitted, never as evidence they work.
  networkPolicy:
    enabled: true
  # No Antrea in KinD — the CRD does not exist, so this would be a rejected manifest.
  fqdnEgress:
    enabled: false

postgres:
  enabled: true
  cluster:
    # PUBLIC upstream CNPG postgres image (no Harbor mirror / pull secret in KinD).
    imageName: ghcr.io/cloudnative-pg/postgresql:16.4
    imagePullSecrets: []
    instances: 1
    storage:
      size: 1Gi
      # KinD's default local-path provisioner StorageClass.
      storageClass: standard
    walStorage:
      size: 1Gi
      storageClass: standard
  backups:
    enabled: false
