{{- if .Values.web.enabled }}
{{- $svc := .Values.web.nginx.apiServiceName -}}
{{- $port := .Values.web.nginx.apiPort -}}
{{- $ns := .Release.Namespace -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uzi.fullname" . }}-web-nginx
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  # k8s variant of web/nginx.conf. DIFFERENCE FROM COMPOSE: X-Forwarded-For is
  # APPENDED ($proxy_add_x_forwarded_for), not OVERWRITTEN ($remote_addr) — the
  # immediate client here is the ingress-nginx controller, and overwriting would
  # collapse every user into one per-IP auth rate-limit bucket + lose client IPs.
  # ingress-nginx is the outermost overwriting hop; the api trusts these hops via
  # TRUSTED_PROXIES. Same-origin / no-CORS is preserved (proxy to the `api` Service).
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
    {{ if .Values.web.nginx.dynamicResolution }}
        # Runtime Service resolution: re-resolve the api Service name per request so
        # a Service recreate (new ClusterIP) is picked up without a web restart.
        resolver {{ .Values.web.nginx.resolver }} valid=30s;
    {{ end }}
        # Live-run WebSocket. Dedicated exact-match so the Upgrade/Connection headers
        # stay OFF the plain REST proxy. Host forwarded as $http_host (with port) so
        # the api's same-origin Origin-vs-Host check holds. Long read timeout keeps an
        # idle-but-live socket alive (ingress-nginx also raised to 3600s).
        location = /api/ws {
            gzip off;
    {{ if .Values.web.nginx.dynamicResolution }}
            set $api_ws_upstream {{ $svc }}.{{ $ns }}.svc.cluster.local:{{ $port }};
            proxy_pass http://$api_ws_upstream$request_uri;
    {{ else }}
            proxy_pass http://{{ $svc }}:{{ $port }};
    {{ end }}
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Same-origin API reverse proxy. XFF is APPENDED (see the header comment); the
        # api reads the real client from it only for hops inside TRUSTED_PROXIES.
        location /api/ {
            gzip off;
    {{ if .Values.web.nginx.dynamicResolution }}
            set $api_upstream {{ $svc }}.{{ $ns }}.svc.cluster.local:{{ $port }};
            proxy_pass http://$api_upstream$request_uri;
    {{ else }}
            proxy_pass http://{{ $svc }}:{{ $port }};
    {{ end }}
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Input-file upload (PRD #1909): exact-match, so the larger body limit and longer
        # timeouts apply to this route only (/api/ keeps nginx's 1 MiB default). Same headers as
        # /api/ (XFF appended). client_max_body_size = the api's default per-file cap
        # (UZI_JOB_INPUT_FILE_MAX_BYTES, 25 MiB) plus multipart framing; raise both together, and
        # web.ingress.annotations' proxy-body-size in front. Request buffering stays ON (the
        # default): nginx takes the whole body from a slow client before the api sees any of it.
        # proxy_*_timeout exceed the api's request deadline (UZI_RECOVERY_REQUEST_DEADLINE, 120 s)
        # plus its 15 s response grace.
        location = /api/v1/files {
            gzip off;
            client_max_body_size 26m;
            client_body_timeout 120s;
            proxy_request_buffering on;
            proxy_send_timeout 150s;
            proxy_read_timeout 150s;
    {{ if .Values.web.nginx.dynamicResolution }}
            set $api_upstream {{ $svc }}.{{ $ns }}.svc.cluster.local:{{ $port }};
            proxy_pass http://$api_upstream$request_uri;
    {{ else }}
            proxy_pass http://{{ $svc }}:{{ $port }};
    {{ end }}
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static locations. gzip is set per location, not at server level, and every
        # /api/ location sets `gzip off;` explicitly, so nginx never introduces
        # compression on API responses (an upstream Content-Encoding passes through).
        # A location-level add_header drops EVERY inherited server-level add_header,
        # so the security headers are repeated verbatim below; the CSP must stay
        # byte-identical to the server-level line (change all copies together;
        # scripts/assert-web-nginx.sh asserts it).
        # Hashed /assets/ files are immutable for a year. try_files $uri =404 makes a
        # missing asset a 404 instead of the SPA index, and the plain add_header (no
        # `always`) means a 404 never carries the one-year policy.
        location /assets/ {
            try_files $uri =404;
            gzip on;
            gzip_comp_level 5;
            gzip_min_length 1024;
            gzip_vary on;
            gzip_proxied any;
            gzip_types application/javascript text/javascript text/css image/svg+xml application/json application/manifest+json;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
        }

        # SPA fallback: any non-file route serves index.html for client routing. The
        # index and unhashed root files (e.g. /theme-preinit.js) are no-cache.
        location / {
            try_files $uri $uri/ /index.html;
            gzip on;
            gzip_comp_level 5;
            gzip_min_length 1024;
            gzip_vary on;
            gzip_proxied any;
            gzip_types application/javascript text/javascript text/css image/svg+xml application/json application/manifest+json;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
        }
    }
{{- end }}
