{{- if and .Values.workers.enabled .Values.workers.networkPolicy.enabled }}
{{- /*
  The CNI-INDEPENDENT floor for the worker namespace (PRD #58 Decision 5b).

  Vanilla networking.k8s.io/v1, so it works on any CNI that implements
  NetworkPolicy at all. It expresses default-deny in BOTH directions plus the two
  in-cluster destinations that a name-based rule structurally cannot cover. The
  genuinely EXTERNAL destinations (forge, Anthropic, nix substituters) are named in
  worker-fqdn-egress.yaml, which needs Antrea.

  The two layers compose, and that is verified rather than hoped: an Antrea Allow is
  programmed to jump past the Kubernetes NetworkPolicy tables entirely
  (dropTable.GetNext() lands on EgressMetricTable, skipping EgressRuleTable and
  EgressDefaultTable), so traffic matching an FQDN Allow is allowed and everything
  else falls through to THIS policy's default-deny.

  ENFORCEMENT IS UNPROVEN. Antrea's CAPABILITY to express these rules was verified
  against dev-cluster (feature gate, CRDs, server-side dry-run, the admission
  webhook) and its BEHAVIOUR from the v1.13 source — but no packet has crossed. And
  kind cannot close it: kindnet implements NO NetworkPolicy at all, not even this
  default-deny floor, so on kind these objects are created and silently never
  enforced. A green kind run says nothing about this file. M6's rollout is where the
  first real hosted worker either reaches gitlab.example.com or does not.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "uzi.fullname" . }}-worker-default-deny
  namespace: {{ .Values.workers.namespace }}
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # An EMPTY podSelector: every pod in the namespace, including anything that arrives
  # here later. The floor must not depend on a label the controller remembers to set.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules at all = deny everything inbound. Nothing dials a worker: the
  # worker is outbound-only by design (it polls the api, exactly like the controller),
  # so there is no such thing as a legitimate inbound connection here. No probe
  # exception is needed either — the worker exposes no port to probe.
  ingress: []
  egress:
    # DNS. Without it every FQDN rule in the Antrea policy silently matches NOTHING:
    # Antrea learns an FQDN's IPs by SNOOPING DNS RESPONSES, so a worker that cannot
    # resolve a name never teaches the datapath which IPs that name means. Expressed
    # with selectors, not an FQDN, for the reason below.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.workers.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.workers.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The api. Also selector-based, and NOT because it is more convenient: an FQDN
    # rule CANNOT work for an in-cluster Service. Antrea's own docs say FQDN policies
    # do not work for Service DNS names created by Kubernetes (except headless ones),
    # because AntreaProxy rewrites the destination IP to a pod IP BEFORE policy
    # enforcement — so the packet the rule inspects no longer carries the address the
    # name resolved to.
    #
    # One port, selected by uzi.workerAPIPort: the TLS listener once api.tls.enabled
    # is on, and nothing else. A claim response carries the user's decrypted forge PAT
    # and Anthropic token.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "uzi.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ include "uzi.workerAPIPort" . }}
    {{- with .Values.workers.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
