{{- $extra := .Values.workers.extraCA | default dict }}
{{- if $extra.pem }}
{{- /*
  workers.extraCA.pem: the inline extra CA bundle the controller relays to hosted
  workers after the api's CA (see values.yaml), and mounted into the api pod for the
  provider Test probe (PRD #4320). Release namespace. Rendered whenever pem is set, not only
  with the controller, because the api consumes it too.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uzi.workerExtraCAConfigMap" . }}
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
data:
  ca.crt: |
    {{- $extra.pem | nindent 4 }}
{{- end }}
