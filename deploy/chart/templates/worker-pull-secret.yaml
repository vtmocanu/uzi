{{- if and .Values.workers.enabled .Values.workers.imagePullSecretName (eq .Values.secrets.mode "infisical") .Values.infisical.enabled }}
{{- /*
  The Harbor robot, materialized a SECOND time — into the hosted-worker namespace
  (PRD #58 M3).

  NOT duplication, and not something the release namespace's copy can cover: a
  ServiceAccount's imagePullSecrets can only reference a Secret in its OWN namespace,
  and the worker SA lives in workers.namespace. Without this the worker pod cannot
  pull its agent image from Harbor and sits in ImagePullBackOff — which in v1 (no
  pod-phase status in the UI, Decision 10) surfaces only as a worker that never comes
  online.

  It is a SEPARATE template rather than an `infisicalList` entry because its lifecycle
  is workers.enabled, not the release's: parked in that list it would render even with
  hosting off, creating an InfisicalSecret pointed at a namespace that does not exist.
  `infisicalList` stays what it says it is — the RELEASE namespace's secrets.

  Skipped under secrets.mode: existing (the KinD smoke has no Infisical operator, and
  no Harbor either: its agent image is kind-loaded).

  IT CAN WRITE THIS NAMESPACE — VERIFIED 2026-07-17 (M6). This used to read "M6
  ROLLOUT CHECK, not verifiable from here: the Infisical operator identity must be able
  to WRITE this namespace"; it was verifiable, so here is the answer rather than the
  errand. dev-cluster's operator SA
  (infisical-operator/dev-cluster-inf-controller-manager) holds a CLUSTER-scoped
  ClusterRole granting create/delete/get/list/update/watch on secrets in ALL namespaces
  — so `uzi-workers` needs no per-namespace grant, and the reasoning above was right
  that this was never a project-membership question (it already reads example-project for
  the release-namespace copy). Checked with SubjectAccessReviews (`kubectl auth can-i
  --as`), which are non-mutating. Note `patch` is the one verb it lacks; the operator's
  creationPolicy: Owner does not use it.
*/ -}}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "uzi.fullname" . }}-harbor-robot-workers
  annotations:
    # Behind the namespace (-20), ahead of anything that pulls an image.
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.infisical.authSecretName }}
        secretNamespace: {{ .Values.infisical.authSecretNamespace }}
      secretsScope:
        projectSlug: {{ .Values.workers.pullSecretSource.projectSlug }}
        envSlug: {{ .Values.workers.pullSecretSource.envSlug }}
        secretsPath: {{ .Values.workers.pullSecretSource.secretsPath | quote }}
        recursive: false
  managedSecretReference:
    secretName: {{ .Values.workers.imagePullSecretName }}
    secretNamespace: {{ .Values.workers.namespace }}
    creationPolicy: Owner
    secretType: kubernetes.io/dockerconfigjson
{{- end }}
