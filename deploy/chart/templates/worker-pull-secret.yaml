{{- if and .Values.workers.enabled .Values.workers.imagePullSecretName (eq .Values.secrets.mode "infisical") .Values.infisical.enabled }}
{{- /*
  The Harbor robot, materialized a SECOND time — into the hosted-worker namespace
  (PRD #58 M3).

  NOT duplication, and not something the release namespace's copy can cover: a
  ServiceAccount's imagePullSecrets can only reference a Secret in its OWN namespace,
  and the worker SA lives in workers.namespace. Without this the worker pod cannot
  pull its agent image from Harbor and sits in ImagePullBackOff — which in v1 (no
  pod-phase status in the UI, Decision 10) surfaces only as a worker that never comes
  online.

  It is a SEPARATE template rather than an `infisicalList` entry because its lifecycle
  is workers.enabled, not the release's: parked in that list it would render even with
  hosting off, creating an InfisicalSecret pointed at a namespace that does not exist.
  `infisicalList` stays what it says it is — the RELEASE namespace's secrets.

  Skipped under secrets.mode: existing (the KinD smoke has no Infisical operator, and
  no Harbor either: its agent image is kind-loaded).

  IT CAN WRITE THIS NAMESPACE — VERIFIED 2026-07-17 (M6). This used to read "M6
  ROLLOUT CHECK, not verifiable from here: the Infisical operator identity must be able
  to WRITE this namespace"; it was verifiable, so here is the answer rather than the
  errand. dev-cluster's operator SA
  (infisical-operator/dev-cluster-inf-controller-manager) holds a CLUSTER-scoped
  ClusterRole granting create/delete/get/list/update/watch on secrets in ALL namespaces
  — so `uzi-workers` needs no per-namespace grant, and the reasoning above was right
  that this was never a project-membership question (it already reads example-project for
  the release-namespace copy). Checked with SubjectAccessReviews (`kubectl auth can-i
  --as`), which are non-mutating. Note `patch` is the one verb it lacks; the operator's
  creationPolicy: Owner does not use it.

  THE CR LIVES IN workers.namespace, NOT THE RELEASE NAMESPACE, and that is load-bearing
  — found by the first real rollout (2026-07-17, chart 0.3.0), which failed:

    Failed to sync secrets. Error: failed to create managed secret
    [err=cross-namespace owner references are disallowed,
     owner's namespace uzi, obj's namespace uzi-workers]

  `creationPolicy: Owner` makes the operator stamp an ownerReference on the Secret it
  creates, pointing back at this CR — and Kubernetes DISALLOWS cross-namespace
  ownerReferences (a namespaced owner cannot own an object in another namespace; the GC
  would treat it as already-deleted). So the CR must sit in the SAME namespace as the
  Secret it manages. Every other InfisicalSecret in this chart satisfies that by
  accident, writing to $.Release.Namespace from the release namespace; this is the only
  one that writes elsewhere, so it is the only one that has to say so.

  Note what this is NOT: it was never an RBAC or project-membership problem. The
  operator's own auth was fine throughout (LoadedInfisicalToken: True) and the scope
  here is byte-identical to the release-namespace copy's. Neither a render, a
  `--dry-run=server` apply, nor the KinD smoke (no operator) can catch it — the CR is
  valid in either namespace, and only the operator's reconcile rejects it.

  Two consequences worth keeping: the namespace must exist first (sync-wave -20 vs -10
  below, already correct), and this CR is now inside the deliberately-empty worker
  namespace, which is fine — an InfisicalSecret is a pointer, not a credential, and the
  Secret it materializes is the pull secret the workers cannot read anyway (the kubelet
  consumes it).
*/ -}}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "uzi.fullname" . }}-harbor-robot-workers
  namespace: {{ .Values.workers.namespace }}
  annotations:
    # Behind the namespace (-20), ahead of anything that pulls an image.
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.infisical.authSecretName }}
        secretNamespace: {{ .Values.infisical.authSecretNamespace }}
      secretsScope:
        projectSlug: {{ .Values.workers.pullSecretSource.projectSlug }}
        envSlug: {{ .Values.workers.pullSecretSource.envSlug }}
        secretsPath: {{ .Values.workers.pullSecretSource.secretsPath | quote }}
        recursive: false
  managedSecretReference:
    secretName: {{ .Values.workers.imagePullSecretName }}
    secretNamespace: {{ .Values.workers.namespace }}
    creationPolicy: Owner
    secretType: kubernetes.io/dockerconfigjson
{{- if .Values.workers.docker.enabled }}
{{- /*
  The SAME Harbor robot, materialized a THIRD time — into the docker-tier namespace
  (PRD #83 M3). A docker worker pulls the same agent image from Harbor, and its SA's
  imagePullSecrets can only reference a Secret in ITS namespace (workers.docker.
  namespace), so this namespace needs its own copy exactly as the restricted worker
  namespace does. Same creationPolicy: Owner, so the CR must live in the SAME
  namespace as the Secret it manages (cross-namespace ownerReferences are disallowed)
  — hence a distinct CR rather than a second managedSecretReference.
*/}}
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "uzi.fullname" . }}-harbor-robot-workers-docker
  namespace: {{ .Values.workers.docker.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-docker
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      credentialsRef:
        secretName: {{ .Values.infisical.authSecretName }}
        secretNamespace: {{ .Values.infisical.authSecretNamespace }}
      secretsScope:
        projectSlug: {{ .Values.workers.pullSecretSource.projectSlug }}
        envSlug: {{ .Values.workers.pullSecretSource.envSlug }}
        secretsPath: {{ .Values.workers.pullSecretSource.secretsPath | quote }}
        recursive: false
  managedSecretReference:
    secretName: {{ .Values.workers.imagePullSecretName }}
    secretNamespace: {{ .Values.workers.docker.namespace }}
    creationPolicy: Owner
    secretType: kubernetes.io/dockerconfigjson
{{- end }}
{{- end }}
