{{- include "uzi.validateDatabaseMode" . }}
{{- include "uzi.validateCommandSandbox" . }}
{{- include "uzi.validateSecretMountPath" . }}
{{- if .Values.api.enabled }}
{{- $ephemeralDefaultSize := .Values.workers.ephemeralDefaultSize }}
{{- $ephemeralSizeSet := not (or (kindIs "invalid" $ephemeralDefaultSize) (eq (toString $ephemeralDefaultSize) "")) }}
{{- $ephemeralLease := .Values.workers.ephemeralLease }}
{{- $ephemeralLeaseSet := not (or (kindIs "invalid" $ephemeralLease) (eq (toString $ephemeralLease) "")) }}
{{- if and $ephemeralSizeSet (not (has $ephemeralDefaultSize (list "s" "m" "l" "l-highmem"))) }}
{{- fail "workers.ephemeralDefaultSize must be one of s, m, l, l-highmem" }}
{{- end }}
{{- if hasKey (.Values.api.secretEnv | default dict) "UZI_EPHEMERAL_DEFAULT_SIZE" }}
{{- fail "Set UZI_EPHEMERAL_DEFAULT_SIZE through workers.ephemeralDefaultSize, not api.secretEnv" }}
{{- end }}
{{- if hasKey (.Values.api.secretEnv | default dict) "UZI_EPHEMERAL_LEASE" }}
{{- fail "Set UZI_EPHEMERAL_LEASE through workers.ephemeralLease, not api.secretEnv (one source: an env value locks the admin ephemeral_lease setting)" }}
{{- end }}
{{- if hasKey (.Values.api.config | default dict) "UZI_EPHEMERAL_LEASE" }}
{{- fail "Set UZI_EPHEMERAL_LEASE through workers.ephemeralLease, not api.config (an env value locks the admin setting; keep one source)" }}
{{- end }}
{{- if hasKey (.Values.api.secretEnv | default dict) "UZI_ADMIN_RUN_DEBUG" }}
{{- fail "Set UZI_ADMIN_RUN_DEBUG through api.adminRunDebug.enabled, not api.secretEnv" }}
{{- end }}
{{- if hasKey (.Values.api.config | default dict) "UZI_EPHEMERAL_DEFAULT_SIZE" }}
{{- fail "Set UZI_EPHEMERAL_DEFAULT_SIZE through workers.ephemeralDefaultSize, not api.config (one source: an env value locks the admin ephemeral_default_size setting)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uzi.fullname" . }}-api
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    {{- with include "uzi.workloadLabels" . }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- with include "uzi.workloadAnnotations" . }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    # HARD SINGLETON: Recreate (never RollingUpdate) so the surge never runs a
    # second api pod. Two would double-poll the forge, double-sweep runs,
    # double-handle Slack Socket Mode events, and race the goose boot migration
    # (no advisory lock). See values.yaml api.replicaCount.
    type: Recreate
  selector:
    matchLabels:
      {{- include "uzi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Roll the pod when the non-secret config (ConfigMap) changes. Secret
        # changes are synced by the Infisical operator (restart the pod to pick up).
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        {{- if include "uzi.workerExtraCAConfigMap" . }}
        {{- $extraCA := .Values.workers.extraCA | default dict }}
        # The api reads UZI_PROVIDER_EXTRA_CA_FILE once at boot: roll it when the inline bundle, or
        # the referenced ConfigMap name or key, changes. An in-place edit of an existing ConfigMap
        # needs a restart, as for the controller.
        checksum/provider-extra-ca: {{ if $extraCA.pem }}{{ $extraCA.pem | sha256sum }}{{ else }}{{ printf "%s/%s" ($extraCA.configMap | default dict).name (($extraCA.configMap | default dict).key | default "ca.crt") | sha256sum }}{{ end }}
        {{- end }}
      labels:
        {{- include "uzi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.appPriorityClass.enabled }}
      priorityClassName: {{ .Values.appPriorityClass.name | default (printf "%s-app" .Release.Name) }}
      {{- end }}
      # The api never calls the k8s API; drop the auto-mounted SA token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecret.name }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api_podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.api_containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.api.tls.enabled }}
            # The worker/controller hop (PRD #58 Decision 4). A SECOND port, not a
            # replacement: the plain one above still serves web's nginx and the
            # kubelet probes, and keeping them apart is what lets the NetworkPolicy
            # admit the worker namespace to this one and nothing else.
            - name: https
              containerPort: {{ .Values.api.tls.port }}
              protocol: TCP
            {{- end }}
          {{- if include "uzi.apiConfigMapEnabled" . }}
          envFrom:
            - configMapRef:
                name: {{ include "uzi.fullname" . }}-api-config
          {{- end }}
          env:
            {{- if .Values.api.tls.enabled }}
            # PATHS to the mounted pair, never the material: cert-manager renews the
            # cert in place and the api re-reads the files, so nothing here goes
            # stale and no rollout is needed to pick up a renewal.
            - name: API_TLS_ADDR
              value: ":{{ .Values.api.tls.port }}"
            - name: API_TLS_CERT
              value: {{ printf "%s/tls.crt" (include "uzi.apiTLSDir" .) | quote }}
            - name: API_TLS_KEY
              value: {{ printf "%s/tls.key" (include "uzi.apiTLSDir" .) | quote }}
            {{- end }}
            # DATABASE_URL DSN, from the Secret the selected database.mode produces
            # (simple: the chart's <fullname>-postgres/`uri`; cnpg: the CNPG-generated
            # <cluster>-app/`uri`; external: the user-supplied api.database.*). Required
            # at boot (config.Load errors on empty), so NOT optional: the pod waits for
            # the secret (under cnpg, CNPG creates it at sync-wave -5).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "uzi.database.secretName" . | quote }}
                  key: {{ include "uzi.database.secretKey" . | quote }}
            {{- range $envName, $secretKey := .Values.api.secretEnv }}
            # {{ $envName }} <- Infisical key "{{ $secretKey }}"
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.infisical.app.managedSecretName }}
                  key: {{ $secretKey | quote }}
                  optional: true
            {{- end }}
            # Issue #4212: both ephemeral knobs are admin settings (Admin > Workers) and are
            # rendered ONLY when the chart value is set; an env value pins the setting and
            # locks the admin field. Unset (null or "") renders no entry.
            {{- if $ephemeralSizeSet }}
            # Issue #2412: chart-owned size; api.config/api.secretEnv duplicates fail above.
            - name: UZI_EPHEMERAL_DEFAULT_SIZE
              value: {{ $ephemeralDefaultSize | quote }}
            {{- end }}
            {{- if $ephemeralLeaseSet }}
            # PRD #2006: idle lease for an ephemeral worker after its run. Set values are
            # quoted as strings so an explicit 0 (lease disabled) survives and is never read
            # as unset. The api validates it (max 2h) and refuses to boot on a bad value.
            - name: UZI_EPHEMERAL_LEASE
              value: {{ toString $ephemeralLease | quote }}
            {{- end }}
            - name: WORKER_DOCKER_ENABLED
              value: {{ ternary "true" "false" (and (not (empty (include "uzi.apiHostingEnabled" .))) .Values.workers.docker.enabled) | quote }}
            {{- if include "uzi.apiHostingEnabled" . }}
            # The controller's bearer credential, as a HASH (PRD #58 Decision 2). The
            # api only ever compares sha256(presented) against this, so the hash is not
            # itself a credential and env is the right shape for it — unlike the
            # controller's plaintext half, which is file-mounted precisely because env
            # is readable through /proc/<pid>/environ.
            #
            # Rendered ONLY with hosting on, and that is not tidiness: the api REFUSES
            # TO BOOT if this is set while WORKER_HOSTING_ENABLED is false ("the api
            # would ignore the credential and every controller poll would 404"). So it
            # cannot live in the static api.secretEnv map — the moment an operator put
            # the key in Infisical, every hosting-off stack would CrashLoop.
            #
            # optional: true, so a missing key surfaces as the api's own boot error
            # naming the variable (hosting on REQUIRES it) rather than a pod wedged in
            # ContainerCreating. Same convention as JWT_SECRET/UZI_SECRET_KEY above.
            - name: WORKER_HOSTING_CONTROLLER_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.app.managedSecretName }}
                  key: {{ .Values.workers.controller.tokenHashSecretKey | quote }}
                  optional: true
            {{- end }}
            {{- if include "uzi.isolatedLaneEnabled" . }}
            {{- $fetcherToken := fromJson (include "uzi.fetcherTokenSecret" .) }}
            # uzi-fetcher's service token, as a HASH (PRD #1906 M3/M6). Setting it is what
            # mounts the fetcher control routes; unset, they do not exist. The api refuses
            # to boot if it equals the controller's hash. Rendered only with the lane on.
            # optional: true, like the controller's hash above: a missing key (source:
            # existing, not yet populated) leaves the routes unmounted, so the lane fails
            # closed (every fetch is refused) while the rest of the api keeps serving.
            - name: UZI_FETCHER_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: {{ $fetcherToken.name }}
                  key: {{ $fetcherToken.hashKey | quote }}
                  optional: true
            {{- end }}
            {{- if .Values.workers.enabled }}
            # The api compares hosted workers' reported version against this pinned tag
            # for the upgrade badge (PRD #422), so an intentionally-pinned worker is not
            # flagged `outdated` when appVersion has moved ahead. workers.image.tag is a
            # concrete pinned value after M1. Emit it only when hosting is enabled:
            # a non-empty pin also tells health checks to expect controller reports.
            - name: HOSTED_WORKER_VERSION
              value: {{ .Values.workers.image.tag | quote }}
            # PRD #4213: the enabled worker tiers, their LimitRange ceilings and quotas as
            # integers (cpu millicores, memory MiB, PVC GiB), so the api can validate admin
            # hosted-worker sizes. See uzi.workerSizeEnv for the contract.
            {{- with include "uzi.workerSizeEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
            # PRD #837 M4 disk-pressure threshold. The api derives a hosted worker's
            # `disk_pressure` boolean by comparing each reported volume's used/total
            # against this fraction in (0,1] (default 0.90); the controller then
            # drains-then-recycles a pressured worker's PVCs. A soft-parsed tuning knob:
            # config.go keeps the 0.90 default on a bad/empty value, so `| default` keeps
            # this rendering even when an existing values file omits the key.
            - name: UZI_DISK_PRESSURE_THRESHOLD
              value: {{ .Values.api.diskPressureThreshold | default 0.90 | quote }}
            {{- if include "uzi.workerExtraCAConfigMap" . }}
            # workers.extraCA is ALSO trusted by the provider Test probe (PRD #4320 section 8), and
            # by that client only: the api's other outbound calls keep the system roots.
            - name: UZI_PROVIDER_EXTRA_CA_FILE
              value: {{ printf "%s/ca.crt" (include "uzi.apiProviderExtraCADir" .) | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable /tmp for the read-only-root-fs container (TLS/temp scratch).
            - name: tmp
              mountPath: /tmp
            {{- if .Values.api.tls.enabled }}
            - name: api-tls
              mountPath: {{ include "uzi.apiTLSDir" . }}
              readOnly: true
            {{- end }}
            {{- if include "uzi.workerExtraCAConfigMap" . }}
            - name: provider-extra-ca
              mountPath: {{ include "uzi.apiProviderExtraCADir" . }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.api.tls.enabled }}
        # NOT marked optional: an api told to serve TLS refuses to boot without the
        # pair, so waiting in ContainerCreating for cert-manager to issue is the
        # honest failure mode. It resolves itself within seconds on a first deploy.
        - name: api-tls
          secret:
            secretName: {{ include "uzi.apiTLSSecretName" . }}
            defaultMode: 0400
        {{- end }}
        {{- with include "uzi.workerExtraCAConfigMap" . }}
        # A CA bundle is public material, so a ConfigMap, projected by key. The same bundle the
        # controller relays to hosted workers.
        - name: provider-extra-ca
          configMap:
            name: {{ . }}
            items:
              {{- $extra := $.Values.workers.extraCA | default dict }}
              - key: {{ if $extra.pem }}ca.crt{{ else }}{{ ($extra.configMap | default dict).key | default "ca.crt" }}{{ end }}
                path: ca.crt
        {{- end }}
{{- end }}
