{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  # LOAD-BEARING name (default "api"): the web nginx proxies /api/* to this exact
  # name in the release namespace (same-origin, no CORS). See uzi.apiServiceName.
  name: {{ include "uzi.apiServiceName" . }}
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "uzi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.api.tls.enabled }}
    # The hosted workers and the controller dial this port (PRD #58 Decision 4).
    # Same Service, because it is the same api: the name on its certificate is this
    # Service's, and a second Service would need a second certificate for nothing.
    - name: https
      port: {{ .Values.api.tls.port }}
      targetPort: https
      protocol: TCP
    {{- end }}
{{- end }}
