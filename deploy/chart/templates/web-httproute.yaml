{{- if and .Values.web.enabled .Values.web.httpRoute.enabled }}
{{- if .Values.web.ingress.enabled }}
{{- fail "web.httpRoute.enabled and web.ingress.enabled are both true. Expose the web Service one way: set web.ingress.enabled: false when using the Gateway API HTTPRoute." }}
{{- end }}
{{- if not .Values.web.httpRoute.parentRefs }}
{{- fail "web.httpRoute.enabled is true but web.httpRoute.parentRefs is empty. An HTTPRoute attached to no Gateway serves nothing; name the Gateway, e.g. [{name: shared, namespace: gateway-system}]." }}
{{- end }}
{{- with .Values.web.httpRoute.timeouts }}
{{- include "uzi.httpRouteTimeouts" (dict "path" "web.httpRoute.timeouts" "t" .) }}
{{- end }}
{{- with .Values.web.httpRoute.rootTimeouts }}
{{- include "uzi.httpRouteTimeouts" (dict "path" "web.httpRoute.rootTimeouts" "t" .) }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "uzi.fullname" . }}-web
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.web.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.web.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "uzi.fullname" . }}-web
          port: {{ .Values.web.service.port }}
      {{- with .Values.web.httpRoute.rootTimeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.web.httpRoute.timeouts }}
    # Input-file upload (POST /api/v1/files): the Exact match outranks the PathPrefix rule
    # above, so only this route gets the longer gateway budget (see web.httpRoute.timeouts).
    - matches:
        - path:
            type: Exact
            value: /api/v1/files
      backendRefs:
        - name: {{ include "uzi.fullname" $ }}-web
          port: {{ $.Values.web.service.port }}
      timeouts:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
