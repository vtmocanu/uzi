{{- if and .Values.web.enabled .Values.web.httpRoute.enabled }}
{{- if .Values.web.ingress.enabled }}
{{- fail "web.httpRoute.enabled and web.ingress.enabled are both true. Expose the web Service one way: set web.ingress.enabled: false when using the Gateway API HTTPRoute." }}
{{- end }}
{{- if not .Values.web.httpRoute.parentRefs }}
{{- fail "web.httpRoute.enabled is true but web.httpRoute.parentRefs is empty. An HTTPRoute attached to no Gateway serves nothing; name the Gateway, e.g. [{name: shared, namespace: gateway-system}]." }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "uzi.fullname" . }}-web
  labels:
    {{- include "uzi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.web.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.web.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "uzi.fullname" . }}-web
          port: {{ .Values.web.service.port }}
{{- end }}
