{{- if .Values.workers.enabled }}
{{- /*
  THIS TEMPLATE RENDERS NOTHING, ON PURPOSE. It exists to evaluate the hosted-worker
  configuration invariants unconditionally. Deleting it deletes a security control,
  and `helm template` will not miss it — nothing downstream references it, which is
  exactly the property that makes it worth naming and commenting this loudly.

  WHY IT EXISTS (PRD #58 M6, from the M3 delta review). The plaintext guard lives in
  `uzi.workerAPIPort`, which fails when hosted workers would be admitted to the api's
  PLAINTEXT :8080. That guard is correct, and every path that REACHES it fires. The
  problem was reachability: the helper was only ever evaluated by templates that have
  other jobs and their own toggles —

    * worker-networkpolicy.yaml   (workers.networkPolicy.enabled)
    * api-networkpolicy.yaml      (api.networkPolicy.enabled)
    * controller-deployment.yaml  (workers.controller.enabled, via uzi.apiInClusterURL)

  — so turning all of those off meant the guard was never reached and a
  workers-on/TLS-off stack rendered clean. Measured, not theorised: at b3944d1,
  `workers.enabled=true` with both NetworkPolicies off AND the controller off rendered
  with no error.

  The invariant was therefore attached to whichever template happened to render,
  rather than to the CONFIGURATION. That is the "true by bookkeeping rather than by
  construction" shape this PRD has now rejected four times (narrowing TRUSTED_PROXIES,
  the CIDR-vs-FQDN allowlist, prose in values.yaml, the compose XFF default). This
  file is the fix: it is gated on `workers.enabled` ALONE, so there is no combination
  of sub-toggles that turns hosted workers on and the invariant off.

  IT IS AN ADDITIONAL CALL SITE, NOT A REPLACEMENT. `uzi.workerAPIPort` keeps its
  `fail` and stays the single definition of the rule — duplicating the condition here
  would create exactly the drift this is meant to prevent. The `$_ :=` assignment
  discards the returned port; the point is the evaluation, not the value.

  WHY NOT worker-namespace.yaml, the other always-rendered template: it has its own
  job, and a chart that later grows the ordinary "bring your own namespace" toggle
  (workers.createNamespace: false) would silently re-open the seam in precisely the
  way described above. A file that does nothing else cannot acquire a reason to be
  switched off.

  NOTE the seam was never a live hole, and this is not a fix for an exposure: with
  both NetworkPolicies off there is no api ingress policy at all, so EVERY pod in the
  cluster can already reach api:8080 — a strictly broader and separately documented
  "you disabled the load-bearing control" posture. No shipped values file has both
  off. This closes the seam because an invariant should hold because of what it is.
*/ -}}
{{- $_ := include "uzi.workerAPIPort" . -}}
{{- /*
  DOCKER TIER FAIL-GUARD (PRD #83 M3, auditor LOW). The docker tier is a PRIVILEGED
  namespace; its worker-docker-networkpolicy.yaml is what fences it off from in-cluster
  lateral movement, and that policy is DEFAULT-OFF (it needs the cluster's real CIDRs,
  which the chart cannot guess). So a stack that turns docker workers on but forgets the
  NetworkPolicy would run privileged DinD workers with NO in-cluster egress fence — the
  exact "on by accident, unfenced" posture the auditor flagged.

  This refuses to render that combination. It lives HERE, in the always-evaluated
  invariants template (gated on workers.enabled, which every real docker deploy has),
  for the same reason the plaintext guard above does: an invariant must hold because of
  the CONFIGURATION, not because some sub-toggled template happened to render.

  The escape hatch is EXPLICIT and VISIBLE: acknowledgeUnfenced=true opts out in the
  values file that chose it (a throwaway cluster with no CNI NetworkPolicy support, say
  kind), rather than an unfenced tier being an inherited default. dev-cluster sets
  networkPolicy.enabled=true with real CIDRs, so it never trips this.
*/ -}}
{{- if and .Values.workers.docker.enabled (not .Values.workers.docker.networkPolicy.enabled) (not .Values.workers.docker.networkPolicy.acknowledgeUnfenced) }}
{{- fail "workers.docker.enabled requires workers.docker.networkPolicy.enabled (with real cluster CIDRs in workers.docker.networkPolicy.{podCIDR,serviceCIDR,linkLocalCIDR}) — the docker tier is privileged and must be fenced from in-cluster lateral movement. To deliberately run it UNFENCED (e.g. a throwaway cluster with no NetworkPolicy support), set workers.docker.networkPolicy.acknowledgeUnfenced=true." }}
{{- end }}
{{- /*
  DinD POSTURE FAIL-GUARDS (PRD #89 M2). Two invariants that must hold BY CONSTRUCTION,
  in the always-evaluated template, for the same reason as the guards above.

  (1) NODE-ROOT ACKNOWLEDGEMENT (auditor MUST; OQ-B resolved YES). rootless:false renders
      a non-rootless privileged DinD daemon — dockerd as REAL ROOT — whose residual is
      NODE ROOT reachable by untrusted repo content (the api pod's UZI_SECRET_KEY decrypts
      every user's forge PAT + Anthropic token). Default-off + a decision-log line is
      insufficient for a residual this reachable, so rootless:false is refused unless
      acknowledgeNonRootlessNodeRoot=true — a loud, visible operator choice, mirroring
      networkPolicy.acknowledgeUnfenced.

  (2) IMAGE/POSTURE COHERENCE (OQ-A). The chart selects the DinD image by posture
      (uzi.workerDinDImage), but workers.docker.image can override it — and a rootless
      (-dind-rootless) image under rootless:false (or a plain -dind image under
      rootless:true) is a silent posture mismatch that would crash-loop or, worse, run
      the wrong daemon. Reject the mismatched pair here, checking the SELECTED image so
      the override is covered too.
*/ -}}
{{- if .Values.workers.docker.enabled }}
{{- $rootless := .Values.workers.docker.rootless }}
{{- if and (not $rootless) (not .Values.workers.docker.acknowledgeNonRootlessNodeRoot) }}
{{- fail "workers.docker.rootless=false renders a NON-ROOTLESS privileged DinD daemon (dockerd as real root on the node): a prompt-injectable agent reaching it can obtain NODE ROOT and read every co-scheduled pod's secrets, including the api's UZI_SECRET_KEY (which decrypts all users' forge PATs + Anthropic tokens). This is the owner-accepted residual on nodes without unprivileged userns (dev-cluster/Linux), but it must be an explicit choice: set workers.docker.acknowledgeNonRootlessNodeRoot=true to accept it, or keep workers.docker.rootless=true (the default, safe posture)." }}
{{- end }}
{{- $img := include "uzi.workerDinDImage" . }}
{{- $imgIsRootless := contains "-dind-rootless" $img }}
{{- if and $rootless (not $imgIsRootless) }}
{{- fail (printf "workers.docker.rootless=true but the selected DinD image %q is not a rootless (-dind-rootless) image — running a non-rootless image under the rootless posture is a silent mismatch. Use a -dind-rootless image (or unset workers.docker.image to take the pinned rootlessImage), or set workers.docker.rootless=false with acknowledgeNonRootlessNodeRoot=true." $img) }}
{{- end }}
{{- if and (not $rootless) $imgIsRootless }}
{{- fail (printf "workers.docker.rootless=false but the selected DinD image %q is a rootless (-dind-rootless) image — a rootless image cannot run under the non-rootless posture (it crash-loops needing unprivileged userns, the exact node prerequisite rootless:false exists to avoid). Use a non-rootless -dind image (or unset workers.docker.image to take the pinned nonRootlessImage)." $img) }}
{{- end }}
{{- end }}
{{- /*
  PVC-SIZE vs LimitRange `max` FAIL-GUARD (issue #224, audit A12.1).

  A per-worker PVC size larger than its tier's limitRange.maxPVCStorage is admissible
  NOWHERE and detectable NOWHERE, and the failure is the exact shape #224 exists to fix.
  Traced with workers.docker.dindDataSize: 40Gi against maxPVCStorage: 20Gi — `helm
  template` renders clean, the controller boots clean (its own validation checks only
  that the string PARSES, and it cannot know the chart's max), RenderPVCs emits the
  claim, limitranger rejects it, the materializer returns before the Deployment is
  created, and the reconcile loop logs into a void nothing reads. Nothing is reported to
  the api. The worker never appears, forever, retrying every tick. That is
  preset.go's worker-that-provisions-and-never-appears, and this converts it into a
  `helm install` error naming both values.

  IT IS WRITTEN AGAINST THE `max`, NOT AGAINST ONE CLAIMANT, so a future PVC gains
  coverage by being added to the list rather than by someone remembering this file
  exists. The default sits EXACTLY on the ceiling today (dindDataSize 20Gi ==
  maxPVCStorage 20Gi), which is why `gt` and not `ge`: equal is the shipped, correct
  configuration.

  🔴 THIS GUARD IS DOCKER-TIER ONLY, WHICH IS CORRECT AND READS BROADER THAN IT IS
  (audit A18.4). The restricted tier has no chart-supplied PVC size — its two claims are
  sized by Go constants — so there is nothing here for this loop to check and the
  `workers.docker.enabled` condition is right. The consequence a reader of THIS FILE
  ALONE would miss: `workers.limitRange.maxPVCStorage` is checked by nothing in the
  chart at all.

  🔴 WHAT THIS CANNOT SEE, stated because a guard's blind spot is the thing that gets
  assumed away: the OTHER two claimants are compiled into the controller, not supplied
  by the chart. `nixSize` (20Gi, also exactly on the ceiling, on BOTH tiers) and each
  preset's DataSize (`l` = 20Gi, likewise) are Go constants, and a chart cannot read
  them. Duplicating them into values.yaml was rejected deliberately — it would make the
  chart a fourth place preset quantities appear and the only one with no golden gating
  it, which is the ungated-skew class preset.go's own header exists to prevent. They are
  guarded on the Go side instead, by TestPresetPVCSizesFitTheChartsLimitRangeMax, which
  READS both tiers' maxPVCStorage out of values.yaml.

  AND THE RESIDUAL THAT NEITHER HALF CLOSES, since an earlier version of this comment
  claimed a safety property it did not have: the Go test reads values.yaml FROM DISK, so
  it gates an edit to the shipped defaults and CANNOT see a cluster lowering
  maxPVCStorage through `--set` or its own values file. The chart cannot check that
  either, because nixSize never reaches it. So an operator-lowered RESTRICTED-tier
  ceiling is ungated on both sides — a real residual, not a covered case. The docker
  tier's is covered here, at render time, overrides included.
*/ -}}
{{- /*
  NO `ephemeral-storage` IN ANY LimitRange `default` OR `defaultRequest`, EITHER TIER
  (issue #224, A3.2's second half; found unenforced by the tester as A22.3).

  render.go's ephemeralRequest header explains at length why no CONTAINER may declare
  `limits.ephemeral-storage`: kubelet's podEphemeralStorageLimitEviction fires as soon
  as ANY container has one, and compares the SUM of declared limits against pod usage
  that INCLUDES the emptyDirs — so a single limit creates a deterministic eviction that
  fires with no node pressure at all, which is the failure this whole issue exists to
  reduce. A unit test pins that over the RENDERED pod.

  🔴 A LimitRange DEFEATS THAT TEST WITHOUT CONTRADICTING IT, WHICH IS WHY IT NEEDS A
  CHART GUARD RATHER THAN A BETTER ASSERTION. The injection happens at ADMISSION, after
  the controller has rendered and after every test has run: the object we render carries
  no limit, the object the cluster admits does. Measured with a before/after/restore on
  an otherwise cleanly-admitting pod — three lines in a values file moved the worker
  container from `{cpu, memory}` to `{cpu, ephemeral-storage, memory}` limits, and
  `task gate:controller` stayed green throughout. No test above this layer can see it,
  so this is the instrument's floor, not a gap in the assertions.

  `defaultRequest` is guarded too, and not merely for symmetry: it would inject a
  REQUEST into every container that declares none — the dind sidecar and both init
  containers — which silently breaks the "whole pod budget on the `worker` container
  alone" invariant that makes quota, the scheduler and the eviction ranker agree on one
  number.

  Same shape as A3.6's rule for `max`, and for the same reason: an ephemeral `max`
  needs a `default` beside it, and that `default` hands the trap above to EVERY pod in
  the namespace. Neither tier declares any of these four keys; this refuses to render
  if one appears.
*/ -}}
{{- range $path, $block := dict
  "workers.limitRange.default"               .Values.workers.limitRange.default
  "workers.limitRange.defaultRequest"        .Values.workers.limitRange.defaultRequest
  "workers.docker.limitRange.default"        .Values.workers.docker.limitRange.default
  "workers.docker.limitRange.defaultRequest" .Values.workers.docker.limitRange.defaultRequest }}
{{- if $block }}
{{- if hasKey $block "ephemeral-storage" }}
{{- fail (printf "%s sets ephemeral-storage, which must never be declared in a LimitRange. It is injected at ADMISSION, so the controller renders a pod with no ephemeral limit and the cluster admits one WITH it — invisible to every unit test. A `default` arms kubelet's pod-level ephemeral eviction, which compares the SUM of declared limits against pod usage INCLUDING the emptyDirs and therefore evicts with no node pressure at all (the exact failure issue #224 exists to reduce, made deterministic). A `defaultRequest` injects a request into the dind sidecar and the init containers, breaking the invariant that the whole pod budget sits on the `worker` container alone. Remove the key: the controller declares the worker's requests.ephemeral-storage itself, per tier, and deliberately declares no limit anywhere." $path) }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.workers.docker.enabled .Values.workers.docker.limitRange.enabled }}
{{- $max := .Values.workers.docker.limitRange.maxPVCStorage }}
{{- $maxBytes := float64 (include "uzi.quantityBytes" $max) }}
{{- /*
  THE UNSET PATH IS CHECKED TOO, and skipping it was a real hole (audit A18.2).
  An empty or absent dindDataSize does NOT mean "no claim" — it means the controller
  falls back to its OWN compiled-in default and creates a 20Gi PVC anyway. Guarding
  only the set value left that claim unchecked, so an empty string plus a lowered max
  rendered perfectly clean and produced exactly the failure this guard exists to stop.
  Measured: dindDataSize "" + maxPVCStorage 10Gi rendered with no env var at all.

  The literal below MIRRORS dindDataDefaultSize in controller/internal/kube/render.go
  and the two must move together. It is a genuine cross-toolchain duplicate — Helm
  cannot read a Go constant — so it is tied the same way every other one here is: that
  constant's own comment names this file, and TestDinDDataDefaultFitsTheChartsLimitRangeMax
  (controller/internal/kube) fails if the controller's default outgrows this max. That
  test is the mechanical half; this literal is what makes the CHART side honest about
  what will actually be claimed.
*/ -}}
{{- $dindSize := .Values.workers.docker.dindDataSize }}
{{- $dindKey := "workers.docker.dindDataSize" }}
{{- if not $dindSize }}
{{- $dindSize = "20Gi" }}
{{- $dindKey = "the controller's built-in dind data-root default (workers.docker.dindDataSize is unset, so the controller supplies 20Gi itself)" }}
{{- end }}
{{- /* name -> value, so the failure names the key an operator has to edit. */ -}}
{{- $claimants := dict $dindKey $dindSize }}
{{- range $key, $size := $claimants }}
{{- if $size }}
{{- if gt (float64 (include "uzi.quantityBytes" $size)) $maxBytes }}
{{- fail (printf "%s=%v exceeds workers.docker.limitRange.maxPVCStorage=%v. The claim would be REJECTED by the LimitRange admission plugin, and nothing surfaces that: helm renders clean, the controller boots clean, and the worker then provisions and NEVER APPEARS while the reconcile loop retries every tick with the reason only in its log. Raise workers.docker.limitRange.maxPVCStorage to at least %v (and raise workers.docker.quota.requestsStorage with it, or the tier runs out of storage budget instead), or lower %s." $key $size $max $size $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
