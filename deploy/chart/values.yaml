# uzi Helm chart — GENERIC defaults (cluster-agnostic).
#
# Per-cluster values (image registry overrides, the public host, FRONTEND_ORIGIN,
# TRUSTED_PROXIES, the CNPG image/storageClass/backup target) live in
# deploy/values/<cluster>.yaml and are layered on top by BOTH deploy paths:
#   - the ArgoCD Application in myorg/k8s/argo-apps (multi-source: the Harbor
#     OCI chart + $values/deploy/values/<cluster>.yaml from the uzi repo)
#   - a manual `helm upgrade -f deploy/values/<cluster>.yaml`
# So this file MUST stay deployable to any cluster: do NOT put a concrete host /
# endpoint / storageClass / image tag here.
#
# SECRETS: nothing secret lives in this file or in any values file. JWT_SECRET,
# UZI_SECRET_KEY, the optional UZI_SEED_* seeds, and the Postgres/Harbor creds all
# arrive from Infisical (infisicalList below) or are CNPG-generated. The api's
# refuse-to-start-on-placeholder-key guard is the backstop.

nameOverride: ""
fullnameOverride: "uzi"

# How the runtime Secrets are provided.
#   infisical (default): the chart creates the InfisicalSecret CRs below, and the
#     cluster's Infisical operator syncs `uzi-secrets` + the Harbor pull secret.
#   existing: SKIP the InfisicalSecret templates entirely and assume `uzi-secrets`
#     (+ any pull secret) are PRE-CREATED as plain k8s Secrets. Used by the KinD
#     smoke (deploy/values/kind-smoke.yaml), which has no Infisical operator. The
#     api still reads `uzi-secrets` by secretKeyRef either way, so nothing else
#     changes. The CNPG `-app` DB secret is operator-generated in both modes.
secrets:
  mode: infisical

# Harbor pull secret (dockerconfigjson), synced from Infisical (/k8s-registry-robot)
# by the infisicalList entry below. Both the api and web pods pull PRIVATE images
# from harbor.example.com/gitlab/vtmocanu/uzi/*, and the CNPG pod pulls the
# postgres image from the cloudnative-pg mirror, so all three reference it.
imagePullSecret:
  name: registry-robot-secret-uzi

# --- api: the Go backend (sole holder of secrets/keys, the DB client) -----------
api:
  enabled: true
  image:
    repository: harbor.example.com/gitlab/vtmocanu/uzi/api
    # Unset => follows Chart.appVersion (Model B). Pin only to override per-cluster.
    tag: ""
    pullPolicy: IfNotPresent
  # HARD SINGLETON (do NOT raise): three independent reasons the api cannot run
  # >1 replica today — the forge poller + run sweeper hold single-goroutine
  # in-memory state (two replicas double-poll/double-sweep), the Slack Socket Mode
  # manager would double-handle events, and store.Migrate runs goose at boot with
  # NO advisory lock (two pods booting concurrently race the migrations). Paired
  # with strategy: Recreate below (RollingUpdate's surge would briefly run two).
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # The api Service. Named "api" (see uzi.apiServiceName) so the web nginx
  # `proxy_pass http://api:8080` resolves it — same-origin, no CORS.
  service:
    name: api
    port: 8080
  # DB connection string. Sourced from the CNPG-generated <cluster>-app Secret's
  # `uri` key (the model the other MM CNPG apps use). secretName follows the CNPG
  # cluster's fullnameOverride (postgres-uzi-cluster) + "-app". Point database.*
  # elsewhere to use a DB outside this chart. REQUIRED at boot (config.Load errors
  # on an empty DATABASE_URL), so it is NOT optional: the pod waits for the secret
  # (created by the CNPG cluster at sync-wave -5, before the api at wave 0).
  database:
    secretName: postgres-uzi-cluster-app
    secretKey: uri
  # Non-secret env -> ConfigMap (envFrom). Only keys that differ from config.go's
  # safe defaults need setting; the environment-specific ones (FRONTEND_ORIGIN,
  # TRUSTED_PROXIES, FORGE_ALLOWED_BASE_URLS) live in deploy/values/<cluster>.yaml.
  config:
    API_ADDR: ":8080"
    # OIDC group-based roles/access (PRD #55) — all NON-secret ConfigMap values
    # (group names are not secrets, so they live here, not in secretEnv). Require
    # OIDC configured (issuer/client-id in api.config per-cluster + the client secret
    # in secretEnv above). Uncomment + set per-cluster to enable; empty admin/allowed
    # groups = feature dormant. Matching is exact + case-sensitive. See docs/oidc.md.
    # UZI_OIDC_GROUPS_CLAIM: groups
    # UZI_OIDC_ADMIN_GROUPS: uzi-admins
    # UZI_OIDC_ALLOWED_GROUPS: uzi-users
  # Infisical-synced secret env: ENV_VAR -> the key in the `uzi-secrets` Secret.
  # JWT_SECRET and UZI_SECRET_KEY are REQUIRED (the api refuses to boot without
  # them — that guard is the backstop, so the k8s secretKeyRef stays optional:true
  # and a missing key surfaces as a clear boot error, not a stuck ContainerCreating).
  # The UZI_SEED_* entries are OPTIONAL one-time seeds: uncomment an entry AND add
  # the matching key to the Infisical /uzi folder to use it. Slack/OIDC secrets
  # follow the same add-a-line pattern (see docs/ + config.go for the full set).
  secretEnv:
    JWT_SECRET: JWT_SECRET
    UZI_SECRET_KEY: UZI_SECRET_KEY
    # Optional startup seeds (all belong to the seed admin; see config.go):
    # UZI_SEED_EMAIL: UZI_SEED_EMAIL
    # UZI_SEED_PASSWORD: UZI_SEED_PASSWORD
    # UZI_SEED_NAME: UZI_SEED_NAME
    # UZI_SEED_FORGE_PAT: UZI_SEED_FORGE_PAT
    # UZI_SEED_ANTHROPIC_TOKEN: UZI_SEED_ANTHROPIC_TOKEN
    # Slack integration (PRD #25) — overlay tokens or one-time seeds:
    # SLACK_BOT_TOKEN: SLACK_BOT_TOKEN
    # SLACK_APP_TOKEN: SLACK_APP_TOKEN
    # OIDC SSO (PRD #45) — client secret is env-only (never DB):
    # UZI_OIDC_CLIENT_SECRET: UZI_OIDC_CLIENT_SECRET
  # Probes. Startup covers the goose boot migration (nothing listens until it
  # finishes, then /api/health 200s); readiness gates serving on DB reachability
  # (/api/health pings the pool); liveness is a dumb socket check so a transient DB
  # blip does NOT restart the singleton (a restart cannot fix an upstream DB
  # outage — it only churns).
  startupProbe:
    httpGet:
      path: /api/health
      port: http
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    tcpSocket:
      port: http
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 6
  # --- Optional TLS listener on the api (PRD #58 Decision 4) -------------------
  #
  # WHAT IT IS FOR: the hosted workers and the worker controller dial the api
  # DIRECTLY (no nginx in the path), and a claim response carries the user's
  # DECRYPTED forge PAT and Anthropic token. dev-cluster is a shared cluster
  # running arbitrary dev pods, so that plaintext does not cross the pod network.
  # Nothing else changes: users still reach uzi through the ingress -> web -> the
  # PLAIN api port, which never leaves the namespace and is policed by
  # networkPolicy above.
  #
  # ADDITIVE, NEVER A REPLACEMENT. Off (this default) the api binds :8080 alone and
  # behaves exactly as it always has — compose is unaffected by all of this. On, it
  # binds BOTH: :8080 for web's nginx and the kubelet probes, and this port for the
  # workers. Turn it on together with the hosted-worker feature; on its own it just
  # opens a port nothing dials.
  #
  # The api reads PATHS (API_TLS_CERT/API_TLS_KEY) from a mounted Secret and
  # re-reads them when they change, so a cert-manager renewal needs no restart.
  tls:
    enabled: false
    port: 8443
    # The Secret holding tls.crt + tls.key (and ca.crt, which is what the clients
    # mount). Empty => <fullname>-api-tls, which is what the Certificate below
    # writes. Set it to a PRE-CREATED Secret when certManager.enabled is false.
    secretName: ""
    # The cluster's DNS domain, for the FQDN on the certificate. The hosted workers
    # live in another namespace and can only dial the api by FQDN, so this is the
    # name that actually gets verified.
    clusterDomain: cluster.local
    # Extra SANs, if something dials the api by a name the four Service names below
    # do not cover (see api-certificate.yaml).
    extraDNSNames: []
    certManager:
      # false => the chart creates no Certificate and you supply tls.secretName
      # yourself (an external PKI, or a cluster with no cert-manager).
      enabled: true
      # WHICH ISSUER. Empty (the default) => the chart ships its own
      # selfSigned -> CA -> leaf chain, scoped to this release.
      #
      # This is not a fallback, it is the correct answer for this hop: the name
      # being certified is `api.<ns>.svc.cluster.local`, and dev-cluster's only
      # ClusterIssuer is ACME (letsencrypt-prod, DNS-01 on the dev.example.com
      # zone), which cannot issue for a cluster-internal name — no public challenge
      # can validate one. Per-app selfsigned chains are what the rest of the cluster
      # already does for internal hops (ingress-nginx, keycloak, otel).
      #
      # Point this at a real internal CA (Issuer or ClusterIssuer) if one ever
      # exists; the chart then issues from it and skips its own chain.
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
      # Leaf lifetime: the ordinary 90/30. Renewal is picked up live by the api.
      duration: 2160h
      renewBefore: 720h
      # CA lifetime. Long, because rotating the ROOT means re-trusting it in the
      # controller and every hosted worker pod at once — it is not the routine
      # rotation, the leaf is.
      caDuration: 43800h
      caRenewBefore: 2160h

  # Default-deny ingress on the api pods, allowing ONLY the web pods (the reverse
  # proxy) to reach api:8080. This is the LOAD-BEARING control on a shared cluster
  # like dev-cluster: without it any pod (e.g. coder.example.com runs
  # arbitrary dev code) could hit the api ClusterIP directly, bypass web nginx, and
  # spoof X-Forwarded-For to defeat the per-IP auth rate limit. (Rate limiting is the
  # whole impact: uzi persists no client IP, so there are no "audit IPs" to forge —
  # this comment used to claim otherwise. Verified 2026-07-17: ClientIP has three call
  # sites, all in ratelimit.go, and no migration defines an IP column.)
  # example-app has no such policy (it runs on the non-shared mgmt cluster).
  networkPolicy:
    enabled: true
    # kubelet liveness/readiness/startup probes originate from the NODE IP (host
    # network), which no podSelector can match. On CNIs that subject probe traffic
    # to NetworkPolicy (platform/Antrea, Calico), the node CIDR must be allowed here or
    # the api never goes Ready (startup probe dropped -> CrashLoop). Set per-cluster
    # to the dev-cluster node InternalIP CIDR(s). Empty = rely on the CNI exempting
    # host->pod probe traffic; CONFIRM at M6 before trusting empty.
    probeCIDRs: []

# --- hosted workers: the namespace, its RBAC, its policies, the controller -------
#
# M3 built the security ENVELOPE (namespace, RBAC, quotas, policies); M6 added the
# CONTROLLER that fills it and the api-side hosting flags. `workers.enabled` now
# turns on a working feature rather than an inert namespace — except with
# `controller.enabled: false`, which keeps M3's envelope-only shape (the KinD smoke
# is the one consumer).
#
# SHIPS DISABLED. Compose deployments are zero-diff by construction (they render no
# chart), and a cluster that has not opted in gets no extra namespace.
workers:
  # TURNING THIS ON REQUIRES api.tls.enabled: true. Not a convention — the chart
  # REFUSES TO RENDER otherwise (uzi.workerAPIPort), because the two flags live in
  # separate blocks and nothing else couples them. With TLS off, hosted workers get
  # admitted to the api's plaintext 8080, which serves the FULL router and does not
  # strip X-Forwarded-For: /api/auth/* comes back into a worker's reach, and a worker
  # pod's IP is inside TRUSTED_PROXIES so it can forge its own rate-limit key. That
  # combination works perfectly and is silently insecure, which is exactly why it is
  # a template error rather than a line of advice.
  enabled: false
  # The escape hatch for the ONE case that legitimately has no TLS: a throwaway test
  # cluster with no cert-manager (deploy/values/kind-smoke.yaml). NEVER set this on a
  # real deployment — a cluster without cert-manager still sets api.tls.enabled: true
  # and supplies a pre-created api.tls.secretName. It exists so that deviation is
  # VISIBLE in the values file that chose it, instead of being an inherited default.
  allowPlaintextAPI: false
  # The DEDICATED namespace, which must contain NOTHING but hosted workers. A Role
  # that can create pods in a namespace can mount any Secret and impersonate any
  # ServiceAccount in it — RBAC cannot scope `create` by label — so this namespace's
  # emptiness is precisely what bounds a compromised controller. Do not park anything
  # else here.
  namespace: uzi-workers
  # The workers' own zero-permission ServiceAccount (worker namespace), bound to no
  # Role anywhere, token never automounted.
  serviceAccountName: uzi-hosted-worker
  # The controller's ServiceAccount (RELEASE namespace) — the only kube credential in
  # uzi. The identity + Role were created together in M3 so the boundary is one
  # reviewable unit; M6's Deployment below is what runs under it.
  controllerServiceAccountName: uzi-controller

  # --- the controller Deployment (M6) -------------------------------------------
  #
  # The component that turns the envelope above into running workers. It is the ONLY
  # thing in uzi holding a kube credential (Decision 1) — the api holds none and must
  # never hold one.
  controller:
    # Off with workers.enabled: true = M3's envelope-only shape: the namespace, RBAC,
    # quotas and policies exist and nothing runs in them. The api's hosting flags
    # follow this flag, not workers.enabled, and that coupling is deliberate: hosting
    # on with no controller means users provision workers that no process ever
    # materializes — a row that sits pending until its token expires, visible only as
    # a worker that never comes online (Decision 10).
    #
    # The KinD smoke is the one place false is right: it exercises what KinD can
    # prove (admission, the /nix seed, object rendering) and has neither a controller
    # image nor a controller token.
    enabled: true
    image:
      repository: harbor.example.com/gitlab/vtmocanu/uzi/controller
      # Unset => follows Chart.appVersion (Model B), exactly like api/web.
      tag: ""
      pullPolicy: IfNotPresent
    # HARD SINGLETON, for the same class of reason the api is one: two controllers
    # would poll and reconcile the same fleet concurrently, racing each other's
    # create/patch/delete against one namespace. Paired with strategy: Recreate.
    # The reconcile is idempotent, so this is about avoiding pointless churn and
    # duplicate work, not about correctness of a single pass.
    replicaCount: 1
    # It polls, renders and applies — no compilation, no large payloads. The api's
    # own requests are 50m/128Mi and it does far more.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    # Empty => the controller's own defaults (10s poll, 15s HTTP timeout). Both are
    # ordinary Go durations ("30s", "1m").
    pollInterval: ""
    httpTimeout: ""
    # --- the controller's bearer credential (Decision 2) --------------------------
    #
    # TWO values, ONE secret, and they MUST be kept in sync by whoever sets them:
    #   * tokenSecretKey     — the PLAINTEXT token. Mounted as a FILE into the
    #                          controller (never an env var: /proc/<pid>/environ is
    #                          the leak docs/proc-hardening.md closed for the worker,
    #                          and the same argument applies to this credential).
    #   * tokenHashSecretKey — its sha256, HEX-encoded. Read by the API as an env var.
    #                          A hash is not a credential: holding it does not let you
    #                          authenticate, so env is fine for this half.
    #
    # Generate the pair:
    #   TOKEN=$(openssl rand -base64 32)
    #   printf '%s' "$TOKEN" | shasum -a 256      # the hex hash
    # then put BOTH in Infisical /uzi (or the pre-created uzi-secrets under
    # secrets.mode: existing).
    #
    # THE CHART DELIBERATELY DOES NOT GENERATE THIS. A `randAlphaNum` default would
    # re-render on every `helm upgrade` and silently rotate the credential, which is
    # the one failure an operator cannot see coming. Sourcing it like every other
    # secret keeps rotation an explicit act.
    #
    # A rotation that updates only ONE of the two FAILS CLOSED, in both directions:
    # the controller's polls 401 and it stops reconciling. Nothing is admitted that
    # should not be — the cost is an outage (hosted workers stop being created,
    # rolled or torn down; existing ones keep running on their own join tokens), never
    # a bypass. Rotate both, then restart the controller so it re-reads the file.
    tokenSecretKey: UZI_CONTROLLER_TOKEN
    tokenHashSecretKey: WORKER_HOSTING_CONTROLLER_TOKEN_SHA256

  # --- the per-template agent images the controller renders (M6) ------------------
  #
  # The REPO PREFIX only. The controller appends "/agent-<template>:<tag>"
  # (controller/internal/preset), so this must equal what CI publishes:
  # .gitlab-ci.yml HARBOR_AGENT_IMAGE_PREFIX is this value + "/agent".
  #
  # A template the product offers (api/internal/workertmpl) but CI never published
  # provisions a worker that sits in ImagePullBackOff forever — which in v1 surfaces
  # only as a worker that never comes online. The two lists are kept equal by review,
  # not by a gate.
  image:
    repository: harbor.example.com/gitlab/vtmocanu/uzi
    # Unset => Chart.appVersion (Model B). Changing the tag is what rolls every hosted
    # worker onto a new release (Decision 9) — the controller stamps it into the pod
    # spec hash, so a release rolls the fleet as its workers finish their runs.
    tag: ""
  # The Harbor pull secret IN THE WORKER NAMESPACE. It cannot be the release
  # namespace's copy: a ServiceAccount's imagePullSecrets can only name a Secret in
  # its OWN namespace. Empty = no pull secret (the KinD smoke, where the agent image
  # is kind-loaded). Materialized by worker-pull-secret.yaml — deliberately its own
  # template rather than an infisicalList entry, since its lifecycle is workers.enabled
  # and not the release's.
  imagePullSecretName: registry-robot-secret-uzi-workers
  # Where that robot comes from. The SHARED k8s-clusters project, exactly like the
  # release namespace's copy (uzi's own runtime secrets live in the vtmocanu project;
  # only the Harbor robot is shared — the same split infisicalList already makes).
  pullSecretSource:
    projectSlug: example-project
    envSlug: prod
    secretsPath: /k8s-registry-robot
  # StorageClass for the worker PVCs. Empty = the cluster default.
  #
  # Worth a moment at rollout: dev-cluster's storage-class is volumeBindingMode Immediate,
  # while storage-class-latebinding (WaitForFirstConsumer) is safer for a 2-PVC pod. uzi's
  # own CNPG already runs on storage-class here, so this is a default worth thinking about,
  # not a blocker.
  storageClass: ""
  # Namespace ResourceQuota (Decision 8). Defense in depth under the api's per-user
  # quota: an app-level bug must not noisy-neighbour a shared cluster.
  #
  # Sized for a fleet of 20 x `m`: 10 CPU / 40Gi requested, 20 x (10Gi data + 4Gi nix)
  # = 280Gi of PVC. STORAGE is the binding constraint, not CPU or memory.
  # dev-cluster's real budget is M6's rollout conversation.
  #
  # SIDE EFFECT, and it is load-bearing: a quota on requests.* makes admission reject
  # any pod with a container declaring no requests — initContainers included. The
  # controller renders them explicitly for exactly this reason.
  quota:
    enabled: true
    requestsCPU: "10"
    requestsMemory: 40Gi
    requestsStorage: 280Gi
    persistentVolumeClaims: "40"
    deployments: "20"
  # The backstop, never the source: every hosted worker pod arrives from the
  # controller with explicit requests + limits from its size preset.
  #
  # `max` MUST stay >= the LARGEST preset's limits (l = 4 CPU / 8Gi) or that preset
  # stops being admissible — which would surface as a worker that provisions and never
  # appears. maxPVCStorage likewise >= l's /data (20Gi).
  limitRange:
    enabled: true
    default:
      cpu: "2"
      memory: 4Gi
    defaultRequest:
      cpu: 500m
      memory: 2Gi
    max:
      cpu: "4"
      memory: 8Gi
    maxPVCStorage: 20Gi
  # --- the docker-capable worker tier (PRD #83 M3, PRD #89) ---------------------
  #
  # A SECOND, DEDICATED namespace running `pod-security.kubernetes.io/enforce:
  # privileged`, for workers that opted into a Docker-in-Docker sidecar so their agent
  # can run `docker`/`docker compose`. It is a SEPARATE namespace on purpose: the
  # privileged tier's blast radius must never touch the restricted default above
  # (Decision 7 / Q-B). The restricted `namespace` stays exactly as it is — nothing
  # here weakens it.
  #
  # OFF by default. The DinD posture is a PER-CLUSTER toggle (PRD #89, `rootless` below):
  #   - rootless:true (default) — the PRD #83 rootless-DinD sidecar (unprivileged uid
  #     inside a privileged, fenced namespace); the recommended stance, and it needs
  #     nodes with unprivileged userns (kernel.unprivileged_userns_clone=1).
  #   - rootless:false — a NON-ROOTLESS privileged sidecar (dockerd as REAL ROOT on
  #     pod-loopback TCP), for clusters whose nodes cannot do rootless. dev-cluster
  #     (vendor Linux, userns off) is one, so it sets rootless:false. Its residual is
  #     node root, gated behind acknowledgeNonRootlessNodeRoot (see below).
  # sysbox (runtimeClassName: sysbox-runc) remains the documented path to a
  # non-privileged tier once a cluster can run it; it is NOT installed and NOT required.
  docker:
    # Turning this on creates the privileged namespace, its quota/limits, the worker
    # SA + pull secret in it, and the controller's Role there. It also makes the
    # controller render docker workers (UZI_WORKER_DOCKER_NAMESPACE + the sidecar
    # image). With it off, a worker provisioned with docker=true is SKIPPED by the
    # controller (a loud error, never rendered into the restricted default).
    enabled: false
    # The dedicated privileged namespace. MUST differ from workers.namespace — the
    # controller refuses to boot if they are equal (the separation is the point).
    namespace: uzi-workers-docker
    # --- DinD posture (PRD #89): the per-cluster rootless toggle -------------------
    #
    # Default ROOTLESS (the safe, recommended stance — PRD #83). Set false ONLY on
    # clusters whose nodes cannot run rootless dockerd (no unprivileged userns, e.g.
    # dev-cluster / vendor Linux, kernel default off): the controller then renders a
    # NON-ROOTLESS privileged DinD sidecar — dockerd as REAL ROOT bound to pod-loopback
    # TCP (127.0.0.1:2375). Nothing changes on any cluster that keeps rootless.
    #
    # The residual under rootless:false is NODE ROOT reachable by untrusted repo
    # content (a prompt-injectable agent reaches the root daemon and can `docker run
    # --privileged` out to the node) — the owner-accepted risk. So it is refused unless
    # acknowledgeNonRootlessNodeRoot is ALSO true (worker-invariants.yaml), mirroring
    # the networkPolicy.acknowledgeUnfenced idiom: a loud, visible operator choice.
    rootless: true
    # The acknowledgement of the node-root residual, REQUIRED to render rootless:false.
    # An opt-in in the values file that chose it, never an inherited default. Ignored
    # while rootless:true.
    acknowledgeNonRootlessNodeRoot: false
    # The pinned DinD sidecar images, ONE PER POSTURE (OQ-A resolved: hybrid). The chart
    # SELECTS by `rootless` (uzi.workerDinDImage) and passes the winner to the controller
    # as UZI_WORKER_DIND_IMAGE, so a cluster flips posture with a bare `rootless:false`
    # and no second image line — while digest pinning is preserved. Both are
    # digest-pinned and share the other tracks' pins: rootlessImage == docker-compose.yml
    # `dind`; nonRootlessImage == .gitlab-ci.yml's `docker:28-dind` service (same major).
    # One image ref serves both the sidecar and the tiny root socket-prep helper.
    rootlessImage: docker:28-dind-rootless@sha256:7c3e797187e43738220462658f4586572cbd3bf009f728b21e34d9c5c06ce431
    nonRootlessImage: docker:28-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
    # Explicit image override: non-empty is used VERBATIM instead of the posture
    # selection above (still subject to the coherence fail-guard, which rejects a
    # -dind-rootless image with rootless:false, or a plain -dind image with
    # rootless:true). Empty selects rootlessImage/nonRootlessImage by `rootless`.
    image: ""
    # The docker tier's OWN NetworkPolicy (auditor MUST, blocking for LIVE enablement).
    # The restricted ns's worker-networkpolicy.yaml + worker-fqdn-egress.yaml hardcode
    # workers.namespace, so this namespace would otherwise be default-ALLOW — and a
    # privileged DinD worker could `docker run --network=host` to reach CNPG / other
    # ClusterIPs / the apiserver, and expose the dind daemon port cluster-wide. This
    # vanilla networking.k8s.io/v1 policy closes IN-CLUSTER lateral egress + ALL ingress
    # (Half A). EXTERNAL egress filtering — the Anthropic-token / repo-exfil residual —
    # stays PRD #50's job (Half B), NOT closed here.
    #
    # Default enabled:false so it renders nothing when the docker tier is off. It MUST
    # be set true, with the cluster's REAL CIDRs, BEFORE enabling docker workers live —
    # deploy/values/dev-cluster.yaml pre-stages dev-cluster's CIDRs + enables it.
    networkPolicy:
      enabled: false
      # The escape hatch for the fail-guard (worker-invariants.yaml): with docker on and
      # this NetworkPolicy off, the chart REFUSES TO RENDER, because a privileged docker
      # tier with no in-cluster egress fence is the "on by accident, unfenced" posture.
      # Set this true ONLY to deliberately run unfenced — a throwaway cluster whose CNI
      # enforces no NetworkPolicy (kind), where the policy would be created and silently
      # ignored anyway. NEVER on a real deployment: enable networkPolicy with real CIDRs
      # instead. Visible in the values file that chose it, not an inherited default.
      acknowledgeUnfenced: false
      # The in-cluster ranges EXCLUDED from the 0.0.0.0/0 egress allow, so a docker
      # worker can pull images from the internet but cannot reach in-cluster ClusterIPs,
      # pod IPs, the apiserver, or the metadata/link-local IP. CLUSTER-SPECIFIC — the
      # defaults below are common guesses; set the real values per cluster.
      podCIDR: 10.244.0.0/16
      serviceCIDR: 10.96.0.0/12
      linkLocalCIDR: 169.254.0.0/16
      # Extra CIDRs to also exclude from the internet allow (appended to the three
      # above). The node CIDR belongs here — reaching a node IP is reaching the kubelet,
      # which the restricted tier's Antrea policy already drops. Per-cluster.
      extraExcept: []
    # Namespace ResourceQuota for the docker tier (Decision 8's floor, per-tier).
    # Docker workers cost MORE than a plain one: the worker preset PLUS the DinD
    # sidecar (~1-2 GiB / ~1 CPU, arch §Q4) PLUS the daemon's emptyDir image/build
    # cache (~5-20 GiB, arch §Q4). Sized smaller than the default tier because the
    # docker tier is opt-in and expected to hold few workers; tune at rollout.
    quota:
      enabled: true
      requestsCPU: "8"
      requestsMemory: 32Gi
      requestsStorage: 140Gi
      # emptyDir dind data roots land on node ephemeral storage; bound it so a runaway
      # image pull cannot fill a node.
      ephemeralStorage: 200Gi
      persistentVolumeClaims: "20"
      deployments: "10"
    # The backstop, never the source (the controller renders explicit requests+limits
    # on every container, sidecars included). `max` must stay >= the largest worker
    # preset's limits PLUS the sidecar's, or the biggest docker worker stops being
    # admissible.
    limitRange:
      enabled: true
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 500m
        memory: 2Gi
      max:
        cpu: "4"
        memory: 8Gi
      maxPVCStorage: 20Gi
    # The DinD sidecar's resource requests + limits (PRD #89 0.8.1). The controller renders
    # the sidecar with these (flattened to UZI_WORKER_DIND_{REQUEST,LIMIT}_{CPU,MEMORY}).
    # The default (250m/256Mi req, 2/2Gi lim) is enough for `docker`/compose that pulls
    # prebuilt images, but IN-DAEMON image BUILDS OOM it (uzi's own e2e builds 5 images
    # inside the daemon), so a cluster that runs real docker work raises them per-cluster
    # (dev-cluster sets 500m/2Gi req, 4/6Gi lim). RAISE THE REQUEST alongside the limit:
    # a large limit with a tiny request lets the scheduler place the pod on a node without
    # the memory and OOM it under contention. Limits must stay within limitRange.max above
    # (per-container ceiling: 4 CPU / 8Gi). Any field left empty falls back to the
    # controller's built-in default.
    dindResources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 2Gi
  # The CNI-INDEPENDENT floor: default-deny both directions, plus the two in-cluster
  # destinations an FQDN rule structurally cannot express (AntreaProxy rewrites a
  # ClusterIP before policy enforcement, so FQDN cannot match a Service).
  networkPolicy:
    enabled: true
    dns:
      # Where the cluster's DNS runs. DNS egress is NOT optional: Antrea learns an
      # FQDN's addresses by snooping DNS RESPONSES, so blocking DNS makes every FQDN
      # rule below match nothing at all.
      namespace: kube-system
      podSelector:
        k8s-app: kube-dns
    # Extra egress rules, appended verbatim. For a cluster that needs an in-cluster
    # destination the two rules above do not cover (a substituter mirror, a proxy).
    extraEgress: []
  # Named egress, Antrea-native (crd.antrea.io). OFF by default: it needs Antrea, and
  # a cluster without it would just get a rejected manifest.
  #
  # Off is FAIL-CLOSED, not fail-open — the k8s floor still denies everything but DNS
  # and the api, so a worker without this simply cannot reach its forge.
  #
  # dev-cluster turns it on (deploy/values/dev-cluster.yaml); the KinD smoke leaves it
  # off (no Antrea there, and kindnet enforces no NetworkPolicy whatsoever).
  fqdnEgress:
    enabled: false
    tier: application
    priority: 5
    # DROPPED FIRST, and not redundant with the default-deny floor: an FQDN rule
    # programs the datapath with whatever IPs the DNS RESPONSE carried, so a poisoned
    # answer for an allowed name mapping to the metadata IP would open egress to it
    # THROUGH the allow rule. Per-cluster (the apiserver/node CIDRs differ).
    denyCIDRs:
      - name: drop-cloud-metadata
        cidr: 169.254.169.254/32
    # Expand from a REAL provisioning failure, never from prediction. Values-driven so
    # a missing name does not need a code change and a release to fix.
    allowFQDNs:
      - name: allow-anthropic
        fqdn: "*.anthropic.com"
        ports: [443]
      - name: allow-nix-substituters
        fqdn: "cache.nixos.org"
        ports: [443]

# --- web: nginx serving the SPA + reverse-proxying /api/* to the api Service -----
web:
  enabled: true
  image:
    repository: harbor.example.com/gitlab/vtmocanu/uzi/web
    tag: ""
    pullPolicy: IfNotPresent
  # Stateless (SPA + reverse proxy): safe to run >1 for availability. 2 gives a
  # rolling update without a blip.
  replicaCount: 2
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  service:
    port: 80
  # nginx reverse-proxy config, rendered into a ConfigMap (web-configmap.yaml) and
  # mounted over the image's compiled-in /etc/nginx/conf.d/default.conf. This is the
  # k8s variant of web/nginx.conf: it APPENDS X-Forwarded-For
  # ($proxy_add_x_forwarded_for) instead of OVERWRITING it ($remote_addr) — in k8s
  # the immediate client is the ingress-nginx controller, so overwriting would
  # collapse every user into one per-IP rate-limit bucket and lose client IPs. The
  # compose web/nginx.conf stays overwrite (its immediate client IS the browser).
  nginx:
    # api upstream Service name + port (must equal the api Service).
    apiServiceName: api
    apiPort: 8080
    # Upstream resolution mode:
    #  - false (default): `proxy_pass http://<apiService>:<port>` — nginx resolves
    #    the Service name ONCE at worker start. Safe here because the api Service is
    #    applied together with the Deployment (ArgoCD) and its ClusterIP is stable;
    #    the only wrinkle is that DELETING+recreating the api Service strands the
    #    cached ClusterIP until the web pods restart (documented, rare).
    #  - true: emit an nginx `resolver` + a variable upstream so the Service name is
    #    re-resolved at request time (survives a Service recreate). REQUIRES
    #    web.nginx.resolver set to the cluster's kube-dns/CoreDNS ClusterIP.
    dynamicResolution: false
    # The cluster DNS resolver IP (only used when dynamicResolution: true). Find it
    # with `kubectl -n kube-system get svc kube-dns -o jsonpath={.spec.clusterIP}`.
    resolver: ""
  ingress:
    enabled: true
    className: nginx
    # Per-cluster: the public host (deploy/values/<cluster>.yaml).
    host: ""
    path: /
    pathType: Prefix
    annotations:
      # WS idle timeout: web nginx allows 3600s on /api/ws, but ingress-nginx
      # defaults proxy-read-timeout to 60s and would cull idle live-run sockets at
      # the controller. Raise both so a quiet-but-live socket survives (REST replay
      # self-heals, but churn is avoided).
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # dev-cluster serves a *.example.com default wildcard cert at the
    # controller, so no per-host TLS block is needed there. Set tls.enabled: true +
    # a secretName (and a cert-manager annotation) for a cluster without one.
    tls:
      enabled: false
      secretName: uzi-tls

# --- Runtime secrets via Infisical ---------------------------------------------
# Synced from infisical.example.com into k8s Secrets by the cluster's Infisical
# operator. Shared host/auth config here; each infisicalList entry supplies its
# own scope (projectSlug/envSlug/secretsPath) + the managed k8s Secret it creates.
infisical:
  enabled: true
  hostAPI: https://infisical.example.com/api
  resyncInterval: 600
  authSecretName: universal-auth-credentials
  authSecretNamespace: infisical-operator
  # The Opaque Secret the api reads its secret env from (secretKeyRef). MUST equal
  # the infisicalList entry that creates it (secretName: uzi-secrets).
  app:
    managedSecretName: uzi-secrets

# One InfisicalSecret per entry (the list pattern the other MM apps use). To add a
# secret, append an entry — no new template. `secretName` values MUST match what the
# workloads reference: `uzi-secrets` == infisical.app.managedSecretName (api env);
# `registry-robot-secret-uzi` == imagePullSecret.name.
#
# CONFIRMED (M6 first sync, 2026-07-16 — this replaces the M5 assumption, which was
# WRONG): uzi's own runtime secrets live at /uzi in the **vtmocanu** Infisical project
# (slug example-project, envSlug dev), matching the sibling vtmocanu apps —
# example-app -> example-project/dev:/example-app, dot-ai -> example-project/dev:/dot-ai. Only the
# SHARED Harbor robot pull secret comes from the k8s-clusters project
# (example-project, envSlug prod), so the two entries below intentionally differ.
# The M5 draft assumed BOTH lived in example-project/prod; that 404'd on first sync
# ("Folder with path '/uzi' in environment 'prod' was not found") and CrashLooped the
# api on an empty JWT_SECRET. NOTE: a cluster's operator identity needs membership on
# the vtmocanu project (per-project grant — auth succeeds then 403s without it);
# dev-cluster's was granted 2026-07-16.
# syncWave: "-10" applies both InfisicalSecrets before the workloads (and before
# the CNPG cluster at -5), so the api's `uzi-secrets` and the Harbor pull secret
# `registry-robot-secret-uzi` exist on first deploy instead of causing a transient
# ImagePullBackOff / api CrashLoop until the operator catches up (self-heal is the
# real recovery; this just cuts the churn).
infisicalList:
  - name: infsec-uzi
    projectSlug: example-project
    envSlug: dev
    secretsPath: /uzi
    secretName: uzi-secrets
    secretType: Opaque
    syncWave: "-10"
  - name: infsec-harbor-robot-uzi
    projectSlug: example-project
    envSlug: prod
    secretsPath: /k8s-registry-robot
    secretName: registry-robot-secret-uzi
    secretType: kubernetes.io/dockerconfigjson
    syncWave: "-10"

# Restricted-PodSecurity contexts (satisfy the `restricted` standard everywhere;
# harmless where it is not enforced).
#
# api: distroless static-nonroot image (uid/gid 65532); the server writes nothing
# to disk, so its root fs is read-only (a small emptyDir covers /tmp for TLS/temp).
api_podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
api_containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# controller: same distroless static-nonroot base as the api (uid/gid 65532), same
# posture. It writes nothing to disk (a small emptyDir covers /tmp).
#
# fsGroup is what makes its two mounted files readable: a secret volume's files are
# owned by ROOT with the group set to fsGroup, never by runAsUser (measured on a real
# kubelet in M3). Without it the controller cannot read its own bearer token.
controller_podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
controller_containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# web: nginx-unprivileged (uid/gid 101). Root fs left writable: nginx writes its
# pid, cache and temp under /var and /tmp at runtime.
web_podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault
web_containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop: ["ALL"]

# --- CloudNativePG Postgres (subchart, aliased `postgres`) ----------------------
# uzi REQUIRES a database (unlike example-app, which wired CNPG for a future feature).
# SHIPS DISABLED here (generic default, so the chart stays cluster-agnostic — no
# concrete image/storageClass/S3 target); every cluster that deploys uzi turns it on
# in deploy/values/<cluster>.yaml and supplies those. The api's DATABASE_URL is
# wired to the CNPG-generated postgres-uzi-cluster-app Secret (api.database above).
#
# Postgres image: the per-cluster values pin a specific tag from the MM Harbor
# mirror (cloudnative-pg). dev-cluster standardizes on 16.x (fleet-consistent
# + confirmed mirrored); do NOT copy example-app's PG18 image here. (dev-cluster's CNPG
# operator 1.23.5 supports up to PG17, so 16.x is a fleet-convention choice, not an
# operator-imposed ceiling.)
postgres:
  enabled: false
  type: postgresql
  # standalone = a single primary + in-cluster HA replicas; NO cross-site standby.
  mode: standalone
  # The CNPG `Cluster` object name. Stable; the generated secrets
  # (postgres-uzi-cluster-app, ...) and the S3 serverName follow it.
  fullnameOverride: postgres-uzi-cluster
  version:
    # Major series; the pinned imageName in the per-cluster values is authoritative
    # for the exact tag. Keep this major in sync with that tag.
    postgresql: "16"
  cluster:
    # Protect the DB from ArgoCD prune: without Prune=false a chart refactor /
    # rollback / disabling postgres would let Argo delete the Cluster + its PVCs.
    # sync-wave -5 brings the DB (and its -app secret) up before the api (wave 0).
    annotations:
      argocd.argoproj.io/sync-wave: "-5"
      argocd.argoproj.io/sync-options: Prune=false
    # Dev sizing: single instance (no HA). Raise per-cluster for stage/prod.
    instances: 1
    # Cluster-specific (the MM Harbor mirror) -> set in deploy/values/<cluster>.yaml.
    imageName: ""
    imagePullSecrets: []
    storage:
      size: 5Gi
      storageClass: ""        # per-cluster (e.g. storage-class)
    walStorage:
      enabled: true
      size: 5Gi
      storageClass: ""        # per-cluster
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    # No superuser secret: the app connects as the `-app` role (DATABASE_URL from
    # the postgres-uzi-cluster-app secret), so the unused `postgres` superuser
    # credential is dead weight / extra attack surface.
    enableSuperuserAccess: false
    # Single-instance dev cluster: a PodDisruptionBudget (subchart default true)
    # has no failover target and would wedge node drains/upgrades. Disable it.
    enablePDB: false
    # Off by default: dev-cluster does not necessarily ship the PodMonitor /
    # PrometheusRule CRDs. A cluster with the Prometheus operator can flip these on.
    monitoring:
      enabled: false
      podMonitor:
        enabled: false
      prometheusRule:
        enabled: false
    initdb:
      # The application database + owning role created at bootstrap.
      database: uzi
      owner: uzi
  # Backups OFF by default (M5 open question: confirm the s3://postgres-<cluster>
  # bucket exists + wire the barman S3 creds from Infisical before enabling). The
  # per-cluster values decide; see deploy/values/dev-cluster.yaml.
  backups:
    enabled: false
