# CANARY: liveness fixture for the FQDN-egress completeness check in
# scripts/assert-chart-render.sh (PRD #808 M2). This is a DELIBERATELY-INCOMPLETE
# slice of a real chart render, missing ONE host per detector half so BOTH halves
# are exercised:
#   - `cache.nixos.org` -- a STATIC_HOSTS entry, omitted from the Allow list below;
#   - `gitlab.example.com` -- the FORGE host: the ConfigMap's FORGE_ALLOWED_BASE_URLS
#     names it, but the policy below carries NO Allow for it, so the forge-derivation
#     path must catch the gap.
# assert-chart-render.sh runs the completeness check against this file before checking
# the real render and requires it to report BOTH hosts missing; if the detector reads
# this known-incomplete render as complete (or names only one), the instrument is
# broken (exit 2, "an empty result must not read as green").
#
# Do NOT "fix" this file by adding the cache.nixos.org or gitlab.example.com Allow:
# that would silence the canary and the gate would stop proving the detector works.
# This file holds no secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: uzi-api-config
data:
  FORGE_ALLOWED_BASE_URLS: "https://gitlab.example.com"
---
apiVersion: crd.antrea.io/v1beta1
kind: NetworkPolicy
metadata:
  name: uzi-worker-egress
  namespace: uzi-workers
spec:
  priority: 5
  tier: application
  appliedTo:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: uzi-hosted-worker
  egress:
    - name: drop-cloud-metadata
      action: Drop
      to:
        - ipBlock:
            cidr: 169.254.169.254/32
    - name: allow-anthropic
      action: Allow
      to:
        - fqdn: "*.anthropic.com"
      ports:
        - protocol: TCP
          port: 443
    # cache.nixos.org is OMITTED ON PURPOSE -- see the CANARY header above.
    - name: allow-devbox-resolver
      action: Allow
      to:
        - fqdn: "search.devbox.sh"
      ports:
        - protocol: TCP
          port: 443
    - name: allow-cnpg-oci-registry
      action: Allow
      to:
        - fqdn: "ghcr.io"
      ports:
        - protocol: TCP
          port: 443
    # allow-forge-gitlab-example-com (gitlab.example.com) is OMITTED ON PURPOSE below
    # -- the ConfigMap above names it in FORGE_ALLOWED_BASE_URLS, so the forge-derivation
    # half of the detector must report it missing. See the CANARY header.
    - name: allow-cnpg-oci-blobs
      action: Allow
      to:
        - fqdn: "pkg-containers.githubusercontent.com"
      ports:
        - protocol: TCP
          port: 443
