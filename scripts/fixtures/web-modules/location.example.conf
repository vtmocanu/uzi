# Reference per-module location for the runtime web modules (PRD #4686), module id `example`.
#
# This is the exact block the chart (web.modules[]) and scripts/web-modules-gen.py emit for one
# module, with two placeholders the emitter fills in:
#   @UZI_RESOLVER@  the DNS server nginx re-resolves the upstream host with (web.nginx.resolver
#                   in the chart; 127.0.0.11, Docker's embedded DNS, in compose)
#   @UZI_UPSTREAM@  the validated upstream host:port (no scheme, no path)
# scripts/assert-web-nginx.sh substitutes both and runs the result under all three web configs.
# Keep the emitters and this file identical; the variable is `uzi_module_` plus the id with
# each `-` written as `_`. The upstream is untrusted, so every line below is a boundary:
#   - ^~ plus a variable proxy_pass: nginx starts even while the upstream is absent (the host is
#     resolved per request, 502 until it exists), and no regex location can take the path over.
#   - limit_except GET: GET and HEAD only, anything else is 403 before it reaches the upstream.
#   - Cookie, Authorization, Proxy-Authorization and X-CSRF-Token are cleared, so a browser
#     session never reaches a module.
#   - proxy_hide_header drops the upstream's cache, cookie, security and origin-wide-effect
#     headers (Service-Worker-Allowed would let a module register an origin-wide service worker;
#     Clear-Site-Data, Strict-Transport-Security, Refresh, Permissions-Policy, CORS, Report-To
#     and NEL are the host's to set), so the host's are the only ones; the five X-Accel names nginx honours are hidden and ignored, and
#     js_header_filter (web/nginx-modules.js) deletes every other x-accel-* name.
#   - proxy_redirect off: a module redirect is passed through unchanged. Modules must send a
#     RELATIVE Location (the module origin is not the browser's), so there is nothing to rewrite.
#   - Host stays nginx's default for a variable proxy_pass ($proxy_host, the upstream host:port)
#     and the upstream speaks HTTP/1.0 (the default): a static module needs neither a Host of
#     the browser nor keepalive, so neither is set.
#   - add_header Cache-Control $uzi_modcc always: the cache split is the map in the main
#     server config, decided on the final status and path. The security headers are repeated
#     because a location-level add_header drops the inherited ones.
location ^~ /modules/example/ {
    resolver @UZI_RESOLVER@ valid=10s;
    resolver_timeout 5s;
    set $uzi_module_example @UZI_UPSTREAM@;
    limit_except GET {
        deny all;
    }
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header X-CSRF-Token "";
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Service-Worker-Allowed;
    proxy_hide_header Clear-Site-Data;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Refresh;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Report-To;
    proxy_hide_header NEL;
    proxy_hide_header X-Accel-Redirect;
    proxy_hide_header X-Accel-Expires;
    proxy_hide_header X-Accel-Limit-Rate;
    proxy_hide_header X-Accel-Buffering;
    proxy_hide_header X-Accel-Charset;
    js_header_filter uzi_modules.stripAccel;
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset Expires Cache-Control Set-Cookie;
    proxy_redirect off;
    proxy_pass http://$uzi_module_example$request_uri;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css image/svg+xml application/json application/manifest+json;
    add_header Cache-Control $uzi_modcc always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'" always;
}
