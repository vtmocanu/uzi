# uzi's quality gate, in one file (PRD #103 M1).
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR EVERY GATE RECIPE. `CLAUDE.md`, the
# `.claude/agent-team.md` paste-block and the `.claude/agents/*` tails name TARGETS
# from here and never restate a command line. A stale target name dies loudly
# (`task: Task "gate:api" does not exist`, nonzero exit); a stale pasted command
# line still runs, still prints `ok`, and is reported green. This repo's whole
# documented failure history is silent-green over loud-red.
#
# SELF-CONTAINED ON PURPOSE. No `includes:`, no remote taskfiles, no shared task
# library: the gate must be readable here without resolving anything.
#
# 🔴 FOUR TASKFILE FEATURES ARE BANNED IN THIS FILE. One list, so the next reader
# sees all of them at once. Each is one line to avoid and expensive to retrofit.
#
# 1. NO `sources:`, `generates:` OR `status:` ON ANY TARGET. A fingerprinted
#    target prints `Task "x" is up to date`, exits 0 and executes nothing -
#    output indistinguishable from a passing run. That is the exact silent-green
#    failure `CLAUDE.md` mandates `-count=1` against at both Go gates, and
#    `checksum` has the SAME cross-module blind spot as Go's test cache: this
#    repo's gates deliberately read `fixtures/judge-fidelity/{cases,expected}.json`
#    at the repo root and `api/internal/hostedsvc/testdata/` from outside the
#    module under test, so a `sources:` glob over one module cannot see them
#    change. `.task/` is gitignored (its own entry in `.gitignore`), so CI would
#    always run cold
#    while a contributor's `task gate` silently skipped. If some future target
#    must carry `sources:` for an unrelated reason, it also carries `method: none`.
#
# 2. NO `dotenv:`. Task loads the named env files into EVERY target's
#    environment. `.env` is gitignored (its own entry in `.gitignore`) and root
#    `CLAUDE.md`
#    spends a section on compose ranking shell environment above `--env-file`, so
#    a `dotenv: ['.env']` here would silently inject a developer's real secrets
#    into every gate target - including whatever a future milestone adds.
#
# 3. NO `includes:` AT ALL, and the sharp edge is the remote form specifically.
#    Task 3.x can include a taskfile over https, which is unpinned remote code
#    executing inside the gate. `.gitignore` already carries a "Task
#    remote-include cache" comment, so the mechanism is one line from being
#    invited back. The self-contained rule above is the style reason; this is the
#    security one.
#
# 4. NO DYNAMIC ROOT `vars:` (`vars: {X: {sh: ...}}`). Those execute on every
#    invocation, including unrelated targets and a bare `task --list`. Not a hole,
#    but it puts a shell command on the path of everything.
#
# 🔴 AND NEVER SPLICE A VARIABLE UNQUOTED INTO A `cmds:` LINE. Task templates are
# Go `text/template` and the result reaches `sh -c` unquoted, so a
# `{{.CI_COMMIT_BRANCH}}` or `{{.CLI_ARGS}}` inside a command is injectable by
# anyone who can push a branch (branch names may contain `;`, `$`, backticks). M1
# needs neither. Stated here because M6's coverage measurement is where the
# temptation first appears.
#
# SERIAL, NOT CONCURRENT - a recorded decision, not an oversight. `gate` and each
# `gate:*` call their components through `cmds:` (sequential) rather than `deps:`
# (concurrent). Reason: CPU contention is an already-measured flake source here.
# `web/vite.config.ts` raised `testTimeout` to 20000 because "under full-suite CPU
# contention, THREE unrelated tests each timed out once across ~20 runs"; running
# two Go modules and `node --test` alongside vitest makes that strictly worse. The
# gate's job is a trustworthy verdict, not a fast one.
#
# `output: prefixed`, NOT `output: group`, and the two are not interchangeable.
# Serial execution (above) already removes the interleaving `group` exists to fix,
# so `group` would buy nothing and cost streaming. Measured on task 3.51.1, log
# read at t=1.5s into a target that prints EARLY, sleeps 3s, prints LATE:
#
#   group        task: [a] sh -c '...'                  <- EARLY ABSENT, buffered
#   prefixed     task: [a] sh -c '...'   [a] EARLY      <- streams
#   interleaved  task: [a] sh -c '...'   EARLY          <- streams
#
# Two costs `group` would have imposed. Locally, `task gate:api` would print
# NOTHING for the whole `go test -race` run - 41s wall per `.gitlab-ci.yml`'s own
# measurement - then dump, which is a regression against today's streaming
# `go test`. In CI it is worse: every gate job sets `interruptible: true`, so a
# cancelled or timed-out job under `group` loses ALL buffered diagnostic output. A
# gate that discards its evidence on timeout is the failure class this PRD exists
# to remove. `prefixed` keeps the per-task disambiguation that both `CLAUDE.md`
# and `.claude/agent-team.md` need for reading NAMED failing tests, and streams.
#
# `task`'s OWN EXIT CODE IS 201, NOT THE UNDERLYING COMMAND'S. Measured on task
# 3.51.1: a component exiting 7 surfaces as `task: Failed to run task "gate": ...
# exit status 7` with rc=201. Anything reading `$?` NUMERICALLY must know this;
# `!= 0` is still a correct failure test.
#
# AND 201 IS NOT THE ONLY NONZERO. `201` means a target RAN AND FAILED; `109`
# means task never got that far, because THIS FILE DID NOT PARSE - and that one
# is LOUD AND SELF-LOCATING. Measured 2026-08-02 while editing this file, task
# 3.51.1: a `desc:` reading `... modules (fail-fast: stops at the first module)`
# puts a bare `: ` inside a plain YAML scalar, which is illegal. `task --list`,
# `--list-all`, a named target and a bare `task` ALL return 109 and all print
#
#   task: Failed to parse Taskfile.yml:
#   yaml: line 191: mapping values are not allowed in this context
#
# naming the file and the line you just edited. Still: parse this file after
# touching it, because a `desc:` is the one place a stray `: ` looks harmless.
#
# (Corrected same day. This paragraph first said `1`, and said every target
# disappears at once so the symptom does not resemble its cause. BOTH WRONG, and
# the second is backwards. The `1` came from `python3 -c "import yaml..." && task
# ...; echo $?` -- the YAML library exits 1, the && short-circuits, task NEVER
# RUNS, and python's code was reported as task's. Reporting-failure form (1) in
# CLAUDE.md's gate-status entry, committed inside a note about exit codes.)
#
# NO DEPENDENCY INSTALL STEP, DELIBERATELY - WITH ONE EXCEPTION SINCE PRD #103 M3,
# NAMED HERE BECAUSE AN UNQUALIFIED CLAIM IS WORSE THAN A QUALIFIED ONE.
# `lint:api` / `lint:controller` invoke `go run …golangci-lint@v2.12.2`, which on a
# cold cache FETCHES AND BUILDS that tool's whole dependency tree - 51.6s measured,
# recorded beside the target. It is a pinned, sumdb-verified, module-scoped fetch
# that writes nothing to either go.mod (the same shape as validate:api's
# `sqlc@v1.30.0`), so it does not install a PROJECT dependency and nothing below
# changes. But "installs nothing" is now false as stated, and a reader trusting it
# will be surprised by a 51.6s first run. Everything else still holds:
# no `npm ci`, no `go mod download`.
# CI does that in `.gitlab-ci.yml`'s `before_script`; locally your `node_modules`
# is expected to exist. `cd agent && npm ci` in particular has a documented
# host-wide side effect (it rewrites `/opt/homebrew/bin/agent-browser`), so this
# file must never trigger one as a side effect of running a test.
#
# THE npm TARGETS DELEGATE TO THE EXISTING SCRIPT AND MUST KEEP DOING SO. A target
# written `npm test` inherits whatever flags `package.json` already encodes; a
# target that reimplements the command drops them SILENTLY. The live instance is
# `test:agent`: `agent/package.json`'s test script carries `--test-timeout=30000`
# and node's own default is NO timeout. On node v26.4.0 a spelled-out `node
# --import tsx --test` does not actually hang (measured: identical pass/fail
# counts to `npm test`) -- the cap is insurance against a future slow test, not
# a fix for a current one, and a target that reimplements the command still
# drops the flag silently either way. This is the same "a future simplify-the-gate edit"
# hazard as `-race`/`-count=1`, arriving through `package.json` instead of
# `.gitlab-ci.yml`. Before wrapping any npm script, read it for flags first; if you
# must spell out the underlying command, re-add every flag the script carried and
# say in the comment that you are re-adding it because the target bypassed the
# script, not that the script never had it.
#
# NOT SILENT, DELIBERATELY. Task echoes each command before running it, so the
# gate's own output shows `-race`, `-count=1` and `--test-timeout=30000` actually
# being passed. That echo is how a teammate notices a load-bearing flag going
# missing, which is the failure mode this milestone is most exposed to.
#
# NO `-buildvcs=false` HERE. It is a local-only workaround for VCS stamping in a
# linked git worktree and must not be committed. If you hit it, export
# `GOFLAGS=-buildvcs=false` in your shell - Go applies it to build/vet/test with
# no change to this file.

version: '3'

output: prefixed

tasks:
  # ---------------------------------------------------------------- composed --
  default:
    desc: List the gate targets
    cmds:
      - task --list

  gate:
    desc: The whole gate, every component, serially (see the header for why)
    cmds:
      - task: gate:api
      - task: gate:controller
      - task: gate:web
      - task: gate:agent

  gate:api:
    desc: api - fmt-check, vet, build, lint, deadcode, test
    cmds:
      # fmt-check FIRST, deliberately. Measured 2026-08-02, go1.26.5 darwin/arm64,
      # warm build cache: `task fmt-check:api` 0.11-0.13s over three runs against
      # 48.7s for this whole gate, so a coder learns about a misformat in the first
      # fifth of a second instead of after test:api's -race compile.
      - task: fmt-check:api
      - task: vet:api
      - task: build:api
      # lint AFTER build and BEFORE test, and the ordering is asymmetric with the
      # npm gates below on purpose (PRD #103 M3). AFTER build because
      # golangci-lint TYPE-CHECKS: on a tree that does not compile it reports
      # `typechecking error` instead of the build error, which is a worse message
      # for the same defect. BEFORE test because it is seconds against test:api's
      # -race run.
      - task: lint:api
      # deadcode AFTER lint, and the ordering has a CALIBRATION consequence that
      # is not obvious from the cost (PRD #103 M4). golangci-lint's `unused`
      # reports unused UNEXPORTED symbols; deadcode reports unreachable functions
      # whether exported or not. So an unexported dead function reddens `lint:api`
      # first and THIS TARGET NEVER RUNS - anyone calibrating the dead-code slot
      # with one demonstrates M3's linter while believing they demonstrated M4's.
      # Measured 2026-08-02: on a two-function scratch module, `unused` reports
      # only the unexported one and deadcode reports both. Calibrate with an
      # EXPORTED symbol. (After build, for the same reason lint is: deadcode
      # loads and type-checks packages, and on a tree that does not compile it
      # exits 1 with a load error rather than a build error.)
      - task: deadcode:api
      - task: test:api

  gate:controller:
    desc: controller - fmt-check, vet, build, lint, deadcode, test
    cmds:
      - task: fmt-check:controller
      - task: vet:controller
      - task: build:controller
      # Same ordering and the same reasons as gate:api above, including why
      # deadcode sits after lint.
      - task: lint:controller
      - task: deadcode:controller
      - task: test:controller

  gate:web:
    desc: web - lint, deadcode, check-docs, typecheck, test
    cmds:
      # lint FIRST here, which is the MIRROR IMAGE of the Go gates above and is
      # deliberate rather than inconsistent (PRD #103 M3). oxlint is measured at
      # ~0.06s, two orders of magnitude cheaper than anything else in this gate,
      # and unlike golangci-lint it is NOT type-aware - so it has no ordering
      # dependency on a build and nothing is gained by deferring it. Same reason
      # M2 put fmt-check first in gate:api.
      - task: lint:web
      # knip SECOND, on the same cheap-first principle: 244ms measured, against
      # ~5s for typecheck and ~10s for vitest. It has no ordering dependency on
      # a build or a typecheck either - knip 6 resolves with oxc-resolver and
      # does not run tsc.
      - task: deadcode:web
      - task: check-docs:web
      - task: typecheck:web
      - task: test:web

  gate:agent:
    desc: agent - lint, deadcode, typecheck, test
    cmds:
      # lint first, same reason as gate:web (~0.05s here).
      - task: lint:agent
      # knip second, same reason as gate:web (152ms here).
      - task: deadcode:agent
      - task: typecheck:agent
      - task: test:agent

  fmt-check:
    # COMPOSES THE TWO PER-MODULE TARGETS; IT DOES NOT RE-SCOPE THEM. There must
    # never be a root-scoped `gofmt -l .` in this file. A repo-root walk descends
    # into dot-directories, and `.go_job` sets GOPATH=$CI_PROJECT_DIR/.go and
    # GOCACHE=$CI_PROJECT_DIR/.gocache and runs `go mod download` before any script
    # line - so in CI a root-scoped gofmt would traverse the populated module cache
    # and red the gate on third-party source. Neither directory is in .gitignore,
    # so nothing else would catch it.
    #
    # FAIL-FAST, NOT A COMBINED REPORT, consistent with `gate` and every other
    # composed target here. Measured with drift in BOTH modules: this dies at
    # fmt-check:api and fmt-check:controller never runs, so one invocation does
    # not enumerate both modules. `desc:` says "over both Go modules" and that is
    # the SCOPE, not a promise of a single combined listing. CI is unaffected -
    # validate:api and validate:controller report independently.
    desc: gofmt -l over both Go modules, fail-fast at the first drifted one
    cmds:
      - task: fmt-check:api
      - task: fmt-check:controller

  lint:
    # EXTENSIBLE, NOT CLOSED — and it composes MORE than fmt-check above does, so
    # do not copy that target's scope along with its shape. `fmt-check` composes
    # TWO targets because only the Go modules have a format check; `lint` composes
    # ALL FOUR components today, and PRD #103 M5 appends `lint:shell` and
    # `lint:yaml` to this same list. Fail-fast for the same reason every other
    # composed target here is.
    desc: lint all four components today (extensible - M5 appends shell and YAML)
    cmds:
      - task: lint:api
      - task: lint:controller
      - task: lint:web
      - task: lint:agent

  deadcode:
    # ONE SLOT, ONE PREFIX, FOUR COMPONENTS (PRD #103 M4). The npm half is knip
    # rather than `deadcode`, and `deadcode:web` is therefore slightly imprecise -
    # knip also reports unused FILES and unused DEPENDENCIES. That is the same
    # imprecision `lint:web` already carries (oxlint is not golangci-lint), and it
    # is preferred to a second prefix: the `dead code` row of the paste-block in
    # `.claude/agent-team.md` is ONE line, and a `knip:web` target would split one
    # slot across two prefixes for a reader who has to type both.
    #
    # WHAT THIS SLOT DOES NOT COVER, stated here because the alternative is a slot
    # implying coverage it lacks: DEAD BRANCHES. `deadcode` finds unreachable
    # FUNCTIONS and knip finds unused EXPORTS/FILES/DEPS; neither can see a `case`
    # arm that nothing reaches inside a live function. The known live example is
    # PRD #99's legacy `case "Task":` arms in `web/src/components/RunEvent.tsx`,
    # still present, and NOT a valid probe for this slot for exactly that reason -
    # it would produce a clean "no findings" from a working tool. Dead branches
    # stay the reviewer's job.
    desc: dead-code detection across all four components (deadcode + knip)
    cmds:
      - task: deadcode:api
      - task: deadcode:controller
      - task: deadcode:web
      - task: deadcode:agent

  # ------------------------------------------------------------- api (Go) -----
  fmt-check:api:
    desc: gofmt -l over the api module (fails on drift, naming the files)
    dir: api
    cmds:
      # 🔴 DO NOT SIMPLIFY THIS LINE TO `test -z "$(gofmt -l .)"`. It reads as the
      # tidier spelling of the same check and it is not the same check. Measured
      # 2026-08-02 on task 3.51.1 under `output: prefixed`, first by the lead and
      # then independently reproduced before this target shipped:
      #
      #   tree                  form               task rc   stdout
      #   drifted               assignment (below) 201       NAMES THE FILES
      #   drifted               test -z "$(...)"   201       empty
      #   a Go file that does   assignment (below) 201       the parse errors
      #     not parse           test -z "$(...)"   0 GREEN   the parse errors
      #
      # Two independent reasons, and the second is the one the PRD did not have:
      #
      # 1. `gofmt -l` EXITS 0 WHETHER OR NOT IT LISTS ANYTHING (CLAUDE.md documents
      #    this trap), so the gate must be on the OUTPUT, not the exit code. Both
      #    forms get that right - but `test -z` SWALLOWS THE FILENAMES, and a gate
      #    that reddens without naming the file is not the gate PRD #103 SC8 asks
      #    for (a control that produces no output is not a control).
      # 2. `test -z "$(...)"` FAILS OPEN ON A GO FILE THAT DOES NOT PARSE. gofmt
      #    exits 2 and writes to stderr, so `$(…)` captures nothing and `test -z`
      #    is TRUE. THE POSIX DISTINCTION IS WHY THAT FORM HAS THE HOLE AND AN
      #    UNGUARDED ASSIGNMENT DOES NOT: under errexit, an ASSIGNMENT whose
      #    command substitution fails aborts the script, while a substitution
      #    inside a SIMPLE COMMAND does not. It is NOT the mechanism the line
      #    below relies on - see the next paragraph, and do not read it as one.
      #    And because `output: prefixed` puts a recipe's stderr on Task's
      #    stdout, the green run PRINTS the parse errors: visible-and-ignored,
      #    which is worse than silent, because the error text reads as the gate
      #    having done its job.
      #
      # THE `|| exit 2` IS WHAT THE SHIPPED LINE ACTUALLY RELIES ON, DELIBERATELY.
      # Once `||` is on the line the assignment sits in a CONDITION CONTEXT, so
      # errexit no longer fires for it at all and the explicit exit is the whole
      # guarantee. Measured 2026-08-02: `sh -ec 'x="$(false)"; echo R'` exits 1
      # with errexit doing the work, while both `sh -c` and `sh -ec` of
      # `'x="$(false)" || exit 7; echo R'` exit **7**. So this is not belt-and-
      # braces over reason 2's mechanism, it REPLACES it - the property is now
      # intrinsic to the recipe and survives a future `set +e`, a Task release
      # changing its shell defaults, or this line being copied somewhere with
      # neither. Measured on one non-parsing file, nothing else drifted:
      #
      #   sh -c   'out="$(gofmt -l .)"; ...'            rc=0   <- FAILS OPEN
      #   sh -ec  'out="$(gofmt -l .)"; ...'            rc=2
      #   sh -c   'out="$(gofmt -l .)" || exit 1; ...'  rc=1
      #   sh -c   'out="$(gofmt -l .)" || exit 2; ...'  rc=2   <- shipped
      #
      # ONE ORDERING CONSEQUENCE, since `desc:` promises the files are named: on a
      # tree carrying BOTH a non-parsing file AND drift, the guard fires before
      # `$out` is echoed, so the drifted files are NOT named that run - you get
      # the parse error and `exit status 2`, then the drift on the next run once
      # the parse error is fixed. Measured. Two rounds, not a hole: gofmt does
      # list the drifted files, the guard simply pre-empts the echo.
      #
      # `2` AND NOT `1`, FOR TWO REASONS. It reproduces gofmt's own exit status,
      # so the table at the top of this comment and CLAUDE.md's R10 paragraph -
      # both of which recorded `exit status 2` against the UNPINNED form - stay
      # true rather than going stale in the commit that pinned them. And it keeps
      # the two red modes distinguishable: `exit status 2` means a file does not
      # PARSE, `exit status 1` means a file is MISFORMATTED. Task's own rc is 201
      # for both, so this line is the only status-level discriminator there is.
      #
      # ONE MEASURED SUBTLETY, BECAUSE IT INVERTS THE INTUITION: the fail-open
      # window is exactly a tree with NO OTHER DRIFT. gofmt still LISTS every
      # other misformatted file while erroring on the unparseable one, so on the
      # 16-file drifted tree this milestone started from, the bare form under
      # `sh -c` returned 1 and looked fine. Clearing the drift is what arms the
      # hole. THE GATE'S OWN SUCCESS IS THE PRECONDITION FOR ITS FAILURE MODE,
      # which is why this cannot be left to be noticed later.
      #
      # Also forbidden here, all three for reasons above or in this file's header:
      # no `{{.CLI_ARGS}}` (the splicing ban, and it would let a caller narrow the
      # gate's scope); no `xargs`/`gofmt -d $out` "improvement" that unquotes the
      # filename list; and no `vars: {DRIFT: {sh: gofmt -l api}}` + `test -z
      # "{{.DRIFT}}"`, which splices shell output through text/template into
      # `sh -c` and so dies on the splicing ban alone. (Header ban 4 is scoped to
      # dynamic ROOT vars; the form above would sit on the target, so it is the
      # SPLICE ban that catches it, not ban 4. The conclusion was always right and
      # this citation was one word loose until 2026-08-02.)
      #
      # NO `sources:` ON THIS TARGET (header ban 1). A `**/*.go` fingerprint is
      # MORE defensible here than anywhere else in this file - gofmt reads nothing
      # across the module boundary, so the cross-module blind spot the header
      # argues does not apply - and it is still wrong, for a reason specific to
      # this check: A CHECKSUM OVER THE INPUTS CANNOT SEE THE GOFMT BINARY CHANGE.
      # It would serve a stale green across exactly the toolchain bump most likely
      # to introduce new drift. Reproduced by the auditor: a `sources:`-carrying
      # fmt-check printed `up to date`, exited 0 and executed nothing.
      #
      # THE NAME IS `fmt-check`, NEVER `fmt`. `.claude/agents/tester.md` instructs
      # testers to refuse a slot whose command looks like a fixing variant, `gofmt
      # -w` and "a bare `fmt` target" named explicitly - so a target called `fmt`
      # would be declined by the role that is supposed to run it. Do not tidy the
      # suffix away.
      - 'out="$(gofmt -l .)" || exit 2; [ -z "$out" ] || { echo "$out"; exit 1; }'

  vet:api:
    desc: go vet over the api module
    dir: api
    cmds:
      - go vet ./...

  build:api:
    desc: go build over the api module
    dir: api
    cmds:
      - go build ./...

  lint:api:
    desc: golangci-lint over the api module (RATCHETED to origin/main - see .golangci.yml)
    dir: api
    cmds:
      # 🔴 READ `.golangci.yml` BEFORE THIS TARGET. THE LOAD-BEARING CONFIGURATION
      # IS NOT VISIBLE IN TASK'S ECHO, AND THAT IS THIS MILESTONE'S ONE DELIBERATE
      # WEAKENING OF A MECHANISM THIS FILE RELIES ON. The header above says the
      # echo is how a teammate notices a load-bearing flag going missing; for the
      # RATCHET that property is now absent, because
      # `issues: {new-from-merge-base: origin/main, whole-files: true}` lives in
      # `.golangci.yml` rather than on the command line. Traded deliberately: the
      # CLI form would have to be spliced into this line (banned by the header) or
      # set in the CI job only (which makes local and CI disagree about what a
      # finding IS - the exact divergence PRD #103 Success Criterion 1 exists to
      # prevent). One recipe, byte-identical locally and in CI, was worth the echo.
      #
      # PRE-FLIGHT, AND IT IS NOT DEFENSIVE PADDING. If the ratchet cannot resolve
      # its base, golangci-lint does NOT skip it and does NOT error: it emits ONE
      # line - `level=warning msg="[runner] Can't process results by diff
      # processor…"` - and then reports the ENTIRE unfiltered backlog with exit 1.
      # It fails CLOSED, loudly, and in the most misleading possible way: the first
      # reader sees ~107 findings, concludes the branch broke something enormous,
      # and starts a burn-down when the fix is one `git fetch`. This line converts
      # that misleading red into an accurate one.
      #
      # 🔴 THE PREDICATE IS `git merge-base`, NOT `git rev-parse`, AND THE
      # DIFFERENCE IS A REAL HOLE THAT SHIPPED FIRST. This guard was originally
      # `git rev-parse --verify -q "origin/main^{commit}"`, which asks whether the
      # REF EXISTS. What golangci-lint needs is a REACHABLE COMMON ANCESTOR - its
      # own error text is `error executing "git merge-base origin/main HEAD"` - and
      # those are not the same question on a SHALLOW clone, which is exactly what
      # CI produces. Measured in a CI-shaped scratch repo (feature branch cloned
      # --depth 1, then the lint job's own explicit fetch of main):
      #
      #   shallow?                                     YES
      #   git rev-parse --verify origin/main^{commit}  rc=0   <- GUARD SATISFIED
      #   git merge-base origin/main HEAD              rc=1   <- no common ancestor
      #   after `git fetch --unshallow`                rc=0
      #
      # So the ref resolved, the old guard passed, and the run took precisely the
      # misleading path the guard exists to prevent. `merge-base` STRICTLY SUBSUMES
      # the old check rather than adding to it: on a MISSING ref it exits 128
      # (measured), so the case rev-parse did catch is still caught, and it also
      # catches the shallow case rev-parse cannot see. One predicate, both failures.
      # Do not "restore" the rev-parse form or add it alongside - it tests a weaker
      # premise than the thing it is guarding.
      #
      # `exit 2` NOT `exit 1`, matching fmt-check:api's convention above:
      # 2 = the instrument is broken, 1 = there are findings. `task`'s own rc is
      # 201 for both, so the recipe is the only place that distinction can live.
      #
      # LITERAL REF, NEVER A VARIABLE. `git check-ref-format --branch` accepts
      # `a;b`, `a$b`, backticks, `a|b`, `a&b`, `a(b)` as branch names - only a
      # space is rejected - and anyone who can open an MR chooses the target
      # branch, so `$CI_MERGE_REQUEST_TARGET_BRANCH_NAME` is an attacker-chosen
      # string with live metacharacters. Quoted here even though it is a literal.
      - 'git merge-base "origin/main" HEAD >/dev/null 2>&1 || { echo "lint: no merge-base between origin/main and HEAD - either the ref is missing, or this is a SHALLOW clone whose history does not reach a common ancestor. golangci-lint would NOT skip the ratchet - it reports the ENTIRE unfiltered backlog (exit 1) behind one buried warning line, which reads as a huge new regression. Fix the history first (CI: GIT_DEPTH=0 plus an explicit git fetch; locally: git fetch origin main, and git fetch --unshallow origin if the clone is shallow)." >&2; exit 2; }'
      # `config verify` AHEAD OF THE RUN: it is the positive control on the config
      # this target's whole behaviour is delegated to. Exits 0 SILENTLY on a valid
      # file and 3 with a named error otherwise - measured 2026-08-02 at 2.12.2, a
      # bogus sibling key gives rc=3 and `additional properties 'no-such-key' not
      # allowed`, so the green means something rather than merely meaning the
      # parser did not crash. Cheap: ~0.9s warm.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 config verify
      # PINNED `go run`, NOT A PREINSTALLED BINARY AND NOT THE OFFICIAL IMAGE.
      # Written out in full rather than through a Taskfile var, deliberately: the
      # header's echo property is what makes a version pin going missing VISIBLE,
      # and it is the only such property this target still has (see the ratchet
      # note at the top of this comment).
      #   - Same shape as the `sqlc@v1.30.0` precedent already in validate:api.
      #   - It pins the version IDENTICALLY local and in CI, which is what kills
      #     the unpinned-local-binary divergence: a contributor's brew
      #     golangci-lint drifts on its own schedule and would disagree with CI
      #     about what a finding is.
      #   - It does NOT touch api/go.mod. `go run pkg@version` resolves in its own
      #     module context; verified, `git status -- api/go.mod api/go.sum` is
      #     clean after a run. `go get -tool` would instead write golangci-lint's
      #     whole dependency tree into api/go.mod, and this repo keeps that file
      #     deliberately clean - the separate controller module exists precisely so
      #     k8s.io/client-go stays out of it.
      #   - NOT the official golangci/golangci-lint image: it ships Go 1.26.2 with
      #     GOTOOLCHAIN=auto against both modules' `go 1.26.4`, so it would make
      #     lint the first job in this pipeline whose effective toolchain is
      #     FETCHED rather than pinned. The golang:1.26 image CI already pins is
      #     1.26.4 with GOTOOLCHAIN=local.
      # COST, measured 2026-08-02 on go1.26.5 darwin/arm64 with isolated
      # GOMODCACHE+GOCACHE: 51.6s COLD (first build of the dependency tree), then
      # 1.77s and 0.89s WARM. CI persists both caches via .go_job's `cache:` keyed
      # on api/go.sum, so the cold cost is per-cache-key, not per-pipeline.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  lint:api:all:
    desc: api - the UNFILTERED lint backlog; not in any gate, but it EXITS NONZERO
    dir: api
    cmds:
      # 🔴 "NEVER GATING" MEANS NOT WIRED INTO ANYTHING - IT DOES NOT MEAN THIS
      # TARGET EXITS 0. golangci-lint exits 1 whenever it reports a finding, so on
      # a module with a backlog this target returns `task` rc=201, every time, by
      # design. The two claims are independent and the `desc:` used to assert only
      # the first, which reads as the second. Anyone who wraps this target, or adds
      # a reporting job around it later, gets a red pipeline from something
      # documented as non-gating - so if you build such a job, it needs an explicit
      # `|| true` (or `allow_failure: true`) and a comment saying why.
      #
      # NOT IN `gate`, NOT IN THE COMPOSITE `lint`, NOT A CI JOB.
      # `new-from-merge-base` reports nothing on a
      # `main` pipeline (the merge-base of main with itself is main), so without
      # this target the debt the ratchet defers would be uncountable.
      #
      # 🔴 THE FLAG NAME IS COUPLED TO THE CONFIG KEY AND THE TWO MOVE TOGETHER.
      # An EMPTY `--new-from-merge-base=` is what clears a `new-from-merge-base`
      # set in .golangci.yml. The two obvious alternatives DO NOT CLEAR IT and fail
      # silently - measured 2026-08-02 on this tree against the shipped config:
      #
      #   --new-from-merge-base=  (empty)   rc=1   106 findings   <- cleared
      #   --new-from-rev=         (empty)   rc=0     0 findings   <- STILL RATCHETED
      #   --whole-files=false               rc=0     0 findings   <- STILL RATCHETED
      #
      # Neither of the last two errors. They yield a "full debt report" that is
      # still filtered, so a companion target written either way reports `0 issues`
      # over a module carrying 106 - the exact silent-green shape PRD #103 exists
      # to remove. If the config key is ever renamed, rename this flag with it.
      #
      # 🔴 BOTH CAP FLAGS OR THE NUMBER IS A CAP READING. Defaults are 50 per
      # linter and 3 per repeated message. THEY COMPOSE IN ORDER; NEITHER "OWNS" A
      # LINTER. Measured on the shipped config, `cache clean` first, each flag
      # isolated:
      #
      #   --new-from-merge-base=                            55   errcheck 36  staticcheck 13
      #   + --max-issues-per-linter=0                       55   errcheck 36  staticcheck 13
      #   + --max-same-issues=0                             77   errcheck 50  staticcheck 21
      #   both                                             106   errcheck 79  staticcheck 21
      #
      # RE-DERIVED 2026-08-03 AT 1076b133 with a private GOLANGCI_LINT_CACHE (zero
      # foreign paths in any cell); `controller` reads 5 in every cell, then and
      # now. EVERY PER-LINTER FIGURE IS UNCHANGED - the totals each dropped by one
      # because 6ea98493 wired up `const hookEvent` and consumed a pre-existing
      # `unused` finding, so the tail is now unparam 4 + unused 2 = 6 against 7
      # when M3 measured. The 120-vs-107 INCIDENT NARRATIVE further down keeps its
      # own numbers on purpose: it describes one dated run, not the current tree.
      #
      # `--max-same-issues` folds duplicate MESSAGES first; `--max-issues-per-linter`
      # then truncates the survivors at 50. So on this config `--max-issues-per-
      # linter=0` ALONE IS A COMPLETE NO-OP - nothing exceeds 50 until the fold is
      # lifted - and the per-linter flag's real effect here is ERRCHECK 50 -> 79,
      # which exists only after the other flag has fired. Cite that pair, not
      # 36 -> 79: no single flag produces 36 -> 79.
      #
      # AND `issues.uniq-by-line` DEFAULTS TO TRUE, DEDUPPING ACROSS LINTERS, so a
      # single linter's count depends on which OTHERS are enabled: 106 becomes 107
      # with `--uniq-by-line=false` (staticcheck 21 -> 22, that cell RE-RUN at
      # 1076b133 rather than shifted on paper). One finding today, noted
      # for M4/M5 because they add linters - this is how a staticcheck finding
      # vanishes from an "unfiltered" total with nobody touching staticcheck.
      #
      # 🔴 WHICH MAKES THE OBVIOUS "IS THE SECOND FLAG LOAD-BEARING?" CHECK A TRAP.
      # Add `--max-issues-per-linter=0` on its own, see 55 -> 55, conclude it does
      # nothing, delete it: errcheck then reads 50 forever, which is exactly the cap
      # reading this paragraph exists to prevent.
      #
      # 🔴 THE COMMIT MESSAGE THAT INTRODUCED THIS COMMENT (490df687) STILL CARRIES
      # THE WRONG VERSION AND IS IMMUTABLE. If you find "errcheck 36→79 is
      # --max-same-issues" in `git log`, THIS is the correction. Named explicitly so
      # the history stays honest rather than merely contradicting itself, and so a
      # reader who greps the log lands here instead of on two disagreeing sources.
      #
      # (Corrected 2026-08-02. This comment first read "errcheck 36→79 is
      # --max-same-issues, staticcheck 13→21 is --max-issues-per-linter",
      # attributing each delta to one flag from a 2-cell measurement that could not
      # separate them. Refuted by a 2x2 and re-derived by the lead in the matrix
      # above. The wrong version propagated out of THIS FILE into a PRD carry-forward
      # before anyone re-measured, which is the real cost: a comment is a citation
      # source, so an unsupported figure here does not stay here.)
      #
      # `controller` reads 5 EITHER WAY, AND THAT IS THE CAMOUFLAGE - anyone who
      # sanity-checks "do the caps matter?" on the cheap module concludes no.
      #
      # No `origin/main` pre-flight here, deliberately: this target does not use
      # the ref, so the guard would fail a run that is not exposed to the hazard.
      #
      # 🔴 `cache clean` FIRST, AND IT IS NOT HYGIENE - WITHOUT IT THIS TARGET
      # REPORTS ANOTHER WORKTREE'S FINDINGS AS THIS ONE'S. golangci-lint's result
      # cache is HOST-GLOBAL (~/Library/Caches/golangci-lint), shared by every
      # sibling worktree of this bare clone exactly like the Go build cache. A warm
      # entry from worktree B replays B's ABSOLUTE paths, and this target has no
      # diff processor to drop them, so they are simply ADDED to the report.
      # Measured 2026-08-02, with a validator's throwaway worktree warm in the
      # cache: this target printed 120 findings, EVERY ONE carrying a path like
      # `../../../../../../../../private/tmp/.../wt-r3/api/internal/...`; after
      # `cache clean` it printed 107, all repo-root-relative. The recorded backlog
      # figure is the 107.
      #
      # THE TWO ARE DISJOINT POPULATIONS FROM TWO RUNS, NOT 107 REAL PLUS 13 STALE.
      # Measured from the surviving log: of the 120, ZERO were repo-relative and all
      # pointed into a SINGLE foreign tree. So do not reason about a 13-finding gap;
      # there is no decomposition. Why that tree's own count was 120 rather than the
      # ~107 an identical checkout would give CANNOT BE ESTABLISHED - it was deleted
      # and no log of it survives, which is the failure this whole paragraph is about
      # arriving in the evidence for it.
      #
      # NOTE THE DIRECTION, because the documented version of this trap is the
      # OPPOSITE one: a poisoned cache makes the RATCHETED target go falsely GREEN
      # (the diff processor cannot match a foreign path against `git diff` and
      # drops everything), while it makes THIS target falsely LOUD. Same cache, two
      # inverted symptoms, and the quiet one is the dangerous half.
      #
      # IN THE RECIPE RATHER THAN IN A DOC, on purpose: this is a RECORDING target
      # whose entire output is a number somebody writes down, so "remember to clean
      # first" is the kind of discipline this repo removes rather than relies on.
      # THE COST IS REAL AND SHARED: the cache is host-global, so this clears it for
      # every concurrent agent and worktree too, and the next `lint:api` runs cold
      # (~6-8s). That is why the clean lives HERE and NOT on `lint:api` /
      # `lint:controller`, which run in the gate and on every MR.
      #
      # 🔴 RUNNING THIS BY HAND? SET `GOLANGCI_LINT_CACHE=<a private dir>` INSTEAD
      # OF CLEANING. It gives the SAME isolation as `cache clean` with none of the
      # shared cost the paragraph above concedes - nobody else's warm cache is
      # touched, so a concurrent agent does not silently pay ~6-8s for your
      # measurement. Verified honoured by golangci-lint 2.12.2, and it is what
      # produced PRD #103 M4's re-derived isolation matrix with zero foreign paths
      # in any cell. The `cache clean` stays IN THIS RECIPE because a target has to
      # be correct for someone who sets no environment at all.
      #
      # THE TELL, if you ever see this target's output without the clean: any path
      # containing `../`. A `../` in a finding is an invalid run, not a finding.
      #
      # 🔴 EXCEPT THAT THE TELL HAS A FALSE-POSITIVE MODE, and stated as a bare
      # `../` check it has already made a validator DISCARD A VALID MEASUREMENT.
      # golangci-lint bases every path on its CONFIG FILE'S directory, so a run
      # driven by a config outside the repo prints `../` on EVERY path while being
      # perfectly valid (the header of `.golangci.yml` documents the same mechanism
      # from the other side). THE DISCRIMINATOR IS WHERE THE PATH LANDS, NOT THE
      # PRESENCE OF `../`: resolve it, and ask whether it lands in this worktree or
      # in a foreign tree.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 cache clean
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --new-from-merge-base= --max-issues-per-linter=0 --max-same-issues=0 ./...

  deadcode:api:
    desc: api - unreachable functions, gated against api/.deadcode-baseline (EMPTY)
    cmds:
      # 🔴 A SCRIPT, NOT AN INLINE RECIPE, AND THE ARGUMENT IS M5's. PRD #103 M5
      # adds `shellcheck` over `git ls-files '*.sh'`, so a committed script gets
      # LINTED and an inline Taskfile recipe gets nothing - yamllint checks YAML,
      # not shell embedded in a `cmds:` string. Precedent in this repo:
      # `scripts/assert-chart-render.sh`, invoked from the `helm_chart` job.
      #
      # 🔴 AND THE WRAPPER IS NOT ABOUT THE BASELINE. Both baselines ship EMPTY
      # (see api/.deadcode-baseline's header). It exists because `deadcode` EXITS
      # 0 WHETHER IT FINDS 0, 1 OR 44 DEAD FUNCTIONS - rc=1 only on a load error,
      # and on that path stdout is 0 BYTES, so a naive additions-only diff reads
      # a non-compiling module as clean and passes GREEN. The script reads rc
      # before it reads output. Read its header before editing this target.
      #
      # THE PIN IS AN ARGUMENT RATHER THAN A SCRIPT DEFAULT, so this file's echo
      # still shows it. The header calls that echo the mechanism by which a
      # teammate notices a version pin going missing, and `lint:api` already
      # spends one deliberate exception on it (the ratchet lives in
      # `.golangci.yml`, invisible here). One is enough.
      #
      # PINNED `go run`, same shape as `sqlc@v1.30.0` in validate:api and
      # `golangci-lint@v2.12.2` above: identical version local and in CI, and it
      # writes nothing to api/go.mod. v0.48.0 is the current release; v0.38.0 was
      # measured independently on this tree and gave IDENTICAL counts (1 for api,
      # 0 for controller), which is worth more than a figure from one version.
      #
      # COST, measured 2026-08-02 on go1.26.5 darwin/arm64: 2.7-3.2s warm, ~25s
      # on a cold GOCACHE (x/tools' own dependency tree). deadcode has NO result
      # cache of its own - checked for one, and cold and warm runs were
      # byte-identical - so carry-forward item 4's poisoned-cache hazard, where
      # golangci-lint replays a sibling worktree's absolute paths, has no analogue
      # here. Neither does its host-global LOCK: three concurrent runs, no
      # contention.
      - ./scripts/deadcode-gate.sh api golang.org/x/tools/cmd/deadcode@v0.48.0

  deadcode:api:all:
    desc: api - unreachable funcs WITHOUT -test; reported, never gating, ALWAYS EXITS 0
    dir: api
    cmds:
      # 🔴 THIS TARGET EXITS 0 EVEN WHEN IT REPORTS, WHICH IS THE OPPOSITE OF
      # `lint:api:all`. Read both `desc:` lines together: golangci-lint exits 1
      # on a finding, deadcode exits 0 on any number of them. That asymmetry is
      # precisely why the gating target above goes through a wrapper and this one
      # does not need to - and it is why "the output is the signal here" has to be
      # said out loud rather than left to be inferred from a green.
      #
      # WHY IT EXISTS AT ALL, given the baseline is the full record for the gating
      # invocation: `-test ./...` makes a PRODUCTION-DEAD function invisible the
      # moment any test calls it, and `golangci-lint unused` does not catch it
      # either. Measured on a scratch module:
      #
      #   deadcode       ./...   ExportedNoCaller + unexportedNoCaller
      #   deadcode -test ./...   <EMPTY>
      #   golangci-lint unused   "0 issues."
      #
      # That is the commonest way dead code enters a repo with a testing culture -
      # write the function, write its test, never wire it up - and it is a class
      # the gating invocation cannot see at all, so the baseline is NOT the full
      # record for it. `-test` is still the right GATING default: 32 of api's
      # 43-finding delta are `FakeClient.*` methods on a test double, correctly
      # suppressed.
      #
      # THE POSITIVE PAIR (carry-forward item 5): as of 2026-08-03 at 1076b133
      # this prints 43 where `task deadcode:api` reports 0. A companion that
      # reports one number needs the other to mean anything.
      #
      # THE SHA IS PART OF THE FIGURE, NOT DECORATION. This line read 44 for a
      # day: 44 was measured before 6ea98493 deleted `HookManager.SettingsPath`,
      # and the commit that WROTE the 44 landed after the one that invalidated
      # it. A date cannot separate two commits landed the same afternoon, and
      # both of these were. See PRD #103 Decision 10.
      - go run golang.org/x/tools/cmd/deadcode@v0.48.0 ./...

  test:api:
    desc: api unit tests (-race -count=1; live-DB tests self-skip)
    dir: api
    cmds:
      # -race AND -count=1: two independently measured fixes on one command,
      # neither of which subsumes the other. DROPPING EITHER SILENTLY UNDOES A
      # FIX WHOSE ABSENCE IS INVISIBLE IN THE OUTPUT, which is why moving them
      # into this file is itself the "simplify the gate" edit `.gitlab-ci.yml`
      # warns about.
      #
      # -count=1 (PRD #98): fixtures/judge-fidelity/{cases,expected}.json live at
      # the REPO ROOT, above this module, and are read by
      # internal/workersvc/judge_backlog_fidelity_test.go. Go's test cache hashes
      # only files INSIDE the module root, so a fixture-only edit changes nothing
      # in the cache key and the gate serves a green that ran nothing. Measured:
      # deleting a case left `go test ./internal/workersvc/` printing
      # `ok (cached)` while -count=1 reddened with "fixture broken: cases.json has
      # no case ...". It disables the test-RESULT cache only; compilation is still
      # reused.
      #
      # -race (PRD #108 M4): workersvc holds a mutex-guarded map written by every
      # /messages handler goroutine and read by the sweeper. Measured by deleting
      # the lock: 3/3 red under -race, only 2/3 without it.
      #
      # PROVENANCE, CITED BY STRING because every SHA and date offered for this
      # line has been wrong once. Reproduce it with:
      #
      #   git log --oneline -s --diff-merges=first-parent -S 'race -count=1 ./...' -- .gitlab-ci.yml
      #
      # Three things about that command, each of which someone got wrong:
      #   - `--oneline -s` is REQUIRED, BOTH of them. `--diff-merges` turns patch
      #     output ON for merges, and without `--oneline` each hit still carries a
      #     full header. Measured at dc062ce5: the chain is TWO commits, and the
      #     three flag sets print two lines, tens of lines and well over a hundred.
      #     No number is recorded because it grows with history (Decision 10);
      #     the shape is that only `--oneline -s` gives you one line per commit.
      #   - PLAIN `git log -S` RETURNS NOTHING here. The combined line was produced
      #     by a conflict resolution inside a merge and git omits merge diffs by
      #     default, so the obvious form is fail-open and reads as "refuted".
      #   - Keep the path filter. Unfiltered, the same query also matches PRD
      #     documents that merely quote the string.
      #
      # The chain is 224b5349 (2026-07-25, on the PRD #98 wave-3 branch, where
      # PRD #98's -count=1 and PRD #108 M4's -race were resolved onto one command)
      # then 77cb96e4 (2026-07-26, which is when MAIN got it). -race itself
      # predates both, as `go test -race ./...` in 8f1b0c9b.
      #
      # MEASURED at 1778f359: M1 moving this command out of .gitlab-ci.yml is NOT a
      # hit. The comment left behind there still quotes the string, so its
      # occurrence count went 1 -> 1 and `-S` sees no change. The chain head is
      # therefore still 77cb96e4, not the move. Fragile in one direction: reword
      # that CI comment so the string disappears and this commit becomes the newest
      # hit. Read the chain, not the head, either way.
      #
      # Live-DB (*LiveDB) tests are NOT covered here - they self-skip without
      # UZI_TEST_DATABASE_URL, and go RED if you export it for this run (the
      # package binaries race one shared database). Run those via
      # `./e2e/run-store-it.sh`, which carries `-p 1` for the same reason.
      - go test -race -count=1 ./...

  # ------------------------------------------------------ controller (Go) -----
  fmt-check:controller:
    desc: gofmt -l over the controller module (fails on drift, naming the files)
    dir: controller
    cmds:
      # Same recipe, same bans, same reasons - read fmt-check:api's comment before
      # editing either. This module was ALREADY gofmt-clean when PRD #103 M2 landed
      # (measured 2026-08-02 at 755861e8, go1.26.5: `gofmt -l ./controller` empty
      # while ./api listed 16 files); the target exists to keep it that way. It
      # ships with an empty backlog, which is not the same thing as a no-op.
      - 'out="$(gofmt -l .)" || exit 2; [ -z "$out" ] || { echo "$out"; exit 1; }'

  vet:controller:
    desc: go vet over the controller module
    dir: controller
    cmds:
      - go vet ./...

  build:controller:
    desc: go build over the controller module
    dir: controller
    cmds:
      - go build ./...

  lint:controller:
    desc: golangci-lint over the controller module (RATCHETED to origin/main - see .golangci.yml)
    dir: controller
    cmds:
      # Same recipe, same config, same reasons - READ lint:api's comment before
      # editing either, INCLUDING the paragraph on why the pre-flight predicate is
      # `git merge-base` and not `git rev-parse`. One root .golangci.yml serves both
      # modules: golangci-lint
      # walks UP from its working directory, and `dir:` here is what puts it inside
      # the module. Verified from BOTH module directories before this shipped -
      # `golangci-lint config path` prints `../.golangci.yml` from each, and the
      # control run matters as much: before the file existed the same command
      # printed `No config file detected`, so nothing stray was being resolved from
      # outside the repo.
      #
      # This module ships with a SMALL backlog, not an empty one: 5 findings
      # uncapped (3 staticcheck, 2 errcheck) as of 2026-08-02. Ratcheted it reports
      # 0 today, which is not the same thing as there being nothing there - run
      # `task lint:controller:all` to see it.
      - 'git merge-base "origin/main" HEAD >/dev/null 2>&1 || { echo "lint: no merge-base between origin/main and HEAD - either the ref is missing, or this is a SHALLOW clone whose history does not reach a common ancestor. golangci-lint would NOT skip the ratchet - it reports the ENTIRE unfiltered backlog (exit 1) behind one buried warning line, which reads as a huge new regression. Fix the history first (CI: GIT_DEPTH=0 plus an explicit git fetch; locally: git fetch origin main, and git fetch --unshallow origin if the clone is shallow)." >&2; exit 2; }'
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 config verify
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  lint:controller:all:
    desc: controller - the UNFILTERED lint backlog; not in any gate, but it EXITS NONZERO
    dir: controller
    cmds:
      # Exits nonzero whenever it reports anything, exactly like lint:api:all -
      # read that target's first paragraph before wrapping either, and its
      # `cache clean` paragraph before deleting the line below as redundant.
      #
      # See lint:api:all for why the empty `--new-from-merge-base=` is the only
      # spelling that clears the config's ratchet, and why both cap flags are
      # required. THIS is the module where the caps make no difference (5 either
      # way) - which is exactly why a "do the caps matter?" check must be run
      # against `api`, not here.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 cache clean
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --new-from-merge-base= --max-issues-per-linter=0 --max-same-issues=0 ./...

  deadcode:controller:
    desc: controller - unreachable functions, gated against controller/.deadcode-baseline (EMPTY)
    cmds:
      # Same script, same pin, same reasons - read deadcode:api's comment before
      # editing either. This module reported ZERO findings under the gating
      # invocation when M4 landed, so nothing was deleted to reach zero here; the
      # target exists to keep it there. An empty backlog is not the same thing as
      # a no-op (fmt-check:controller shipped under the same argument).
      - ./scripts/deadcode-gate.sh controller golang.org/x/tools/cmd/deadcode@v0.48.0

  deadcode:controller:all:
    desc: controller - unreachable funcs WITHOUT -test; reported, never gating, ALWAYS EXITS 0
    dir: controller
    cmds:
      # Exits 0 even when it reports - see deadcode:api:all's first paragraph, and
      # do not "fix" that by wrapping this target.
      #
      # THIS MODULE IS THE ONE THAT MAKES THE COMPANION'S CASE. It reads 0 under
      # the gate and FOUR here (`SpecHashOf`, `SizeNames`, `TemplateNames`,
      # `keys`), and all four are the write-it/test-it/never-wire-it shape: three
      # are exported, so `golangci-lint unused` does not report them, and the
      # fourth is called by two of the other three within its own package, so
      # `unused` considers it used. Nothing else in the gate sees them.
      - go run golang.org/x/tools/cmd/deadcode@v0.48.0 ./...

  test:controller:
    desc: controller unit tests (-count=1)
    dir: controller
    cmds:
      # -count=1 is load-bearing BY CONSTRUCTION here, not by analogy with the
      # api gate: every contract golden this module tests against lives in the
      # OTHER module, above its own root -
      # internal/protocol -> ../../../api/internal/hostedsvc/testdata/controller_poll_wire.json
      # internal/preset   -> ../../../api/internal/hostedsvc/testdata/{hosted_sizes,hosted_templates}.json
      # Those cross-reads ARE the gate on the wire format, so a `(cached)` run
      # silently retires the only check on it.
      - go test -count=1 ./...

  # ------------------------------------------------------------- web (npm) ----
  lint:web:
    desc: oxlint over web/src (correctness + react-hooks/rules-of-hooks)
    dir: web
    cmds:
      # DELEGATES TO package.json's `lint` SCRIPT, as this file's header requires
      # of every npm target: a target that reimplements the command drops whatever
      # flags the script encodes, SILENTLY. Here that is not hypothetical - the
      # script carries BOTH halves of this gate's severity, and each is a documented
      # silent-no-op if dropped:
      #
      #   --config .oxlintrc.json   oxlint WALKS UP for .oxlintrc.json, so without
      #                             an explicit --config a stray root config would
      #                             silently govern both packages; and with the file
      #                             renamed or deleted, a bare `oxlint src` reverts
      #                             to the WARNING tier and exits 0 on a real
      #                             violation, while --config exits 1 with
      #                             `Failed to parse config … NotFound`.
      #   -D correctness            🔴 `oxlint src` EXITS 0 WHILE REPORTING
      #                             FINDINGS. correctness defaults to WARNING
      #                             severity and warnings do not set the exit code,
      #                             so a target without this flag is a lint job that
      #                             CAN NEVER FAIL. Measured: the bare invocation
      #                             exits 0 on web's 6 findings.
      #   --report-unused-disable-directives-severity=error
      #                             🔴 A SUPPRESSION THAT NO LONGER SUPPRESSES
      #                             ANYTHING IS INVISIBLE WITHOUT THIS, and it reads
      #                             to every later reviewer as a live, justified
      #                             one. That is the vacuous-negative class arriving
      #                             through a COMMENT instead of an assertion - the
      #                             same shape .claude/agent-team.md records for a
      #                             negative assertion on retired copy. This MR ships
      #                             11 new directives, so the exposure is its own.
      #                             Measured on this tree: a directive for a rule
      #                             that does not fire gives rc=1 and `Unused
      #                             eslint-disable directive (no problems were
      #                             reported)`, while the SAME tree without the flag
      #                             gives rc=0 and prints nothing. The plain
      #                             `--report-unused-disable-directives` form only
      #                             WARNS, and a warning does not set the exit code
      #                             here either - the `-severity=error` suffix is
      #                             the whole point. Verified it does not fire on
      #                             any of the 13 live directives in this repo.
      #
      # AND THIS FLAG IS NOT THE GUARD FOR `rules-of-hooks`, which is what this
      # milestone exists for: that rule is `pedantic`, not `correctness`, so
      # `-D correctness` cannot reach it. Its severity is promoted at RULE level in
      # web/.oxlintrc.json. Read that file; Task's echo shows only `npm run lint`,
      # so neither of these lives anywhere the echo can protect.
      #
      # NEVER A BARE `npx oxlint`: npx FETCHES FROM THE NETWORK when the dep is
      # missing, which a gate may not do. `npm run` puts node_modules/.bin on PATH
      # and fails closed with `command not found` instead.
      - npm run lint

  deadcode:web:
    desc: knip over web - unused files, exports, deps (see web/knip.jsonc for staging)
    dir: web
    cmds:
      # DELEGATES TO package.json's `knip` SCRIPT, as this file's header requires of
      # every npm target. That script is a BARE `knip` on purpose: every flag lives
      # in `web/knip.jsonc`, so there is nothing here for a rewrite to drop
      # silently, and `web/package.json` (a documented three-way contention point
      # across this PRD's milestones) carries the smallest possible line.
      #
      # NEVER A BARE `npx knip`: npx fetches from the network when the dep is
      # missing, which a gate may not do. `npm run` puts node_modules/.bin on PATH
      # and fails closed with `command not found`.
      #
      # 🔴 WHAT GATES AND WHAT DOES NOT, because a green here does NOT mean "no
      # unused exports". `web/knip.jsonc` stages `exports`/`types` and the rest of
      # that family at `warn`, and WARN-SEVERITY ISSUES ARE PRINTED IN FULL AND DO
      # NOT SET THE EXIT CODE. As of 2026-08-02 that is 22 findings on this package
      # (9 exports + 13 exported types), reported on every run and gating nothing;
      # unused FILES and DEPENDENCIES gate at zero. `--max-issues` is NOT a fallback
      # for the warn tier - measured, it counts error-severity issues only and exits
      # 0 with the warn findings printed. Burning the export tier down and promoting
      # it to `error` is issue #206, not this milestone.
      #
      # 🔴 AND NEVER ADD `--fix`. knip's fix mode edits files in the repo (it strips
      # `export` keywords, and with --allow-remove-files deletes files). Nothing in
      # the gate may be a fixing variant - the same rule that makes the format slot
      # `fmt-check` rather than `fmt`.
      - npm run knip

  check-docs:web:
    desc: docs frontmatter + relative-link lint
    dir: web
    cmds:
      - npm run check-docs

  typecheck:web:
    desc: tsc --noEmit over web
    dir: web
    cmds:
      - npm run typecheck

  test:web:
    desc: web unit tests (vitest)
    dir: web
    cmds:
      # No cache flag needed: vitest has no result cache of the kind Go's test
      # cache is, and the same fixture mutation reddens it with no flag at all.
      # The two halves of this repo are NOT symmetric here.
      - npm test

  # ----------------------------------------------------------- agent (npm) ----
  lint:agent:
    desc: oxlint over agent/src and agent/test (correctness tier)
    dir: agent
    cmds:
      # Delegates to package.json's `lint` script for the same reasons lint:web
      # does - read that target's comment, both flags are load-bearing there too.
      # One difference worth knowing before you copy this: agent/.oxlintrc.json
      # does NOT list the `react` plugin, because this package has no React. Its
      # findings come from the unicorn/typescript/oxc defaults, which that file
      # re-lists because `plugins` REPLACES the default list rather than extending
      # it.
      #
      # Scoped `src test` rather than `src`: unlike web/, this package's tests live
      # OUTSIDE src/, and 7 of its 10 baseline findings are in test/.
      - npm run lint

  deadcode:agent:
    desc: knip over agent - unused files, exports, deps (see agent/knip.jsonc for staging)
    dir: agent
    cmds:
      # Same delegation, same bans, same staging - read deadcode:web's comment
      # before editing either. Two differences specific to this package:
      #
      #   - the debt is LARGER: 53 warn-tier findings as of 2026-08-02 (35 exports +
      #     18 exported types) against web's 22.
      #   - `agent-browser` is in `ignoreDependencies`, because it is resolved BY
      #     PATH at runtime rather than by an import. `agent/knip.jsonc` states why;
      #     deleting that line makes knip demand the removal of a dependency the
      #     worker image genuinely needs.
      - npm run knip

  typecheck:agent:
    desc: tsc --noEmit over agent
    dir: agent
    cmds:
      - npm run typecheck

  test:agent:
    desc: agent unit tests (node --test via tsx)
    dir: agent
    cmds:
      # `npm test` and NOT a bare `node --test`: agent/package.json's test script
      # carries `--test-timeout=30000`, and node's own default is NO timeout at
      # all. The cap is live (a 3s body under --test-timeout=1000 is cancelled),
      # but on node v26.4.0 a bare `node --import tsx --test test/*.test.ts` does
      # NOT hang -- measured identical to `npm test` (1059 pass, 0 fail, both
      # forms) -- because every test body in this suite finishes in under a
      # second; test/judge-runner.test.ts's unrefed 60s timer only holds process
      # WALL TIME down (454ms vs 60263ms), which --test-timeout does not govern.
      # So delegating here is insurance against a future slow test, not a fix for
      # a hang this suite has today. Rewriting this line as a direct node call
      # still drops the flag silently, which is the reason to delegate regardless.
      - npm test
