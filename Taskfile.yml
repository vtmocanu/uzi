# uzi's quality gate, in one file (PRD #103 M1).
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR EVERY GATE RECIPE. `CLAUDE.md`, the
# `.claude/agent-team.md` paste-block and the `.claude/agents/*` tails name TARGETS
# from here and never restate a command line. A stale target name dies loudly
# (`task: Task "gate:api" does not exist`, nonzero exit); a stale pasted command
# line still runs, still prints `ok`, and is reported green. This repo's whole
# documented failure history is silent-green over loud-red.
#
# SELF-CONTAINED ON PURPOSE. The GATE is readable here without resolving anything:
# no gate target (`gate`, `gate:*`, or any target they call) includes or depends on a
# remote taskfile. The exceptions are the `brew:` and `brew-rc:` includes below (see rule
# 3) -- both LOCAL vendored copies of the same reusable brew mechanic (tracking an upstream
# SHA), reached by no gate target (only the release path and the local brew-local-test.sh
# harness invoke them).
#
# 🔴 FOUR TASKFILE FEATURES ARE BANNED IN THIS FILE. One list, so the next reader
# sees all of them at once. Each is one line to avoid and expensive to retrofit.
#
# 1. NO `sources:`, `generates:` OR `status:` ON ANY TARGET. A fingerprinted
#    target prints `Task "x" is up to date`, exits 0 and executes nothing -
#    output indistinguishable from a passing run. That is the exact silent-green
#    failure `CLAUDE.md` mandates `-count=1` against at both Go gates, and
#    `checksum` has the SAME cross-module blind spot as Go's test cache: this
#    repo's gates deliberately read `fixtures/judge-fidelity/{cases,expected}.json`
#    at the repo root and `api/internal/hostedsvc/testdata/` from outside the
#    module under test, so a `sources:` glob over one module cannot see them
#    change. `.task/` is gitignored (its own entry in `.gitignore`), so CI would
#    always run cold
#    while a contributor's `task gate` silently skipped. If some future target
#    must carry `sources:` for an unrelated reason, it also carries `method: none`.
#
# 2. NO `dotenv:`. Task loads the named env files into EVERY target's
#    environment. `.env` is gitignored (its own entry in `.gitignore`) and root
#    `CLAUDE.md`
#    spends a section on compose ranking shell environment above `--env-file`, so
#    a `dotenv: ['.env']` here would silently inject a developer's real secrets
#    into every gate target - including whatever a future milestone adds.
#
# 3. NO `includes:` IN THE GATE, and the sharp edge is the remote form
#    specifically. Task 3.x can include a taskfile over https, which is unpinned
#    remote code; the danger is that reaching a gate target. `.gitignore` already
#    carries a "Task remote-include cache" comment, so the mechanism is one line
#    from being invited back. The self-contained rule above is the style reason;
#    this is the security one.
#
#    THE SANCTIONED EXCEPTIONS are the `brew:` and `brew-rc:` includes below
#    (owner-approved 2026-08-17): both reuse `./homebrew-tap.yml`, a VENDORED copy of the
#    reusable mechanic the sibling formulae (cc-statusline, fj-queue) share. It is
#    deliberately NOT the remote form the siblings use, and the reason is THIS rule: Task
#    resolves an include EAGERLY on every `task` call, so a `{{if .CI}}` remote include
#    would fetch over the network on every GATE job in CI (and fail there without
#    TASK_X_REMOTE_TASKFILES). Vendoring keeps them (a) reached by no gate target -- only
#    the release path renders both via .github/workflows/brew.yml, with offline
#    render coverage in scripts/brew-local-test.sh; (b) local, so no network and no
#    remote code touches any run; (c)
#    reviewable in-repo. To update, diff against the upstream file named in its header and
#    bump that SHA.
#
# 4. NO DYNAMIC ROOT `vars:` (`vars: {X: {sh: ...}}`). Those execute on every
#    invocation, including unrelated targets and a bare `task --list`. Not a hole,
#    but it puts a shell command on the path of everything.
#
# 🔴 AND NEVER SPLICE A VARIABLE UNQUOTED INTO A `cmds:` LINE. Task templates are
# Go `text/template` and the result reaches `sh -c` unquoted, so a
# `{{.CI_COMMIT_BRANCH}}` or `{{.CLI_ARGS}}` inside a command is injectable by
# anyone who can push a branch (branch names may contain `;`, `$`, backticks). M1
# needs neither. Stated here because M6's coverage measurement is where the
# temptation first appears.
#
# SERIAL, NOT CONCURRENT - a recorded decision, not an oversight. `gate` and each
# `gate:*` call their components through `cmds:` (sequential) rather than `deps:`
# (concurrent). Reason: CPU contention is an already-measured flake source here.
# `web/vite.config.ts` raised `testTimeout` to 20000 because "under full-suite CPU
# contention, THREE unrelated tests each timed out once across ~20 runs"; running
# two Go modules and `node --test` alongside vitest makes that strictly worse. The
# gate's job is a trustworthy verdict, not a fast one.
#
# `output: prefixed`, NOT `output: group`, and the two are not interchangeable.
# Serial execution (above) already removes the interleaving `group` exists to fix,
# so `group` would buy nothing and cost streaming. Measured on task 3.51.1, log
# read at t=1.5s into a target that prints EARLY, sleeps 3s, prints LATE:
#
#   group        task: [a] sh -c '...'                  <- EARLY ABSENT, buffered
#   prefixed     task: [a] sh -c '...'   [a] EARLY      <- streams
#   interleaved  task: [a] sh -c '...'   EARLY          <- streams
#
# Two costs `group` would have imposed. Locally, `task gate:api` would print
# NOTHING for the whole `go test -race` run - 41s wall per the retired GitLab
# pipeline's own measurement - then dump, which is a regression against today's streaming
# `go test`. In CI it is worse: every gate job sets `interruptible: true`, so a
# cancelled or timed-out job under `group` loses ALL buffered diagnostic output. A
# gate that discards its evidence on timeout is the failure class this PRD exists
# to remove. `prefixed` keeps the per-task disambiguation that both `CLAUDE.md`
# and `.claude/agent-team.md` need for reading NAMED failing tests, and streams.
#
# `task`'s OWN EXIT CODE IS 201, NOT THE UNDERLYING COMMAND'S. Measured on task
# 3.51.1: a component exiting 7 surfaces as `task: Failed to run task "gate": ...
# exit status 7` with rc=201. Anything reading `$?` NUMERICALLY must know this;
# `!= 0` is still a correct failure test.
#
# AND 201 IS NOT THE ONLY NONZERO. `201` means a target RAN AND FAILED; `109`
# means task never got that far, because THIS FILE DID NOT PARSE - and that one
# is LOUD AND SELF-LOCATING. Measured 2026-08-02 while editing this file, task
# 3.51.1: a `desc:` reading `... modules (fail-fast: stops at the first module)`
# puts a bare `: ` inside a plain YAML scalar, which is illegal. `task --list`,
# `--list-all`, a named target and a bare `task` ALL return 109 and all print
#
#   task: Failed to parse Taskfile.yml:
#   yaml: line 191: mapping values are not allowed in this context
#
# naming the file and the line you just edited. Still: parse this file after
# touching it, because a `desc:` is the one place a stray `: ` looks harmless.
#
# (Corrected same day. This paragraph first said `1`, and said every target
# disappears at once so the symptom does not resemble its cause. BOTH WRONG, and
# the second is backwards. The `1` came from `python3 -c "import yaml..." && task
# ...; echo $?` -- the YAML library exits 1, the && short-circuits, task NEVER
# RUNS, and python's code was reported as task's. Reporting-failure form (1) in
# CLAUDE.md's gate-status entry, committed inside a note about exit codes.)
#
# NO DEPENDENCY INSTALL STEP, DELIBERATELY - WITH ONE EXCEPTION SINCE PRD #103 M3,
# NAMED HERE BECAUSE AN UNQUALIFIED CLAIM IS WORSE THAN A QUALIFIED ONE.
# `lint:api` / `lint:controller` acquire golangci-lint through
# `scripts/golangci-lint.sh` with the static `GOLANGCI_LINT_VERSION` argument
# (PRD #230 M5): a curl + sha256-verified release archive, cached under
# $HOME/.cache and freshly extracted before each execution. It replaced
# `go run …golangci-lint@v2.12.2`, which COMPILED that tool from source on a cold
# cache - 51.6s, the pipeline's cold long pole. So there is still a FETCH but no
# compile (~1-2s to download+verify, not 51.6s), and it still writes nothing to
# either go.mod. "Installs nothing" remains false as stated: it fetches a binary.
# Everything else still holds: no `npm ci`, no `go mod download`.
# CI does that in .github/workflows/ci.yml's setup steps (`npm ci`); locally your `node_modules`
# is expected to exist. `cd agent && npm ci` in particular has a documented
# host-wide side effect (it rewrites `/opt/homebrew/bin/agent-browser`), so this
# file must never trigger one as a side effect of running a test.
#
# THE npm TARGETS DELEGATE TO THE EXISTING SCRIPT AND MUST KEEP DOING SO. A target
# written `npm test` inherits whatever flags `package.json` already encodes; a
# target that reimplements the command drops them SILENTLY. The live instance is
# `test:agent`: `agent/package.json`'s test script carries `--test-timeout=120000`
# and node's own default is NO timeout. A target that reimplements the command
# drops the flag silently. See `test:agent` below for why the cap is 120000 and
# not the 30000 it shipped with -- and for why what that number GOVERNS is
# different on the CI node major than on the dev laptop's. This is the same "a future simplify-the-gate edit"
# hazard as `-race`/`-count=1`, arriving through `package.json` instead of
# .github/workflows/ci.yml. Before wrapping any npm script, read it for flags first; if you
# must spell out the underlying command, re-add every flag the script carried and
# say in the comment that you are re-adding it because the target bypassed the
# script, not that the script never had it.
#
# NOT SILENT, DELIBERATELY. Task echoes each command before running it, so the
# gate's own output shows `-race`, `-count=1` and `--test-timeout=120000` actually
# being passed. That echo is how a teammate notices a load-bearing flag going
# missing, which is the failure mode this milestone is most exposed to.
#
# NO `-buildvcs=false` HERE. It is a local-only workaround for VCS stamping in a
# linked git worktree and must not be committed. If you hit it, export
# `GOFLAGS=-buildvcs=false` in your shell - Go applies it to build/vet/test with
# no change to this file.

version: '3'

output: prefixed

# Static and quoted at every use. Task renders the value before echoing each
# command, so the resolved pin stays visible without accepting shell input.
vars:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: "v8.30.1"
  # renovate: datasource=github-releases depName=golangci-lint-taskfile packageName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.14.0
  # The pinned OpenAPI diff tool behind check:api-v1-compat (PRD #1908 Decision 11). Passed to
  # scripts/oasdiff.sh as an ARGUMENT, like the golangci-lint pin above, so `task`'s echo shows the
  # resolved version. The wrapper carries the per-arch sha256 pins and refuses any other version.
  # renovate: datasource=github-releases depName=oasdiff-taskfile packageName=oasdiff/oasdiff
  OASDIFF_VERSION: v1.33.0

# THE TWO SANCTIONED INCLUDES (rule 3), and they are LOCAL, not remote. Both reuse
# `./homebrew-tap.yml`, a VENDORED copy of vtmocanu/task's reusable brew mechanic (see its
# header for the upstream SHA). Task resolves includes EAGERLY on every `task` call, so a
# remote include would fetch over the network on every gate job in CI and break them; a
# vendored local file resolves identically everywhere with no network and no remote code.
# It provides Homebrew formula render + tap publish, reached by no gate target: `brew:` is
# run by .github/workflows/brew.yml on stable tags, while `brew-rc:` runs on both
# stable and RC tags, advancing only to a newer version (issue #2180). Both have
# offline render coverage in scripts/brew-local-test.sh. The formula BODIES
# are Formula/uzi-cli.rb and Formula/uzi-cli-rc.rb (two templates with url/sha256
# placeholders); the rendered copy lands in the tap.
includes:
  brew:
    taskfile: ./homebrew-tap.yml
    vars:
      NAME: uzi-cli
      GH_REPO: vtmocanu/uzi
      TAP_REPO: vtmocanu/homebrew-tap
      FORMULA_TEMPLATE: Formula/uzi-cli.rb
  brew-rc:
    taskfile: ./homebrew-tap.yml
    vars:
      NAME: uzi-cli-rc
      GH_REPO: vtmocanu/uzi
      TAP_REPO: vtmocanu/homebrew-tap
      FORMULA_TEMPLATE: Formula/uzi-cli-rc.rb

tasks:
  # ---------------------------------------------------------------- composed --
  default:
    desc: List the gate targets
    cmds:
      - task --list

  # NOT a gate target and NOT under gate: it WRITES the tree (a .env with fresh
  # secrets) and is a convenience entry point for the laptop dev loop, not a check.
  # The script is the source of truth (docs point at it directly for the no-`task`
  # new-user path); this just gives `task init` the same one-liner. Generate-once:
  # re-running is a no-op when .env exists (issue #894).
  init:
    desc: generate the local docker-compose secrets into .env once (no-op if .env exists)
    cmds:
      - ./scripts/init-env.sh

  gate:
    desc: The whole gate, repo-wide checks then every component, serially
    cmds:
      # gate:repo FIRST (PRD #103 M5), on the same cheap-first principle gate:web
      # already states for oxlint: none of its checks needs a build, a node_modules
      # or a toolchain warm-up, so a contributor who has broken a shell script
      # learns it before test:api starts rather than four minutes later.
      #
      # THE "SECONDS" HALF OF THAT ARGUMENT NARROWED WHEN MR-B ADDED `scan:secrets`,
      # and it is narrowed here rather than left reading as it did: three of the
      # four are sub-second, the gitleaks pass measured 5.7-42s across runs on one
      # host. It stays first because the cheap three still run first WITHIN
      # gate:repo and the expensive one is ordered last there -- so the fast
      # feedback is unchanged and the cost lands before, not instead of, a 43-66s
      # `gate:api`.
      #
      # AND IT IS A LIST MEMBER RATHER THAN A NEW SLOT INSIDE EACH gate:*, because
      # its checks are FUNCTIONS OF THE TREE and have no component. Splitting
      # shellcheck four ways would need a per-component file scope, which is exactly
      # the hand-maintained glob list M5 replaced with `git ls-files`.
      - task: gate:repo
      # A gate member, not a gate:repo member (PRD 1265 M1): it builds a multi-commit
      # git repo, so it does not belong in gate:repo's sub-second offline band, but it
      # IS a function of the tree (the release scripts) with no component, so it rides
      # here right after gate:repo rather than inside a gate:<component>.
      - task: test:release-scripts
      - task: gate:api
      - task: gate:controller
      - task: gate:web
      - task: gate:agent

  gate:repo:
    # 🔴 THIS TARGET EXISTS BECAUSE "IT RUNS FROM A TASK TARGET" IS NOT THE
    # DEFINITION OF DONE -- "IT IS REACHABLE FROM `task gate`" IS. The composed
    # slot targets in this file (`lint`, `fmt-check`, `deadcode`) are ENTRY POINTS,
    # not members of `gate`: `gate` calls the four `gate:*` targets and each of
    # those names its slots individually, so nothing in `gate`'s transitive closure
    # calls `lint`. Confirmed empirically rather than by reading -- `task --dry
    # gate` echoed 21 targets and `lint` was not among them.
    #
    # That matters here because the `lint:` target's own comment told M5 to append
    # `lint:shell` and `lint:yaml` "to this same list", and following it literally
    # and stopping there produces two gate targets that `task gate` NEVER RUNS.
    # They are appended there too (it is the right entry point), but THIS is the
    # edge that makes them gate.
    #
    # THE SEAM HELD. `scan:secrets` (gitleaks, PRD #103 M5 MR-B) joined this list
    # and nothing else changed -- not `gate`, not the `lint:repo` CI job, which
    # invokes this target rather than its members, and not either `needs:` list.
    # That was the design claim when the seam was written and it is recorded here
    # as having been paid off, because a one-line extension point that turns out to
    # need a two-list `needs:` edit is this repo's signature failure shape.
    #
    # 🔴 ORDER IS CHEAPEST-FIRST AND `scan:secrets` IS LAST BECAUSE IT DOMINATES.
    # Measured across seven runs on one host 2026-08-03: the three lint targets are
    # sub-second each, and gitleaks' pass over the 1464 tracked files ranged 5.7s to
    # 42s -- an eightfold spread on an UNCHANGED tree, so it tracks the filesystem
    # cache rather than anything a reader can act on. Do not treat any single
    # figure here as the number; the SHAPE (three that are instant, one that is not)
    # is what decides the order. So `gate:repo` is no longer "three checks that are
    # seconds", and `gate` above still calls it FIRST: a contributor with a broken
    # shell script still learns it in the first second, and the scan's cost lands
    # before rather than instead of a 43-66s `gate:api`.
    desc: repo-wide checks that belong to no component
    cmds:
      - task: lint:shell
      - task: lint:yaml
      - task: check:skill-triage-render
      # A web test importing an uncopied fixture passes gate:web but breaks the web image build (#2602).
      - task: test:web-docker-fixtures
      - task: check:web-docker-fixtures
      - task: lint:formula
      # Workflow linting (actionlint + zizmor). Grouped with the other lint:* checks;
      # like them it fail-open SKIPs when its tools are absent on a laptop and is
      # forced (UZI_LINT_ACTIONS_REQUIRED) in the lint-repo CI job.
      - task: lint:actions
      # Composite-action embedded-shell linting (issue #948): shellchecks the `run:`
      # blocks of .github/actions/**/action.yml, the one class lint:shell and
      # lint:actions both miss. Same fail-open/REQUIRED contract, same UZI_LINT_ACTIONS_REQUIRED.
      - task: lint:actions:embedded
      # Hermetic fake-tool regression suite for the golangci-lint downloader and
      # build-Go guard: no network and no real release binary. It protects the
      # archive-cache trust boundary and the go/toolchain compatibility seam.
      - task: test:golangci-wrapper
      # Hermetic tests of the oasdiff wrapper's verified-archive cache (PRD #1908 M5): fake
      # curl/uname, a real fixture tarball, no network. Same protection as the line above.
      - task: test:oasdiff-wrapper
      # Hermetic exit-code contract for the compat gate below (fake oasdiff wrapper, throwaway
      # git repos): proves it fails closed when origin/main is unreachable and that its
      # liveness canary is required.
      - task: test:api-v1-compat-check
      # Hermetic exit-code contract for the sqlc-drift gate (scripts/sqlc-drift-gate.sh):
      # a fake `go` + throwaway repos, no real sqlc and no network, proving 2/1/0 fire so
      # a gutted check cannot read green. The REAL drift check runs in gate:api, not here.
      - task: test:sqlc-drift-gate
      # Hermetic contract for the mirror.gcr.io-then-Docker-Hub image pull CI uses
      # (scripts/docker-pull-fallback.sh): a fake `docker`, no network.
      - task: test:docker-pull-fallback
      - task: test:cosign-sign-retry
      # Hermetic cleanup-ownership contract for the opt-in test:web-nginx script
      # (scripts/assert-web-nginx.sh): fake docker/helm/yq, no network.
      - task: test:web-nginx-cleanup
      # Hermetic fetch-retry contract for scan:secrets (scripts/scan-secrets.sh): a
      # fake `go install` failing then succeeding, no real gitleaks and no network,
      # proving a transient proxy failure is retried while a broken scan is not.
      - task: test:scan-secrets
      # Hermetic extraction and ordered package-rule regression for the three
      # golangci aliases and the outer Go-toolchain group. No registry lookup.
      - task: test:renovate-go-toolchain
      - task: test:renovate-codex-runtime
      - task: test:forge-fake
      # Hermetic bot-provisioning regressions (issues #2010 and #2016): fake glab,
      # no network, covering host selection, JSON, PAT headers and safe diagnostics.
      - task: test:create-gitlab-bot
      # hermetic (~instant): a fake `docker` on PATH, no daemon touched. It guards
      # the destructive e2e leaked-project reclaim's selection contract so a future
      # edit that would tear down the wrong project reddens here instead of on a host.
      - task: test:e2e-reclaim
      # hermetic sibling of test:e2e-reclaim (PRD #966 M2): a fake docker/curl/psql, no
      # daemon. It exercises the e2e phase-registry driver's fail-soft/quarantine/provides
      # semantics AND guards the tally (>= 8 cases, c == p) so a gutted driver test cannot
      # read green. Before `scan:secrets`, which is deliberately last because it dominates.
      - task: test:e2e-driver
      # hermetic (~instant): extracts lib.sh's _psql_strip_tags and asserts a psql DML command tag
      # welded onto / bled into a db_psql scalar read is stripped (#1351). Tally-guarded like the two
      # siblings above so a gutted run cannot read green.
      - task: test:e2e-lib
      # Docker-free diagnostic regressions for the worker UID lane (#2397).
      - task: test:worker-uid-harness
      # hermetic (~instant): a fake `docker` on PATH, no daemon. Guards that
      # run-store-it.sh's teardown removes the throwaway Postgres ANONYMOUS VOLUME
      # (`docker rm -v`); the missing `-v` leaked one pg volume per run and filled
      # the worker's Docker data-root. Before `scan:secrets` (deliberately last).
      - task: test:store-it-cleanup
      - task: test:reset-recovery-tables
      # hermetic (~11s, fake docker, no daemon; Linux-only via `platforms`): the opt-in
      # codex-git-trust wrapper's bind/cleanup/exit-code/signal contract (#1769). Its
      # SIGTERM case waits out the 10s kill grace, so it is not sub-second.
      - task: test:codex-git-trust-wrapper
      # Hermetic end-to-end tests for the repo-local uzi-watcher backup scripts. They use
      # fake uzi/kubectl commands and temporary git repos: no cluster, forge or live backup
      # directory is touched. This gates clone capture, bare-ref fallback, fail-closed
      # publication/exit status, retention pruning and detached-loop terminal pruning.
      - task: test:uzi-watcher-backups
      # Hermetic regressions for the landing scripts: no network, forge or live PR.
      # They pin review routing, fail-closed quota timing and stale-base push behavior.
      - task: test:uzi-lander
      - task: test:ci-safe-paths
      # hermetic (~1s, fake go + gofmt on PATH): fmt-check:api and fmt-check:controller run
      # the module toolchain's gofmt, not a stale PATH gofmt, and still fail closed.
      - task: test:fmt-check-toolchain
      # Offline fake-go contract: govulncheck install and child package loading use
      # the module-selected toolchain, preserving host/target settings and failures.
      - task: test:govulncheck-toolchain
      - task: test:devbox-update
      - task: test:brew-tap-guard
      # cheapest-first: this whole-file duplicate check is sub-second, so it runs
      # before `scan:secrets`, which is deliberately last because it dominates.
      - task: check:spec-numbering
      # Additive-migration guard (PRD #422 M6): also sub-second and offline, so it
      # runs before `scan:secrets` too. Belongs in gate:repo, not a component gate:
      # it is a function of the migration corpus (a tree fact), and the compatibility
      # invariant it protects — an N-1 worker reading a HEAD schema — is cross-cutting.
      - task: check:migration-additive
      # Migration-number collision guard (PRD #500 M1): also sub-second and offline, so
      # it runs before `scan:secrets` too. A tree fact (a duplicate goose prefix panics
      # the runner at boot and in every *LiveDB test), so it belongs in gate:repo.
      - task: check:migration-numbering
      # e2e/README.md registry-table drift guard (PRD #966 M2): reads only the phase-file
      # headers (no docker), regenerates the table and diffs it against the committed
      # README. Sub-second and offline, so it runs before `scan:secrets` too. A tree fact
      # (a new e2e/phases/NN-*.sh file must appear in the generated README table).
      - task: check:e2e-registry-doc
      # Binary/control-byte text-file guard (PRD #500 M2): also sub-second and offline,
      # so it runs before `scan:secrets` too. A tree fact (a NEW text-extension file
      # carrying a raw NUL or other control byte passes lint/typecheck/tests invisibly),
      # so it belongs in gate:repo.
      - task: check:no-binary-text
      # mktemp `-t` portability guard: a `mktemp -t <name>` template with too few X's
      # (GNU needs >=3 consecutive X's) dies on GNU coreutils ("too few X's in
      # template") but passes on BSD/macOS, so it fails only on the Linux worker/CI.
      # Sub-second, offline, index-only -- runs before `scan:secrets` too. A tree fact,
      # so it belongs in gate:repo.
      - task: check:mktemp-portability
      - task: check:postgres-pin-parity
      # Over-cap SKILL.md guard: a repo skill whose SKILL.md exceeds the 65536-byte
      # runtime cap is dropped silently at run time (agent/src/repo-skills.ts:151), so it
      # looks committed but never loads. Sub-second, offline, tree-fact -- runs before
      # `scan:secrets` too. Belongs in gate:repo, not a component gate.
      - task: check:skill-size
      # Per-file byte budgets on loaded agent guidance (AGENTS.md, .claude/rules/*.md), so
      # growth toward the 64 KiB runtime cap is a reviewed edit. Offline tree fact; about 2-3 s
      # locally (macOS, 2026-10-13), nearly all in the hermetic fixture test (the real-tree
      # check is ~0.1 s), so it is not in the sub-second band.
      - task: check:guidance-size
      # /api/v1 backward-compatibility gate (PRD #1908 Decision 11): oasdiff diffs the spec on
      # origin/main against the tree's and fails on any breaking change. It sits here, not in
      # gate:api, because CI's lint-repo job already runs `task gate:repo` (so no
      # .github/workflows edit is needed) and because a breaking spec change is a tree fact,
      # not a Go fact. It fetches origin/main itself when a shallow checkout lacks it, so it
      # needs the network only then and for the cached oasdiff download; a fetch it cannot
      # make fails the gate closed. Before `scan:secrets`, which is deliberately last.
      - task: check:api-v1-compat
      # PR-time CHANGELOG entry gate: a branch changing shipping paths must add a CHANGELOG.md
      # line, carry `Changelog: none`, be docs-typed throughout, or touch only dependency
      # manifests (the release oracle's rules, moved to the PR). Needs a merge-base with
      # origin/main, so CI's lint-repo job checks out full history; fails closed (exit 2)
      # without one. Its hermetic suite runs first so a gutted check cannot read green.
      - task: test:changelog-entry
      - task: check:changelog-entry
      - task: test:livedb-skip-guard
      # CI and the baked worker share one SAST engine (#2093): CI installs the
      # worker lock's semgrep, and this fails if CI grows a pin of its own.
      - task: test:semgrep-parity
      - task: check:semgrep-parity
      - task: test:semgrep-gate
      # Hermetic fixture tests only; aging real prices is advisory and never gates.
      - task: test:pricing-freshness
      - task: test:pricing-freshness-issue
      # Provider-token source-hygiene guard (PRD #1120 M3): an ADDITIONAL, independent
      # check (never a replacement for scan:secrets) that flags a NEWLY-ADDED complete
      # provider-token literal in tracked source EVEN when an inline //gitleaks:allow is
      # present -- GitHub Push Protection honours no such directive and refuses the push.
      # Sub-second, offline, index-only tree fact, so it runs before `scan:secrets` too.
      - task: check:token-literals
      # Offline fixture test of scripts/migration-renumber.sh (issue 1400). The ONE
      # non-sub-second gate:repo member: it builds temp git repos with a local bare
      # origin, so it does not fit gate:repo's offline sub-second band. It is kept here
      # DELIBERATELY -- CI runs `task gate:repo` as a job and separately hardcodes only
      # `test:release-scripts`, so wiring it into gate:repo is what makes it CI-gated
      # WITHOUT editing .github/workflows/** (which this branch must not touch). Ordered
      # before `scan:secrets`, which is deliberately last because it dominates.
      - task: test:migration-renumber
      # #1851: the weekly role refresh (builtins + dev-team roster) is all-or-nothing
      # and never widens the roster; temp repos and stubs, a second or two.
      - task: test:refresh-role-manifest
      # #1720: the agent runtime-base input key must change for every runtime-stage input
      # and refuse any form it cannot account for; a gap there makes a release silently
      # reuse a stale base. Temp git repos, a few seconds.
      - task: test:agent-runtime-key
      # PRD #1493 M3: the Codex command sandbox is a SEPARATE Go module
      # (agent/codex/supervisor, go 1.26.0, vendored/offline) whose tests NO CI job runs
      # today. Wiring test:codex-supervisor here makes the lint-repo job (which runs
      # `task gate:repo` on Linux with Go) reach them WITHOUT a .github/workflows edit --
      # the same "reachable from gate:repo" seam test:migration-renumber uses. The target
      # is `platforms: [linux]`, so a macOS `task gate:repo` skips it rather than failing.
      # Also non-sub-second (it runs `go test`), so it sits before `scan:secrets`.
      - task: test:codex-supervisor
      - task: scan:secrets
      # Whole-tree Go+TS SAST scan (semgrep), BYO fail-open like lint:yaml. Ordered
      # LAST because a whole-tree scan dominates, same as scan:secrets above (PRD #862 M2).
      - task: sast:semgrep

  gate:api:
    desc: api - fmt-check, vet, build, lint, deadcode, test
    cmds:
      # fmt-check FIRST, deliberately. Measured 2026-08-02, go1.26.5 darwin/arm64,
      # warm build cache: `task fmt-check:api` 0.11-0.13s over three runs against
      # 48.7s for this whole gate, so a coder learns about a misformat in the first
      # fifth of a second instead of after test:api's -race compile.
      - task: fmt-check:api
      - task: vet:api
      - task: build:api
      # sqlc drift AFTER build (the tree compiles) and BEFORE the -race test:api:
      # cheapest-first + fail-fast, mirroring CI's validate-api sqlc step so a stale
      # committed codegen is caught locally instead of on the first PR pipeline. The
      # pinned sqlc version is read from ci.yml so local `go run` stays in lockstep
      # with CI's release binary (scripts/sqlc-drift-gate.sh). NOT in gate:repo: it
      # needs the Go toolchain + a warm module cache, unlike gate:repo's offline
      # sub-second checks, and CI's lint-repo runs gate:repo (validate-api already
      # runs this drift check), so gate:repo would only duplicate it at cold cost.
      - task: check:sqlc-drift
      # lint AFTER build and BEFORE test, and the ordering is asymmetric with the
      # npm gates below on purpose (PRD #103 M3). AFTER build because
      # golangci-lint TYPE-CHECKS: on a tree that does not compile it reports
      # `typechecking error` instead of the build error, which is a worse message
      # for the same defect. BEFORE test because it is seconds against test:api's
      # -race run.
      - task: lint:api
      # deadcode AFTER lint, and the ordering has a CALIBRATION consequence that
      # is not obvious from the cost (PRD #103 M4). golangci-lint's `unused`
      # reports unused UNEXPORTED symbols; deadcode reports unreachable functions
      # whether exported or not. So an unexported dead function reddens `lint:api`
      # first and THIS TARGET NEVER RUNS - anyone calibrating the dead-code slot
      # with one demonstrates M3's linter while believing they demonstrated M4's.
      # Measured 2026-08-02: on a two-function scratch module, `unused` reports
      # only the unexported one and deadcode reports both. Calibrate with an
      # EXPORTED symbol. (After build, for the same reason lint is: deadcode
      # loads and type-checks packages, and on a tree that does not compile it
      # exits 1 with a load error rather than a build error.)
      - task: deadcode:api
      - task: test:api

  gate:controller:
    desc: controller - fmt-check, vet, build, lint, deadcode, test
    cmds:
      - task: fmt-check:controller
      - task: vet:controller
      - task: build:controller
      # Same ordering and the same reasons as gate:api above, including why
      # deadcode sits after lint.
      - task: lint:controller
      - task: deadcode:controller
      - task: test:controller

  gate:web:
    desc: web - deps-check, lint, deadcode, check-docs, check-changelog, check-styles, typecheck, test, test-browser
    cmds:
      # 🔴 deps-check FIRST, AND IT DELIBERATELY BREAKS THE CHEAPEST-FIRST ORDER THE
      # REST OF THIS TARGET ARGUES FOR (PRD #103 M5 MR-C). oxlint is ~0.06s and this
      # is ~1-3s, so on cost alone lint would still lead. It goes first because a
      # STALE node_modules does not make the later slots WRONG, it makes them
      # ANSWERS ABOUT A DIFFERENT TREE - lint, knip, tsc and vitest would all run,
      # all pass, and all report on the versions that happen to be on disk rather
      # than the ones this branch declares. A verdict about the wrong tree is worse
      # than a slow one, which is the same argument `gate` uses for putting
      # `gate:repo` ahead of a 51.8s `gate:api`.
      #
      # WHY THIS EXISTS AT ALL: A VERSION BUMP OF A devDependency FAILS SILENTLY,
      # WHERE A NEW ONE FAILS LOUDLY. Carry-forward 12 covers the new-dependency
      # case: `npm run` puts node_modules/.bin on PATH, so a missing binary dies with
      # `command not found`. A BUMP cannot fire that - the binary is already there -
      # so a checkout that skipped `npm ci` runs vitest 2 while the lockfile says 4,
      # green, with nothing naming the mismatch. MR-C ships exactly that bump, so
      # this is its own exposure rather than a general precaution.
      #
      # `npm ls --depth=0` AND NOT A `vitest --version` ASSERTION, measured rather
      # than preferred. It exits 1 with a POSITIVE OBSERVATION NAMING BOTH VERSIONS
      # (`vitest@2.1.9 invalid: "4.1.10" from the root project`), needs no new
      # dependency, and covers EVERY direct dependency rather than the one bump
      # somebody remembered to assert. A `--version` assertion has to be written
      # again for each future bump, and the one nobody writes is the one that bites.
      #
      # IT IS OFFLINE, MEASURED, NOT ASSUMED. With an unreachable registry
      # (`npm_config_registry=http://127.0.0.1:1`) the output is BYTE-IDENTICAL to
      # the clean run and rc stays 0, in both packages. That is what lets it sit in
      # `gate` at all: this file's govulncheck/npm-audit note below excludes those
      # two precisely because their verdict is a function of a remote database, and
      # this one's is a function of the tree.
      #
      # 🔴 THIS CHECK IS TWO LINES, NOT ONE, AND THIS COMMENT DESCRIBED ONLY THE
      # FIRST UNTIL 2026-08-04. `3903e9d7` added a lockfile join precisely to cover
      # the two limits listed below, so a reader who stopped here came away with a
      # narrower view of the gate than it has had since. Corrected rather than
      # deleted, because the limits are still true OF LINE 1 and line 1 is still
      # what runs first. `deps-check:web`'s own comment further down describes both
      # lines; if the two ever disagree again, that one is the definition and this
      # one is the summary.
      #
      # LINE 1, `npm ls --depth=0`, has TWO LIMITS, BOTH REAL. `--depth=0` sees
      # DIRECT dependencies only - a transitive version skew is invisible to it. And
      # it compares node_modules against `package.json` RANGES, not against the
      # lockfile, so a caret range makes it loose: `^4.1.10` is satisfied by 4.9.0
      # and the check would say nothing. That is why MR-C pins `vitest` with
      # `--save-exact`, matching the `oxlint`/`knip` precedent.
      #
      # LINE 2 is a join against the lockfile's RESOLVED versions, which is what
      # covers both of those, and since `4f48085d` it reports ABSENCE as well as
      # skew - the state a `git pull` adding a transitive dependency produces, where
      # line 1 has no declared range to check either.
      #
      # AND ONE STATE WHERE THE CHECK LIES, which is the one a person TESTING this
      # will create: `npm install --package-lock-only` run in place also rewrites
      # `node_modules/.package-lock.json`, after which `npm ls` reports the NEW
      # version while the package on disk is still the old one.
      #
      # 🔴 THAT STATE DEFEATS BOTH LINES, NOT JUST `npm ls`, and this comment blamed
      # line 1 alone. `node_modules/.package-lock.json` is line 2's installed-side
      # oracle, so rewriting it moves what line 2 reads as "installed" too - measured
      # by the Unit B reviewer: on-disk 2.0.2, both lockfiles 2.0.1, gate rc=0 "up to
      # date" (`probes/prd-103-mrc-b-reviewer/p5-deps-check-shared-oracle.txt`).
      # NEITHER line has an independent read of what is actually unpacked on disk.
      # A git pull cannot produce that state; a hand-built repro can. Build the stale
      # state the way a pull does - replace package.json and the lockfile, leave
      # node_modules alone.
      #
      # NOT A CI CHECK, AND THAT DOES NOT VIOLATE SUCCESS CRITERION 1. SC1 reads
      # "CI runs no toolchain check that `task gate` does not" and is one-directional;
      # this is the other direction. CI is structurally unexposed anyway - every npm
      # job's `before_script` is `npm ci`, which reinstalls from the lockfile, so the
      # check would be asserting something CI has just made true by construction.
      - task: deps-check:web
      # lint SECOND here, which is the MIRROR IMAGE of the Go gates above and is
      # deliberate rather than inconsistent (PRD #103 M3). oxlint is measured at
      # ~0.06s, two orders of magnitude cheaper than anything else in this gate,
      # and unlike golangci-lint it is NOT type-aware - so it has no ordering
      # dependency on a build and nothing is gained by deferring it. Same reason
      # M2 put fmt-check first in gate:api.
      - task: lint:web
      # knip SECOND, on the same cheap-first principle: ~1-3s WALL, against
      # ~5s for typecheck and ~10s for vitest. It has no ordering dependency on
      # a build or a typecheck either - knip 6 resolves with oxc-resolver and
      # does not run tsc.
      - task: deadcode:web
      - task: check-docs:web
      - task: check-changelog:web
      - task: check-styles:web
      - task: typecheck:web
      - task: test:web
      - task: test:web-browser

  gate:agent:
    desc: agent - deps-check, lint, deadcode, typecheck, test
    cmds:
      # deps-check first, same placement and the same reasons as gate:web above -
      # read that target's comment, including the two limits and the one state in
      # which `npm ls` lies. This package is the one where the standing remedy for a
      # missing dependency (symlink node_modules rather than install) is unavailable,
      # because `npm ci`/`npm install` here rewrites /opt/homebrew/bin/agent-browser
      # host-wide, so a contributor is MORE likely to be running a stale tree here
      # than in web/ and this check is what names it.
      - task: deps-check:agent
      # lint second, same reason as gate:web (~0.05s here).
      - task: lint:agent
      # knip second, same reason as gate:web (~1-3s wall here too).
      - task: deadcode:agent
      - task: typecheck:agent
      - task: test:agent

  fmt-check:
    # COMPOSES THE TWO PER-MODULE TARGETS; IT DOES NOT RE-SCOPE THEM. There must
    # never be a root-scoped `gofmt -l .` in this file. A repo-root walk descends
    # into dot-directories, and `.go_job` sets GOPATH=$CI_PROJECT_DIR/.go and
    # GOCACHE=$CI_PROJECT_DIR/.gocache and runs `go mod download` before any script
    # line - so in CI a root-scoped gofmt would traverse the populated module cache
    # and red the gate on third-party source. Neither directory is in .gitignore,
    # so nothing else would catch it.
    #
    # FAIL-FAST, NOT A COMBINED REPORT, consistent with `gate` and every other
    # composed target here. Measured with drift in BOTH modules: this dies at
    # fmt-check:api and fmt-check:controller never runs, so one invocation does
    # not enumerate both modules. `desc:` says "over both Go modules" and that is
    # the SCOPE, not a promise of a single combined listing. CI is unaffected -
    # validate:api and validate:controller report independently.
    desc: gofmt -l over both Go modules, fail-fast at the first drifted one
    cmds:
      - task: fmt-check:api
      - task: fmt-check:controller

  lint:
    # EXTENSIBLE, NOT CLOSED — and it composes MORE than fmt-check above does, so
    # do not copy that target's scope along with its shape. `fmt-check` composes
    # TWO targets because only the Go modules have a format check; `lint` composes
    # the four components plus the three repo-wide checks PRD #103 M5 added.
    # Fail-fast for the same reason every other composed target here is.
    #
    # 🔴 APPENDING HERE DOES NOT PUT A TARGET IN THE GATE, and this comment said
    # otherwise by implication until M5 landed. It read "PRD #103 M5 appends
    # `lint:shell` and `lint:yaml` to this same list", which is correct as far as
    # it goes and is a trap if it is the only thing you do: THIS TARGET IS AN ENTRY
    # POINT AND IS NOT REACHABLE FROM `gate`. `gate` calls the four `gate:*`
    # targets, each of which names its slots individually, so `task --dry gate`
    # never echoes `lint`. A milestone that followed the old sentence and stopped
    # would have shipped two gate targets nothing runs. `gate:repo` is the edge
    # that makes them gate; this list is where you find them by name.
    #
    # `lint:formula` is here too even though the old sentence did not name it. It
    # is a lint of a tracked file with no component, which is the same shape as the
    # other two.
    #
    # `scan:secrets` is deliberately NOT here, and this line exists so its absence
    # reads as a decision rather than an omission: it is a secret scan, not a lint,
    # and it is seconds-to-tens-of-seconds where the three repo-wide lints are
    # sub-second. `gate:repo` is where the four repo-wide checks are composed; this
    # list is the seven LINTS.
    desc: lint the four components plus the three repo-wide checks (M5)
    cmds:
      - task: lint:api
      - task: lint:controller
      - task: lint:web
      - task: lint:agent
      - task: lint:shell
      - task: lint:yaml
      - task: lint:formula

  vulncheck:
    # 🔴 THIS SLOT IS THE ONE TARGET FAMILY IN THIS FILE THAT `task gate` MUST NOT
    # REACH, AND THAT IS A RULING RATHER THAN AN OVERSIGHT (PRD #103 M5 MR-C).
    # Every other composed target here (`lint`, `fmt-check`, `deadcode`) is an
    # entry point that happens not to sit in `gate`'s closure because `gate` names
    # slots individually inside each `gate:*`. This one is different in kind: it
    # must be absent from `gate` AND from all five `gate:*` targets, and if a
    # future milestone adds a sixth component gate it must be left out of that too.
    #
    # THE REASON IS THE VERDICT, NOT THE NETWORK, and the distinction matters
    # because the network version of this argument is FALSE here. `task gate` is
    # not offline: `lint:api` (a pinned release archive), `deadcode:api` and
    # `scan:secrets` (`go run` / `go install pkg@version`) all need the network on
    # a cold cache (measured: `task scan:secrets` under GOPROXY=off returns 201
    # with "module lookup disabled"). What separates those from these two is that
    # a pinned fetch gets a checksum-verified artifact ONCE and then answers from the
    # TREE, whereas govulncheck and npm audit query a REMOTE MUTABLE DATABASE on
    # every run. So `task gate` would answer differently on two runs of one commit
    # with nobody's diff in between, and a contributor's gate must be
    # deterministic against the tree. State it this way: the false version invites
    # somebody to "fix" gitleaks out of `gate:repo` on the same reasoning.
    #
    # CI RUNS THESE TARGETS, WHICH IS WHAT KEEPS SUCCESS CRITERION 3 TRUE (gate
    # recipes are defined once, in this file). They are invoked as EXTRA SCRIPT
    # LINES of the four existing per-toolchain jobs -- `lint:api`,
    # `lint:controller`, `validate:web`, `validate:agent` -- exactly the way
    # `deadcode:api` is already a second script line inside the `lint:api` job. No
    # new CI job, so no `.gate_needs` / `.publish_needs` edit.
    #
    # 🔴 AND `lint:api` NAMES BOTH A CI JOB AND A TASKFILE TARGET. That ambiguity
    # is the trap here: the Taskfile target `lint:api` IS reachable from `task
    # gate` (gate -> gate:api -> lint:api), so "fold govulncheck into lint:api"
    # read as the target would put a remote-database query inside every
    # contributor's gate. It is the JOB. When you read a placement claim about
    # this milestone, check which of the two it means.
    #
    # SUCCESS CRITERION 1 IS AMENDED IN THE SAME MR RATHER THAN QUIETLY VIOLATED.
    # It reads "CI runs no toolchain check that `task gate` does not" and carries
    # an explicit exclusion list; these two are toolchain checks in per-toolchain
    # jobs, so they belong on that list. Their exclusion GROUND is different from
    # every existing entry's: the others "cannot run meaningfully from a plain
    # local checkout", while both of these run fine locally -- that is not why they
    # are excluded. The ground is the one stated above.
    desc: dependency-vulnerability scan, all four components. NOT in `gate` -- see comment
    cmds:
      - task: vulncheck:api
      - task: vulncheck:controller
      - task: vulncheck:web
      - task: vulncheck:agent

  deadcode:
    # ONE SLOT, ONE PREFIX, FOUR COMPONENTS (PRD #103 M4). The npm half is knip
    # rather than `deadcode`, and `deadcode:web` is therefore slightly imprecise -
    # knip also reports unused FILES and unused DEPENDENCIES. That is the same
    # imprecision `lint:web` already carries (oxlint is not golangci-lint), and it
    # is preferred to a second prefix: the `dead code` row of the paste-block in
    # `.claude/agent-team.md` is ONE line, and a `knip:web` target would split one
    # slot across two prefixes for a reader who has to type both.
    #
    # WHAT THIS SLOT DOES NOT COVER, stated here because the alternative is a slot
    # implying coverage it lacks: DEAD BRANCHES. `deadcode` finds unreachable
    # FUNCTIONS and knip finds unused EXPORTS/FILES/DEPS; neither can see a `case`
    # arm that nothing reaches inside a live function. The known live example is
    # PRD #99's legacy `case "Task":` arms in `web/src/components/RunEvent.tsx`,
    # still present, and NOT a valid probe for this slot for exactly that reason -
    # it would produce a clean "no findings" from a working tool. Dead branches
    # stay the reviewer's job.
    desc: dead-code detection across all four components (deadcode + knip)
    cmds:
      - task: deadcode:api
      - task: deadcode:controller
      - task: deadcode:web
      - task: deadcode:agent

  # ------------------------------------------------- repo-wide (no component) --
  # The four checks below are FUNCTIONS OF THE WHOLE TREE. They take their scope
  # from the git INDEX rather than from a directory, so adding a script or a YAML
  # file puts it in scope with no edit here -- which is the property a
  # hand-maintained list cannot have, and the reason PRD #103 M5 rejected
  # `e2e/*.sh` + `scripts/*.sh` (those two miss 4 of the 18 tracked shell scripts,
  # including agent/templates/entrypoint.sh, the worker entrypoint that runs in
  # every hosted worker pod).
  #
  # `scan:secrets` takes its GATING scope from the index too, but it gets there
  # the other way round: gitleaks walks the whole tree and the wrapper filters the
  # REPORT against `git ls-files`. It has to, because `gitleaks dir` honours one
  # target and silently widens to `.` on two or more, so a file list cannot be
  # handed to it. The index rule still earns its place -- gitleaks does NOT honour
  # `.gitignore` (measured), so gating on the walk would gate on a contributor's
  # `web/dist`, local `.env` and stale build output, none of which is in CI's
  # checkout. Findings outside the index are printed and do not gate.
  #
  # 🔴 AND `git ls-files '*.sh'` IS NOT ENOUGH EITHER -- IT WAS ALREADY STALE WHEN
  # M5 SHIPPED IT. An extension is a naming convention; a shebang is what the kernel
  # honours. `agent/bin/agent-browser` is tracked, is `#!/bin/sh`, and is COPYd into
  # /usr/local/bin in BOTH worker Dockerfiles -- the shim every `agent-browser` call
  # in every worker pod execs through -- and the glob did not see it.
  # `scripts/lint-shell.sh` therefore unions the glob with a shebang scan, and its
  # own comment claiming a glob "cannot go stale" was corrected in the same commit.
  #
  # 🔴 A MISSING TOOL IS A LOUD SKIP, NOT A FAILURE; A WRONG VERSION IS STILL exit 2.
  # `gate:repo` runs FIRST below, so a hard failure on a tool a contributor has not
  # installed would stop `gate:api`, `gate:web` and every other component gate from
  # running at all -- PRD #103 Decision 2's "a gate people cannot run is a gate that
  # stops being run", the same argument that produced amendment #6 for the formula
  # check. CI arms all three (`UZI_LINT_{SHELL,YAML,FORMULA}_REQUIRED` on the script
  # line, plus `CI` itself) so the skip is unreachable there. The version pin is a
  # different question and keeps its exit 2: it is about someone who HAS the tool and
  # would get a different gate from CI's.
  #
  # 🔴 THAT PARAGRAPH IS ABOUT THREE OF THE FOUR. `scan:secrets` HAS NO SKIP BRANCH
  # AND NO `*_REQUIRED` VARIABLE, and the asymmetry is the ruling rather than an
  # oversight. shellcheck, yamllint and ruby are brew/pip/system tools a
  # contributor may simply not have; gitleaks arrives through `go install pkg@version`,
  # the Go toolchain is mandatory here, and `gate:api` ALREADY fetches two pinned
  # remote tools. So the population that cannot obtain gitleaks is the population
  # that cannot run `gate:api` either -- a skip would buy nobody anything while
  # putting a fail-open branch in the one check where fail-open is worst. And a
  # `UZI_SCAN_SECRETS_REQUIRED` guarding a branch that does not exist would be the
  # vacuous-directive class this milestone is about, so `lint:repo` does not set
  # one. If a skip is ever added here, that variable is added in the same commit.
  #
  # 🔴 EACH DELEGATES TO A COMMITTED `scripts/*.sh` RATHER THAN INLINING THE
  # RECIPE, AND THE ARGUMENT IS M5's OWN. M5 adds shellcheck over every tracked
  # script, so a committed script GETS LINTED and an inline `cmds:` string gets
  # nothing -- yamllint checks YAML, not shell embedded in a YAML scalar. The same
  # argument is recorded at `deadcode:api` below, where it was written a milestone
  # early on M5's behalf. Precedent: `scripts/assert-chart-render.sh`.
  #
  # 🔴 AND EVERY ONE OF THEM CAPTURES ITS FILE LIST INTO A VARIABLE AND ASSERTS IT
  # NON-EMPTY BEFORE INVOKING THE TOOL. The obvious spelling,
  # `git ls-files '*.sh' | xargs shellcheck`, is FAIL-OPEN ON macOS and FAIL-CLOSED
  # IN CI: measured 2026-08-03 with an empty list, BSD xargs never runs the command
  # and exits 0 while GNU 4.10.0 and busybox both exit 123. Same recipe, opposite
  # verdicts, and the lying half is the contributor's -- Success Criterion 1's exact
  # failure mode. Read the scripts' headers before simplifying any of them.
  #
  # THE FOURTH ONE IS `scan:secrets`, BELOW `lint:formula` RATHER THAN IN THIS
  # `lint:` RUN, because it is a scan and not a lint -- see its own comment. This
  # block used to end "WHAT IS NOT HERE YET: `scan:secrets` (gitleaks) is MR-B. It
  # appends to `gate:repo` above and needs no other edit anywhere." MR-B landed and
  # that prediction held exactly, including the "no other edit" half.
  lint:shell:
    desc: shellcheck over every tracked shell script (severity=warning, pinned, Renovate-tracked)
    cmds:
      # THE SEVERITY IS AN ARGUMENT SO THIS FILE'S ECHO SHOWS IT. For this check the
      # threshold IS the gate, and the header calls that echo the mechanism by which
      # a teammate notices a load-bearing flag going missing. `--norc` and the
      # empty-list guard live in the script, with their reasons beside them.
      #
      # `warning` AND NOT `error`, MEASURED RATHER THAN CHOSEN. At 3ca30153 over the
      # 14 tracked scripts, shellcheck 0.11.0 reported: error 0, warning 4, info 9,
      # style 2. The `error` tier catches NOTHING in this repo, so shipping it would
      # be a gate that cannot fail. The four warnings were fixed in the two commits
      # before this one (SC1010 by quoting a positional, SC3067 x3 by per-instance
      # disables carrying the busybox measurement), so this ships gating at zero.
      # `info`/`style` are the burn-down; tightening to them is a later decision
      # with 11 findings behind it, not a flag flip.
      #
      # 🔴 AND THE VERSION ARGUMENT IS AN EXACT PIN THE SCRIPT ASSERTS, EXITING 2 ON
      # ANYTHING ELSE. Decision 7 has this file invoke tools by NAME, indifferent to what put
      # them on PATH -- which is right, and it means a brew shellcheck and CI's
      # pinned build can drift. That is not a speed difference: measured over the
      # same 14 scripts, 0.10.0 reports 1 warning where 0.11.0 reports 4 and DOES
      # NOT EMIT SC3067 AT ALL, which would make entrypoint.sh's three disables
      # vacuous and take this gate green by the tool's blindness. The info/style
      # tiers move in OPPOSITE directions between the two, so they are different
      # instruments rather than nested subsets. The version is an argument, not a
      # script default, for the same reason the severity is: this file's echo is
      # how a pin going missing becomes visible.
      #
      # THE PIN IS WRITTEN TWICE ON PURPOSE -- here, and in the `lint-repo` job's
      # shellcheck tarball fetch in .github/workflows/ci.yml. That duplication is
      # SELF-CHECKING rather than a drift risk: bump one and the other's assert
      # exits 2 with both numbers in the message. Renovate now keeps the two in
      # lockstep -- both carry a `koalaman/shellcheck` marker and a packageRule
      # (groupName "shellcheck" in renovate.json) folds them into ONE bump PR. A
      # single shared variable would have to be spliced into a `cmds:` line, which
      # this file's header bans.
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      - ./scripts/lint-shell.sh warning 0.11.0

  lint:yaml:
    desc: yamllint --strict over every tracked YAML except deploy/chart/templates/
    cmds:
      # THE CONFIG PATH IS THE ARGUMENT AND `--strict` IS NOT, deliberately.
      # `--strict` is the whole gate -- measured 2026-08-03 at yamllint 1.38.0,
      # WITHOUT it the run printed three findings and exited 0, because yamllint
      # puts most style rules at `warning` severity and warnings do not set the exit
      # code. That is oxlint's severity trap in a second tool. A caller must not be
      # able to switch it off from this file, so it lives in the script; the config
      # is the argument because a config going missing or being swapped is the thing
      # a reader needs to see here.
      #
      # `.yamllint` IS PASSED, NEVER DISCOVERED, and the script asserts it exists
      # before invoking: yamllint auto-discovers `.yamllint` from the working
      # directory (so a stray file up the tree could govern the gate), and `-c` on a
      # missing file exits 1 -- indistinguishable from "there are findings".
      - ./scripts/lint-yaml.sh .yamllint

  test:ci-safe-paths:
    desc: workflow safe-path skips, fallback conditions, cancellation and agent result gates
    cmds:
      - ruby scripts/ci-safe-paths.test.rb

  lint:actions:
    desc: actionlint + zizmor over .github/workflows (embedded shell + Actions hazards)
    cmds:
      # THE ONE CLASS lint:shell AND lint:yaml BOTH MISS: shell embedded in a
      # workflow `run:` scalar, and Actions-specific hazards (bad ${{ }} contexts,
      # unpinned `uses:`, template injection). actionlint feeds every run: block to
      # shellcheck and validates expressions; zizmor runs the supply-chain + injection
      # audits. Both flags that decide a verdict live in the SCRIPT with their reasons
      # (actionlint's --severity=warning aligns its embedded shellcheck with lint:shell;
      # zizmor's --offline --min-confidence=high keep the gate deterministic and gate
      # High-confidence findings -- unpinned-uses + High template-injection). The
      # workflows dir is the argument because a scope change is the thing to see here.
      - ./scripts/lint-actions.sh .github/workflows

  lint:actions:embedded:
    desc: shellcheck the embedded run scripts of composite actions (.github/actions/**/action.yml)
    cmds:
      # THE ONE CLASS lint:shell AND lint:actions BOTH MISS (issue #948): a composite
      # action's `run:` block is bash but lives in .github/actions/**/action.yml, which
      # is neither a tracked `*.sh` file (lint:shell's scope) nor a workflow
      # (lint:actions' scope), so it was gated by NOTHING. This extracts each composite
      # `run:` script and feeds it to the SAME pinned shellcheck at the SAME severity as
      # lint:shell, so a shell construct is judged identically wherever it sits. The
      # severity and version are ARGUMENTS for the same reason lint:shell passes them:
      # this file's echo is how a load-bearing flag going missing becomes visible, and
      # the version is an EXACT pin the script asserts (0.10.0 and 0.11.0 are different
      # instruments). The per-step `shell:` is honored inside the script (a `shell: sh`
      # step is judged by sh rules, not bash), and yq (the YAML reader) is unpinned for
      # the same reason lint:yaml leaves yamllint unpinned -- it only reads YAML.
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      - ./scripts/lint-actions-embedded.sh warning 0.11.0

  lint:formula:
    desc: ruby -c over both Homebrew formulae (syntax only; needs ruby >= 3.1)
    cmds:
      # 🔴 THIS TARGET CAN SKIP, AND A SKIP IS EXIT 0. /usr/bin/ruby on macOS is
      # 2.6.10 and the formula uses the Ruby >= 3.1 shorthand hash value
      # (`ldflags:`), so a naive `ruby -c` reports a SYNTAX ERROR IN A CORRECT FILE
      # -- and the tempting fix for that red is to downgrade a formula that ships to
      # a public tap. The script therefore RESOLVES an interpreter (PATH ruby if
      # >= 3.1, else Homebrew's vendored portable-ruby) and, if neither exists,
      # prints a loud SKIP banner and exits 0.
      #
      # 🔴 THAT SKIP IS FAIL-OPEN AND CI MUST NOT TAKE IT. `lint:repo` sets
      # UZI_LINT_FORMULA_REQUIRED=1, which turns the skip into `exit 2`; its image
      # ships ruby 3.3, so a skip THERE means the image changed under us. Same shape
      # as the *LiveDB tests (self-skip locally, required and asserted in CI), and
      # for the same reason the skip prints a banner: a skipped run and a passing run
      # must not look alike in the output.
      #
      # The first version of this target did what the frozen design said -- assert
      # >= 3.1, exit 2 -- and measured the cost: `task gate` was permanently red for
      # every contributor whose only ruby is the system one. PRD #103 Decision 2 is
      # explicit that a gate people cannot run is a gate that stops being run, so the
      # design was amended (2026-08-03 #6) rather than the cost accepted.
      #
      # SYNTAX ONLY. `ruby -c` parses and does not evaluate, so a broken Homebrew
      # DSL passes; and `publish_brew` seds the `tag:` line before pushing to the
      # tap, so this validates the pre-sed source rather than the shipped artifact.
      # Both limits are argued in the script's header. What makes it worth gating is
      # that `publish_brew` CARRIES `needs: *publish_needs` -- it is a CONSUMER of
      # that list, not an element of it, and this line said "sits in" until the
      # fact-check caught it; the repo uses that phrasing for genuine members
      # elsewhere, so the distinction is live -- and copies this file VERBATIM
      # into vtmocanu/homebrew-tap on every v* tag.
      - ./scripts/lint-formula.sh Formula/uzi-cli.rb
      - ./scripts/lint-formula.sh Formula/uzi-cli-rc.rb

